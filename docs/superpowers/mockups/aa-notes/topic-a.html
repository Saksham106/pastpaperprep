<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic A · Mind map</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="topic.css">
<style>
  .mm { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 10px; }
  .mm svg { display: block; width: 100%; height: auto; }
  .side { font: 500 11.5px var(--font-mono); letter-spacing: .08em; }
  .grp text { font: 600 12.5px var(--font-body); fill: var(--ink); }
  .grp .c { font: 500 11px var(--font-mono); fill: var(--muted); font-weight: 500; }
  .leaf { cursor: pointer; }
  .leaf rect.bg { fill: var(--surface-raised); stroke: var(--line); }
  .leaf:hover rect.bg, .leaf:focus rect.bg, .leaf.on rect.bg { stroke: var(--cobalt); fill: var(--cobalt-faint); }
  .leaf:focus { outline: none; }
  .leaf .num { font: 500 11.5px var(--font-mono); fill: var(--muted); }
  .leaf .nm { font: 13px var(--font-body); fill: var(--ink); }
  .dim { opacity: .3; }
  .detail { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; margin-top: 12px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-raised); min-height: 64px; }
  .detail h3 { margin: 0; font: 400 19px var(--font-serif); }
  .detail p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .mlist { display: none; }
  @media (max-width: 860px) {
    .mm { display: none; } .detail { display: none; } .mlist { display: block; margin-top: 10px; }
    .mlist section { border-top: 1px solid var(--line); padding: 12px 0; }
    .mlist h3 { margin: 0 0 6px; font: 600 15px var(--font-body); }
    .mlist a { display: flex; gap: 10px; align-items: center; padding: 6px 0; color: var(--ink); text-decoration: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="t-top" id="top"></div>
  <div class="mm" id="mm"></div>
  <div class="detail" id="detail"></div>
  <div class="mlist" id="mlist"></div>
  <div style="height:60px"></div>
</main>
<script src="data.js"></script><script src="common.js"></script><script src="topic.js"></script>
<script>
const M = window.MOCK, T = window.TOPIC; M.header("Topic A · Mind map");
const W = 1300, CX = 650, GX = 222, LX = 352, LW = 300, LH = 32, GAP = 40, GG = 36;
function layout(gs) {
  let y = 0; const out = [];
  gs.forEach((g, gi) => {
    if (gi) y += GG;
    const ys = g.lessons.map(() => { const v = y; y += GAP; return v; });
    out.push({ g, ys, gy: (ys[0] + ys[ys.length - 1]) / 2 });
  });
  return { out, h: y - GAP };
}
function draw() {
  const lvl = M.level();
  const L = layout(T.groups.filter((g) => !g.hlOnly)), R = layout(T.groups.filter((g) => g.hlOnly));
  const H = Math.max(L.h, R.h) + 120, CY = H / 2 + 14;
  const offL = CY - L.h / 2, offR = CY - R.h / 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calculus mind map">`;
  s += `<text class="side" x="${CX - LX - LW / 2}" y="22" text-anchor="middle" fill="var(--cobalt-strong)">● SL AND HL</text>`;
  s += `<text class="side" x="${CX + LX + LW / 2}" y="22" text-anchor="middle" fill="var(--burgundy)">◆ HL ONLY</text>`;
  const side = (Lr, off, dir, dim) => {
    let o = `<g class="${dim ? "dim" : ""}">`;
    Lr.out.forEach(({ g, ys, gy }) => {
      const gyA = gy + off, gx = CX + dir * GX;
      o += `<path d="M${CX + dir * 66} ${CY} C ${CX + dir * 130} ${CY}, ${gx - dir * 160} ${gyA}, ${gx - dir * 100} ${gyA}" fill="none" stroke="var(--t5-ink)" stroke-opacity=".45" stroke-width="3"/>`;
      ys.forEach((ly, k) => {
        const yy = ly + off, it = g.lessons[k], lx = CX + dir * LX;
        o += `<path d="M${gx + dir * 100} ${gyA} C ${gx + dir * 120} ${gyA}, ${lx - dir * 30} ${yy}, ${lx} ${yy}" fill="none" stroke="var(--t5-ink)" stroke-opacity=".35" stroke-width="1.6"/>`;
        const rx = dir > 0 ? lx : lx - LW, done = M.DONE.has(it.num), ahl = it.level === "AHL";
        const mark = ahl
          ? `<rect x="${rx + 12}" y="${yy - 5}" width="10" height="10" transform="rotate(45 ${rx + 17} ${yy})" fill="${done ? "var(--done)" : "none"}" stroke="var(--burgundy)" stroke-width="2.4"/>`
          : `<circle cx="${rx + 17}" cy="${yy}" r="5.5" fill="${done ? "var(--done)" : "none"}" stroke="${done ? "var(--done)" : "var(--ink-soft)"}" stroke-width="2.4"/>`;
        const nm = it.name.length > 33 ? it.name.slice(0, 32).trimEnd() + "…" : it.name;
        o += `<g class="leaf" tabindex="0" role="link" data-num="${it.num}" aria-label="${it.num} ${it.name}"><rect class="bg" x="${rx}" y="${yy - LH / 2}" width="${LW}" height="${LH}" rx="9"/>${mark}
          <text class="num" x="${rx + 32}" y="${yy + 4}">${it.num}</text><text class="nm" x="${rx + 70}" y="${yy + 4.5}">${nm}</text>
          ${done ? `<text x="${rx + LW - 14}" y="${yy + 5}" text-anchor="end" fill="var(--done)" font-weight="700">✓</text>` : ""}</g>`;
      });
      const words = g.name.split(" "); let l1 = "", l2 = "";
      for (const w of words) { if ((l1 + " " + w).trim().length <= 26 && !l2) l1 = (l1 + " " + w).trim(); else l2 = (l2 + " " + w).trim(); }
      if (l2.length > 27) l2 = l2.slice(0, 26) + "…";
      const cnt = `${g.count.SL} SL · ${g.count.HL} HL questions`;
      const hgt = l2 ? 64 : 48;
      o += `<g class="grp"><rect x="${gx - 100}" y="${gyA - hgt / 2}" width="200" height="${hgt}" rx="12" fill="var(--t5)"/>
        <text x="${gx}" y="${gyA - hgt / 2 + 20}" text-anchor="middle">${l1}</text>${l2 ? `<text x="${gx}" y="${gyA - hgt / 2 + 36}" text-anchor="middle">${l2}</text>` : ""}
        <text class="c" x="${gx}" y="${gyA + hgt / 2 - 10}" text-anchor="middle">${cnt}</text></g>`;
    });
    return o + "</g>";
  };
  s += side(L, offL, -1, false) + side(R, offR, 1, lvl === "SL");
  s += `<circle cx="${CX}" cy="${CY}" r="64" fill="var(--t5-ink)"/><text x="${CX}" y="${CY - 8}" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="var(--surface)" letter-spacing="1">TOPIC 5</text><text x="${CX}" y="${CY + 18}" text-anchor="middle" font-family="Young Serif" font-size="22" fill="var(--surface)">Calculus</text>`;
  if (lvl === "SL") s += `<text x="${CX + LX + LW / 2}" y="${H - 8}" text-anchor="middle" font-size="13" fill="var(--muted)">Switch to HL to study these</text>`;
  s += "</svg>";
  document.getElementById("mm").innerHTML = s;
  document.querySelectorAll(".leaf").forEach((g) => {
    const on = () => { document.querySelectorAll(".leaf").forEach((x) => x.classList.toggle("on", x === g)); detail(g.dataset.num); };
    g.addEventListener("mouseenter", on); g.addEventListener("focus", on); g.addEventListener("click", () => (location.href = "lesson-a.html"));
  });
  document.getElementById("mlist").innerHTML = T.groups.filter((g) => lvl === "HL" || !g.hlOnly).map((g) => `<section><h3>${g.name} <span class="qs">${g.count[lvl]} ${lvl} questions</span></h3>${g.lessons.map((i) => `<a href="lesson-a.html"><span class="${i.level === "AHL" ? "mark-ahl" : "mark-sl"}${M.DONE.has(i.num) ? " mark-done" : ""}"></span><span class="qs">${i.num}</span>${i.name}</a>`).join("")}</section>`).join("");
  detail("5.16");
}
function detail(num) {
  const it = M.items.find((i) => i.num === num), pre = M.PREREQS[num] || [];
  document.getElementById("detail").innerHTML = `<span class="badge ${it.level === "AHL" ? "badge-ahl" : "badge-sl"}">${it.num} · ${it.level === "AHL" ? "AHL" : "SL + HL"}</span>
    <div><h3>${it.name}</h3><p>${T.BLURB[num]}${pre.length ? ` Builds on ${pre.join(", ")}.` : ""}</p></div><a class="btn btn-primary" href="lesson-a.html">Open lesson →</a>`;
}
T.top(document.getElementById("top"), draw);
draw();
</script>
</body>
</html>
