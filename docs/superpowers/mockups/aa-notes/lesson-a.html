<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson A · Contents rail</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="lesson.css">
<style>
  .layout { display: grid; grid-template-columns: 230px minmax(0, 740px); gap: 56px; justify-content: center; padding: 0 28px; }
  .rail { position: sticky; top: 18px; align-self: start; padding-top: 34px; font-size: 14px; }
  .rail .rt { font: 500 11.5px var(--font-mono); letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .rail ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
  .rail a { display: block; padding: 6px 12px; margin-left: -2px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; }
  .rail a:hover { color: var(--ink); }
  .rail a.on { color: var(--ink); font-weight: 600; border-left-color: var(--t5-ink); }
  .rail .prog { margin-top: 18px; padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .rail .prog i { display: block; height: 5px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .rail .prog i b { display: block; height: 100%; width: 0; background: var(--t5-ink); }
  /* Asides: inline callouts; term definitions only appear as popovers */
  .side-term { display: none; }
  .side-note, .side-calc { display: block; margin: 16px 0; padding: 12px 16px; border-left: 3px solid var(--t5-ink); background: var(--surface); border-radius: 0 10px 10px 0; }
  .side-calc { border-left-color: var(--cobalt); }
  .pop { position: absolute; z-index: 40; width: 300px; padding: 14px 16px; border-radius: 12px; background: var(--surface-raised); border: 1px solid var(--line-strong); box-shadow: 0 16px 38px rgb(0 0 0 / .16); font-size: 14.5px; line-height: 1.5; }
  .pop b { display: block; font: 400 18px var(--font-serif); margin-bottom: 4px; }
  .pop a { display: inline-block; margin-top: 8px; font-weight: 600; }
  .pop::before { content: ""; position: absolute; top: -7px; left: 22px; width: 12px; height: 12px; background: inherit; border-left: 1px solid var(--line-strong); border-top: 1px solid var(--line-strong); transform: rotate(45deg); }
  .mobile-toc { display: none; }
  @media (max-width: 980px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 0 16px; }
    .rail { display: none; }
    .mobile-toc { display: flex; position: sticky; top: 0; z-index: 20; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 14px; }
  }
</style>
</head>
<body>
<div class="mobile-toc"><span><b>5.16</b> · Contents</span><span class="mono" style="color:var(--muted)">2 of 9</span></div>
<div class="layout">
  <nav class="rail" aria-label="On this page">
    <div class="rt">ON THIS PAGE</div>
    <ol id="toc"></ol>
    <div class="prog">Reading progress<i><b id="pbar"></b></i></div>
  </nav>
  <article class="lesson" id="lesson"></article>
</div>
<div class="pop" id="pop" hidden role="dialog"></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="data.js"></script><script src="common.js"></script><script src="lesson-content.js"></script>
<script>
MOCK.header("Lesson A · Contents rail");
document.getElementById("toc").innerHTML = LESSON.toc.map(([id, t]) => `<li><a href="#${id}" data-id="${id}">${t}</a></li>`).join("");
const pop = document.getElementById("pop");
let openTerm = null;
initLesson({
  onTerm(t) {
    if (openTerm === t) { close(); return; }
    const def = document.querySelector(`.side-term[data-for="${t.dataset.term}"]`);
    pop.innerHTML = def.innerHTML; pop.hidden = false; openTerm = t; t.setAttribute("aria-expanded", "true");
    const r = t.getBoundingClientRect();
    pop.style.left = Math.min(r.left + scrollX - 16, innerWidth - 320) + "px"; pop.style.top = r.bottom + scrollY + 12 + "px";
  },
});
function close() { pop.hidden = true; if (openTerm) openTerm.setAttribute("aria-expanded", "false"); openTerm = null; }
addEventListener("keydown", (e) => { if (e.key === "Escape" && openTerm) { const t = openTerm; close(); t.focus(); } });
addEventListener("click", (e) => { if (!e.target.closest(".term, .pop")) close(); });
const links = [...document.querySelectorAll("#toc a")];
addEventListener("scroll", () => {
  let cur = links[0];
  for (const a of links) { const s = document.getElementById(a.dataset.id); if (s && s.getBoundingClientRect().top < 140) cur = a; }
  links.forEach((a) => a.classList.toggle("on", a === cur));
  const h = document.documentElement; document.getElementById("pbar").style.width = (100 * h.scrollTop) / (h.scrollHeight - h.clientHeight) + "%";
});
dispatchEvent(new Event("scroll"));
if (new URLSearchParams(location.search).has("demo")) setTimeout(() => document.querySelector('.term[data-term="integrand"]').click(), 300);
</script>
</body>
</html>
