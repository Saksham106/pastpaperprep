name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Several tests pin data to earlier commits with `git show <sha>:<path>`.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # The course-notes maths gate needs SymPy; its vitest tests fail on CI if no python is given.
      - name: Install SymPy for the maths gate
        run: |
          python -m venv "$RUNNER_TEMP/notes-venv"
          "$RUNNER_TEMP/notes-venv/bin/pip" install sympy antlr4-python3-runtime==4.11
          echo "AA_NOTES_PYTHON=$RUNNER_TEMP/notes-venv/bin/python" >> "$GITHUB_ENV"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # Cheap, node-free check that every course lesson's published maths passes SymPy.
  notes-math:
    runs-on: ubuntu-latest
    # Every lesson of every course: 5–9 minutes with five courses, so 10 was cutting off slower runners.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy==1.14.0 antlr4-python3-runtime==4.11
      - name: Check every lesson's maths, in every course
        run: |
          shopt -s nullglob
          courses=(src/content/notes/*/course.json)
          test "${#courses[@]}" -gt 0
          fail=0
          for config in "${courses[@]}"; do
            course=$(basename "$(dirname "$config")")
            files=(src/content/notes/"$course"/lessons/*.json)
            for file in "${files[@]}"; do
              name=$(basename "$file" .json)
              item="${name/-/.}"
              out=$(python scripts/notes/check-math.py --course "$course" "$item") || fail=1
              echo "== $course $item"; echo "$out"
              if grep -q '^FAIL' <<<"$out"; then fail=1; fi
            done
          done
          for config in "${courses[@]}"; do
            course=$(basename "$(dirname "$config")")
            lessons=(src/content/notes/"$course"/lessons/*.json)
            test "${#lessons[@]}" -gt 0 || { echo "No lessons for $course"; fail=1; }
          done
          exit $fail

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Non-secret placeholders so the build can compile; nothing here reaches a real service.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      NEXT_PUBLIC_SITE_URL: https://example.com
      # Same release gates as production, so CI builds every released bank, not only the ungated ones.
      PASTPAPERPREP_ENABLE_IGCSE_RELEASE_BANKS: "true"
      PASTPAPERPREP_IGCSE_RELEASE_ASSETS_VERIFIED: "true"
      PASTPAPERPREP_ENABLE_IB_ECONOMICS_PRODUCTION: "true"
      PASTPAPERPREP_IB_ECONOMICS_ASSETS_VERIFIED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Runs prebuild generation, next build and the postbuild private-sourcemap check.
      - name: Build
        run: npm run build
        env:
          # Vercel builds with NODE_ENV=production; the IB Economics gate requires it.
          # Set here, not job-wide, so `npm ci` still installs devDependencies.
          NODE_ENV: production
      # Every served bank has an asset manifest and search entries; staged (pending-storage) banks have
      # neither; the bank index registry still lists the whole catalog.
      - name: Every served bank has an asset manifest and search entries
        run: npx tsx scripts/check-served-bank-coverage.mts
        env:
          NODE_ENV: production

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # supabase/tests/explanation_allowance.sql is not run here; it needs a real Postgres.
      - name: SQL tests (PGlite)
        run: npm run test:sql
