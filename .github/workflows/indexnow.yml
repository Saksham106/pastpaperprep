name: IndexNow notifications

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Wait for this revision's production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            main=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$main" != "$SHA" ]]; then echo "Superseded revision"; exit 1; fi
            state=$(gh api "repos/$REPOSITORY/commits/$SHA/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "pending"')
            if [[ "$state" == success ]]; then exit 0; fi
            if [[ "$state" == failure || "$state" == error ]]; then exit 1; fi
            echo "Waiting for Vercel production status for $SHA (attempt $attempt/60)"
            sleep 30
          done
          echo "Timed out waiting for Vercel production status for $SHA" >&2
          exit 1
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow/state.json
          key: indexnow-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v2-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare live canonical sitemap and public content
        run: node scripts/indexnow.mjs --submit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexnow-delivery-${{ github.sha }}
          path: .indexnow/delivery.jsonl
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: .indexnow/state.json
          key: indexnow-v2-${{ github.run_id }}-${{ github.run_attempt }}
