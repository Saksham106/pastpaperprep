<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#f3f4f7">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent">Your PastPaperPrep sign-in code is {{ .Token }}. It expires in 1 hour.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f4f7">
    <tr>
      <td align="center" style="padding:32px 16px">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#ffffff;border:1px solid #e3e6ee;border-radius:14px">
          <tr>
            <td style="padding:36px 36px 32px;font-family:Arial,Helvetica,sans-serif;color:#172033">
              <p style="margin:0 0 28px;font-size:15px;font-weight:700;color:#3156d3">PastPaperPrep</p>
              <h1 style="margin:0 0 10px;font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.25;font-weight:700;color:#172033">Sign in to PastPaperPrep</h1>
              <p style="margin:0 0 26px;font-size:16px;line-height:1.5;color:#475467">Use the button or code below to sign in.</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border-radius:10px;background:#3156d3">
                    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;padding:14px 26px;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px">Sign in</a>
                  </td>
                </tr>
              </table>
              <p style="margin:30px 0 10px;font-size:14px;color:#667085">Or enter this code:</p>
              <div style="padding:16px 12px;background:#f1f4fe;border:1px solid #d5ddfb;border-radius:10px;text-align:center;font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:32px;line-height:1.2;font-weight:700;letter-spacing:8px;color:#172033;-webkit-user-select:all;user-select:all">{{ .Token }}</div>
              <p style="margin:12px 0 0;font-size:13px;line-height:1.5;color:#667085">Expires in 1 hour and works once.</p>
            </td>
          </tr>
        </table>
        <p style="margin:18px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#98a2b3">Didn’t ask for this? You can ignore this email.</p>
      </td>
    </tr>
  </table>
</body>
</html>
