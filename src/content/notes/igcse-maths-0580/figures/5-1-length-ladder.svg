<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" role="img" aria-labelledby="t">
  <title id="t">Four boxes in a row: km, m, cm, mm, from the largest unit to the smallest. Arrows above point right, towards smaller units: times 1000 from km to m, times 100 from m to cm, times 10 from cm to mm. Arrows below point left, towards larger units: divide by 1000, by 100 and by 10.</title>
  <g stroke="currentColor" stroke-width="1.8" fill="none">
    <rect x="15" y="65" width="60" height="40" rx="6"/>
    <rect x="130" y="65" width="60" height="40" rx="6"/>
    <rect x="245" y="65" width="60" height="40" rx="6"/>
    <rect x="360" y="65" width="45" height="40" rx="6"/>
  </g>
  <g font-family="inherit" font-size="18" font-weight="bold" fill="currentColor" text-anchor="middle">
    <text x="45" y="91">km</text>
    <text x="160" y="91">m</text>
    <text x="275" y="91">cm</text>
    <text x="382.5" y="91">mm</text>
  </g>
  <g stroke="var(--t1-ink)" stroke-width="1.8" fill="none">
    <path d="M60,60 Q102,25 145,60"/>
    <path d="M175,60 Q217,25 260,60"/>
    <path d="M290,60 Q332,25 375,60"/>
  </g>
  <g fill="var(--t1-ink)">
    <polygon points="145,60 135,57 141,50"/>
    <polygon points="260,60 250,57 256,50"/>
    <polygon points="375,60 365,57 371,50"/>
  </g>
  <g stroke="var(--t2-ink)" stroke-width="1.8" fill="none">
    <path d="M145,110 Q102,145 60,110"/>
    <path d="M260,110 Q217,145 175,110"/>
    <path d="M375,110 Q332,145 290,110"/>
  </g>
  <g fill="var(--t2-ink)">
    <polygon points="60,110 70,113 64,120"/>
    <polygon points="175,110 185,113 179,120"/>
    <polygon points="290,110 300,113 294,120"/>
  </g>
  <g font-family="inherit" font-size="15" text-anchor="middle">
    <text x="102" y="30" fill="var(--t1-ink)">× 1000</text>
    <text x="217" y="30" fill="var(--t1-ink)">× 100</text>
    <text x="332" y="30" fill="var(--t1-ink)">× 10</text>
    <text x="102" y="152" fill="var(--t2-ink)">÷ 1000</text>
    <text x="217" y="152" fill="var(--t2-ink)">÷ 100</text>
    <text x="332" y="152" fill="var(--t2-ink)">÷ 10</text>
  </g>
  <g font-family="inherit" font-size="12" fill="var(--muted)">
    <text x="15" y="14">to a smaller unit: multiply →</text>
    <text x="405" y="167" text-anchor="end">← to a larger unit: divide</text>
  </g>
</svg>
