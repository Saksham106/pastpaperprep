<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 322 316" role="img" aria-labelledby="t">
  <title id="t">Graph of the depth of water in a bath against time. Across, time goes from 0 to 8 minutes, one minute per square. Up, depth goes from 0 to 40 centimetres, 5 centimetres per square. A straight line rises from 5 cm at 0 minutes, through 25 cm at 5 minutes, to 37 cm at 8 minutes.</title>
