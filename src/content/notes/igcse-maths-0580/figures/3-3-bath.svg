  </g>
  <text x="178" y="298" fill="currentColor" font-size="13" font-family="inherit" text-anchor="middle">Time (minutes)</text>
  <text x="14" y="144" fill="currentColor" font-size="13" font-family="inherit" text-anchor="middle" transform="rotate(-90 14 144)">Depth of water (cm)</text>
