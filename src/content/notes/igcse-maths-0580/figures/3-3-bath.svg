    <line x1="58" y1="24" x2="298" y2="24"/>
    <line x1="58" y1="54" x2="298" y2="54"/>
    <line x1="58" y1="84" x2="298" y2="84"/>
    <line x1="58" y1="114" x2="298" y2="114"/>
    <line x1="58" y1="144" x2="298" y2="144"/>
    <line x1="58" y1="174" x2="298" y2="174"/>
