    <line x1="58" y1="264" x2="58" y2="24"/>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="58" y="279">0</text>
    <text x="88" y="279">1</text>
    <text x="118" y="279">2</text>
    <text x="148" y="279">3</text>
