<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">Bar chart of how the members of a club travel to meetings. The vertical axis is number of members, from 0 to 12. Walk 11, bus 7, car 4, cycle 3.</title>
  <g stroke="var(--muted)" stroke-width="0.8">
    <line x1="60" y1="190" x2="380" y2="190"/>
    <line x1="60" y1="160" x2="380" y2="160"/>
    <line x1="60" y1="130" x2="380" y2="130"/>
    <line x1="60" y1="100" x2="380" y2="100"/>
    <line x1="60" y1="70" x2="380" y2="70"/>
    <line x1="60" y1="40" x2="380" y2="40"/>
  </g>
  <g fill="var(--t2-ink)" fill-opacity="0.35" stroke="var(--t2-ink)" stroke-width="1.2">
    <rect x="80" y="55" width="50" height="165"/>
    <rect x="155" y="115" width="50" height="105"/>
    <rect x="230" y="160" width="50" height="60"/>
    <rect x="305" y="175" width="50" height="45"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="60" y1="220" x2="380" y2="220"/>
    <line x1="60" y1="220" x2="60" y2="30"/>
  </g>
  <g font-family="inherit" font-size="13" fill="currentColor" text-anchor="end">
    <text x="54" y="224">0</text>
    <text x="54" y="194">2</text>
    <text x="54" y="164">4</text>
    <text x="54" y="134">6</text>
    <text x="54" y="104">8</text>
    <text x="54" y="74">10</text>
    <text x="54" y="44">12</text>
  </g>
  <g font-family="inherit" font-size="14" fill="currentColor" text-anchor="middle">
    <text x="105" y="240">Walk</text>
    <text x="180" y="240">Bus</text>
    <text x="255" y="240">Car</text>
    <text x="330" y="240">Cycle</text>
  </g>
  <text x="18" y="125" font-family="inherit" font-size="13" fill="currentColor" text-anchor="middle" transform="rotate(-90 18 125)">Number of members</text>
</svg>
