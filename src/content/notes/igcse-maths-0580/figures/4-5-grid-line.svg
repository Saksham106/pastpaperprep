<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" role="img" aria-labelledby="t">
  <title id="t">A grid of 3 rows and 4 columns with a dashed vertical line down the middle. Shaded squares: row 1 columns 1 and 4; row 2 columns 2 and 3; row 3 column 3. Three unshaded squares are labelled: A in row 3 column 2, B in row 3 column 4, and C in row 2 column 1.</title>
  <rect x="20.0" y="20.0" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.55"/>
  <rect x="140.0" y="20.0" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.55"/>
  <rect x="60.0" y="60.0" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.55"/>
  <rect x="100.0" y="60.0" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.55"/>
  <rect x="100.0" y="100.0" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.55"/>
  <line x1="20.0" y1="20.0" x2="180.0" y2="20.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="20.0" y1="60.0" x2="180.0" y2="60.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="20.0" y1="100.0" x2="180.0" y2="100.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="20.0" y1="140.0" x2="180.0" y2="140.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="20.0" y1="20.0" x2="20.0" y2="140.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="60.0" y1="20.0" x2="60.0" y2="140.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="100.0" y1="20.0" x2="100.0" y2="140.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="140.0" y1="20.0" x2="140.0" y2="140.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="180.0" y1="20.0" x2="180.0" y2="140.0" stroke="currentColor" stroke-width="1.2"/>
  <text x="80.0" y="125.0" fill="var(--t1-ink)" font-size="15" text-anchor="middle">A</text>
  <text x="160.0" y="125.0" fill="var(--t1-ink)" font-size="15" text-anchor="middle">B</text>
  <text x="40.0" y="85.0" fill="var(--t1-ink)" font-size="15" text-anchor="middle">C</text>
  <line x1="100.0" y1="6.0" x2="100.0" y2="154.0" stroke="var(--t1-ink)" stroke-width="2.2" stroke-dasharray="6 4"/>
