<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" role="img" aria-labelledby="t">
  <title id="t">Number line from 13 to 15 centimetres. The part from 13.5 to 14.5 is shaded, with 14 in the middle. 13.5 has a filled dot, labelled lower bound. 14.5 has an open dot, labelled upper bound. Below the line: 13.5 is less than or equal to l, which is less than 14.5.</title>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="30" y1="70" x2="370" y2="70"/>
    <line x1="40" y1="62" x2="40" y2="78"/>
    <line x1="120" y1="62" x2="120" y2="78"/>
    <line x1="200" y1="62" x2="200" y2="78"/>
    <line x1="280" y1="62" x2="280" y2="78"/>
    <line x1="360" y1="62" x2="360" y2="78"/>
  </g>
  <line x1="120" y1="70" x2="280" y2="70" stroke="var(--t1-ink)" stroke-width="6"/>
  <circle cx="120" cy="70" r="7" fill="var(--t1-ink)" stroke="var(--t1-ink)" stroke-width="2"/>
  <circle cx="280" cy="70" r="7" fill="var(--surface, white)" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <g font-family="inherit" font-size="16" fill="currentColor" text-anchor="middle">
    <text x="40" y="100">13</text>
    <text x="120" y="100">13.5</text>
    <text x="200" y="100">14</text>
    <text x="280" y="100">14.5</text>
    <text x="360" y="100">15</text>
  </g>
  <g font-family="inherit" font-size="15" fill="var(--t1-ink)" font-weight="bold" text-anchor="middle">
    <text x="120" y="45">lower bound</text>
    <text x="280" y="45">upper bound</text>
  </g>
  <g font-family="inherit" font-size="15" fill="var(--muted)" text-anchor="middle">
    <text x="200" y="135">13.5 ≤ l &lt; 14.5   (cm)</text>
  </g>
</svg>
