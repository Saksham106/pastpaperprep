  <title id="t">Cumulative frequency diagram for the finishing times of 68 runners. Time in minutes across from 22 to 46, each small square 1 minute. Cumulative frequency up from 0 to 70, each small square 2 runners. Crosses at 22 minutes and 0, 26 and 5, 30 and 22, 34 and 48, 38 and 63, and 46 and 68, joined by a smooth S-shaped curve. The curve is steepest between 30 and 34 minutes. At 28 minutes it is at a height of about 12, and at 31 minutes about 28.</title>
