<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 256" role="img" aria-labelledby="t">
  <title id="t">Graph of y equals tan x for x from 0 to 360 degrees. Dashed vertical asymptotes at x equals 90 and x equals 270 split it into three pieces. The first piece rises from (0, 0) through (45, 1) and shoots up towards the asymptote at 90. The middle piece comes up from far below just after 90, rises through (180, 0) and (225, 1), and shoots up towards the asymptote at 270. The last piece comes up from far below just after 270 and rises to (360, 0). Every piece rises from left to right.</title>
