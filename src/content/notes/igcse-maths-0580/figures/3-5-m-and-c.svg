<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 322" role="img" aria-labelledby="t">
  <title id="t">Grid with x from 0 to 5 and y from 0 to 13. The straight line y = 2x + 3 starts at the marked point (0, 3) on the y-axis, labelled y-intercept 3, and rises to (5, 13). A dashed step under the line, from (1, 5) to (2, 5) and then up to (2, 7), is labelled across 1 and up 2.</title>
  <g stroke="var(--muted)" stroke-width="0.6" opacity="0.6">
    <line x1="50" y1="40" x2="50" y2="300"/>
    <line x1="90" y1="40" x2="90" y2="300"/>
    <line x1="130" y1="40" x2="130" y2="300"/>
    <line x1="170" y1="40" x2="170" y2="300"/>
    <line x1="210" y1="40" x2="210" y2="300"/>
    <line x1="250" y1="40" x2="250" y2="300"/>
    <line x1="50" y1="300" x2="250" y2="300"/>
    <line x1="50" y1="280" x2="250" y2="280"/>
    <line x1="50" y1="260" x2="250" y2="260"/>
    <line x1="50" y1="240" x2="250" y2="240"/>
    <line x1="50" y1="220" x2="250" y2="220"/>
    <line x1="50" y1="200" x2="250" y2="200"/>
    <line x1="50" y1="180" x2="250" y2="180"/>
    <line x1="50" y1="160" x2="250" y2="160"/>
    <line x1="50" y1="140" x2="250" y2="140"/>
    <line x1="50" y1="120" x2="250" y2="120"/>
    <line x1="50" y1="100" x2="250" y2="100"/>
    <line x1="50" y1="80" x2="250" y2="80"/>
    <line x1="50" y1="60" x2="250" y2="60"/>
    <line x1="50" y1="40" x2="250" y2="40"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="50" y1="300" x2="250" y2="300"/>
    <line x1="50" y1="300" x2="50" y2="40"/>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="50" y="315">0</text>
    <text x="90" y="315">1</text>
    <text x="130" y="315">2</text>
    <text x="170" y="315">3</text>
    <text x="210" y="315">4</text>
    <text x="250" y="315">5</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="end">
    <text x="45" y="284">1</text>
    <text x="45" y="264">2</text>
    <text x="45" y="244">3</text>
    <text x="45" y="224">4</text>
    <text x="45" y="204">5</text>
    <text x="45" y="184">6</text>
    <text x="45" y="164">7</text>
    <text x="45" y="144">8</text>
    <text x="45" y="124">9</text>
    <text x="45" y="104">10</text>
    <text x="45" y="84">11</text>
    <text x="45" y="64">12</text>
    <text x="45" y="44">13</text>
  </g>
  <text x="258" y="304" fill="currentColor" font-size="14" font-style="italic" font-family="inherit">x</text>
  <text x="56" y="32" fill="currentColor" font-size="14" font-style="italic" font-family="inherit">y</text>
  <line x1="90" y1="200" x2="130" y2="200" stroke="var(--t2-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="130" y1="200" x2="130" y2="160" stroke="var(--t2-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="50" y1="240" x2="250" y2="40" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <circle cx="50" cy="240" r="4.5" fill="var(--t3-ink)"/>
  <text x="60" y="256" fill="var(--t3-ink)" font-size="12" font-family="inherit" font-weight="bold">(0, 3): y-intercept 3</text>
  <text x="110.0" y="216" fill="var(--t2-ink)" font-size="12" font-family="inherit" text-anchor="middle" font-weight="bold">across 1</text>
  <text x="136" y="184.0" fill="var(--t2-ink)" font-size="12" font-family="inherit" font-weight="bold">up 2</text>
  <text x="214" y="58" fill="var(--t1-ink)" font-size="13" font-family="inherit" text-anchor="end" font-weight="bold">y = 2x + 3</text>
</svg>
