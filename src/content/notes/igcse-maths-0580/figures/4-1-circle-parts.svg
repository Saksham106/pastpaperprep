<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 230" role="img" aria-labelledby="t">
  <title id="t">Two circles, each with centre O. Left circle: a diameter passes through O from one side of the circle to the other; a radius goes from O to the circle; a chord joins two points on the lower part of the circle without passing through O; a tangent line touches the circle at one point on the lower right; the curve itself is labelled circumference. Right circle: a shaded sector between two radii and the arc joining them, at the top right; a shaded segment between a chord and the arc below it, at the bottom; and a short arc on the left, drawn as a thick part of the curve.</title>
  <circle cx="120" cy="130" r="80" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="120" cy="130" r="3" fill="currentColor"/>
  <text x="114.0" y="146.0" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">O</text>
  <line x1="44.8" y1="157.4" x2="195.2" y2="102.6" stroke="var(--t1-ink)" stroke-width="2"/>
  <text x="150.0" y="112.0" fill="var(--t1-ink)" font-size="12" text-anchor="middle" font-family="inherit">diameter</text>
  <line x1="120" y1="130" x2="92.6" y2="54.8" stroke="var(--t2-ink)" stroke-width="2"/>
  <text x="92.0" y="98.0" fill="var(--t2-ink)" font-size="12" text-anchor="end" font-family="inherit">radius</text>
  <line x1="74.1" y1="195.5" x2="165.9" y2="195.5" stroke="var(--t3-ink)" stroke-width="2"/>
  <text x="120.0" y="187.5" fill="var(--t3-ink)" font-size="12" text-anchor="middle" font-family="inherit">chord</text>
  <line x1="154.3" y1="230.6" x2="214.3" y2="126.7" stroke="var(--t4-ink)" stroke-width="2"/>
  <circle cx="189.3" cy="170.0" r="3" fill="var(--t4-ink)"/>
  <text x="218.3" y="122.7" fill="var(--t4-ink)" font-size="12" text-anchor="start" font-family="inherit">tangent</text>
  <text x="172.0" y="54.0" fill="currentColor" font-size="12" text-anchor="start" font-family="inherit">circumference</text>
  <circle cx="370" cy="130" r="80" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="370" cy="130" r="3" fill="currentColor"/>
  <text x="358.0" y="135.0" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">O</text>
  <path d="M370,130 L445.2,102.6 A80,80 0 0 0 356.1,51.2 Z" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="2"/>
  <text x="392.0" y="88.0" fill="var(--t2-ink)" font-size="13" text-anchor="middle" font-family="inherit">sector</text>
  <path d="M308.7,181.4 A80,80 0 0 0 431.3,181.4 Z" fill="var(--t3-ink)" fill-opacity="0.18" stroke="var(--t3-ink)" stroke-width="2"/>
  <text x="370.0" y="196.0" fill="var(--t3-ink)" font-size="13" text-anchor="middle" font-family="inherit">segment</text>
  <path d="M308.8,78.5 A80,80 0 0 0 291.2,143.9" fill="none" stroke="var(--t1-ink)" stroke-width="3"/>
  <text x="300.0" y="72.0" fill="var(--t1-ink)" font-size="13" text-anchor="end" font-family="inherit">arc</text>
</svg>
