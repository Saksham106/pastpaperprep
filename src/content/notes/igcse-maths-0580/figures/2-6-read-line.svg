<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" role="img" aria-labelledby="t">
  <title id="t">Number line from minus 3 to 6. Open circle at minus 1 and filled circle at 4, joined by a line.</title>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="26" y1="60" x2="378" y2="60"/>
    <polyline points="32,55 26,60 32,65"/>
    <polyline points="372,55 378,60 372,65"/>
    <line x1="40" y1="54" x2="40" y2="66"/>
    <line x1="76" y1="54" x2="76" y2="66"/>
    <line x1="112" y1="54" x2="112" y2="66"/>
    <line x1="148" y1="54" x2="148" y2="66"/>
    <line x1="184" y1="54" x2="184" y2="66"/>
    <line x1="220" y1="54" x2="220" y2="66"/>
    <line x1="256" y1="54" x2="256" y2="66"/>
    <line x1="292" y1="54" x2="292" y2="66"/>
    <line x1="328" y1="54" x2="328" y2="66"/>
    <line x1="364" y1="54" x2="364" y2="66"/>
  </g>
  <g fill="currentColor" font-size="13" font-family="inherit" text-anchor="middle">
    <text x="40" y="84">−3</text>
    <text x="76" y="84">−2</text>
    <text x="112" y="84">−1</text>
    <text x="148" y="84">0</text>
    <text x="184" y="84">1</text>
    <text x="220" y="84">2</text>
    <text x="256" y="84">3</text>
    <text x="292" y="84">4</text>
    <text x="328" y="84">5</text>
    <text x="364" y="84">6</text>
  </g>
  <line x1="112" y1="44" x2="292" y2="44" stroke="var(--t1-ink)" stroke-width="3"/>
  <circle cx="112" cy="44" r="6.5" fill="var(--surface, white)" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <circle cx="292" cy="44" r="6.5" fill="var(--t1-ink)" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <text x="386" y="65" fill="currentColor" font-size="14" font-style="italic" font-family="inherit">x</text>
</svg>
