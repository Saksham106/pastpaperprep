  <text x="243.0" y="56.0" fill="var(--t1-ink)" font-size="15" font-family="inherit" text-anchor="middle" font-weight="bold">a</text>
  <line x1="140.0" y1="140.0" x2="58.5" y2="167.2" stroke="var(--t3-ink)" stroke-width="2.4"/>
  <polygon points="50.0,170.0 58.9,161.8 62.0,171.2" fill="var(--t3-ink)"/>
  <text x="97.0" y="145.0" fill="var(--t3-ink)" font-size="15" font-family="inherit" text-anchor="middle" font-weight="bold">−a</text>
