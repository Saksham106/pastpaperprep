  <line x1="50.0" y1="80.0" x2="131.5" y2="52.8" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <polygon points="140.0,50.0 131.1,58.2 128.0,48.8" fill="var(--t1-ink)"/>
  <circle cx="50.0" cy="80.0" r="3.5" fill="currentColor"/>
  <circle cx="140.0" cy="50.0" r="3.5" fill="currentColor"/>
  <text x="42.0" y="96.0" fill="currentColor" font-size="15" font-family="inherit" text-anchor="end" font-style="italic">A</text>
  <text x="148.0" y="44.0" fill="currentColor" font-size="15" font-family="inherit" text-anchor="start" font-style="italic">B</text>
  <text x="93.0" y="56.0" fill="var(--t1-ink)" font-size="15" font-family="inherit" text-anchor="middle" font-weight="bold">a</text>
  <line x1="200.0" y1="80.0" x2="281.5" y2="52.8" stroke="var(--t1-ink)" stroke-width="2.4"/>
