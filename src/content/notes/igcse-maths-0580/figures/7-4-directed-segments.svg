    <line x1="230" y1="20" x2="230" y2="200"/>
    <line x1="260" y1="20" x2="260" y2="200"/>
    <line x1="290" y1="20" x2="290" y2="200"/>
    <line x1="320" y1="20" x2="320" y2="200"/>
