<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img" aria-labelledby="t">
  <title id="t">Square grid with four arrows. Arrow a goes from point A to point B, 3 squares right and 1 square up. A second arrow, also labelled a, starts somewhere else and also goes 3 squares right and 1 square up. Arrow minus a goes 3 squares left and 1 square down. Arrow 2a goes 6 squares right and 2 squares up.</title>
