<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 304" role="img" aria-labelledby="t">
  <title id="t">Grid with x from 0 to 8 and y from 0 to 8, showing three straight lines. Line P rises gently from (0, 2) to (8, 6), passing through (4, 4). Line Q falls from (0, 7) to (8, 1), also passing through (4, 4). Line R is steep. It rises from the x-axis between 4 and 5, through (5, 1), (6, 4) and (7, 7), to the top of the grid.</title>
