    <line x1="110" y1="24" x2="110" y2="264"/>
    <line x1="140" y1="24" x2="140" y2="264"/>
    <line x1="170" y1="24" x2="170" y2="264"/>
    <line x1="200" y1="24" x2="200" y2="264"/>
    <line x1="230" y1="24" x2="230" y2="264"/>
    <line x1="260" y1="24" x2="260" y2="264"/>
    <line x1="290" y1="24" x2="290" y2="264"/>
    <line x1="50" y1="24" x2="290" y2="24"/>
    <line x1="50" y1="54" x2="290" y2="54"/>
    <line x1="50" y1="84" x2="290" y2="84"/>
    <line x1="50" y1="114" x2="290" y2="114"/>
    <line x1="50" y1="144" x2="290" y2="144"/>
    <line x1="50" y1="174" x2="290" y2="174"/>
    <line x1="50" y1="204" x2="290" y2="204"/>
    <line x1="50" y1="234" x2="290" y2="234"/>
    <line x1="50" y1="264" x2="290" y2="264"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="50" y1="264" x2="290" y2="264"/>
    <line x1="50" y1="264" x2="50" y2="24"/>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="50" y="279">0</text>
    <text x="80" y="279">1</text>
    <text x="110" y="279">2</text>
    <text x="140" y="279">3</text>
