    <text x="45" y="208">2</text>
    <text x="45" y="178">3</text>
    <text x="45" y="148">4</text>
    <text x="45" y="118">5</text>
    <text x="45" y="88">6</text>
    <text x="45" y="58">7</text>
    <text x="45" y="28">8</text>
  </g>
  <text x="298" y="268" fill="currentColor" font-size="14" font-style="italic" font-family="inherit">x</text>
  <text x="56" y="16" fill="currentColor" font-size="14" font-style="italic" font-family="inherit">y</text>
