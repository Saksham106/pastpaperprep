<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 200" role="img" aria-labelledby="t">
  <title id="t">Three bars of the same length. The first is split into 4 equal parts with 3 shaded. The second is split into 8 equal parts with 6 shaded. The third is split into 12 equal parts with 9 shaded. A dashed line shows the shading ends at the same point on all three bars, so three quarters, six eighths and nine twelfths are the same amount.</title>
