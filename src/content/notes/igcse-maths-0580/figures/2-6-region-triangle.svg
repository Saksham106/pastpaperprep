<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" role="img" aria-labelledby="t">
  <title id="t">Grid with x and y from 0 to 6. Three lines: a solid horizontal line y equals 1, a broken line x plus y equals 6 from (0, 6) to (6, 0), and a solid line y equals 2x through the origin and (3, 6). The triangle with corners (0.5, 1), (5, 1) and (2, 4) is unshaded and labelled R. Everything else is shaded.</title>
  <g stroke="var(--muted)" stroke-width="0.6" stroke-opacity="0.6">
    <line x1="40" y1="280" x2="40" y2="40"/>
    <line x1="80" y1="280" x2="80" y2="40"/>
    <line x1="120" y1="280" x2="120" y2="40"/>
    <line x1="160" y1="280" x2="160" y2="40"/>
    <line x1="200" y1="280" x2="200" y2="40"/>
    <line x1="240" y1="280" x2="240" y2="40"/>
    <line x1="280" y1="280" x2="280" y2="40"/>
    <line x1="40" y1="280" x2="280" y2="280"/>
    <line x1="40" y1="240" x2="280" y2="240"/>
    <line x1="40" y1="200" x2="280" y2="200"/>
    <line x1="40" y1="160" x2="280" y2="160"/>
    <line x1="40" y1="120" x2="280" y2="120"/>
    <line x1="40" y1="80" x2="280" y2="80"/>
    <line x1="40" y1="40" x2="280" y2="40"/>
  </g>
  <path d="M40,280 L280,280 L280,40 L40,40 Z M60.0,240 L240,240 L120,120 Z" fill="var(--muted)" fill-opacity="0.3" fill-rule="evenodd" stroke="none"/>
  <line x1="40" y1="240" x2="280" y2="240" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <line x1="40" y1="40" x2="280" y2="280" stroke="var(--t3-ink)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="40" y1="280" x2="160" y2="40" stroke="var(--t2-ink)" stroke-width="2.5"/>
  <text x="140.0" y="205" fill="currentColor" font-size="18" font-weight="bold" font-family="inherit" text-anchor="middle">R</text>
  <text x="284.0" y="245" fill="var(--t1-ink)" font-size="13" font-family="inherit">y = 1</text>
  <text x="212.0" y="192.0" fill="var(--t3-ink)" font-size="13" font-family="inherit">x + y = 6</text>
  <text x="162.0" y="56.0" fill="var(--t2-ink)" font-size="13" font-family="inherit">y = 2x</text>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="40" y1="280" x2="292" y2="280"/>
    <polyline points="286,275 292,280 286,285"/>
    <line x1="40" y1="280" x2="40" y2="28"/>
    <polyline points="35,34 40,28 45,34"/>
  </g>
  <g fill="currentColor" font-size="12" font-family="inherit" text-anchor="middle">
    <text x="80" y="296">1</text>
    <text x="120" y="296">2</text>
    <text x="160" y="296">3</text>
    <text x="200" y="296">4</text>
    <text x="240" y="296">5</text>
    <text x="280" y="296">6</text>
    <text x="30" y="244">1</text>
    <text x="30" y="204">2</text>
    <text x="30" y="164">3</text>
    <text x="30" y="124">4</text>
    <text x="30" y="84">5</text>
    <text x="30" y="44">6</text>
    <text x="30" y="296">0</text>
  </g>
  <text x="298" y="285" fill="currentColor" font-size="14" font-style="italic" font-family="inherit">x</text>
  <text x="40" y="22" fill="currentColor" font-size="14" font-style="italic" font-family="inherit" text-anchor="middle">y</text>
</svg>
