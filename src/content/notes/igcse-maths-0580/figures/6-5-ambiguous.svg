<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img" aria-labelledby="t">
  <title id="t">A horizontal base line starts at A. A side of length 12 goes up from A to B at 35 degrees to the base. From B, a side of length 8 can swing down to meet the base line at two points, C1 nearer A and C2 further away. A dotted arc shows the path of the swinging side through both points. The angle at C1 is obtuse, 120.6 degrees. The angle at C2 is acute, 59.4 degrees.</title>
  <line x1="30" y1="180" x2="325" y2="180" stroke="currentColor" stroke-width="2"/>
  <line x1="30" y1="180" x2="206.94" y2="56.11" stroke="currentColor" stroke-width="2.4"/>
  <line x1="206.94" y1="56.11" x2="133.54" y2="180" stroke="var(--t2-ink)" stroke-width="2.4" stroke-dasharray="7 5"/>
  <line x1="206.94" y1="56.11" x2="280.34" y2="180" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <path d="M133.54,180 A144,144 0 0 0 280.34,180" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="2 4"/>
  <path d="M62,180 A32,32 0 0 0 56.21,161.65" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M117.54,180 A16,16 0 0 1 141.69,166.23" fill="none" stroke="var(--t2-ink)" stroke-width="1.6"/>
  <path d="M264.34,180 A16,16 0 0 1 272.19,166.23" fill="none" stroke="var(--t1-ink)" stroke-width="1.6"/>
  <text x="72" y="172" fill="currentColor" font-size="13" text-anchor="start" font-family="inherit">35°</text>
  <text x="108" y="108" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">12</text>
  <text x="160" y="122" fill="var(--t2-ink)" font-size="14" text-anchor="end" font-family="inherit">8</text>
  <text x="252" y="114" fill="var(--t1-ink)" font-size="14" text-anchor="start" font-family="inherit">8</text>
  <text x="112" y="164" fill="var(--t2-ink)" font-size="12" text-anchor="end" font-family="inherit">120.6°</text>
  <text x="246" y="170" fill="var(--t1-ink)" font-size="12" text-anchor="end" font-family="inherit">59.4°</text>
  <text x="22" y="194" fill="currentColor" font-size="15" text-anchor="middle" font-family="inherit">A</text>
  <text x="212" y="46" fill="currentColor" font-size="15" text-anchor="middle" font-family="inherit">B</text>
  <text x="133.54" y="200" fill="var(--t2-ink)" font-size="15" text-anchor="middle" font-family="inherit">C₁</text>
  <text x="280.34" y="200" fill="var(--t1-ink)" font-size="15" text-anchor="middle" font-family="inherit">C₂</text>
</svg>
