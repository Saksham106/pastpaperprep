  <line x1="160.0" y1="195.0" x2="220.1" y2="49.9" stroke="currentColor" stroke-width="1.8"/>
  <line x1="80.1" y1="80.9" x2="220.1" y2="49.9" stroke="currentColor" stroke-width="1.8"/>
  <path d="M130.0,195.0 A30,30 0 0 1 142.8,170.4" fill="none" stroke="var(--t1-ink)" stroke-width="2"/>
