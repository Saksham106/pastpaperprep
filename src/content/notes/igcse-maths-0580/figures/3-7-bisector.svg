<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 240" role="img" aria-labelledby="t">
  <title id="t">Axes with points P at (-1, 2) and Q at (5, 6) joined by a line segment. The midpoint M at (2, 4) is marked, with equal tick marks on PM and MQ. A second line crosses PQ at M at right angles: this is the perpendicular bisector of PQ.</title>
