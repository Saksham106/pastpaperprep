  </g>
  <text x="246" y="224" fill="currentColor" font-size="14" font-style="italic" font-family="inherit">x</text>
  <text x="96" y="16" fill="currentColor" font-size="14" font-style="italic" font-family="inherit">y</text>
  <line x1="65" y1="170" x2="215" y2="70" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <line x1="95" y1="52.5" x2="200" y2="210" stroke="var(--t3-ink)" stroke-width="2.4"/>
