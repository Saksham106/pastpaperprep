<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img" aria-labelledby="t">
  <title id="t">Pictogram of cups of coffee sold at a cafe. Key: one whole circle represents 8 cups. Monday: 3 whole circles and a half circle. Tuesday: 2 whole circles and a quarter circle. Wednesday: 4 whole circles. Thursday: empty row.</title>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <rect x="10" y="10" width="400" height="184" />
    <line x1="10" y1="46.8" x2="410" y2="46.8" />
    <line x1="10" y1="83.6" x2="410" y2="83.6" />
    <line x1="10" y1="120.4" x2="410" y2="120.4" />
    <line x1="10" y1="157.2" x2="410" y2="157.2" />
    <line x1="110" y1="10" x2="110" y2="194" />
  </g>
  <g font-size="13" font-family="inherit" fill="currentColor" text-anchor="middle">
    <text x="60" y="33" font-weight="bold">Day</text>
    <text x="260" y="33" font-weight="bold">Cups of coffee sold</text>
    <text x="60" y="69.8">Monday</text>
    <text x="60" y="106.6">Tuesday</text>
    <text x="60" y="143.4">Wednesday</text>
    <text x="60" y="180.2">Thursday</text>
  </g>
  <g fill="var(--t5-ink)" fill-opacity="0.6" stroke="currentColor" stroke-width="1">
    <circle cx="140" cy="65.2" r="14" />
    <circle cx="180" cy="65.2" r="14" />
    <circle cx="220" cy="65.2" r="14" />
    <path d="M 260 65.2 L 260 51.2 A 14 14 0 0 1 260.0 79.2 Z" />
    <circle cx="140" cy="102.0" r="14" />
    <circle cx="180" cy="102.0" r="14" />
    <path d="M 220 102.0 L 220 88.0 A 14 14 0 0 1 234.0 102.0 Z" />
    <circle cx="140" cy="138.8" r="14" />
    <circle cx="180" cy="138.8" r="14" />
    <circle cx="220" cy="138.8" r="14" />
    <circle cx="260" cy="138.8" r="14" />
  </g>
  <g fill="var(--t5-ink)" fill-opacity="0.6" stroke="currentColor" stroke-width="1">
    <circle cx="140" cy="222" r="14" />
