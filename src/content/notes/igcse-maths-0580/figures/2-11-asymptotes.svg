  <title id="t">Two sketches with asymptotes. Left: y equals 6 over x plus 3, two separate branches, top right and bottom left of where the y-axis meets the dashed line y equals 3. The left branch crosses the x-axis at minus 2. Neither branch meets the y-axis or the dashed line. Right: y equals 5 times 0.5 to the power x, minus 2. The curve is steep on the left, crosses the y-axis at 3, then falls and levels off just above the dashed line y equals minus 2.</title>
