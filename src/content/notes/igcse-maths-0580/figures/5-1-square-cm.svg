<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img" aria-labelledby="t">
  <title id="t">A square with sides of 1 centimetre, which is 10 millimetres. It is divided into a 10 by 10 grid of small squares, each 1 millimetre by 1 millimetre. There are 10 times 10, which is 100, small squares, so 1 square centimetre is 100 square millimetres.</title>
  <g stroke="var(--muted)" stroke-width="0.8">
    <line x1="55" y1="30" x2="55" y2="180"/>
    <line x1="40" y1="45" x2="190" y2="45"/>
    <line x1="70" y1="30" x2="70" y2="180"/>
    <line x1="40" y1="60" x2="190" y2="60"/>
    <line x1="85" y1="30" x2="85" y2="180"/>
    <line x1="40" y1="75" x2="190" y2="75"/>
    <line x1="100" y1="30" x2="100" y2="180"/>
    <line x1="40" y1="90" x2="190" y2="90"/>
    <line x1="115" y1="30" x2="115" y2="180"/>
    <line x1="40" y1="105" x2="190" y2="105"/>
    <line x1="130" y1="30" x2="130" y2="180"/>
    <line x1="40" y1="120" x2="190" y2="120"/>
    <line x1="145" y1="30" x2="145" y2="180"/>
    <line x1="40" y1="135" x2="190" y2="135"/>
    <line x1="160" y1="30" x2="160" y2="180"/>
    <line x1="40" y1="150" x2="190" y2="150"/>
    <line x1="175" y1="30" x2="175" y2="180"/>
    <line x1="40" y1="165" x2="190" y2="165"/>
  </g>
  <rect x="40" y="30" width="150" height="150" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="40" y="30" width="15" height="15" fill="var(--t1-ink)" fill-opacity="0.35" stroke="var(--t1-ink)" stroke-width="1.5"/>
  <g font-family="inherit" font-size="14" fill="currentColor" text-anchor="middle">
    <text x="115.0" y="202">1 cm = 10 mm</text>
    <text x="28" y="105.0" transform="rotate(-90 28 105.0)">1 cm = 10 mm</text>
  </g>
  <g font-family="inherit" font-size="15" fill="currentColor">
    <text x="215" y="60" fill="var(--t1-ink)">one small square</text>
    <text x="215" y="80" fill="var(--t1-ink)">= 1 mm²</text>
    <text x="215" y="125">10 × 10 = 100 of them</text>
    <text x="215" y="150" font-weight="bold">1 cm² = 100 mm²</text>
  </g>
</svg>
