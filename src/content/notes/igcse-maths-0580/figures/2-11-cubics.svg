  <title id="t">Two cubic sketches. Left: y equals x(x minus 4)(x plus 3). It starts low on the left, rises through minus 3 on the x-axis, turns, falls through the origin, turns again and rises through 4. Right: y equals minus x(x minus 2) squared. It starts high on the left, falls through the origin, turns, rises to touch the x-axis at 2 without crossing it, then falls away.</title>
