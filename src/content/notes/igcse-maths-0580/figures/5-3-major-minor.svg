<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 260" role="img" aria-labelledby="t">
<title id="t">A circle with centre O cut by two radii. The smaller slice at the top, with angle theta at the centre, is shaded darker and labelled minor sector. The rest of the circle, with angle 360 degrees minus theta, is shaded lighter and labelled major sector.</title>
<path d="M165,135 L103.9,62.2 A95,95 0 1 0 247.3,87.5 Z" fill="var(--t3-ink)" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
<path d="M165,135 L247.3,87.5 A95,95 0 0 0 103.9,62.2 Z" fill="var(--t2-ink)" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/>
<circle cx="165" cy="135" r="3" fill="currentColor"/>
<text x="173" y="153" fill="currentColor" font-size="14" font-family="inherit">O</text>
<path d="M184.1,124.0 A22,22 0 0 0 150.9,118.1" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="170.9" y="106.5" fill="currentColor" font-size="15" text-anchor="middle" font-family="inherit">θ</text>
<path d="M145.7,112.0 A30,30 0 1 0 191.0,120.0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="156.7" y="187.3" fill="currentColor" font-size="13" text-anchor="middle" font-family="inherit">360° − θ</text>
<text x="176.9" y="71.6" fill="var(--t2-ink)" font-size="13" text-anchor="middle" font-family="inherit">minor sector</text>
<text x="144.9" y="212.3" fill="var(--t3-ink)" font-size="13" text-anchor="middle" font-family="inherit">major sector</text>
</svg>
