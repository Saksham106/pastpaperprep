  <line x1="65.0" y1="112.1" x2="126.4" y2="69.0" stroke="currentColor" stroke-width="1.8"/>
  <line x1="171.4" y1="147.0" x2="126.4" y2="69.0" stroke="currentColor" stroke-width="1.8"/>
  <line x1="20.0" y1="190.0" x2="81.4" y2="147.0" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
