<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" role="img" aria-labelledby="t">
  <title id="t">Two solids. On the left, a triangular prism with equilateral triangle ends. A shaded triangle halfway along its length is a plane of symmetry across the middle, parallel to the ends. On the right, a pyramid with a square base and its top vertex directly above the centre of the base. A dashed vertical axis runs from the top vertex to the centre of the base. A shaded triangle through the top vertex and the midpoints of the left and right base edges is one of its planes of symmetry; it contains the axis.</title>
