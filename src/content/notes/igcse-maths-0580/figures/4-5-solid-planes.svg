  <text x="125.0" y="220.0" fill="currentColor" font-size="12" text-anchor="middle">plane across the middle</text>
  <polygon points="377.5,64.2 322.5,184.2 432.5,184.2" fill="var(--t2-ink)" stroke="var(--t2-ink)" stroke-width="1.4" fill-opacity="0.3"/>
