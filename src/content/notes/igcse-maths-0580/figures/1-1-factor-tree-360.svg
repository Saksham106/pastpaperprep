<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-labelledby="t">
  <title id="t">Factor tree for 360. 360 splits into 36 and 10. 36 splits into 6 and 6. 10 splits into 2 and 5. Each 6 splits into 2 and 3. The primes at the ends of the branches are circled: 2, 3, 2, 3, 2 and 5. So 360 equals 2 cubed times 3 squared times 5.</title>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="190" y1="38" x2="125" y2="78"/>
    <line x1="210" y1="38" x2="275" y2="78"/>
    <line x1="115" y1="104" x2="75" y2="144"/>
    <line x1="135" y1="104" x2="175" y2="144"/>
    <line x1="270" y1="104" x2="245" y2="140"/>
    <line x1="290" y1="104" x2="315" y2="140"/>
    <line x1="68" y1="170" x2="45" y2="206"/>
    <line x1="82" y1="170" x2="105" y2="206"/>
    <line x1="168" y1="170" x2="145" y2="206"/>
    <line x1="182" y1="170" x2="205" y2="206"/>
  </g>
  <g stroke="var(--t1-ink)" stroke-width="2" fill="none">
    <circle cx="240" cy="157" r="16"/>
    <circle cx="320" cy="157" r="16"/>
    <circle cx="45" cy="223" r="16"/>
    <circle cx="105" cy="223" r="16"/>
    <circle cx="145" cy="223" r="16"/>
    <circle cx="205" cy="223" r="16"/>
  </g>
  <g font-family="inherit" font-size="18" fill="currentColor" text-anchor="middle">
    <text x="200" y="30">360</text>
    <text x="125" y="97">36</text>
    <text x="280" y="97">10</text>
    <text x="75" y="163">6</text>
    <text x="175" y="163">6</text>
  </g>
  <g font-family="inherit" font-size="18" fill="var(--t1-ink)" font-weight="bold" text-anchor="middle">
    <text x="240" y="163">2</text>
    <text x="320" y="163">5</text>
    <text x="45" y="229">2</text>
    <text x="105" y="229">3</text>
    <text x="145" y="229">2</text>
    <text x="205" y="229">3</text>
  </g>
  <g font-family="inherit" font-size="15" fill="var(--muted)" text-anchor="middle">
    <text x="200" y="262">360 = 2 × 2 × 2 × 3 × 3 × 5 = 2³ × 3² × 5</text>
  </g>
</svg>
