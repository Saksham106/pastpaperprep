  <line x1="100.0" y1="120.0" x2="292.0" y2="120.0" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 3"/>
  <line x1="292.0" y1="120.0" x2="125.5" y2="54.8" stroke="var(--t3-ink)" stroke-width="2.2"/>
  <line x1="292.0" y1="120.0" x2="125.5" y2="185.2" stroke="var(--t3-ink)" stroke-width="2.2"/>
  <line x1="100.0" y1="120.0" x2="125.5" y2="54.8" stroke="var(--t1-ink)" stroke-width="2.2"/>
  <line x1="100.0" y1="120.0" x2="125.5" y2="185.2" stroke="var(--t1-ink)" stroke-width="2.2"/>
  <path d="M122.2,63.2 L130.6,66.5 L133.9,58.1" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <path d="M122.2,176.8 L130.6,173.5 L133.9,181.9" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <line x1="210.9" y1="81.8" x2="206.6" y2="93.0" stroke="currentColor" stroke-width="1.4"/>
  <line x1="206.6" y1="147.0" x2="210.9" y2="158.2" stroke="currentColor" stroke-width="1.4"/>
  <circle cx="100.0" cy="120.0" r="3" fill="currentColor"/>
  <circle cx="292.0" cy="120.0" r="3" fill="currentColor"/>
  <circle cx="125.5" cy="54.8" r="3" fill="currentColor"/>
  <circle cx="125.5" cy="185.2" r="3" fill="currentColor"/>
  <g font-family="inherit">
    <text x="86.0" y="125.0" fill="currentColor" font-size="14" text-anchor="middle">O</text>
    <text x="304.0" y="125.0" fill="currentColor" font-size="14" text-anchor="middle">T</text>
    <text x="123.5" y="44.8" fill="currentColor" font-size="14" text-anchor="middle">P</text>
    <text x="123.5" y="207.2" fill="currentColor" font-size="14" text-anchor="middle">Q</text>
  </g>
</svg>
