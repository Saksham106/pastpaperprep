<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">Circle with centre O and a point T outside it, to the right. Two tangents from T touch the circle at P, at the top, and Q, at the bottom. TP and TQ are each marked with one tick to show they are equal. Radii OP and OQ meet the tangents at right angles, which are marked. A dashed line joins O to T, so OPTQ is a kite.</title>
