  <title id="t">Six solids with their names, hidden edges dashed. Cube: six square faces. Triangular prism: the same triangle at each end, joined by three rectangles. Cylinder: two circular ends joined by a curved surface. Square-based pyramid: a square base with four triangular faces meeting at a point at the top. Cone: a circular base and a curved surface that rises to a point. Sphere: a round ball.</title>
