<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 354" role="img" aria-labelledby="t">
  <title id="t">Grid with x from 0 to 8 and y from minus 2 to 8, showing two parallel straight lines. The upper line, y equals one half x plus 3, goes from (0, 3) to (8, 7). The lower line, y equals one half x minus 1, goes from (0, minus 1) to (8, 3). On each line a dashed triangle shows across 2 and up 1: on the upper line from (2, 4) to (4, 5), and on the lower line from (4, 1) to (6, 2). The lines stay the same distance apart and never meet.</title>
  <g stroke="var(--muted)" stroke-width="0.6" opacity="0.6">
    <line x1="40" y1="24" x2="40" y2="324"/>
    <line x1="70" y1="24" x2="70" y2="324"/>
    <line x1="100" y1="24" x2="100" y2="324"/>
    <line x1="130" y1="24" x2="130" y2="324"/>
    <line x1="160" y1="24" x2="160" y2="324"/>
    <line x1="190" y1="24" x2="190" y2="324"/>
    <line x1="220" y1="24" x2="220" y2="324"/>
    <line x1="250" y1="24" x2="250" y2="324"/>
    <line x1="280" y1="24" x2="280" y2="324"/>
    <line x1="40" y1="324" x2="280" y2="324"/>
    <line x1="40" y1="294" x2="280" y2="294"/>
    <line x1="40" y1="264" x2="280" y2="264"/>
    <line x1="40" y1="234" x2="280" y2="234"/>
    <line x1="40" y1="204" x2="280" y2="204"/>
    <line x1="40" y1="174" x2="280" y2="174"/>
    <line x1="40" y1="144" x2="280" y2="144"/>
    <line x1="40" y1="114" x2="280" y2="114"/>
    <line x1="40" y1="84" x2="280" y2="84"/>
    <line x1="40" y1="54" x2="280" y2="54"/>
    <line x1="40" y1="24" x2="280" y2="24"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="40" y1="264" x2="280" y2="264"/>
    <line x1="40" y1="324" x2="40" y2="24"/>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="70" y="278">1</text>
    <text x="100" y="278">2</text>
    <text x="130" y="278">3</text>
    <text x="160" y="278">4</text>
    <text x="190" y="278">5</text>
    <text x="220" y="278">6</text>
    <text x="250" y="278">7</text>
    <text x="280" y="278">8</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="end">
    <text x="35" y="328">&#8722;2</text>
    <text x="35" y="298">&#8722;1</text>
    <text x="35" y="278">0</text>
    <text x="35" y="238">1</text>
    <text x="35" y="208">2</text>
    <text x="35" y="178">3</text>
    <text x="35" y="148">4</text>
    <text x="35" y="118">5</text>
    <text x="35" y="88">6</text>
    <text x="35" y="58">7</text>
    <text x="35" y="28">8</text>
  </g>
  <text x="288" y="268" fill="currentColor" font-size="14" font-style="italic" font-family="inherit">x</text>
  <text x="46" y="16" fill="currentColor" font-size="14" font-style="italic" font-family="inherit">y</text>
  <line x1="100" y1="144" x2="160" y2="144" stroke="var(--t2-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="160" y1="144" x2="160" y2="114" stroke="var(--t2-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="160" y1="234" x2="220" y2="234" stroke="var(--t2-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="220" y1="234" x2="220" y2="204" stroke="var(--t2-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="40" y1="174" x2="280" y2="54" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <line x1="40" y1="294" x2="280" y2="174" stroke="var(--t3-ink)" stroke-width="2.4"/>
  <text x="130" y="160" fill="var(--t2-ink)" font-size="12" font-family="inherit" text-anchor="middle" font-weight="bold">across 2</text>
  <text x="165" y="133.0" fill="var(--t2-ink)" font-size="12" font-family="inherit" text-anchor="start" font-weight="bold">up 1</text>
  <text x="190" y="250" fill="var(--t2-ink)" font-size="12" font-family="inherit" text-anchor="middle" font-weight="bold">across 2</text>
  <text x="225" y="223.0" fill="var(--t2-ink)" font-size="12" font-family="inherit" text-anchor="start" font-weight="bold">up 1</text>
  <text x="70" y="108.0" fill="var(--t1-ink)" font-size="13" font-family="inherit" text-anchor="start" font-weight="bold">y = ½x + 3</text>
  <text x="49.0" y="316.0" fill="var(--t3-ink)" font-size="13" font-family="inherit" text-anchor="start" font-weight="bold">y = ½x − 1</text>
</svg>
