<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t">
  <title id="t">Triangle PQR built with compasses. The base PQ is 8 cm. An arc of radius 6.5 cm drawn from P and an arc of radius 5.5 cm drawn from Q cross at R. Straight lines join P to R and Q to R, and both arcs are left showing.</title>
  <line x1="40.0" y1="190.0" x2="280.0" y2="190.0" stroke="currentColor" stroke-width="2.2"/>
  <path d="M210.5,95.3 A195.0,195.0 0 0 0 146.1,26.4" fill="none" stroke="var(--t1-ink)" stroke-width="1.6"/>
  <path d="M223.0,35.2 A165.0,165.0 0 0 0 149.6,88.9" fill="none" stroke="var(--t1-ink)" stroke-width="1.6"/>
  <line x1="40.0" y1="190.0" x2="182.5" y2="56.9" stroke="currentColor" stroke-width="1.8"/>
  <line x1="280.0" y1="190.0" x2="182.5" y2="56.9" stroke="currentColor" stroke-width="1.8"/>
  <circle cx="40.0" cy="190.0" r="3" fill="currentColor"/>
  <circle cx="280.0" cy="190.0" r="3" fill="currentColor"/>
  <circle cx="182.5" cy="56.9" r="3" fill="currentColor"/>
  <g font-family="inherit">
    <text x="28.0" y="195.0" fill="currentColor" font-size="14" text-anchor="middle">P</text>
    <text x="292.0" y="195.0" fill="currentColor" font-size="14" text-anchor="middle">Q</text>
    <text x="182.5" y="42.9" fill="currentColor" font-size="14" text-anchor="middle">R</text>
    <text x="160.0" y="210.0" fill="currentColor" font-size="13" text-anchor="middle">8 cm</text>
    <text x="83.2" y="123.4" fill="var(--t1-ink)" font-size="13" text-anchor="middle">6.5 cm</text>
    <text x="261.2" y="123.4" fill="var(--t1-ink)" font-size="13" text-anchor="middle">5.5 cm</text>
  </g>
</svg>
