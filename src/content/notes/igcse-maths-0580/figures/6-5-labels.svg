<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img" aria-labelledby="t">
  <title id="t">Triangle ABC with A at bottom left, B at bottom right and C at the top. Side a is BC, across from angle A. Side b is CA, across from angle B. Side c is AB, across from angle C. Each angle and its opposite side are drawn in the same colour.</title>
  <line x1="300" y1="180" x2="200" y2="40" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <line x1="40" y1="180" x2="200" y2="40" stroke="var(--t2-ink)" stroke-width="2.4"/>
  <line x1="40" y1="180" x2="300" y2="180" stroke="var(--t3-ink)" stroke-width="2.4"/>
  <path d="M68,180 A28,28 0 0 0 61.07,161.56" fill="none" stroke="var(--t1-ink)" stroke-width="1.8"/>
  <path d="M272,180 A28,28 0 0 1 283.73,157.22" fill="none" stroke="var(--t2-ink)" stroke-width="1.8"/>
  <path d="M181.94,55.80 A24,24 0 0 0 213.95,59.53" fill="none" stroke="var(--t3-ink)" stroke-width="1.8"/>
  <text x="26" y="194" fill="var(--t1-ink)" font-size="15" text-anchor="middle" font-family="inherit">A</text>
  <text x="314" y="194" fill="var(--t2-ink)" font-size="15" text-anchor="middle" font-family="inherit">B</text>
  <text x="200" y="30" fill="var(--t3-ink)" font-size="15" text-anchor="middle" font-family="inherit">C</text>
  <text x="264" y="106" fill="var(--t1-ink)" font-size="15" font-style="italic" text-anchor="start" font-family="inherit">a</text>
  <text x="108" y="104" fill="var(--t2-ink)" font-size="15" font-style="italic" text-anchor="end" font-family="inherit">b</text>
  <text x="170" y="202" fill="var(--t3-ink)" font-size="15" font-style="italic" text-anchor="middle" font-family="inherit">c</text>
</svg>
