  <rect x="78" y="70" width="64" height="128" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <rect x="142" y="70" width="80" height="128" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <path d="M78,70 L142,70 L78,22 Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <path d="M78,198 L142,198 L78,246 Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <path d="M86,70 L86,62 L78,62" fill="none" stroke="var(--t1-ink)" stroke-width="1.2"/>
  <path d="M86,198 L86,206 L78,206" fill="none" stroke="var(--t1-ink)" stroke-width="1.2"/>
