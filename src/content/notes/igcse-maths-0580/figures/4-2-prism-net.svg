<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 310" role="img" aria-labelledby="t">
  <title id="t">Net of a triangular prism. Three rectangles sit side by side, each 8 cm tall, with widths 3 cm, 4 cm and 5 cm. A right-angled triangle with shorter sides 3 cm and 4 cm is joined to the top of the 4 cm rectangle, and an identical triangle is joined to its bottom. The right angles are at the corners next to the 3 cm rectangle.</title>
