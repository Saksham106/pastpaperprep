  <title id="t">Frequency table for how 24 students travel to school. Walk: two gates of five and one stroke, frequency 11. Bus: one gate and one stroke, frequency 6. Car: four strokes, frequency 4. Bike: three strokes, frequency 3. Total 24.</title>
