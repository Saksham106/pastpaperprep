<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 205" role="img" aria-labelledby="t">
  <title id="t">Four small graphs side by side. First, the cubic y equals x cubed: an S-shaped curve rising from bottom left, flattening through the origin, then rising to top right. Second, y equals 1 over x squared: two curves, both above the x-axis, one each side of the y-axis, rising steeply near the y-axis. Third, y equals the square root of x: starts at the origin and rises more and more slowly, only for x at least 0. Fourth, y equals 1 over the square root of x: only for x greater than 0, falling steeply near the y-axis and then levelling off towards the x-axis.</title>
