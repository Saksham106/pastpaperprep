<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" role="img" aria-labelledby="t">
  <title id="t">A table of exact values. Columns are 0, 30, 45, 60 and 90 degrees. The sine row reads 0, one half, root 2 over 2, root 3 over 2, 1. The cosine row reads 1, root 3 over 2, root 2 over 2, one half, 0. The tangent row reads 0, root 3 over 3, 1, root 3, and no value at 90 degrees.</title>
  <g fill="none" stroke="var(--muted)" stroke-width="1.2">
    <rect x="10" y="10" width="400" height="150" rx="6"/>
    <line x1="10" y1="47.5" x2="410" y2="47.5"/>
    <line x1="10" y1="85" x2="410" y2="85"/>
    <line x1="10" y1="122.5" x2="410" y2="122.5"/>
    <line x1="80" y1="10" x2="80" y2="160"/>
  </g>
  <g fill="currentColor" font-family="inherit" font-size="15" text-anchor="middle">
    <text x="45" y="34" font-style="italic">x</text>
    <text x="113" y="34" font-weight="bold">0°</text>
    <text x="179" y="34" font-weight="bold">30°</text>
    <text x="245" y="34" font-weight="bold">45°</text>
    <text x="311" y="34" font-weight="bold">60°</text>
    <text x="377" y="34" font-weight="bold">90°</text>
  </g>
  <g fill="var(--t1-ink)" font-family="inherit" font-size="15" text-anchor="middle">
    <text x="45" y="72" font-style="italic">sin x</text>
    <text x="113" y="72">0</text>
    <text x="179" y="72">1/2</text>
    <text x="245" y="72">√2/2</text>
    <text x="311" y="72">√3/2</text>
    <text x="377" y="72">1</text>
  </g>
  <g fill="var(--t2-ink)" font-family="inherit" font-size="15" text-anchor="middle">
    <text x="45" y="109" font-style="italic">cos x</text>
    <text x="113" y="109">1</text>
    <text x="179" y="109">√3/2</text>
    <text x="245" y="109">√2/2</text>
    <text x="311" y="109">1/2</text>
    <text x="377" y="109">0</text>
  </g>
  <g fill="var(--t3-ink)" font-family="inherit" font-size="15" text-anchor="middle">
    <text x="45" y="147" font-style="italic">tan x</text>
    <text x="113" y="147">0</text>
    <text x="179" y="147">√3/3</text>
    <text x="245" y="147">1</text>
    <text x="311" y="147">√3</text>
    <text x="377" y="147" font-size="13">no value</text>
  </g>
</svg>
