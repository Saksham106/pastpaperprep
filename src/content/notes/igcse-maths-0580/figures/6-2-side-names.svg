<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" role="img" aria-labelledby="t">
  <title id="t">A right-angled triangle ABC with the right angle at C. The marked angle theta is at A. The hypotenuse AB is opposite the right angle. The opposite side BC is across from theta. The adjacent side AC runs from A to the right angle.</title>
  <line x1="40" y1="170" x2="260" y2="40" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <line x1="260" y1="40" x2="260" y2="170" stroke="var(--t2-ink)" stroke-width="2.4"/>
  <line x1="40" y1="170" x2="260" y2="170" stroke="var(--t3-ink)" stroke-width="2.4"/>
  <polyline points="246,170 246,156 260,156" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <path d="M80,170 A40,40 0 0 0 74.4,149.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="92" y="162" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">θ</text>
  <text x="138" y="96" fill="var(--t1-ink)" font-size="14" text-anchor="middle" font-family="inherit">hypotenuse</text>
  <text x="268" y="110" fill="var(--t2-ink)" font-size="14" text-anchor="start" font-family="inherit">opposite</text>
  <text x="150" y="192" fill="var(--t3-ink)" font-size="14" text-anchor="middle" font-family="inherit">adjacent</text>
  <text x="28" y="178" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">A</text>
  <text x="260" y="30" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">B</text>
  <text x="272" y="182" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">C</text>
</svg>
