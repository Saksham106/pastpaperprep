<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">A 4 by 4 grid with a dot at its centre. Shaded squares: row 1 column 2; row 2 columns 3 and 4; row 3 column 2; row 4 column 3. Three unshaded squares are labelled: A in row 3 column 1, B in row 2 column 1, and C in row 3 column 4.</title>
  <rect x="60.0" y="20.0" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.55"/>
  <rect x="100.0" y="140.0" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.55"/>
  <rect x="100.0" y="60.0" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.55"/>
  <rect x="60.0" y="100.0" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.55"/>
  <rect x="140.0" y="60.0" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.55"/>
  <line x1="20.0" y1="20.0" x2="180.0" y2="20.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="20.0" y1="60.0" x2="180.0" y2="60.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="20.0" y1="100.0" x2="180.0" y2="100.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="20.0" y1="140.0" x2="180.0" y2="140.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="20.0" y1="180.0" x2="180.0" y2="180.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="20.0" y1="20.0" x2="20.0" y2="180.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="60.0" y1="20.0" x2="60.0" y2="180.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="100.0" y1="20.0" x2="100.0" y2="180.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="140.0" y1="20.0" x2="140.0" y2="180.0" stroke="currentColor" stroke-width="1.2"/>
  <line x1="180.0" y1="20.0" x2="180.0" y2="180.0" stroke="currentColor" stroke-width="1.2"/>
  <text x="40.0" y="125.0" fill="var(--t1-ink)" font-size="15" text-anchor="middle">A</text>
  <text x="40.0" y="85.0" fill="var(--t1-ink)" font-size="15" text-anchor="middle">B</text>
  <text x="160.0" y="125.0" fill="var(--t1-ink)" font-size="15" text-anchor="middle">C</text>
  <circle cx="100.0" cy="100.0" r="3.5" fill="var(--t1-ink)"/>
</svg>
