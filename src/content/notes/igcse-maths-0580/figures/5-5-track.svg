  <title id="t">A shape made from a rectangle 9 cm long and 4 cm high with a semicircle on each 4 cm end. The two 4 cm ends are dashed lines inside the shape.</title>
  <path d="M90 50 H270 A40 40 0 0 1 270 130 H90 A40 40 0 0 1 90 50 Z" fill="var(--t2-ink)" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
