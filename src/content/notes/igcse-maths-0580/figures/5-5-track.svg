  <line x1="270" y1="50" x2="270" y2="130" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 3"/>
  <g font-family="inherit" font-size="14" fill="currentColor" text-anchor="middle">
    <text x="180" y="40">9 cm</text>
    <text x="244" y="95">4 cm</text>
