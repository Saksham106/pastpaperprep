<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 205" role="img" aria-labelledby="t">
  <title id="t">Four small graphs side by side. First, a straight line sloping up: y equals 2x plus 1. Second, a U-shaped parabola with its lowest point on the y-axis at minus 4: y equals x squared minus 4. Third, an upside-down U-shaped parabola with its highest point on the y-axis at 4: y equals 4 minus x squared. Fourth, the reciprocal graph y equals 4 over x: two separate curves, one in the top-right quarter and one in the bottom-left quarter, each getting closer to both axes without touching them.</title>
