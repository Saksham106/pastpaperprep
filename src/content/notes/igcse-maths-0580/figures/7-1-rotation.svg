  <title id="t">Grid with x from minus 1 to 6 and y from 0 to 5. Triangle PQR has corners P (2, 1), Q (5, 1) and R (2, 3). Its image after a quarter turn anticlockwise about P has corners P (2, 1), Q prime (2, 4) and R prime (0, 1). P is marked with a dot as the centre. Side PQ pointed 3 right; after the turn, PQ prime points 3 up.</title>
