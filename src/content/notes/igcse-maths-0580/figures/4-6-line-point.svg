  <text x="500.0" y="158.0" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">Vertically opposite</text>
  <text x="500.0" y="176.0" fill="var(--muted)" font-size="12" text-anchor="middle" font-family="inherit">opposite angles are equal</text>
</svg>
