  <title id="t">Six quadrilaterals with their lines of symmetry dashed. Square: 4 lines, two through midpoints of opposite sides and two diagonals; order 4. Rectangle: 2 lines through midpoints of opposite sides; order 2. Rhombus: 2 lines, its diagonals; order 2. Parallelogram: no lines; order 2. Kite: 1 line, the diagonal through the corners where the equal sides meet; order 1. Isosceles trapezium: 1 line through the midpoints of the parallel sides; order 1.</title>
