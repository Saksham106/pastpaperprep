  <title id="t">Travel graph of Leah's bike ride. Time from 08 00 to 12 00 across, with 6 small squares per hour, so each small square is 10 minutes. Distance from home in km up, from 0 to 20, with each small square 2 km. The line goes from home at 08 00 up to 8 km at 08 40, is horizontal at 8 km until 09 00, rises more steeply to 18 km at 09 30, is horizontal at 18 km until 10 30, then slopes down to 0 km at 12 00.</title>
