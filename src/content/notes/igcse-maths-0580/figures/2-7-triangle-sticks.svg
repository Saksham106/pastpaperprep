<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" role="img" aria-labelledby="t">
  <title id="t">Three patterns of matchsticks. Pattern 1 is one triangle made of 3 sticks. Pattern 2 is two triangles side by side, sharing a stick, with 5 sticks. Pattern 3 is three triangles in a row with 7 sticks. Each new pattern adds 2 sticks, shown in colour.</title>
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="20" y1="65" x2="60" y2="65" />
    <line x1="20" y1="65" x2="40" y2="30" />
    <line x1="40" y1="30" x2="60" y2="65" />
    <line x1="110" y1="65" x2="150" y2="65" />
    <line x1="110" y1="65" x2="130" y2="30" />
    <line x1="130" y1="30" x2="150" y2="65" />
    <line x1="220" y1="65" x2="260" y2="65" />
    <line x1="220" y1="65" x2="240" y2="30" />
    <line x1="240" y1="30" x2="260" y2="65" />
    <line x1="240" y1="30" x2="280" y2="30" />
    <line x1="260" y1="65" x2="280" y2="30" />
  </g>
  <g stroke="var(--t2-ink)" stroke-width="2.6" stroke-linecap="round" fill="none">
    <line x1="130" y1="30" x2="170" y2="30" />
    <line x1="150" y1="65" x2="170" y2="30" />
    <line x1="260" y1="65" x2="300" y2="65" />
    <line x1="280" y1="30" x2="300" y2="65" />
  </g>
  <g fill="currentColor" font-size="12" font-family="inherit" text-anchor="middle">
    <text x="40" y="88">Pattern 1</text>
    <text x="140" y="88">Pattern 2</text>
    <text x="260" y="88">Pattern 3</text>
  </g>
  <g fill="var(--muted)" font-size="12" font-family="inherit" text-anchor="middle">
    <text x="40" y="106">3 sticks</text>
    <text x="140" y="106">5 sticks</text>
    <text x="260" y="106">7 sticks</text>
  </g>
</svg>
