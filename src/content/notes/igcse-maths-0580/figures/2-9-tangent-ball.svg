  <title id="t">Distance-time graph of a ball rolling down a slope. Time in seconds across from 0 to 6, each small square half a second. Distance in metres up from 0 to 18, each small square 1 metre. The graph is a curve that starts flat at the origin and gets steeper, reaching 18 metres at 6 seconds. A dashed straight tangent touches the curve at 4 seconds, 8 metres. The tangent passes through 2 seconds, 0 metres and 6 seconds, 16 metres, both marked with dots.</title>
