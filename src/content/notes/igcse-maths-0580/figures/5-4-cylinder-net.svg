<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 210" role="img" aria-labelledby="t">
  <title id="t">Left: a cylinder with radius r across the top circle and height h up the side. Right: its net. The curved surface unrolls into a rectangle of height h and width 2 pi r, the circumference of the circle. A circle is attached above and below the rectangle.</title>
  <ellipse cx="70" cy="50" rx="45" ry="12" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M25,150 A45,12 0 0 0 115,150" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M25,150 A45,12 0 0 1 115,150" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="25" y1="50" x2="25" y2="150" stroke="currentColor" stroke-width="2"/>
  <line x1="115" y1="50" x2="115" y2="150" stroke="currentColor" stroke-width="2"/>
  <line x1="70" y1="50" x2="115" y2="50" stroke="var(--t1-ink)" stroke-width="2"/>
  <circle cx="70" cy="50" r="2.5" fill="currentColor"/>
  <text x="90" y="44" fill="var(--t1-ink)" font-size="15" font-style="italic" text-anchor="middle" font-family="inherit">r</text>
  <text x="124" y="105" fill="currentColor" font-size="15" font-style="italic" font-family="inherit">h</text>
  <circle cx="255" cy="46" r="24" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="180" y="70" width="150" height="80" fill="var(--t3-ink)" fill-opacity="0.15" stroke="currentColor" stroke-width="2"/>
  <circle cx="255" cy="174" r="24" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="168" y="115" fill="currentColor" font-size="15" font-style="italic" text-anchor="end" font-family="inherit">h</text>
  <text x="255" y="100" fill="currentColor" font-size="15" font-style="italic" text-anchor="middle" font-family="inherit">2πr</text>
  <text x="255" y="125" fill="currentColor" font-size="13" text-anchor="middle" font-family="inherit">curved surface</text>
</svg>
