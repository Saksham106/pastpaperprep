<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="t">
  <title id="t">Venn diagram of 50 students with three overlapping circles: F for football, H for hockey and T for tennis. F only 11, H only 6, T only 8, F and H only 3, F and T only 5, H and T only 2, all three 4, and outside all three circles 11.</title>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="10" y="10" width="300" height="240"/>
    <circle cx="125" cy="100" r="65"/>
    <circle cx="195" cy="100" r="65"/>
    <circle cx="160" cy="160" r="65"/>
  </g>
  <g font-family="inherit" font-size="17" fill="currentColor">
    <text x="20" y="32">ℰ</text>
    <text x="58" y="50">F</text>
    <text x="252" y="50">H</text>
    <text x="236" y="222">T</text>
  </g>
  <g font-family="inherit" font-size="17" fill="var(--t1-ink)" font-weight="bold" text-anchor="middle">
    <text x="95" y="96">11</text>
    <text x="225" y="96">6</text>
    <text x="160" y="206">8</text>
    <text x="160" y="80">3</text>
    <text x="122" y="150">5</text>
    <text x="198" y="150">2</text>
    <text x="160" y="126">4</text>
  </g>
  <text x="285" y="238" font-family="inherit" font-size="17" fill="currentColor" text-anchor="middle">11</text>
</svg>
