<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 225" role="img" aria-labelledby="t">
  <title id="t">Pyramid VABCD with a square base ABCD. M is the centre of the base, where the diagonals cross. V is vertically above M, and the dashed height VM is at right angles to the base. MA is half of the base diagonal AC. Triangle VMA has its right angle at M, with the slant edge VA as its hypotenuse.</title>
  <line x1="290" y1="150" x2="110" y2="150" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="110" y1="150" x2="40" y2="200" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="165" y1="30" x2="110" y2="150" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="165" y1="175" x2="290" y2="150" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="2 3"/>
  <polyline points="40,200 220,200 290,150" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="165" y1="30" x2="220" y2="200" stroke="currentColor" stroke-width="2"/>
  <line x1="165" y1="30" x2="290" y2="150" stroke="currentColor" stroke-width="2"/>
  <line x1="165" y1="30" x2="40" y2="200" stroke="var(--t2-ink)" stroke-width="2.4"/>
  <line x1="40" y1="200" x2="165" y2="175" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <line x1="165" y1="30" x2="165" y2="175" stroke="var(--t3-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <polyline points="155.2,177 155.2,167 165,165" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="30" y="214" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">A</text>
  <text x="226" y="216" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">B</text>
  <text x="302" y="154" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">C</text>
  <text x="100" y="146" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">D</text>
  <text x="165" y="22" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">V</text>
  <text x="176" y="192" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">M</text>
</svg>
