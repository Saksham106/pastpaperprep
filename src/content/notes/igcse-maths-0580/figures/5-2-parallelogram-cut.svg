<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-labelledby="t">
  <title id="t">A parallelogram with base b along the bottom and a dashed perpendicular height h drawn from the top left corner straight down to the base, with a right-angle mark. The right-angled triangle to the left of the height is shaded. An arrow shows it sliding to the right end, where a dashed copy fills the gap and turns the parallelogram into a rectangle with base b and height h.</title>
  <polygon points="40,200 100,200 100,80" fill="var(--t1-ink)" fill-opacity="0.22" stroke="none"/>
  <polygon points="240,200 300,200 300,80" fill="var(--t1-ink)" fill-opacity="0.1" stroke="var(--t1-ink)" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="40,200 240,200 300,80 100,80" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="200" stroke="var(--t3-ink)" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polyline points="100,188 112,188 112,200" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M75,160 C130,120 210,120 262,160" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="262,160 250,158 256,150" fill="var(--muted)"/>
  <g font-family="inherit" font-size="15" fill="currentColor" text-anchor="middle">
    <text x="140" y="224" font-style="italic">b</text>
    <text x="88" y="145" font-style="italic" fill="var(--t3-ink)">h</text>
  </g>
</svg>
