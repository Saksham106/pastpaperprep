<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">Circle with centre O. AB is a chord below the centre and M is its midpoint, with AM and MB marked equal. A dashed vertical line, the perpendicular bisector of AB, passes through M and through O. It meets AB at a right angle. The radius OA is labelled r and OM is labelled d, so triangle OMA is right-angled at M.</title>
  <circle cx="160.0" cy="110.0" r="90" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <line x1="160.0" y1="8.0" x2="160.0" y2="228.0" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 3"/>
  <line x1="85.2" y1="160.0" x2="234.8" y2="160.0" stroke="var(--t3-ink)" stroke-width="2.2"/>
  <line x1="160.0" y1="110.0" x2="85.2" y2="160.0" stroke="var(--t1-ink)" stroke-width="2.2"/>
  <line x1="160.0" y1="110.0" x2="160.0" y2="160.0" stroke="var(--t2-ink)" stroke-width="2.2"/>
  <path d="M160.0,151.0 L169.0,151.0 L169.0,160.0" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <line x1="122.6" y1="154.0" x2="122.6" y2="166.0" stroke="currentColor" stroke-width="1.4"/>
  <line x1="197.4" y1="154.0" x2="197.4" y2="166.0" stroke="currentColor" stroke-width="1.4"/>
  <circle cx="160.0" cy="110.0" r="3" fill="currentColor"/>
  <circle cx="160.0" cy="160.0" r="3" fill="currentColor"/>
  <circle cx="85.2" cy="160.0" r="3" fill="currentColor"/>
  <circle cx="234.8" cy="160.0" r="3" fill="currentColor"/>
  <g font-family="inherit">
    <text x="174.0" y="106.0" fill="currentColor" font-size="14" text-anchor="middle">O</text>
    <text x="162.0" y="180.0" fill="currentColor" font-size="14" text-anchor="middle">M</text>
    <text x="73.2" y="166.0" fill="currentColor" font-size="14" text-anchor="middle">A</text>
    <text x="246.8" y="166.0" fill="currentColor" font-size="14" text-anchor="middle">B</text>
    <text x="114.6" y="129.0" fill="var(--t1-ink)" font-size="14" text-anchor="middle">r</text>
    <text x="172.0" y="140.0" fill="var(--t2-ink)" font-size="14" text-anchor="start">d</text>
    <text x="168.0" y="226.0" fill="var(--muted)" font-size="12" text-anchor="start">perpendicular bisector</text>
  </g>
</svg>
