    <text x="53" y="210">30</text>
    <text x="53" y="184">40</text>
    <text x="53" y="158">50</text>
    <text x="53" y="132">60</text>
    <text x="53" y="106">70</text>
    <text x="53" y="80">80</text>
    <text x="53" y="54">90</text>
    <text x="53" y="28">100</text>
  </g>
  <text x="136" y="318" fill="currentColor" font-size="13" font-family="inherit" text-anchor="middle">Time (hours)</text>
  <text x="14" y="154" fill="currentColor" font-size="13" font-family="inherit" text-anchor="middle" transform="rotate(-90 14 154)">Battery charge (%)</text>
  <line x1="58" y1="50" x2="214" y2="206" stroke="var(--t3-ink)" stroke-width="2.4"/>
</svg>
