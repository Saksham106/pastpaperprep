<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" role="img" aria-labelledby="t">
  <title id="t">Triangle ABC with base AC along the bottom. D is a point on AC, and the line BD goes straight up from D to B, at right angles to AC. AB is 10 centimetres, the angle at A is 35 degrees, and DC is 4.5 centimetres.</title>
  <line x1="30" y1="180" x2="284" y2="180" stroke="currentColor" stroke-width="2"/>
  <line x1="30" y1="180" x2="194" y2="65" stroke="currentColor" stroke-width="2"/>
  <line x1="194" y1="65" x2="284" y2="180" stroke="currentColor" stroke-width="2"/>
  <line x1="194" y1="65" x2="194" y2="180" stroke="var(--t1-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <polyline points="194,166 208,166 208,180" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <path d="M70,180 A40,40 0 0 0 62.8,157.1" fill="none" stroke="var(--t2-ink)" stroke-width="1.6"/>
  <text x="84" y="172" fill="var(--t2-ink)" font-size="13" text-anchor="middle" font-family="inherit">35°</text>
  <text x="96" y="112" fill="currentColor" font-size="13" text-anchor="middle" font-family="inherit">10 cm</text>
  <text x="239" y="198" fill="currentColor" font-size="13" text-anchor="middle" font-family="inherit">4.5 cm</text>
  <text x="20" y="186" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">A</text>
  <text x="194" y="55" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">B</text>
  <text x="296" y="186" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">C</text>
