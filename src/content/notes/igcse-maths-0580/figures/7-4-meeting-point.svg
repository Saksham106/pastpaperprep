<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" role="img" aria-labelledby="t">
  <title id="t">Triangle OAB with arrow a from O to A along the bottom and arrow b from O up to B. P is on OA, three fifths of the way from O to A. A dashed line through A runs parallel to OB. The line from B through P is extended below OA until it meets the dashed line at Q.</title>
