<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 225" role="img" aria-labelledby="t">
  <title id="t">Cuboid ABCDEFGH. The base is ABCD, with E above A, F above B, G above C and H above D. The base diagonal AC runs across the bottom face from A to C. The space diagonal AG runs through the inside from A up to G. CG is the vertical edge at C, and triangle ACG has its right angle at C.</title>
  <line x1="50" y1="190" x2="130" y2="140" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="130" y1="140" x2="290" y2="140" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="130" y1="140" x2="130" y2="20" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="50,190 210,190 210,70 50,70" fill="none" stroke="currentColor" stroke-width="2"/>
  <polyline points="210,190 290,140 290,20 210,70" fill="none" stroke="currentColor" stroke-width="2"/>
  <polyline points="50,70 130,20 290,20" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="190" x2="290" y2="140" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <line x1="50" y1="190" x2="290" y2="20" stroke="var(--t2-ink)" stroke-width="2.4"/>
  <polyline points="278.3,142.4 278.3,130.4 290,128" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="40" y="205" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">A</text>
  <text x="212" y="207" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">B</text>
  <text x="302" y="146" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">C</text>
  <text x="120" y="136" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">D</text>
  <text x="40" y="70" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">E</text>
  <text x="200" y="88" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">F</text>
  <text x="302" y="22" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">G</text>
  <text x="122" y="16" fill="currentColor" font-size="14" text-anchor="middle" font-family="inherit">H</text>
  <text x="246" y="166" fill="var(--t1-ink)" font-size="12" text-anchor="middle" font-family="inherit">base diagonal</text>
  <text x="168" y="98" fill="var(--t2-ink)" font-size="12" text-anchor="middle" font-family="inherit">space diagonal</text>
</svg>
