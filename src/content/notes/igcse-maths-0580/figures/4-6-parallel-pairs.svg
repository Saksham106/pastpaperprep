<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-labelledby="t">
  <title id="t">Three copies of two parallel lines, marked with arrows, crossed by a slanting line. Left, corresponding: the angle above each parallel line on the right of the slanting line is shaded; they are in the same position and are equal. Middle, alternate: the angle below the top line on the left and the angle above the bottom line on the right are shaded; they sit inside the pair of lines, one each side of the slanting line, and are equal. Right, co-interior: the angle below the top line on the left and the angle above the bottom line on the left are shaded; they sit inside the pair of lines, both on the left, and add up to 180 degrees.</title>
