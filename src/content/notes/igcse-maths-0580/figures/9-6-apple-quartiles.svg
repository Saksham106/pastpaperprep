<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-labelledby="t">
  <title id="t">Cumulative frequency diagram for the masses of 160 apples. Mass in grams across from 100 to 220, each small square 4 grams. Cumulative frequency up from 0 to 160, each small square 4 apples. Crosses are plotted at 100 grams and 0, 120 and 8, 140 and 38, 160 and 90, 180 and 136, 200 and 154, and 220 and 160, joined by a smooth S-shaped curve. Three dashed reading lines go across to the curve and down to the mass axis: from 40 down to about 141 grams, labelled LQ; from 80 down to about 156 grams, labelled median; from 120 down to about 172 grams, labelled UQ. The curve also passes about 20 at 130 grams, and reaches 144 at about 187 grams.</title>
