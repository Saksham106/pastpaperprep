<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190" role="img" aria-labelledby="t">
  <title id="t">Net of a cube made of six squares. Four squares sit in a row: B, C, D, E from left to right. Square A is above B, and square F is below D.</title>
  <rect x="20" y="20" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <rect x="20" y="70" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <rect x="70" y="70" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <rect x="120" y="70" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <rect x="170" y="70" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <rect x="120" y="120" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <g font-family="inherit">
    <text x="45.0" y="51.0" fill="currentColor" font-size="18" text-anchor="middle">A</text>
    <text x="45.0" y="101.0" fill="currentColor" font-size="18" text-anchor="middle">B</text>
    <text x="95.0" y="101.0" fill="currentColor" font-size="18" text-anchor="middle">C</text>
    <text x="145.0" y="101.0" fill="currentColor" font-size="18" text-anchor="middle">D</text>
    <text x="195.0" y="101.0" fill="currentColor" font-size="18" text-anchor="middle">E</text>
    <text x="145.0" y="151.0" fill="currentColor" font-size="18" text-anchor="middle">F</text>
  </g>
</svg>
