  <path d="M160 160 H220 V190" stroke="var(--t3-ink)" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <path d="M165.4 149.3 L176.1 154.7 L170.7 165.4" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <g font-family="inherit" font-size="12" font-weight="bold">
    <text x="196" y="132" fill="var(--t1-ink)">2 up</text>
    <text x="175" y="152" fill="var(--t1-ink)" text-anchor="middle" font-size="11">1</text>
    <text x="226" y="182" fill="var(--t3-ink)">1 down</text>
