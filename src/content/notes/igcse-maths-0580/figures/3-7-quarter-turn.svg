<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="t">
  <title id="t">Grid from minus 4 to 4 on both axes. A line with gradient 2 passes through the origin, with a step of 1 across and 2 up drawn under it. A second line with gradient minus one half also passes through the origin, with a step of 2 across and 1 down drawn on it. A right-angle mark shows the two lines meet at 90 degrees.</title>
