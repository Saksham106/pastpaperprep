    <line x1="130" y1="40" x2="130" y2="280"/><line x1="190" y1="40" x2="190" y2="280"/><line x1="220" y1="40" x2="220" y2="280"/>
    <line x1="250" y1="40" x2="250" y2="280"/><line x1="280" y1="40" x2="280" y2="280"/>
    <line x1="40" y1="40" x2="280" y2="40"/><line x1="40" y1="70" x2="280" y2="70"/><line x1="40" y1="100" x2="280" y2="100"/>
    <line x1="40" y1="130" x2="280" y2="130"/><line x1="40" y1="190" x2="280" y2="190"/><line x1="40" y1="220" x2="280" y2="220"/>
    <line x1="40" y1="250" x2="280" y2="250"/><line x1="40" y1="280" x2="280" y2="280"/>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
