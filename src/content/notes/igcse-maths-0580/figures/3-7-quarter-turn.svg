  <g font-family="inherit" font-size="12" fill="currentColor" text-anchor="middle">
    <text x="100" y="176">−2</text><text x="40" y="176">−4</text><text x="220" y="176">2</text><text x="280" y="176">4</text>
    <text x="150" y="104">2</text><text x="150" y="44">4</text><text x="148" y="224">−2</text><text x="148" y="284">−4</text>
    <text x="150" y="176">O</text>
  </g>
  <g font-family="inherit" font-size="15" font-style="italic" fill="currentColor"><text x="296" y="152">x</text><text x="168" y="30">y</text></g>
