<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-labelledby="t">
  <title id="t">An L-shaped floor plan with all corners right angles. The bottom edge is 9 m and the left edge is 7 m. The top edge is 5 m. The lower right edge is 4 m. A rectangle is missing from the top right corner, so the two edges of the step are not labelled. A dashed line splits the shape into a tall rectangle on the left and a short one on the right.</title>
  <polygon points="40,250 310,250 310,130 190,130 190,40 40,40" fill="var(--t2-ink)" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
  <line x1="190" y1="130" x2="190" y2="250" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 3"/>
  <polyline points="40,238 52,238 52,250" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <polyline points="298,250 298,238 310,238" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <polyline points="40,52 52,52 52,40" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="inherit" font-size="14" fill="currentColor" text-anchor="middle">
    <text x="175" y="274">9 m</text>
    <text x="22" y="150">7 m</text>
    <text x="115" y="30">5 m</text>
    <text x="332" y="195">4 m</text>
  </g>
</svg>
