  <polyline points="60,198 72,198 72,210" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <polyline points="72,30 72,42 60,42" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <polyline points="228,210 228,198 240,198" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="inherit" font-size="14" fill="currentColor" text-anchor="middle">
    <text x="150" y="232">10 cm</text>
