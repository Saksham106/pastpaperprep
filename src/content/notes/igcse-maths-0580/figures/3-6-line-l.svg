    <text x="140" y="264">−2</text>
    <text x="140" y="234">−1</text>
    <text x="140" y="174">1</text>
    <text x="140" y="144">2</text>
    <text x="140" y="114">3</text>
    <text x="140" y="84">4</text>
    <text x="140" y="54">5</text>
