  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="24" y1="200" x2="282" y2="200"/>
    <line x1="150" y1="326" x2="150" y2="8"/>
  </g>
  <path d="M282 200 l-8 -4 v8 z M150 8 l-4 8 h8 z" fill="currentColor"/>
