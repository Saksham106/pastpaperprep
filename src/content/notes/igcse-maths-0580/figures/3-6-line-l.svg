<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 350" role="img" aria-labelledby="t">
  <title id="t">Grid with x from minus 4 to 4 and y from minus 4 to 6. A straight line L slopes down from left to right. It passes through the grid crossings at minus 2, 5; at 0, 2; and at 2, minus 1. A dashed step goes from 0, 2 across 2 to the right, then 3 down to 2, minus 1.</title>
