<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img" aria-labelledby="t">
  <title id="t">Square grid with three parallel arrows. Arrow a goes 2 squares right and 1 square up. Arrow 2a goes 4 squares right and 2 squares up: the same direction, twice as long. Arrow minus a goes 2 squares left and 1 square down: the same length as a, pointing the opposite way.</title>
  <g stroke="var(--muted)" stroke-width="0.6" opacity="0.6">
    <line x1="30" y1="230" x2="30" y2="30"/>
    <line x1="70" y1="230" x2="70" y2="30"/>
    <line x1="110" y1="230" x2="110" y2="30"/>
    <line x1="150" y1="230" x2="150" y2="30"/>
    <line x1="190" y1="230" x2="190" y2="30"/>
    <line x1="230" y1="230" x2="230" y2="30"/>
    <line x1="270" y1="230" x2="270" y2="30"/>
    <line x1="310" y1="230" x2="310" y2="30"/>
    <line x1="350" y1="230" x2="350" y2="30"/>
    <line x1="390" y1="230" x2="390" y2="30"/>
    <line x1="30" y1="230" x2="390" y2="230"/>
    <line x1="30" y1="190" x2="390" y2="190"/>
    <line x1="30" y1="150" x2="390" y2="150"/>
    <line x1="30" y1="110" x2="390" y2="110"/>
    <line x1="30" y1="70" x2="390" y2="70"/>
    <line x1="30" y1="30" x2="390" y2="30"/>
  </g>
  <line x1="70" y1="190" x2="139.3" y2="155.4" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <polygon points="150,150 141.5,159.8 137.0,150.9" fill="var(--t1-ink)"/>
  <line x1="70" y1="110" x2="219.3" y2="35.4" stroke="var(--t3-ink)" stroke-width="2.4"/>
  <polygon points="230,30 221.5,39.8 217.0,30.9" fill="var(--t3-ink)"/>
  <line x1="350" y1="110" x2="280.7" y2="144.6" stroke="var(--t5-ink)" stroke-width="2.4"/>
  <polygon points="270,150 278.5,140.2 283.0,149.1" fill="var(--t5-ink)"/>
  <text x="116" y="190.0" fill="var(--t1-ink)" font-size="17" font-family="inherit" text-anchor="middle" font-weight="bold">a</text>
  <text x="158" y="90" fill="var(--t3-ink)" font-size="17" font-family="inherit" text-anchor="start" font-weight="bold">2a</text>
  <text x="316" y="152.0" fill="var(--t5-ink)" font-size="17" font-family="inherit" text-anchor="middle" font-weight="bold">−a</text>
</svg>
