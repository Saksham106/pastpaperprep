<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 386" role="img" aria-labelledby="t">
  <title id="t">Grid with x from minus 2 to 6 and y from minus 4 to 7. The centre C at (1, 0) is marked with a dot. Triangle A has corners (3, 2), (5, 2) and (3, 6). Its image B, an enlargement with scale factor minus one half, has corners (0, minus 1), (minus 1, minus 1) and (0, minus 3). B is half the size, upside down, on the other side of C. Dashed lines join each corner of A through C to the matching corner of B.</title>
