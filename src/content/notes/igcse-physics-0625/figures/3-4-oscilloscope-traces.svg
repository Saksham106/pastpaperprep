<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="t34scope">
<title id="t34scope">Three oscilloscope traces of sound, each drawn on the same grid of squares with time along the horizontal axis. Left, labelled original sound: three complete waves across the screen, rising 2 squares above the centre line. Middle, labelled louder, same pitch: still three complete waves, but rising 4 squares above the centre line, so a larger amplitude. Right, labelled higher pitch, same loudness: six complete waves across the screen, rising 2 squares above the centre line, so a higher frequency and the same amplitude.</title>
