<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img" aria-labelledby="t611seasons">
  <title id="t611seasons">The Sun in the middle of a dashed oval showing the Earth's orbit, labelled one orbit takes about 365 days. The Earth is drawn at two opposite points of the orbit, on the left and on the right of the Sun. In both positions the Earth's axis leans the same way, with its north end tilted to the right, and the half of the Earth facing the Sun is lit. On the left, labelled June, the north end of the axis leans towards the Sun: summer in the north, winter in the south. On the right, labelled December, the north end leans away from the Sun: winter in the north, summer in the south. Not to scale.</title>
  <ellipse cx="340" cy="150" rx="250" ry="70" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.7"/>
  <circle cx="340" cy="150" r="30" fill="var(--t5-ink)" fill-opacity="0.35" stroke="var(--t5-ink)" stroke-width="2"/>
  <path d="M90 122 A28 28 0 0 1 90 178 Z" fill="var(--t3-ink)" fill-opacity="0.25"/>
  <path d="M90 122 A28 28 0 0 0 90 178 Z" fill="currentColor" fill-opacity="0.28"/>
  <circle cx="90" cy="150" r="28" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M590 122 A28 28 0 0 0 590 178 Z" fill="var(--t3-ink)" fill-opacity="0.25"/>
  <path d="M590 122 A28 28 0 0 1 590 178 Z" fill="currentColor" fill-opacity="0.28"/>
  <circle cx="590" cy="150" r="28" fill="none" stroke="currentColor" stroke-width="2"/>
  <g stroke="currentColor" stroke-width="2">
    <line x1="72.1" y1="191.3" x2="107.9" y2="108.7"/>
    <line x1="572.1" y1="191.3" x2="607.9" y2="108.7"/>
  </g>
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="3 3">
    <line x1="64.3" y1="138.8" x2="115.7" y2="161.2"/>
    <line x1="564.3" y1="138.8" x2="615.7" y2="161.2"/>
  </g>
  <g font-size="13" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="340" y="155" font-weight="bold">Sun</text>
    <text x="340" y="66">one orbit takes about 365 days</text>
    <text x="114" y="101" font-weight="bold">N</text>
    <text x="614" y="101" font-weight="bold">N</text>
    <text x="100" y="222" font-weight="bold">June</text>
    <text x="100" y="240">north tilted towards the Sun</text>
    <text x="100" y="258">summer in the north</text>
    <text x="100" y="276">winter in the south</text>
    <text x="580" y="222" font-weight="bold">December</text>
    <text x="580" y="240">north tilted away from the Sun</text>
    <text x="580" y="258">winter in the north</text>
    <text x="580" y="276">summer in the south</text>
    <text x="340" y="302" fill-opacity="0.75">the axis leans the same way all year (not to scale)</text>
  </g>
</svg>
