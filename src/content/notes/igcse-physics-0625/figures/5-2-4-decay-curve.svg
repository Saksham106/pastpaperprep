<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-labelledby="t524decay">
<title id="t524decay">Decay curve. Time in minutes from 0 to 100 is on the horizontal axis, with small squares of 5 minutes. Count rate in counts per minute from 0 to 400 is on the vertical axis, with small squares of 20 counts per minute. A smooth curve starts at 360 counts per minute at 0 minutes and falls, getting less steep. It passes through 180 at 20 minutes, 90 at 40 minutes, 45 at 60 minutes and about 23 at 80 minutes, and is still above zero at 100 minutes. Dashed lines go across from 180 and from 90 to the curve and down to 20 minutes and 40 minutes on the time axis.</title>
