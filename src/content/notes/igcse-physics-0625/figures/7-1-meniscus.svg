<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" role="img" aria-labelledby="t71m">
<title id="t71m">Close-up of the side of a measuring cylinder holding water. The scale is marked every 1 cubic centimetre from 40 to 50, with numbers at 40, 45 and 50. The water surface curves down in the middle, forming a meniscus whose lowest point lines up with the 46 mark. An eye on the right is level with the bottom of the meniscus, and a dashed horizontal sight line runs from the eye to the 46 mark.</title>
