<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" role="img" aria-labelledby="t222grad">
<title id="t222grad">Graph of the temperature of a metal block against time while a heater warms it. Time in seconds from 0 to 350 is on the horizontal axis and temperature in degrees Celsius from 0 to 40 is on the vertical axis. Crosses every 60 seconds lie on a straight line that rises from 17.0 degrees Celsius at 0 seconds to 35.0 degrees Celsius at 300 seconds. A dashed right-angled triangle under the line has a horizontal side labelled 300 s and a vertical side labelled 18.0 degrees Celsius.</title>
