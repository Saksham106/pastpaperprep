<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="t152span">
<title id="t152span">A spanner seen from the front, gripping a nut on the left. The centre of the nut is the pivot. The handle runs horizontally to the right. A force F pushes straight down on the right-hand end of the handle, at right angles to it. A dashed line below the spanner marks the perpendicular distance d, from the centre of the nut across to the line of the force. A curved arrow round the nut shows that the force turns the spanner clockwise.</title>
