<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t455endon">
<title id="t455endon">A coil seen end-on, looking along its axle, in two positions. In both, an N pole is on the left and an S pole on the right, with field lines running from N to S. Left panel: the coil lies along the field lines. Its left side carries current into the page and is pushed down; its right side carries current out of the page and is pushed up, so the coil turns. Right panel: the coil has turned a quarter turn and now stands at right angles to the field lines. Its top side is pushed up and its bottom side is pushed down, along the line through the axle, so there is no turning effect.</title>
