<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="t31ropeandspr">
<title id="t31ropeandspr">Two waves travelling to the right. Top: a rope shaken up and down at its left end makes a wave of crests and troughs; a double-headed arrow shows the vibration is up and down, at right angles to the arrow showing the direction of travel. Bottom: a spring pushed and pulled along its length at its left end; the coils are close together in some places and spread apart in others; a double-headed arrow shows the vibration is left and right, parallel to the direction of travel.</title>
