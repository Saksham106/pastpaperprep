<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="t431f">
  <title id="t431f">Top: the diode symbol, a triangle pointing at a short bar, and the LED symbol, the same with two small arrows pointing away from it. Bottom: two circuits, A and B, each a cell, an LED and a resistor in series. The long plate of each cell, the positive terminal, is on the left. Conventional current leaves the positive terminal, goes left along the top wire, down the left side and right along the bottom wire through the LED and then the resistor. In A the LED triangle points right, along the current. In B the LED is turned round and points left, against the current.</title>
