<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" role="img" aria-labelledby="t433tr">
  <title id="t433tr">Two resistors, R1 and R2, connected in series with a battery in a single loop. Voltmeter V1 is connected across R1 and voltmeter V2 is connected across R2.</title>
  <g stroke="currentColor" stroke-width="2.2" fill="none">
    <!-- top wire with battery -->
    <line x1="60" y1="60" x2="230" y2="60"/>
    <line x1="240" y1="60" x2="255" y2="60"/>
    <line x1="265" y1="60" x2="460" y2="60"/>
    <!-- sides -->
    <line x1="60" y1="60" x2="60" y2="200"/>
    <line x1="460" y1="60" x2="460" y2="200"/>
    <!-- bottom wire: R1 then R2 -->
    <line x1="60" y1="200" x2="130" y2="200"/>
    <rect x="130" y="190" width="60" height="20"/>
    <line x1="190" y1="200" x2="310" y2="200"/>
    <rect x="310" y="190" width="60" height="20"/>
    <line x1="370" y1="200" x2="460" y2="200"/>
    <!-- voltmeter V1 across R1 -->
    <line x1="110" y1="200" x2="110" y2="260"/>
    <line x1="110" y1="260" x2="145" y2="260"/>
    <circle cx="160" cy="260" r="15"/>
    <line x1="175" y1="260" x2="210" y2="260"/>
    <line x1="210" y1="260" x2="210" y2="200"/>
    <!-- voltmeter V2 across R2 -->
    <line x1="290" y1="200" x2="290" y2="260"/>
    <line x1="290" y1="260" x2="325" y2="260"/>
    <circle cx="340" cy="260" r="15"/>
    <line x1="355" y1="260" x2="390" y2="260"/>
    <line x1="390" y1="260" x2="390" y2="200"/>
  </g>
  <!-- cells: long thin plate is positive, short thick plate negative -->
  <line x1="230" y1="40" x2="230" y2="80" stroke="currentColor" stroke-width="2.2"/>
  <line x1="240" y1="50" x2="240" y2="70" stroke="currentColor" stroke-width="6"/>
  <line x1="255" y1="40" x2="255" y2="80" stroke="currentColor" stroke-width="2.2"/>
  <line x1="265" y1="50" x2="265" y2="70" stroke="currentColor" stroke-width="6"/>
  <g fill="currentColor">
    <circle cx="110" cy="200" r="4"/>
    <circle cx="210" cy="200" r="4"/>
    <circle cx="290" cy="200" r="4"/>
    <circle cx="390" cy="200" r="4"/>
  </g>
  <g font-family="inherit" font-size="15" fill="currentColor" text-anchor="middle">
    <text x="160" y="265">V</text>
    <text x="340" y="265">V</text>
    <text x="160" y="180">R<tspan font-size="11" dy="4">1</tspan></text>
    <text x="340" y="180">R<tspan font-size="11" dy="4">2</tspan></text>
  </g>
  <g font-family="inherit" font-size="13" fill="currentColor" text-anchor="middle">
    <text x="248" y="28">battery</text>
    <text x="160" y="295">V1</text>
    <text x="340" y="295">V2</text>
  </g>
</svg>
