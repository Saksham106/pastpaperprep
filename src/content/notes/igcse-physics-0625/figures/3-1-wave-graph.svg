<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" role="img" aria-labelledby="t31wavegraph">
<title id="t31wavegraph">Graph of displacement in cm, from minus 3.0 to plus 3.0, against distance in cm, from 0 to 120, with grid lines every 5 cm across and every 0.5 cm up. The wave starts at zero displacement at 0 cm and rises to a crest of plus 2.5 cm at 15 cm. It falls through zero at 30 cm to a trough of minus 2.5 cm at 45 cm, back to zero at 60 cm, a second crest of plus 2.5 cm at 75 cm, zero at 90 cm, a second trough of minus 2.5 cm at 105 cm and zero again at 120 cm.</title>
