<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" role="img" aria-labelledby="t452coilgen">
<title id="t452coilgen">A simple a.c. generator. A rectangular coil of wire sits between the N pole of a magnet on the left and the S pole on the right, with magnetic field lines running across from N to S. The coil is fixed to an upright axle and turns with it, shown by a curved rotation arrow at the top. Below the coil, each end of the coil is joined to one of two metal slip rings on the axle, which turn with the coil. A fixed brush presses against each ring. Wires from the two brushes go to a lamp, completing the circuit.</title>
