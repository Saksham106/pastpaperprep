<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" role="img" aria-labelledby="t74g">
<title id="t74g">Speed-time graph for a trolley. Time in seconds from 0 to 3.5 is on the horizontal axis, with small squares of 0.1 seconds. Speed in metres per second from 0 to 1.8 is on the vertical axis, with small squares of 0.1 metres per second. Six crosses at times 0.5, 1.0, 1.5, 2.0, 2.5 and 3.0 seconds have speeds 0.63, 0.79, 0.98, 1.14, 1.33 and 1.50 metres per second. A straight best-fit line passes close to all of them, and a dashed extension of it meets the speed axis at 0.45 metres per second, labelled intercept. A large right-angled triangle under the line has corners on the line at 0.40 seconds, 0.59 metres per second and at 3.40 seconds, 1.64 metres per second. Its horizontal side is labelled 3.00 s and its vertical side 1.05 m/s.</title>
