<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 275" role="img" aria-labelledby="t421fieldpat">
<title id="t421fieldpat">Three electric field patterns. (a) A small positive point charge with eight straight field lines spreading out from it in all directions, like the spokes of a wheel. Every arrow points outwards, away from the charge. (b) A metal sphere with negative charges on its surface. Eight straight field lines point at the centre of the sphere and end on its surface, meeting it at right angles. Every arrow points inwards, towards the sphere. (c) Two vertical metal plates facing each other, the left plate positive and the right plate negative. Five straight, parallel, evenly spaced horizontal field lines run from the left plate to the right plate, meeting each plate at right angles. Every arrow points to the right, from the positive plate to the negative plate. A note says field arrows point away from positive charge and towards negative charge.</title>
<text font-family="inherit" font-size="13" x="120" y="24" fill="currentColor" text-anchor="middle">(a) positive point charge</text>
