<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="t151le">
<title id="t151le">Load-extension graph for a spring. Load in newtons is on the vertical axis from 0 to 6.0, with small squares of 0.2 newtons. Extension in centimetres is on the horizontal axis from 0 to 14, with small squares of 0.5 centimetres. Five plotted crosses at extensions of 2.5, 5.0, 7.5, 10.0 and 12.5 centimetres have loads of 1.0, 2.0, 3.0, 4.0 and 5.0 newtons. A straight line of best fit passes through all of them and through the origin.</title>
