<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="t453relay">
<title id="t453relay">A relay. On the left, a vertical soft-iron core has a coil of wire wound round it, and two leads from the coil go down to the small-current circuit. Just above the top of the core is a horizontal soft-iron armature, a bar that can tip about a pivot at its left end. A spring above the armature holds it up, away from the core. At the right-hand end of the armature is a contact, with a second, fixed contact a short gap below it. Leads from the two contacts go down to the large-current circuit. When the coil is magnetised, it pulls the armature down and the contacts touch.</title>
