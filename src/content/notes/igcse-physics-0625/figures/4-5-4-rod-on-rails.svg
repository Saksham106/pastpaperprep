<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="t454rails">
<title id="t454rails">View from above. Two straight metal rails run across the page from left to right, one above the other. A light metal rod rests across them at right angles. The left ends of the rails are joined to a d.c. supply, with its positive terminal connected to the upper rail. The rod and the middle of the rails lie between the poles of a magnet: the N pole is above the rails and the S pole is below them, so the magnetic field points into the page, shown by crosses. Arrows show the current flowing from the positive terminal along the upper rail, down through the rod and back along the lower rail. A thick arrow pointing right from the rod is labelled force, and shows that the rod rolls to the right.</title>
