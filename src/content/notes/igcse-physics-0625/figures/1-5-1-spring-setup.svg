<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 345" role="img" aria-labelledby="t151set">
<title id="t151set">Apparatus for stretching a spring. A clamp stand on the bench holds a spring hanging from its arm. Slotted masses on a hanger hang from the bottom of the spring and are the load. A pointer fixed to the bottom of the spring points sideways at a metre rule, which is clamped upright beside the spring. A dashed line from the pointer to an eye shows that the reading is taken with the eye level with the pointer.</title>
