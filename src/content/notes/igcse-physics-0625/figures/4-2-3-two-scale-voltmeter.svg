<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="t423volt">
<title id="t423volt">The scale of an analogue voltmeter, marked V, with two scales on one arc. The upper scale runs from 0 to 15 with labels at 0, 5, 10 and 15. The lower scale runs from 0 to 3 with labels at 0, 1, 2 and 3. There are ten small divisions between each pair of labels. Three terminals at the bottom are marked minus, 3 V and 15 V. The pointer lies on the fourth small mark after the label 2 on the lower scale, which is the same as the fourth small mark after 10 on the upper scale.</title>
