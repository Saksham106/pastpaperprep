<line x1="276" y1="108" x2="304" y2="108" stroke="currentColor" stroke-width="1.4"/>
<rect x="130" y="114" width="300" height="12" rx="3" fill="none" stroke="var(--t1-ink)" stroke-width="2"/>
<text font-family="inherit" font-size="15" x="360" y="108" fill="var(--t1-ink)" text-anchor="middle" font-weight="bold">−</text>
<text font-family="inherit" font-size="15" x="380" y="108" fill="var(--t1-ink)" text-anchor="middle" font-weight="bold">−</text>
<text font-family="inherit" font-size="15" x="400" y="108" fill="var(--t1-ink)" text-anchor="middle" font-weight="bold">−</text>
<text font-family="inherit" font-size="15" x="420" y="108" fill="var(--t1-ink)" text-anchor="middle" font-weight="bold">−</text>
<rect x="470" y="114" width="150" height="12" rx="3" fill="none" stroke="var(--t2-ink)" stroke-width="2"/>
<text font-family="inherit" font-size="15" x="480" y="108" fill="var(--t2-ink)" text-anchor="middle" font-weight="bold">−</text>
<text font-family="inherit" font-size="15" x="500" y="108" fill="var(--t2-ink)" text-anchor="middle" font-weight="bold">−</text>
<text font-family="inherit" font-size="15" x="520" y="108" fill="var(--t2-ink)" text-anchor="middle" font-weight="bold">−</text>
<path d="M 440 150 Q 430 190 380 192" fill="none" stroke="currentColor" stroke-width="1.6"/>
<polygon points="372.0,192.0 382.0,187.0 382.0,197.0" fill="var(--t1-ink)"/>
<text font-family="inherit" font-size="12" x="400" y="214" fill="currentColor" text-anchor="middle">the hanging rod turns away</text>
<text font-family="inherit" font-size="12" x="298" y="72" fill="currentColor" text-anchor="start">thread</text>
<line x1="245" y1="150" x2="278" y2="132" stroke="var(--muted)" stroke-width="1"/>
<text font-family="inherit" font-size="12" x="240" y="158" fill="currentColor" text-anchor="end">paper stirrup</text>
<text font-family="inherit" font-size="12" x="130" y="182" fill="var(--t1-ink)" text-anchor="start">rubbed polythene rod, free to turn</text>
<text font-family="inherit" font-size="12" x="545" y="150" fill="var(--t2-ink)" text-anchor="middle">second rubbed polythene rod</text>
<text font-family="inherit" font-size="12" x="320" y="250" fill="var(--muted)" text-anchor="middle">Both rods are negative. Like charges repel, so the hanging rod turns away.</text>
</svg>
