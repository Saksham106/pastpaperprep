<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 265" role="img" aria-labelledby="t421suspende">
<title id="t421suspende">A rubbed polythene rod hangs level from a thread, held in a paper stirrup, so it can turn freely. Its right-hand end carries negative charges. A second rubbed polythene rod, also negatively charged, is held level just to the right of that end. A curved arrow shows the end of the hanging rod turning away from the second rod. A note says both rods are negative, and like charges repel, so the hanging rod turns away.</title>
<line x1="200" y1="30" x2="380" y2="30" stroke="currentColor" stroke-width="4"/>
<line x1="290" y1="30" x2="290" y2="112" stroke="currentColor" stroke-width="1.4"/>
