<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" role="img" aria-labelledby="t612sol">
<title id="t612sol">The Solar System drawn in a row, not to scale. The Sun is a large part-circle on the left. Moving outwards come Mercury, Venus, Earth and Mars, four small planets bracketed as rocky and small. Next is the asteroid belt, a band of tiny dots between Mars and Jupiter. Then come Jupiter, Saturn with its rings, Uranus and Neptune, four large planets bracketed as gaseous and large. Beyond Neptune is a tiny dot labelled Pluto, dwarf planet.</title>
