<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="t522defl">
  <title id="t522defl">Two diagrams in a vacuum. Left: a beam of alpha, beta and gamma radiation enters the space between two horizontal metal plates, positive on top and negative underneath. Gamma goes straight on. Alpha bends gently down towards the negative plate. Beta bends sharply up towards the positive plate. Right: the same beam enters a magnetic field directed into the page. Gamma goes straight on. Alpha curves gently upwards. Beta curves sharply downwards.</title>
