    <circle cx="380" cy="300" r="16"/>
    <circle cx="490" cy="190" r="16"/>
    <circle cx="380" cy="80" r="16"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <circle cx="205" cy="190" r="12" fill="currentColor" fill-opacity="0.45"/>
    <path d="M440 293 A12 12 0 0 1 440 317 Z" fill="var(--t3-ink)" fill-opacity="0.35"/>
    <path d="M440 293 A12 12 0 0 0 440 317 Z" fill="currentColor" fill-opacity="0.45"/>
    <circle cx="560" cy="190" r="12" fill="var(--t3-ink)" fill-opacity="0.35"/>
    <path d="M440 63 A12 12 0 0 0 440 87 Z" fill="var(--t3-ink)" fill-opacity="0.35"/>
    <path d="M440 63 A12 12 0 0 1 440 87 Z" fill="currentColor" fill-opacity="0.45"/>
  </g>
  <g font-size="13" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="70" y="100" font-weight="bold">sunlight</text>
    <text x="380" y="234">Earth</text>
    <text x="380" y="146" font-size="12">Moon's orbit: about a month</text>
    <text x="205" y="222">new moon</text>
    <text x="560" y="222">full moon</text>
    <text x="460" y="304" text-anchor="start">half moon</text>
    <text x="460" y="320" text-anchor="start">(first quarter)</text>
    <text x="460" y="74" text-anchor="start">half moon</text>
    <text x="460" y="90" text-anchor="start">(last quarter)</text>
    <text x="340" y="370" fill-opacity="0.75">small discs: how the Moon looks from the northern hemisphere</text>
    <text x="340" y="386" fill-opacity="0.75">seen from above the North Pole (not to scale)</text>
  </g>
</svg>
