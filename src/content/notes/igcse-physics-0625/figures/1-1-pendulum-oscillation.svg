<line x1="230" y1="38" x2="230" y2="218" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="230" cy="218" r="10" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
