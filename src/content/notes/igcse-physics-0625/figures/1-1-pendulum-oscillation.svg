<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-labelledby="t11pen">
<title id="t11pen">A pendulum hangs from a clamp. The bob is drawn at its left end of swing, A, and faint copies show it at the middle and at the right end of swing, B. A fixed vertical marker stands below the middle of the swing. A curved arrow goes from A across to B, and a second curved arrow comes back from B to A. Together they make one complete oscillation.</title>
