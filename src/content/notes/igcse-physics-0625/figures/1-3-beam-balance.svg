<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="t13bal">
<title id="t13bal">A beam balance. An upright stand holds a pivot at its top, and a horizontal beam rests on the pivot at its centre. A pan hangs from each end of the beam. The left pan holds a stone, the object being measured. The right pan holds a stack of standard masses. The beam is level. An arrow points down from each pan: the weight of the object on the left and the weight of the standard masses on the right. The two arrows are the same length.</title>
