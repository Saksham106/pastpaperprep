<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="t152saw">
<title id="t152saw">A see-saw: a level plank resting at its centre on a triangular pivot. Maya's weight of 420 newtons acts straight down on the plank 1.5 metres to the left of the pivot. Her brother's weight of 350 newtons acts straight down on the plank a distance d to the right of the pivot. Not to scale.</title>
