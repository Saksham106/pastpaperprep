<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="t453wire">
<title id="t453wire">Two views looking straight down the length of a long straight wire. Left: the wire is a small circle with a cross in it, meaning the current flows into the page. Three circles are drawn round it, centred on the wire, with arrows going clockwise. Right: the wire is a small circle with a dot in it, meaning the current flows out of the page. Three circles are drawn round it, with arrows going anticlockwise. In both views the gaps between the circles get bigger further from the wire.</title>
