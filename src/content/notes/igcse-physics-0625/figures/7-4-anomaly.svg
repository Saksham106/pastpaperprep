<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 300" role="img" aria-labelledby="t74a">
<title id="t74a">Graph of current against potential difference for a resistor. P.d. in volts from 0 to 3.0 is on the horizontal axis, with small squares of 0.1 volts. Current in amperes from 0 to 0.70 is on the vertical axis, with small squares of 0.02 amperes. Crosses at 0.5, 1.0, 1.5, 2.0, 2.5 and 3.0 volts have currents 0.10, 0.21, 0.32, 0.52, 0.52 and 0.63 amperes. The point at 2.0 volts and 0.52 amperes is circled and labelled anomaly: it lies well above the line through the others. A straight best-fit line passes through the origin and close to the other five points, ignoring the circled point.</title>
