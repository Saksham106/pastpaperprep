<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 345" role="img" aria-labelledby="tlesliecube">
  <title id="tlesliecube">A Leslie cube seen from above: a hollow metal cube full of very hot water, with four different sides: dull black, shiny black, dull white and shiny silver. The dull black side faces an infrared detector, and arrows show infrared travelling from that side to the detector. A marked distance between the side and the detector is labelled same distance for each side. A note says turn the cube so each side faces the detector in turn.</title>
  <rect x="150" y="90" width="160" height="160" fill="var(--t3-ink)" fill-opacity="0.08"/>
  <line x1="150" y1="90" x2="310" y2="90" stroke="currentColor" stroke-width="2"/>
  <line x1="150" y1="250" x2="310" y2="250" stroke="currentColor" stroke-width="2"/>
  <line x1="150" y1="90" x2="150" y2="250" stroke="currentColor" stroke-width="2"/>
  <line x1="310" y1="90" x2="310" y2="250" stroke="currentColor" stroke-width="7"/>
  <rect x="450" y="145" width="70" height="50" fill="var(--muted)" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/>
  <g stroke="var(--t1-ink)" stroke-width="2.5" fill="none"><line x1="318" y1="140" x2="444" y2="160"/><polyline points="434.4,162.9 444,160 435.8,154.3"/></g>
  <g stroke="var(--t1-ink)" stroke-width="2.5" fill="none"><line x1="318" y1="170" x2="444" y2="170"/><polyline points="435.0,174.3 444,170 435.0,165.7"/></g>
  <g stroke="var(--t1-ink)" stroke-width="2.5" fill="none"><line x1="318" y1="200" x2="444" y2="180"/><polyline points="435.8,185.7 444,180 434.4,177.1"/></g>
  <g stroke="currentColor" stroke-width="1.5" fill="none"><line x1="310" y1="285" x2="450" y2="285"/><polyline points="317.2,281.5 310,285 317.2,288.5"/><polyline points="442.8,288.5 450,285 442.8,281.5"/><line x1="310" y1="255" x2="310" y2="295" stroke-dasharray="3 3"/><line x1="450" y1="200" x2="450" y2="295" stroke-dasharray="3 3"/></g>
  <g font-size="13" fill="currentColor" font-family="inherit"><text x="230" y="165" text-anchor="middle">very hot water</text><text x="230" y="182" text-anchor="middle">(seen from above)</text><text x="230" y="80" text-anchor="middle">shiny black</text><text x="230" y="270" text-anchor="middle">shiny silver</text><text x="140" y="175" text-anchor="end">dull white</text><text x="318" y="120">dull black</text><text x="485" y="135" text-anchor="middle">infrared detector</text><text x="380" y="222" text-anchor="middle">infrared</text><text x="380" y="310" text-anchor="middle">same distance for each side</text><text x="20" y="330">Turn the cube so each side faces the detector in turn.</text></g>
</svg>
