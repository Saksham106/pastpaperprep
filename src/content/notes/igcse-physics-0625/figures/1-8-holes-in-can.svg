<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="t18can">
<title id="t18can">A tall can full of water, with three small holes in its side, one above the other. Water spurts out of each hole. Each jet is drawn falling through the same small height. The jet from the top hole is the slowest and moves the shortest distance sideways. The jet from the bottom hole is the fastest and moves the furthest sideways. An arrow beside the can points down, labelled greater depth, greater pressure.</title>
