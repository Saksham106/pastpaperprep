<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t451wire">
<title id="t451wire">An N pole at the top and an S pole at the bottom, with magnetic field lines running straight down between them, from N to S. A straight wire passes through the gap at right angles to the page, drawn end-on as a small circle with a cross in it, meaning the induced current flows into the page. A thick arrow pointing right from the wire is labelled motion. A thick arrow pointing left from the wire is labelled force on the induced current, opposing the motion. Notes on the right say: field from N to S, down the page; wire moved to the right; induced current into the page; force on the wire to the left.</title>
<rect x="160" y="20" width="250" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
<text font-family="inherit" font-size="18" x="285" y="47" fill="currentColor" text-anchor="middle" font-weight="bold">N</text>
<rect x="160" y="240" width="250" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
<text font-family="inherit" font-size="18" x="285" y="267" fill="currentColor" text-anchor="middle" font-weight="bold">S</text>
<g stroke="var(--muted)" stroke-width="1.2">
<line x1="185" y1="60" x2="185" y2="240"/>
<line x1="235" y1="60" x2="235" y2="240"/>
<line x1="335" y1="60" x2="335" y2="240"/>
<line x1="385" y1="60" x2="385" y2="240"/>
<line x1="285" y1="60" x2="285" y2="132"/>
<line x1="285" y1="168" x2="285" y2="240"/>
</g>
<g fill="var(--muted)">
<polygon points="185,104 180,94 190,94"/>
<polygon points="235,104 230,94 240,94"/>
<polygon points="335,104 330,94 340,94"/>
<polygon points="385,104 380,94 390,94"/>
<polygon points="185,214 180,204 190,204"/>
<polygon points="235,214 230,204 240,204"/>
<polygon points="335,214 330,204 340,204"/>
<polygon points="385,214 380,204 390,204"/>
<polygon points="285,104 280,94 290,94"/>
<polygon points="285,214 280,204 290,204"/>
</g>
<circle cx="285" cy="150" r="15" fill="none" stroke="var(--t2-ink)" stroke-width="2.4"/>
<line x1="275" y1="140" x2="295" y2="160" stroke="var(--t2-ink)" stroke-width="2.4"/>
<line x1="295" y1="140" x2="275" y2="160" stroke="var(--t2-ink)" stroke-width="2.4"/>
<line x1="304" y1="150" x2="362" y2="150" stroke="var(--t1-ink)" stroke-width="3"/>
<polygon points="374,150 360,143 360,157" fill="var(--t1-ink)"/>
<text font-family="inherit" font-size="12" x="312" y="129" fill="var(--t1-ink)" text-anchor="middle">motion</text>
<line x1="266" y1="150" x2="208" y2="150" stroke="var(--t3-ink)" stroke-width="3"/>
<polygon points="196,150 210,143 210,157" fill="var(--t3-ink)"/>
<text font-family="inherit" font-size="12" x="176" y="145" fill="var(--t3-ink)" text-anchor="end">force on the</text>
<text font-family="inherit" font-size="12" x="176" y="161" fill="var(--t3-ink)" text-anchor="end">induced current</text>
<text font-family="inherit" font-size="12" x="404" y="100" fill="currentColor">Field: N to S, down the page</text>
<text font-family="inherit" font-size="12" x="404" y="122" fill="currentColor">Wire moved to the right</text>
<text font-family="inherit" font-size="12" x="404" y="144" fill="var(--t2-ink)">Induced current: into the page (×)</text>
<text font-family="inherit" font-size="12" x="404" y="166" fill="var(--t3-ink)">Force on wire: to the left,</text>
<text font-family="inherit" font-size="12" x="404" y="182" fill="var(--t3-ink)">opposing the motion</text>
</svg>
