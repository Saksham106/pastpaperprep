<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="t423circ">
<title id="t423circ">A cell and a lamp joined in a single loop. The cell is on the left side of the loop, with its positive terminal at the top. The lamp is on the right side. Arrows on the wires show the current going clockwise: out of the positive terminal, along the top wire, down through the lamp and back along the bottom wire. A label beside the cell says the cell does work on the charge, and this is the e.m.f. A label beside the lamp says the charge does work in the lamp, and this is the p.d.</title>
<path d="M 200 132 L 200 50 L 440 50 L 440 122" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M 440 158 L 440 230 L 200 230 L 200 148" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="178" y1="132" x2="222" y2="132" stroke="currentColor" stroke-width="2"/>
<line x1="190" y1="148" x2="210" y2="148" stroke="currentColor" stroke-width="5"/>
<text x="232" y="128" font-family="inherit" font-size="15" fill="currentColor">+</text>
<text x="232" y="160" font-family="inherit" font-size="15" fill="currentColor">−</text>
<circle cx="440" cy="140" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="427.3" y1="127.3" x2="452.7" y2="152.7" stroke="currentColor" stroke-width="2"/>
<line x1="452.7" y1="127.3" x2="427.3" y2="152.7" stroke="currentColor" stroke-width="2"/>
<polygon points="328,50 314,43 314,57" fill="currentColor"/>
<polygon points="312,230 326,223 326,237" fill="currentColor"/>
<text x="320" y="34" font-family="inherit" font-size="13" fill="var(--muted)" text-anchor="middle">current</text>
<text x="168" y="100" font-family="inherit" font-size="15" fill="var(--t1-ink)" text-anchor="end">cell</text>
<text x="168" y="124" font-family="inherit" font-size="13" fill="currentColor" text-anchor="end">does work on</text>
<text x="168" y="142" font-family="inherit" font-size="13" fill="currentColor" text-anchor="end">the charge</text>
<text x="168" y="166" font-family="inherit" font-size="15" fill="var(--t1-ink)" text-anchor="end">e.m.f.</text>
<text x="472" y="100" font-family="inherit" font-size="15" fill="var(--t2-ink)">lamp</text>
<text x="472" y="124" font-family="inherit" font-size="13" fill="currentColor">the charge does</text>
<text x="472" y="142" font-family="inherit" font-size="13" fill="currentColor">work here</text>
<text x="472" y="166" font-family="inherit" font-size="15" fill="var(--t2-ink)">p.d.</text>
</svg>
