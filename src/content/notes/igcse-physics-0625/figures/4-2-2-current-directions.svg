<line x1="320.0" y1="240.0" x2="369.0" y2="240.0" stroke="var(--t2-ink)" stroke-width="2.4"/><polygon points="380.0,240.0 369.0,245.5 369.0,234.5" fill="var(--t2-ink)"/>
