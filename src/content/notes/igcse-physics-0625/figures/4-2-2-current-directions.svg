<text x="260" y="150" font-family="inherit" font-size="13" fill="var(--t3-ink)" text-anchor="middle">electron flow: from − round to +</text>
<text x="260" y="290" font-family="inherit" font-size="13" fill="var(--t2-ink)" text-anchor="middle">conventional current: from + round to −</text>
