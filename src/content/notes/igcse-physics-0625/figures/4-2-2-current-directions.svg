<line x1="262" y1="68" x2="262" y2="92" stroke="currentColor" stroke-width="6"/>
<g font-family="inherit" font-size="18" fill="currentColor" text-anchor="middle"><text x="236" y="58">+</text><text x="278" y="62">−</text></g>
<g font-family="inherit" font-size="13" fill="currentColor" text-anchor="middle"><text x="256" y="40">cell</text><text x="260" y="256">lamp</text></g>
