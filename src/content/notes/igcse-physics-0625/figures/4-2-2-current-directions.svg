<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t422dir">
<title id="t422dir">A cell and a lamp joined in a single loop. The cell is in the top wire with its positive terminal on the left and its negative terminal on the right. Outside the loop, an arrow labelled conventional current leaves the positive terminal and goes anticlockwise round the circuit: left along the top, down the left side, along the bottom through the lamp and up the right side to the negative terminal. Inside the loop, an arrow labelled electron flow goes the opposite way, clockwise, from the negative terminal round to the positive terminal.</title>
<g stroke="currentColor" stroke-width="2.2" fill="none">
<line x1="110" y1="80" x2="250" y2="80"/><line x1="262" y1="80" x2="410" y2="80"/>
<line x1="110" y1="80" x2="110" y2="220"/><line x1="410" y1="80" x2="410" y2="220"/>
<line x1="110" y1="220" x2="245" y2="220"/><line x1="275" y1="220" x2="410" y2="220"/>
<circle cx="260" cy="220" r="15"/>
<line x1="249.4" y1="209.4" x2="270.6" y2="230.6"/><line x1="270.6" y1="209.4" x2="249.4" y2="230.6"/>
</g>
