<line x1="390.0" y1="120.0" x2="390.0" y2="169.0" stroke="var(--t3-ink)" stroke-width="2.4"/><polygon points="390.0,180.0 384.5,169.0 395.5,169.0" fill="var(--t3-ink)"/>
