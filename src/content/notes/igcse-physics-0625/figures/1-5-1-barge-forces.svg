<title id="t151bar">Side view of a canal barge moving to the right. Three horizontal forces act on it. The engine force of 850 newtons points to the right, forwards. The water drag of 520 newtons points to the left, backwards. The wind pushes on the cabin with 140 newtons to the right, forwards. An arrow above the barge shows the motion is to the right.</title>
