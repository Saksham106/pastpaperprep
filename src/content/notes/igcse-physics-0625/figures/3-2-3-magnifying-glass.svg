<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t323mg">
  <title id="t323mg">Ray diagram: an object closer to a converging lens than F gives diverging rays; traced back, they meet at an upright, enlarged, virtual image on the same side as the object</title>
  <line x1="40" y1="200" x2="700" y2="200" stroke="var(--muted)" stroke-width="1.2"/>
  <ellipse cx="420" cy="200" rx="7" ry="80" fill="none" stroke="var(--t3-ink)" stroke-width="2"/>
  <line x1="220" y1="195" x2="220" y2="205" stroke="currentColor" stroke-width="1.5"/>
  <text x="220" y="222" font-size="12" fill="currentColor" text-anchor="middle" font-family="inherit">F</text>
  <line x1="620" y1="195" x2="620" y2="205" stroke="currentColor" stroke-width="1.5"/>
  <text x="620" y="222" font-size="12" fill="currentColor" text-anchor="middle" font-family="inherit">F</text>
  <line x1="300" y1="160" x2="420" y2="160" stroke="var(--t1-ink)" stroke-width="1.8"/>
  <polygon points="364,160 356,163.6 356,156.4" fill="var(--t1-ink)"/>
  <line x1="420" y1="160" x2="690" y2="214" stroke="var(--t1-ink)" stroke-width="1.8"/>
  <polygon points="558.9,187.8 550.4,189.7 551.8,182.7" fill="var(--t1-ink)"/>
  <line x1="420" y1="160" x2="120" y2="100" stroke="var(--t1-ink)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="300" y1="160" x2="520" y2="233.3" stroke="var(--t1-ink)" stroke-width="1.8"/>
  <polygon points="402.8,194.3 394.1,195.2 396.3,188.3" fill="var(--t1-ink)"/>
  <line x1="300" y1="160" x2="120" y2="100" stroke="var(--t1-ink)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="300" y1="200" x2="300" y2="160" stroke="currentColor" stroke-width="2.6"/>
  <polygon points="300,158 294,169 306,169" fill="currentColor"/>
  <line x1="120" y1="200" x2="120" y2="100" stroke="var(--t5-ink)" stroke-width="2.6" stroke-dasharray="6 5"/>
  <polygon points="120,98 114,109 126,109" fill="var(--t5-ink)"/>
  <text x="304" y="222" font-size="12" fill="currentColor" text-anchor="middle" font-family="inherit">object</text>
  <text x="120" y="88" font-size="13" fill="currentColor" text-anchor="middle" font-family="inherit">virtual image</text>
  <text x="420" y="105" font-size="12" fill="currentColor" text-anchor="middle" font-family="inherit">converging lens</text>
  <text x="700" y="248" font-size="12" fill="currentColor" text-anchor="end" font-family="inherit">eye looks through</text>
  <text x="700" y="264" font-size="12" fill="currentColor" text-anchor="end" font-family="inherit">the lens from here</text>
  <text x="370" y="290" font-size="11" fill="var(--muted)" text-anchor="middle" font-family="inherit">dashed lines: rays traced backwards; the image is on the same side as the object</text>
</svg>
