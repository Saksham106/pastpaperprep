  <g font-size="13" fill="currentColor" font-family="inherit">
    <text x="420" y="60">fast particles escape</text>
    <text x="420" y="76">from the surface</text>
    <text x="420" y="150">slower particle:</text>
    <text x="420" y="166">attractions pull it back</text>
    <text x="420" y="270">particles left behind:</text>
    <text x="420" y="286">lower average kinetic</text>
    <text x="420" y="302">energy, so the liquid cools</text>
