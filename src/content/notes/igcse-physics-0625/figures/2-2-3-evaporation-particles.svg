    <circle cx="359" cy="329" r="10"/><circle cx="383" cy="334" r="10"/>
  </g>
  <g fill="var(--t5-ink)" stroke="currentColor" stroke-width="1">
    <circle cx="200" cy="110" r="10"/>
    <circle cx="330" cy="80" r="10"/>
  </g>
  <circle cx="266" cy="200" r="10" fill="var(--t1-ink)" stroke="currentColor" stroke-width="1"/>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="194" y1="100" x2="170" y2="45"/>
    <polyline points="166,59 169,43 179,55"/>
    <line x1="336" y1="70" x2="362" y2="20"/>
