    <circle cx="135" cy="268" r="10"/><circle cx="163" cy="272" r="10"/><circle cx="191" cy="264" r="10"/><circle cx="219" cy="271" r="10"/>
    <circle cx="247" cy="265" r="10"/><circle cx="275" cy="272" r="10"/><circle cx="303" cy="265" r="10"/><circle cx="331" cy="272" r="10"/>
    <circle cx="359" cy="265" r="10"/><circle cx="381" cy="280" r="10"/>
    <circle cx="140" cy="300" r="10"/><circle cx="168" cy="304" r="10"/><circle cx="196" cy="297" r="10"/><circle cx="224" cy="303" r="10"/>
    <circle cx="252" cy="297" r="10"/><circle cx="280" cy="304" r="10"/><circle cx="308" cy="297" r="10"/><circle cx="336" cy="304" r="10"/>
    <circle cx="364" cy="300" r="10"/>
    <circle cx="135" cy="330" r="10"/><circle cx="163" cy="334" r="10"/><circle cx="191" cy="328" r="10"/><circle cx="219" cy="335" r="10"/>
