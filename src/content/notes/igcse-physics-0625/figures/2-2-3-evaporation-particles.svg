<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="t223ev">
  <title id="t223ev">A container of liquid with particles drawn as circles, close together. Two fast particles have left the surface and move up into the air, with long arrows. A slower particle at the surface has a short arrow and is pulled back by its neighbours. The particles left in the liquid have a lower average kinetic energy</title>
