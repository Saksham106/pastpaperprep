<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t151lop">
<title id="t151lop">Sketch of a load-extension graph for a spring, with load in newtons on the vertical axis and extension in centimetres on the horizontal axis. From the origin the graph is a straight line, labelled extension proportional to load. At a marked point labelled limit of proportionality the straight line ends. Beyond it the graph curves and becomes less steep, labelled not proportional.</title>
<path d="M50.0 230.0 L372.0 230.0" fill="none" stroke="currentColor" stroke-width="1.4"/>
<polygon points="380.0,230.0 372.0,234.0 372.0,226.0" fill="currentColor"/>
<path d="M50.0 230.0 L50.0 30.0" fill="none" stroke="currentColor" stroke-width="1.4"/>
<polygon points="50.0,22.0 54.0,30.0 46.0,30.0" fill="currentColor"/>
<text font-family="inherit" font-size="12" x="380" y="250" fill="currentColor" text-anchor="end">extension / cm</text>
<text font-family="inherit" font-size="12" x="58" y="28" fill="currentColor" text-anchor="start">load / N</text>
<text font-family="inherit" font-size="11" x="44" y="244" fill="currentColor" text-anchor="end">0</text>
<path d="M50 230 L220 100" fill="none" stroke="var(--t3-ink)" stroke-width="2.4"/>
<path d="M220 100 Q270 64 360 52" fill="none" stroke="var(--t3-ink)" stroke-width="2.4"/>
<circle cx="220" cy="100" r="4.5" fill="var(--t3-ink)"/>
<path d="M220 100 L232 128" stroke="var(--t3-ink)" stroke-width="1"/>
<text font-family="inherit" font-size="12" x="212" y="142" fill="var(--t3-ink)" text-anchor="start">limit of proportionality</text>
<text font-family="inherit" font-size="11" x="150" y="196" fill="var(--muted)" text-anchor="start">straight: extension</text>
<text font-family="inherit" font-size="11" x="150" y="210" fill="var(--muted)" text-anchor="start">proportional to load</text>
<text font-family="inherit" font-size="11" x="300" y="46" fill="var(--muted)" text-anchor="middle">curve: not proportional</text>
</svg>
