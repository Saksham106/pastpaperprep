<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t223hc">
  <title id="t223hc">Heating curve for pure water heated steadily from minus 20 degrees Celsius. The temperature rises steeply while the ice warms, stays flat at 0 degrees Celsius while the ice melts, rises again, less steeply, while the water warms, stays flat at 100 degrees Celsius for a longer time while the water boils, then rises while the steam warms</title>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="90" y1="360" x2="570" y2="360"/>
    <line x1="90" y1="360" x2="90" y2="30"/>
    <polyline points="562,355 570,360 562,365"/>
    <polyline points="85,38 90,30 95,38"/>
  </g>
  <g stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="90" y1="290" x2="105" y2="290"/>
    <line x1="90" y1="90" x2="365" y2="90"/>
  </g>
  <g stroke="currentColor" stroke-width="1">
    <line x1="84" y1="330" x2="90" y2="330"/>
    <line x1="84" y1="290" x2="90" y2="290"/>
    <line x1="84" y1="90" x2="90" y2="90"/>
  </g>
  <polyline points="90,330 105,290 215,290 365,90 530,90 548,42" fill="none" stroke="var(--t5-ink)" stroke-width="2.5" stroke-linejoin="round"/>
  <g font-size="13" fill="currentColor" font-family="inherit">
    <text x="78" y="334" text-anchor="end">−20</text>
    <text x="78" y="294" text-anchor="end">0</text>
    <text x="78" y="94" text-anchor="end">100</text>
    <text x="98" y="24">temperature / °C</text>
    <text x="570" y="384" text-anchor="end">time</text>
    <text x="100" y="352" text-anchor="start" font-size="12">ice warms</text>
    <text x="160" y="312" text-anchor="middle" font-size="12">melting</text>
    <text x="160" y="327" text-anchor="middle" font-size="12" fill="var(--muted)">ice + water</text>
    <text x="300" y="214" text-anchor="start" font-size="12">water warms</text>
    <text x="447" y="112" text-anchor="middle" font-size="12">boiling</text>
    <text x="447" y="127" text-anchor="middle" font-size="12" fill="var(--muted)">water + steam</text>
    <text x="524" y="50" text-anchor="end" font-size="12">steam warms</text>
    <text x="440" y="240" text-anchor="middle" font-size="12" fill="var(--muted)">flat sections: energy goes in,</text>
    <text x="440" y="255" text-anchor="middle" font-size="12" fill="var(--muted)">temperature stays the same</text>
  </g>
</svg>
