<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="t432sc">
  <title id="t432sc">Series circuit: a battery of two cells, an ammeter A1, a lamp, a resistor and an ammeter A2 are joined one after another in a single loop. A voltmeter is connected in parallel across the lamp.</title>
  <g stroke="currentColor" stroke-width="2.2" fill="none">
    <!-- top wire with battery -->
    <line x1="60" y1="60" x2="230" y2="60"/>
    <line x1="240" y1="60" x2="255" y2="60"/>
    <line x1="265" y1="60" x2="460" y2="60"/>
    <!-- right side with ammeter A2 -->
    <line x1="460" y1="60" x2="460" y2="125"/>
    <circle cx="460" cy="140" r="15"/>
    <line x1="460" y1="155" x2="460" y2="220"/>
    <!-- bottom wire: resistor then lamp -->
    <line x1="460" y1="220" x2="360" y2="220"/>
    <rect x="300" y="210" width="60" height="20"/>
    <line x1="300" y1="220" x2="175" y2="220"/>
    <circle cx="160" cy="220" r="15"/>
    <line x1="149.4" y1="209.4" x2="170.6" y2="230.6"/>
    <line x1="170.6" y1="209.4" x2="149.4" y2="230.6"/>
    <line x1="145" y1="220" x2="60" y2="220"/>
    <!-- left side with ammeter A1 -->
    <line x1="60" y1="220" x2="60" y2="155"/>
    <circle cx="60" cy="140" r="15"/>
    <line x1="60" y1="125" x2="60" y2="60"/>
    <!-- voltmeter across the lamp -->
    <line x1="110" y1="220" x2="110" y2="280"/>
    <line x1="110" y1="280" x2="145" y2="280"/>
    <circle cx="160" cy="280" r="15"/>
    <line x1="175" y1="280" x2="210" y2="280"/>
    <line x1="210" y1="280" x2="210" y2="220"/>
  </g>
  <!-- cells: long thin plate is positive, short thick plate negative -->
  <line x1="230" y1="40" x2="230" y2="80" stroke="currentColor" stroke-width="2.2"/>
  <line x1="240" y1="50" x2="240" y2="70" stroke="currentColor" stroke-width="6"/>
  <line x1="255" y1="40" x2="255" y2="80" stroke="currentColor" stroke-width="2.2"/>
  <line x1="265" y1="50" x2="265" y2="70" stroke="currentColor" stroke-width="6"/>
  <circle cx="110" cy="220" r="4" fill="currentColor"/>
  <circle cx="210" cy="220" r="4" fill="currentColor"/>
  <g font-family="inherit" font-size="15" fill="currentColor" text-anchor="middle">
    <text x="60" y="145">A</text>
    <text x="460" y="145">A</text>
    <text x="160" y="285">V</text>
  </g>
  <g font-family="inherit" font-size="13" fill="currentColor">
    <text x="248" y="28" text-anchor="middle">battery</text>
    <text x="30" y="145" text-anchor="middle">A1</text>
    <text x="490" y="145" text-anchor="middle">A2</text>
    <text x="160" y="200" text-anchor="middle">lamp</text>
    <text x="330" y="200" text-anchor="middle">resistor</text>
    <text x="235" y="285" text-anchor="start">voltmeter</text>
  </g>
  <text x="260" y="312" font-family="inherit" font-size="12" fill="var(--muted)" text-anchor="middle">one loop: A1 and A2 read the same current</text>
</svg>
