<circle cx="330" cy="118" r="3.5" fill="currentColor"/>
<text font-family="inherit" font-size="12" x="335" y="150" fill="var(--muted)" text-anchor="middle">eye level</text>
<path d="M226 84 L172 116" fill="none" stroke="var(--t3-ink)" stroke-width="1"/>
<text font-family="inherit" font-size="12" x="230" y="80" fill="var(--t3-ink)" text-anchor="start">read the bottom of the meniscus</text>
<text font-family="inherit" font-size="12" x="160" y="215" fill="var(--t3-ink)" text-anchor="middle">water</text>
</svg>
