  </g>
  <g font-size="13" fill="currentColor" font-family="inherit">
    <text x="186" y="180">warm water rises:</text>
    <text x="186" y="196">less dense</text>
    <text x="400" y="180">cooler water sinks:</text>
    <text x="400" y="196">denser</text>
