<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="t232dye">
  <title id="t232dye">A beaker of water stands on a gauze. A small flame heats it under the left side only, and a purple crystal sits on the bottom just above the flame. Arrows show the purple water rising above the flame, spreading across the top, sinking down the right side and flowing back along the bottom to the flame. The rising water is warm and less dense; the sinking water is cooler and denser</title>
