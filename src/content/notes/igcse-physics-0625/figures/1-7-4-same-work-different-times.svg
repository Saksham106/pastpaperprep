<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" role="img" aria-labelledby="t174sw">
<title id="t174sw">Two motors side by side, each on a beam, with a rope down to an identical crate of weight 400 N. In each view the crate starts on the floor, shown dashed, and ends 2.0 m higher, shown solid. Both motors do 800 J of work. Motor A takes 4.0 s, so its power is 200 W. Motor B takes 8.0 s, so its power is 100 W.</title>
