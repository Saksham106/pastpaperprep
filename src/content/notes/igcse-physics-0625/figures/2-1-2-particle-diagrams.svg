<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t212pd">
  <title id="t212pd">Particle diagrams of a solid, a liquid and a gas, each in a closed box, with every particle drawn as a circle of the same size. Solid: particles touching in neat rows, a regular pattern, vibrating about fixed positions. Liquid: particles mostly touching in an irregular arrangement, filling the lower part of the box, moving around each other. Gas: a few particles far apart, spread through the whole box, each with an arrow showing it moving fast in a random direction</title>
