<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="t453exp">
<title id="t453exp">A long straight wire stands vertically and passes through a hole in the middle of a horizontal sheet of card. An arrow on the wire shows the current flowing upwards. The wire is part of a circuit with a battery on the right. On the card, two dashed circles are drawn round the wire, seen at an angle, with arrows going anticlockwise as seen from above. Two plotting compasses sit on the outer circle, one on each side of the wire. Each needle lies along the circle, not pointing at the wire, and its N end, shown by an arrowhead, points the same way round as the arrows.</title>
