<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" aria-labelledby="t452emfgraph">
<title id="t452emfgraph">Graph of e.m.f. against time for one turn of a generator coil: a smooth wave that starts at zero, rises to a peak after a quarter turn, falls to zero after half a turn, reaches a trough of the same size below the axis after three quarters of a turn, and is back to zero after one turn. Below the graph, five small views from above show the coil at each of these moments, turning clockwise between an N pole on the left and an S pole on the right. At the start, half turn and full turn the coil lies at right angles to the field, and arrows show its two sides moving along the field lines: the e.m.f. is zero. At a quarter turn and three quarters of a turn the coil lies along the field, and arrows show its two sides moving straight across the field lines: the e.m.f. is a peak and then a trough. The two sides are coloured differently, showing that they have swapped places between the peak and the trough.</title>
