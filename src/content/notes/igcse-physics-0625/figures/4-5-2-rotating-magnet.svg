<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t452rotmag">
<title id="t452rotmag">A rotating-magnet generator. A bar magnet spins on an axle at its centre, shown by a curved arrow. Beside it is a fixed coil of wire, whose two ends are joined straight to a lamp. A note says the coil does not move, so its wires join the lamp directly and no slip rings are needed.</title>
<rect x="110" y="103" width="120" height="34" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="170" y1="103" x2="170" y2="137" stroke="currentColor" stroke-width="1.2"/>
<text font-family="inherit" font-size="16" x="140" y="126" fill="currentColor" text-anchor="middle" font-weight="bold">S</text>
<text font-family="inherit" font-size="16" x="200" y="126" fill="currentColor" text-anchor="middle" font-weight="bold">N</text>
<circle cx="170" cy="120" r="3" fill="currentColor"/>
<path d="M 120 65 A 75 75 0 0 1 220 65" fill="none" stroke="var(--t1-ink)" stroke-width="1.8"/>
<polygon points="226.0,71.0 217.4,68.7 222.6,62.7" fill="var(--t1-ink)"/>
<text font-family="inherit" font-size="12" x="170" y="38" fill="var(--t1-ink)" text-anchor="middle">magnet spins on an axle</text>
<g fill="none" stroke="var(--t2-ink)" stroke-width="2">
<ellipse cx="300" cy="120" rx="8" ry="40"/>
<ellipse cx="320" cy="120" rx="8" ry="40"/>
<ellipse cx="340" cy="120" rx="8" ry="40"/>
<ellipse cx="360" cy="120" rx="8" ry="40"/>
<ellipse cx="380" cy="120" rx="8" ry="40"/>
<ellipse cx="400" cy="120" rx="8" ry="40"/>
<ellipse cx="420" cy="120" rx="8" ry="40"/>
</g>
<text font-family="inherit" font-size="12" x="360" y="68" fill="var(--t2-ink)" text-anchor="middle">fixed coil</text>
<polyline points="300,160 300,215 346,215" fill="none" stroke="currentColor" stroke-width="1.6"/>
<polyline points="420,160 420,215 374,215" fill="none" stroke="currentColor" stroke-width="1.6"/>
<circle cx="360" cy="215" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="350" y1="205" x2="370" y2="225" stroke="currentColor" stroke-width="1.6"/><line x1="370" y1="205" x2="350" y2="225" stroke="currentColor" stroke-width="1.6"/>
<text font-family="inherit" font-size="12" x="360" y="247" fill="currentColor" text-anchor="middle">lamp</text>
<text font-family="inherit" font-size="11" x="470" y="112" fill="var(--muted)" text-anchor="start">The coil does not move,</text>
<text font-family="inherit" font-size="11" x="470" y="128" fill="var(--muted)" text-anchor="start">so its wires join the lamp</text>
<text font-family="inherit" font-size="11" x="470" y="144" fill="var(--muted)" text-anchor="start">directly: no slip rings.</text>
</svg>
