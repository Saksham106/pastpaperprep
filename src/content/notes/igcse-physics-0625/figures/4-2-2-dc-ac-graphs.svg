<title id="t422dcac">Three graphs of current against time. First, steady d.c.: a horizontal line above the time axis. Second, varying d.c.: a wavy line that rises and falls but always stays above the time axis. Third, a.c.: a smooth wave that goes above the time axis, then below it, again and again, so the current keeps reversing direction.</title>
