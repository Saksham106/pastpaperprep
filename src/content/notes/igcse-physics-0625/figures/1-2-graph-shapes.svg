<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 260" role="img" aria-labelledby="t12graphshape">
<title id="t12graphshape">Eight small sketch graphs in two rows and four columns. The columns are labelled at rest, constant speed, accelerating and decelerating. Top row, distance against time: at rest is a horizontal line; constant speed is a straight line sloping up; accelerating is a curve sloping up and getting steeper; decelerating is a curve sloping up and getting less steep. Bottom row, speed against time: at rest is a line along the time axis at zero speed; constant speed is a horizontal line above the time axis; accelerating is a straight line sloping up; decelerating is a straight line sloping down.</title>
<text font-family="inherit" font-size="12" x="120.0" y="20" fill="currentColor" text-anchor="middle">at rest</text>
<text font-family="inherit" font-size="12" x="232.0" y="20" fill="currentColor" text-anchor="middle">constant speed</text>
<text font-family="inherit" font-size="12" x="344.0" y="20" fill="currentColor" text-anchor="middle">accelerating</text>
<text font-family="inherit" font-size="12" x="456.0" y="20" fill="currentColor" text-anchor="middle">decelerating</text>
<text font-family="inherit" font-size="12" x="14" y="77.0" fill="currentColor" text-anchor="start">distance</text>
<text font-family="inherit" font-size="12" x="14" y="91.0" fill="currentColor" text-anchor="start">–time</text>
<text font-family="inherit" font-size="12" x="14" y="193.0" fill="currentColor" text-anchor="start">speed</text>
<text font-family="inherit" font-size="12" x="14" y="207.0" fill="currentColor" text-anchor="start">–time</text>
