<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="t453sol">
<title id="t453sol">A solenoid cut along its length and seen from the side, lying left to right. Its turns of wire show as two rows of small circles: the top row has dots, meaning current out of the page, and the bottom row has crosses, meaning current into the page. Inside the solenoid, five straight, parallel, evenly spaced field lines run from left to right, with arrows pointing right. The middle line carries straight on out of both ends. The other lines leave the right-hand end, curve round above or below the solenoid and come back into the left-hand end, with arrows pointing left on the outside. The right-hand end is labelled N and the left-hand end S, above the ends. No lines cross, and the pattern outside is like that of a bar magnet.</title>
