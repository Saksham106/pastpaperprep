<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" role="img" aria-labelledby="t612acc">
<title id="t612acc">Three stages of the accretion model, left to right. Stage 1: a loose cloud of gas and dust, with arrows pointing inwards labelled gravity. Stage 2: the cloud has flattened into a spinning disc seen at an angle, with a curved arrow showing rotation and a bright centre. Stage 3: the Sun at the centre with circular orbits around it; small rocky planets on the inner orbits and large gaseous planets on the outer orbits.</title>
