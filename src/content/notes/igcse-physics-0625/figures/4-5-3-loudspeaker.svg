<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="t453ls">
<title id="t453ls">A loudspeaker cut in half, facing right. On the left is a permanent magnet: a central rod with an N pole at its front end, surrounded by an outer ring with S poles, joined at the back. A coil of wire sits in the narrow gap between the central N pole and the outer S ring, where the magnet's field is. The coil is fixed to the narrow end of a paper cone that opens out to the right. A double-headed arrow shows the cone moving left and right, and curved lines in front of the cone show sound waves spreading out to the right.</title>
