<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 275" role="img" aria-labelledby="t72c">
<title id="t72c">Side view of a ruler clamped to the edge of a bench with a G-clamp. Part of the ruler sticks out past the bench edge: this overhang length is marked with a double-headed arrow and kept constant. A hanger with slotted masses hangs from the free end, which bends down below its starting level, shown by a dashed horizontal line. The drop of the end below that line is marked d, the deflection. A vertical metre rule stands just beyond the end to measure its height. A tray of sand sits on the floor under the masses.</title>
