<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t41inducednai">
<title id="t41inducednai">A bar magnet on the left with its S pole at the left end and its N pole at the right end. To its right, with a small gap, lies an iron nail that was unmagnetised. The end of the nail nearest the magnet is labelled S and its far end, the point, is labelled N. Arrows between the magnet and the nail point towards each other, labelled attract. A note says the end of the nail nearest the N pole becomes an S pole, and unlike poles attract.</title>
<rect x="60" y="70" width="200" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="160.0" y1="70" x2="160.0" y2="120" stroke="currentColor" stroke-width="1.2"/>
<text font-family="inherit" font-size="16" x="110.0" y="101.0" fill="currentColor" text-anchor="middle" font-weight="bold">S</text>
<text font-family="inherit" font-size="16" x="210.0" y="101.0" fill="currentColor" text-anchor="middle" font-weight="bold">N</text>
<rect x="330" y="82" width="200" height="26" rx="3" fill="none" stroke="var(--t2-ink)" stroke-width="2"/>
<polygon points="530,82 560,95 530,108" fill="none" stroke="var(--t2-ink)" stroke-width="2"/>
<text font-family="inherit" font-size="15" x="352.0" y="100.0" fill="var(--t2-ink)" text-anchor="middle" font-weight="bold">S</text>
<text font-family="inherit" font-size="15" x="510.0" y="100.0" fill="var(--t2-ink)" text-anchor="middle" font-weight="bold">N</text>
<text font-family="inherit" font-size="12" x="430.0" y="140.0" fill="var(--t2-ink)" text-anchor="middle">unmagnetised iron nail</text>
<text font-family="inherit" font-size="12" x="430.0" y="158.0" fill="var(--t2-ink)" text-anchor="middle">becomes an induced magnet</text>
<line x1="262" y1="50" x2="284" y2="50" stroke="currentColor" stroke-width="1.6"/>
<polygon points="291.0,50.0 282.0,45.5 282.0,54.5" fill="currentColor"/>
<line x1="328" y1="50" x2="306" y2="50" stroke="currentColor" stroke-width="1.6"/>
<polygon points="299.0,50.0 308.0,45.5 308.0,54.5" fill="currentColor"/>
<text font-family="inherit" font-size="12" x="295.0" y="36.0" fill="currentColor" text-anchor="middle">attract</text>
<text font-family="inherit" font-size="12" x="160.0" y="140.0" fill="currentColor" text-anchor="middle">bar magnet</text>
<text font-family="inherit" font-size="12" x="320.0" y="200.0" fill="var(--muted)" text-anchor="middle">The end of the nail nearest the N pole becomes an S pole. Unlike poles attract.</text>
</svg>
