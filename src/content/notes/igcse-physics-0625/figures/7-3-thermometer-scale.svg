<rect x="58" y="85" width="444" height="20" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
<circle cx="42" cy="95" r="20" fill="var(--t1-ink)" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/>
<g stroke="currentColor">
<line x1="100" y1="85" x2="100" y2="64" stroke-width="2"/>
<line x1="136" y1="85" x2="136" y2="72" stroke-width="1.3"/>
<line x1="172" y1="85" x2="172" y2="72" stroke-width="1.3"/>
<line x1="208" y1="85" x2="208" y2="72" stroke-width="1.3"/>
<line x1="244" y1="85" x2="244" y2="72" stroke-width="1.3"/>
<line x1="280" y1="85" x2="280" y2="64" stroke-width="2"/>
<line x1="316" y1="85" x2="316" y2="72" stroke-width="1.3"/>
<line x1="352" y1="85" x2="352" y2="72" stroke-width="1.3"/>
<line x1="388" y1="85" x2="388" y2="72" stroke-width="1.3"/>
<line x1="424" y1="85" x2="424" y2="72" stroke-width="1.3"/>
<line x1="460" y1="85" x2="460" y2="64" stroke-width="2"/>
</g>
<g fill="currentColor" font-size="15" font-family="sans-serif" text-anchor="middle">
<text x="100" y="56">20</text>
<text x="280" y="56">25</text>
<text x="460" y="56">30</text>
<text x="495" y="56">°C</text>
</g>
<line x1="334" y1="108" x2="334" y2="130" stroke="var(--t2-ink)" stroke-width="1.5"/>
<polygon points="334,106 329,116 339,116" fill="var(--t2-ink)"/>
<text x="334" y="150" fill="currentColor" font-size="13" font-family="sans-serif" text-anchor="middle">end of the liquid thread</text>
