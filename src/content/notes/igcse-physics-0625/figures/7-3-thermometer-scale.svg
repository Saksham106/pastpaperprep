<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" role="img" aria-labelledby="t73th">
<title id="t73th">Close-up of a liquid-in-glass thermometer lying on its side, with the bulb on the left. The scale above the tube is marked every 1 degree Celsius from 20 to 30, with numbers only at 20, 25 and 30. The liquid thread runs from the bulb and ends exactly halfway between the 26 and 27 marks.</title>
