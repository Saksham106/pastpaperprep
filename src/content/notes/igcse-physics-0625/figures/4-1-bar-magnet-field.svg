<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="t41barmagnetf">
<title id="t41barmagnetf">A bar magnet with its N pole on the left and its S pole on the right. Curved field lines leave the N pole, loop round above and below the magnet, and enter the S pole. Arrows on the lines point from N towards S. One straight line leaves the N end pointing left, away from the magnet, and another straight line on the right points left, into the S end. The lines are closest together at the two poles and spread out further away. None of the lines cross.</title>
