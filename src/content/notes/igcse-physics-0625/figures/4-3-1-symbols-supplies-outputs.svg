<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="t431a">
  <title id="t431a">Twelve circuit symbols. Cell: a long thin line and a short thick line. Battery: two cells joined. d.c. power supply: two small open circles marked plus and minus. a.c. power supply: two small open circles with a wavy line between them. Generator: a circle with G. Open switch: a hinged line lifted away from its contact. Lamp: a circle with a cross. Motor: a circle with M. Electric bell: a dome on a flat base. Ammeter: a circle with A. Voltmeter: a circle with V. Junction of wires: a dot where three wires meet.</title>
