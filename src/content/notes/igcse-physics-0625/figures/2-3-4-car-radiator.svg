<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="t234rad">
  <title id="t234rad">A car's cooling system. A pump pushes coolant round a loop. Hot coolant flows from the engine along the top pipe to the radiator. The radiator is made of thin metal tubes joined to many thin metal fins. Cool air from the front of the car flows between the fins and leaves warmer, carrying energy away. Cooler coolant returns to the engine along the bottom pipe</title>
  <rect x="30" y="120" width="150" height="130" rx="6" fill="var(--muted)" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/>
  <rect x="400" y="60" width="60" height="220" fill="var(--muted)" fill-opacity="0.15" stroke="currentColor" stroke-width="2"/>
  <g stroke="currentColor" stroke-width="1">
    <line x1="400" y1="80" x2="460" y2="80"/><line x1="400" y1="95" x2="460" y2="95"/><line x1="400" y1="110" x2="460" y2="110"/>
    <line x1="400" y1="125" x2="460" y2="125"/><line x1="400" y1="140" x2="460" y2="140"/><line x1="400" y1="155" x2="460" y2="155"/>
    <line x1="400" y1="170" x2="460" y2="170"/><line x1="400" y1="185" x2="460" y2="185"/><line x1="400" y1="200" x2="460" y2="200"/>
    <line x1="400" y1="215" x2="460" y2="215"/><line x1="400" y1="230" x2="460" y2="230"/><line x1="400" y1="245" x2="460" y2="245"/>
    <line x1="400" y1="260" x2="460" y2="260"/>
  </g>
  <g fill="none" stroke-width="6" stroke-linejoin="round">
    <polyline points="180,140 300,140 300,70 400,70" stroke="var(--t1-ink)" stroke-opacity="0.7"/>
    <polyline points="400,270 300,270 300,230 180,230" stroke="var(--t3-ink)" stroke-opacity="0.7"/>
  </g>
  <circle cx="240" cy="230" r="13" fill="var(--t2-ink)" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <polyline points="230,133 242,140 230,147"/>
    <polyline points="352,63 364,70 352,77"/>
    <polyline points="360,263 348,270 360,277"/>
    <polyline points="212,223 200,230 212,237"/>
  </g>
  <g stroke="var(--t3-ink)" stroke-width="2.5" fill="none">
    <line x1="570" y1="110" x2="475" y2="110"/><polyline points="487,103 475,110 487,117"/>
    <line x1="570" y1="170" x2="475" y2="170"/><polyline points="487,163 475,170 487,177"/>
    <line x1="570" y1="230" x2="475" y2="230"/><polyline points="487,223 475,230 487,237"/>
  </g>
  <g stroke="var(--t1-ink)" stroke-width="2.5" fill="none">
    <line x1="392" y1="140" x2="320" y2="140"/><polyline points="332,133 320,140 332,147"/>
    <line x1="392" y1="200" x2="320" y2="200"/><polyline points="332,193 320,200 332,207"/>
  </g>
  <g font-size="13" fill="currentColor" font-family="inherit">
    <text x="105" y="180" text-anchor="middle">hot engine</text>
    <text x="240" y="128" text-anchor="middle">hot coolant</text>
    <text x="240" y="262" text-anchor="middle">pump</text>
    <text x="350" y="298" text-anchor="middle">cooler coolant</text>
    <text x="430" y="40" text-anchor="middle">radiator: thin metal</text>
    <text x="430" y="54" text-anchor="middle">tubes and fins</text>
    <text x="522" y="96" text-anchor="middle">cool air in</text>
    <text x="356" y="178" text-anchor="middle">warmed air</text>
    <text x="356" y="222" text-anchor="middle">carried away</text>
  </g>
</svg>
