<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-labelledby="t12tramspeedt">
<title id="t12tramspeedt">Speed-time graph for a tram between two stops. Time in seconds from 0 to 28 is on the horizontal axis, with small squares of 1 second. Speed in metres per second from 0 to 14 is on the vertical axis, with small squares of 0.5 metres per second. The speed rises in a straight line from 0 at 0 seconds to 12 metres per second at 8 seconds. It stays at 12 metres per second until 20 seconds. Then it falls in a straight line to 0 at 26 seconds.</title>
