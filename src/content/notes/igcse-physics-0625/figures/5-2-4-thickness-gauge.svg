<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" role="img" aria-labelledby="t524gauge">
  <title id="t524gauge">A sheet of paper moves from left to right after passing between two rollers. Further along, a beta source sits just below the sheet and a detector sits just above it, directly over the source. Radiation from the source passes up through the sheet to the detector. A cable joins the detector to a counter and control unit, and an arrow from the control unit goes back to the rollers, which it moves closer together or further apart.</title>
