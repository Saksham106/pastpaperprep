<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t521det">
  <title id="t521det">A radioactive source sits on the bench at the left. A short distance to its right is a detector: a Geiger–Müller tube, a long thin cylinder with a thin window at the end that faces the source. A cable joins the other end of the tube to a counter, a box on the right with a digital display showing the number of counts so far.</title>
  <rect x="30" y="120" width="40" height="40" fill="var(--muted)" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <line x1="74" y1="130" x2="118" y2="132"/>
    <line x1="74" y1="140" x2="118" y2="140"/>
    <line x1="74" y1="150" x2="118" y2="148"/>
  </g>
  <rect x="125" y="122" width="190" height="36" rx="6" fill="var(--t2-ink)" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <line x1="125" y1="124" x2="125" y2="156" stroke="currentColor" stroke-width="4"/>
  <path d="M315 140 C 360 140, 360 200, 400 200 L 420 200" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="420" y="95" width="190" height="130" rx="8" fill="var(--muted)" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="445" y="118" width="140" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="470" cy="198" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="560" cy="198" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <g font-size="14" fill="currentColor" font-family="inherit">
    <text x="22" y="185">source</text>
    <text x="150" y="110">detector (Geiger–Müller tube)</text>
    <text x="100" y="185">thin window</text>
    <text x="485" y="85">counter</text>
    <text x="462" y="152" font-size="26" font-family="monospace">00 417</text>
    <text x="452" y="222" font-size="11">start/stop</text>
    <text x="545" y="222" font-size="11">reset</text>
    <text x="345" y="235" font-size="12">cable</text>
  </g>
</svg>
