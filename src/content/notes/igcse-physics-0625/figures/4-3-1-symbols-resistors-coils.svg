<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-labelledby="t431b">
  <title id="t431b">Ten circuit symbols. Fixed resistor: an empty rectangle. Variable resistor: a rectangle with a straight diagonal arrow through it. Potential divider: a rectangle with an arrow pointing onto its side from a third wire. Thermistor: a rectangle crossed by a diagonal line with a short flat foot at its lower end. Light-dependent resistor: a rectangle with two arrows pointing in towards it. Heater: a rectangle divided into sections. Fuse: a rectangle with the wire running through it along its length. Magnetising coil: a row of loops. Transformer: two coils side by side with two parallel lines, the core, between them. Relay: a coil and a switch, with a dashed line showing that the coil works the switch.</title>
