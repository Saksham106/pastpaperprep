<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="t71p">
<title id="t71p">Side view of a pendulum set up on a bench. A clamp stand stands on the left. A boss fixes a horizontal clamp to the top of its rod, and the end of the clamp grips the top of a string. A small round bob hangs at the bottom of the string. A double-headed arrow labelled l runs from the point where the clamp holds the string down to the centre of the bob. Directly below the bob, a thin upright marker labelled P stands on the bench.</title>
