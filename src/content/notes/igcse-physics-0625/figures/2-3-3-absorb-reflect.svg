<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="tabsorbreflect">
  <title id="tabsorbreflect">Two surfaces with infrared falling on them. On the left, a dull black surface: three infrared arrows hit it and only one short dashed arrow bounces off, labelled absorbs most of the infrared, reflects very little. On the right, a shiny white surface: three infrared arrows hit it and three arrows of the same length bounce off, labelled reflects most of the infrared, absorbs very little.</title>
