  <g stroke="var(--t1-ink)" stroke-width="2.5" fill="none"><line x1="70" y1="70" x2="120" y2="205"/><polyline points="112.8,198.1 120,205 121.0,195.0"/></g>
  <g stroke="var(--t1-ink)" stroke-width="2.5" fill="none"><line x1="120" y1="70" x2="170" y2="205"/><polyline points="162.8,198.1 170,205 171.0,195.0"/></g>
