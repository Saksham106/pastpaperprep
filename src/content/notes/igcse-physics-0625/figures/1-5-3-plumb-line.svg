<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 325" role="img" aria-labelledby="t153plumb">
<title id="t153plumb">An irregular flat card hangs from a pin held in a clamp stand. The pin passes through a small hole near the top edge of the card. A plumb line, a thread with a small mass on the end, hangs from the same pin and runs straight down across the card. A second small hole is near the right-hand edge of the card. A dashed line, marked earlier when the card hung from that second hole, crosses the card and meets the plumb line at a point labelled G, the centre of gravity, which is directly below the pin.</title>
<rect x="20" y="300" width="90" height="12" fill="none" stroke="currentColor" stroke-width="1.4"/>
<path d="M50 300 V30" stroke="currentColor" stroke-width="3"/>
<path d="M50 30 H204" stroke="currentColor" stroke-width="3"/>
<path d="M200 30 V58" stroke="currentColor" stroke-width="2"/>
<path d="M200 50 C240 46, 275 80, 290 120 C302 160, 285 210, 245 235 C215 255, 170 258, 140 235 C108 212, 100 175, 118 150 C135 125, 150 95, 170 70 C180 58, 190 51, 200 50 Z" fill="var(--t4-ink)" fill-opacity="0.18" stroke="currentColor" stroke-width="1.6"/>
<circle cx="282" cy="150" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
<path d="M282 150 L112 181" stroke="var(--t3-ink)" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M200 62 V282" stroke="var(--t2-ink)" stroke-width="1.4"/>
<rect x="193" y="282" width="14" height="12" rx="2" fill="var(--t2-ink)" fill-opacity="0.5" stroke="currentColor" stroke-width="1.2"/>
<circle cx="200" cy="62" r="3.5" fill="currentColor"/>
<circle cx="200" cy="165" r="4" fill="var(--t1-ink)"/>
<text font-family="inherit" font-size="12" x="60" y="22" fill="currentColor" text-anchor="start">clamp and stand</text>
<text font-family="inherit" font-size="12" x="210" y="74" fill="currentColor" text-anchor="start">pin</text>
<text font-family="inherit" font-size="12" x="258" y="100" fill="currentColor" text-anchor="middle">card</text>
<text font-family="inherit" font-size="12" x="207" y="182" fill="var(--t1-ink)" text-anchor="start">G</text>
<text font-family="inherit" font-size="11" x="194" y="204" fill="var(--t1-ink)" text-anchor="end">centre of gravity</text>
<text font-family="inherit" font-size="11" x="306" y="146" fill="currentColor" text-anchor="start">second hole</text>
<text font-family="inherit" font-size="11" x="186" y="282" fill="var(--t2-ink)" text-anchor="end">plumb line</text>
<text font-family="inherit" font-size="11" x="186" y="296" fill="var(--t2-ink)" text-anchor="end">(thread and mass)</text>
<text font-family="inherit" font-size="11" x="94" y="140" fill="var(--t3-ink)" text-anchor="end">line marked</text>
<text font-family="inherit" font-size="11" x="94" y="154" fill="var(--t3-ink)" text-anchor="end">from second hole</text>
</svg>
