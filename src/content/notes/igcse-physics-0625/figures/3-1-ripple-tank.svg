<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="t31rippletank">
<title id="t31rippletank">Four ripple-tank patterns seen from above, with wavefronts drawn as lines. Top left, reflection: straight wavefronts travel down towards a straight barrier set at 45 degrees; after reflection, straight wavefronts travel away to the left, at the same angle to the barrier, with the same spacing. Top right, refraction: straight wavefronts in deep water on the left travel down and to the right at an angle towards a boundary with a shaded region of shallow water on the right. In the shallow water the wavefronts are closer together and the direction of travel has turned to be closer to the line at right angles to the boundary. Bottom left, diffraction through a narrow gap: straight wavefronts arrive at a barrier with a gap about one wavelength wide; beyond the gap the wavefronts are curved arcs centred on the gap, spreading into the regions behind the barrier, with the same spacing as before. Bottom right, diffraction at an edge: straight wavefronts pass the end of a barrier that blocks only the lower half; beyond it the upper parts stay straight and the lower parts curve round the edge into the region behind the barrier, with the same spacing.</title>
