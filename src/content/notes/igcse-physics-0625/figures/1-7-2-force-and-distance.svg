<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" role="img" aria-labelledby="t172fd">
<title id="t172fd">Two side views. Left, pushing along the floor: a crate starts at the left, shown dashed, and ends further right, shown solid. A force arrow labelled force F points to the right from the crate. Below the floor, an arrow to the right from the starting position to the final position is labelled distance moved d. Right, lifting at a steady speed: a box starts on the floor, shown dashed, and ends higher up, shown solid. A force arrow labelled lifting force F points straight up from the box. A vertical arrow beside it, from the floor up to the bottom of the raised box, is labelled height gained d. In both views the force and the distance point the same way.</title>
<text font-family="inherit" font-size="13" x="135" y="22" fill="currentColor" text-anchor="middle">Pushing along the floor</text>
