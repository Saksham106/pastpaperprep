<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" role="img" aria-labelledby="t41twomagnets">
<title id="t41twomagnets">Two diagrams side by side. Left: two bar magnets in a line, the N pole of the first facing the S pole of the second across a small gap. Field lines run straight across the gap from the N pole to the S pole, close together, with arrows pointing from N to S. Two more lines bulge slightly above and below the gap. A label says the lines join across the gap, and the heading says unlike poles facing attract. Right: two bar magnets with their N poles facing each other across a gap. Field lines leave each N pole, go into the gap, then turn sharply up or down, away from each other, with arrows pointing up and down away from the magnets. The lines from the two magnets never meet. At the centre of the gap is a point X with no field lines. A label says the lines push apart and there is no field at X, and the heading says like poles facing repel.</title>
<text font-family="inherit" font-size="13" x="180.0" y="22.0" fill="currentColor" text-anchor="middle">unlike poles facing: attract</text>
