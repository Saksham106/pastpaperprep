<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" role="img" aria-labelledby="t31gapsize">
<title id="t31gapsize">Two ripple-tank patterns seen from above, with the same wavelength arriving at a barrier. Left: the gap is about one wavelength wide; beyond it the wavefronts are almost semicircles centred on the gap, spreading well into the regions behind the barrier. Right: the gap is about five wavelengths wide; beyond it the wavefronts stay mostly straight across the width of the gap and curve only slightly at their ends, so the waves spread very little. The spacing of the wavefronts is the same before and after both gaps.</title>
