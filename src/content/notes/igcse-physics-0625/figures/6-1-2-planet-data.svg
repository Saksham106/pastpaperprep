<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t612data">
<title id="t612data">Table of data for the eight planets, in order from the Sun. Columns: distance from the Sun in millions of kilometres, orbital period in Earth years, orbital speed in kilometres per second, density in kilograms per cubic metre, mean surface temperature in degrees Celsius, and gravitational field strength at the surface in newtons per kilogram. Mercury: 58, 0.24, 47, 5400, 170, 3.7. Venus: 108, 0.62, 35, 5200, 460, 8.9. Earth: 150, 1.00, 30, 5500, 15, 9.8. Mars: 228, 1.88, 24, 3900, minus 65, 3.7. Jupiter: 778, 11.9, 13, 1300, minus 110, 25. Saturn: 1430, 29.5, 9.7, 690, minus 140, 10. Uranus: 2870, 84, 6.8, 1300, minus 195, 8.9. Neptune: 4500, 165, 5.4, 1600, minus 200, 11. A line separates the four inner planets from the four outer planets.</title>
<g font-family="inherit" font-size="12" fill="currentColor" font-weight="bold">
<text x="20" y="28" text-anchor="start">planet</text>
<text x="175" y="28" text-anchor="middle">distance from</text>
<text x="175" y="44" text-anchor="middle">Sun / million km</text>
<text x="270" y="28" text-anchor="middle">orbital period</text>
<text x="270" y="44" text-anchor="middle">/ Earth years</text>
<text x="365" y="28" text-anchor="middle">orbital speed</text>
<text x="365" y="44" text-anchor="middle">/ km/s</text>
<text x="460" y="28" text-anchor="middle">density</text>
<text x="460" y="44" text-anchor="middle">/ kg/m³</text>
<text x="560" y="28" text-anchor="middle">surface</text>
<text x="560" y="44" text-anchor="middle">temperature / °C</text>
<text x="660" y="28" text-anchor="middle">g at surface</text>
<text x="660" y="44" text-anchor="middle">/ N/kg</text>
</g>
<line x1="10" y1="56" x2="710" y2="56" stroke="currentColor" stroke-width="1.4"/>
<line x1="10" y1="194" x2="710" y2="194" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5 4"/>
