<text font-family="inherit" font-size="12" x="240" y="190" fill="currentColor" text-anchor="middle">50 cm mark</text>
<text font-family="inherit" font-size="12" x="440" y="140" fill="currentColor" text-anchor="end">metre rule</text>
<path d="M90 122 V180 M180 122 V170 M360 122 V180" stroke="currentColor" stroke-width="1"/>
