<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="t152exp">
<title id="t152exp">Apparatus to test the principle of moments. A metre rule rests level on a pivot at its 50 centimetre mark. Two weights hang from loops of thread on the left of the pivot, and one weight hangs from a loop of thread on the right. Above the rule, the distances of the threads from the pivot are marked d1 and d2 on the left and d3 on the right.</title>
