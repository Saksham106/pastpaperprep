<rect x="168" y="170" width="24" height="10" fill="var(--t1-ink)" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
<rect x="348" y="180" width="24" height="10" fill="var(--t4-ink)" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
<rect x="348" y="190" width="24" height="10" fill="var(--t4-ink)" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
<rect x="348" y="200" width="24" height="10" fill="var(--t4-ink)" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
<text font-family="inherit" font-size="11" x="90" y="218" fill="var(--muted)" text-anchor="middle">weights on</text>
