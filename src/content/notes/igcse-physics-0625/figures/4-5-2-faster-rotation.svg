<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" role="img" aria-labelledby="t452faster">
<title id="t452faster">Two graphs of e.m.f. against time on the same axes, both starting at zero. The solid curve is the generator at its original speed: two complete cycles. The dashed curve is the same generator turning twice as fast: its peaks and troughs are twice as tall, and each cycle takes half as long, so it fits four cycles into the same time.</title>
