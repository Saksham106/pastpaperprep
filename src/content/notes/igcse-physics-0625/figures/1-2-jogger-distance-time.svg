<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-labelledby="t12joggerdist">
<title id="t12joggerdist">Distance-time graph for a jogger. Time in seconds from 0 to 160 is on the horizontal axis, with small squares of 10 seconds. Distance in metres from 0 to 250 is on the vertical axis, with small squares of 10 metres. The graph is three straight sections. From 0 to 50 seconds it slopes up from 0 to 120 metres. From 50 to 80 seconds it is horizontal at 120 metres. From 80 to 140 seconds it slopes up again, less steeply, from 120 to 240 metres. The three sections are labelled A, B and C.</title>
