<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 245" role="img" aria-labelledby="t41compassplo">
<title id="t41compassplo">A bar magnet with its N pole on the left and S pole on the right. A curved row of dots starts near the N pole, arches over the top of the magnet and ends near the S pole, with a dashed line joining them. Two small plotting compasses sit on the row of dots. Each needle lies along the curve, with its shaded N end pointing the way the row goes, from the N pole towards the S pole. One label points to a compass. Another label says a dot is marked at the N end of the needle. Notes say to move the compass along dot by dot from the N pole to the S pole, then join the dots with a smooth line and add an arrow from N to S.</title>
