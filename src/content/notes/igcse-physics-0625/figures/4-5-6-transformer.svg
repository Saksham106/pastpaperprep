<text font-family="inherit" font-size="13" x="94" y="172" fill="currentColor" text-anchor="end">supply</text>
<text font-family="inherit" font-size="13" x="240" y="290" fill="var(--t1-ink)" text-anchor="middle">primary coil</text>
<text font-family="inherit" font-size="12" x="240" y="307" fill="var(--t1-ink)" text-anchor="middle">input, 5 turns</text>
