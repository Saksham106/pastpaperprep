<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="t456trans">
<title id="t456trans">A simple transformer. A square ring of soft iron forms the core. On the left side of the ring is the primary coil, with 5 turns of insulated copper wire, connected to an a.c. supply. On the right side of the ring is the secondary coil, with 10 turns, connected to a lamp. The two coils are not joined by any wire. The secondary has more turns than the primary, so this is a step-up transformer.</title>
