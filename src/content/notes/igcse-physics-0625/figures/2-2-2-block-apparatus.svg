<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="t222app">
<title id="t222app">Apparatus for measuring the specific heat capacity of a metal block. The block sits on the bench, wrapped in insulation on all sides. An electric heater fits into one hole in the top of the block and a thermometer into another hole. The heater's two wires go up to a power supply, with a joulemeter connected in series between them to measure the energy supplied.</title>
