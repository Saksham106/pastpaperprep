<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" aria-labelledby="t31wavefeatur">
<title id="t31wavefeatur">Left: a graph of displacement against distance for a wave at one instant, drawn about a horizontal line labelled rest position. The highest points are labelled crest (peak) and the lowest points trough. A double-headed arrow from one crest to the next crest is labelled wavelength. A vertical double-headed arrow from the rest position up to a crest is labelled amplitude. Right: the same kind of wave seen from above, drawn as five parallel straight lines labelled wavefronts, with an arrow at right angles to them showing the direction of travel. The gap between two neighbouring wavefronts is labelled wavelength.</title>
