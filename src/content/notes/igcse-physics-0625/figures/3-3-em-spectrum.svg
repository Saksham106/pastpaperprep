<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-labelledby="t33spec">
<title id="t33spec">The electromagnetic spectrum as a row of seven boxes. From left to right: radio waves, microwaves, infrared, visible light, ultraviolet, X-rays, gamma rays. Above the boxes a wave is drawn whose wavelength is long at the radio end and gets shorter and shorter towards the gamma end. Below the boxes, one arrow points right, labelled frequency increases. A second arrow points left, labelled wavelength increases. A note says all of them travel at the same speed in a vacuum.</title>
