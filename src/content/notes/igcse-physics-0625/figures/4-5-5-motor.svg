<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="t455motor">
<title id="t455motor">A simple d.c. motor, drawn in perspective. A flat rectangular coil lies level between the N pole of a magnet on the left and the S pole on the right, with field lines running from N to S. An axle runs through the middle of the coil from front to back. On the front of the axle is a split-ring commutator: a metal ring cut into two halves, with one end of the coil joined to each half. Two fixed carbon brushes press on either side of the ring, and wires join them to a d.c. supply, with the positive terminal on the left brush. Arrows show the current going into the page along the left side of the coil and out of the page along the right side. The force on the left side points down and the force on the right side points up.</title>
