<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-labelledby="t456grid">
<title id="t456grid">How electricity reaches homes, as five boxes in a row joined by arrows from left to right. First, the power station generator. Second, a step-up transformer, which raises the voltage. Third, long cables on pylons, at a very high voltage with a small current. Fourth, step-down transformers, which lower the voltage in stages. Fifth, homes, which receive mains voltage.</title>
<rect x="10" y="50" width="104" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
<text font-family="inherit" font-size="13" x="62.0" y="80" fill="currentColor" text-anchor="middle">power station</text>
<text font-family="inherit" font-size="13" x="62.0" y="97" fill="currentColor" text-anchor="middle">generator</text>
<line x1="116" y1="85" x2="126" y2="85" stroke="currentColor" stroke-width="1.8"/>
<polygon points="132,85 125,81 125,89" fill="currentColor"/>
<rect x="134" y="50" width="104" height="70" rx="6" fill="none" stroke="var(--t1-ink)" stroke-width="2"/>
<text font-family="inherit" font-size="13" x="186.0" y="80" fill="var(--t1-ink)" text-anchor="middle">step-up</text>
<text font-family="inherit" font-size="13" x="186.0" y="97" fill="var(--t1-ink)" text-anchor="middle">transformer</text>
<text font-family="inherit" font-size="11" x="186.0" y="145" fill="var(--muted)" text-anchor="middle">voltage raised</text>
<line x1="240" y1="85" x2="250" y2="85" stroke="currentColor" stroke-width="1.8"/>
<polygon points="256,85 249,81 249,89" fill="currentColor"/>
<rect x="258" y="50" width="104" height="70" rx="6" fill="none" stroke="var(--t3-ink)" stroke-width="2"/>
<text font-family="inherit" font-size="13" x="310.0" y="80" fill="var(--t3-ink)" text-anchor="middle">cables on</text>
<text font-family="inherit" font-size="13" x="310.0" y="97" fill="var(--t3-ink)" text-anchor="middle">pylons</text>
<text font-family="inherit" font-size="11" x="310.0" y="145" fill="var(--muted)" text-anchor="middle">very high voltage,</text>
<text font-family="inherit" font-size="11" x="310.0" y="160" fill="var(--muted)" text-anchor="middle">small current</text>
<line x1="364" y1="85" x2="374" y2="85" stroke="currentColor" stroke-width="1.8"/>
<polygon points="380,85 373,81 373,89" fill="currentColor"/>
<rect x="382" y="50" width="104" height="70" rx="6" fill="none" stroke="var(--t2-ink)" stroke-width="2"/>
<text font-family="inherit" font-size="13" x="434.0" y="80" fill="var(--t2-ink)" text-anchor="middle">step-down</text>
<text font-family="inherit" font-size="13" x="434.0" y="97" fill="var(--t2-ink)" text-anchor="middle">transformers</text>
<text font-family="inherit" font-size="11" x="434.0" y="145" fill="var(--muted)" text-anchor="middle">voltage lowered</text>
<text font-family="inherit" font-size="11" x="434.0" y="160" fill="var(--muted)" text-anchor="middle">in stages</text>
<line x1="488" y1="85" x2="498" y2="85" stroke="currentColor" stroke-width="1.8"/>
<polygon points="504,85 497,81 497,89" fill="currentColor"/>
<rect x="506" y="50" width="104" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
<text font-family="inherit" font-size="13" x="558.0" y="89" fill="currentColor" text-anchor="middle">homes</text>
<text font-family="inherit" font-size="11" x="558.0" y="145" fill="var(--muted)" text-anchor="middle">mains voltage</text>
<text font-family="inherit" font-size="12" x="320" y="30" fill="var(--muted)" text-anchor="middle">electrical energy flows this way</text>
<text font-family="inherit" font-size="12" x="320" y="192" fill="var(--muted)" text-anchor="middle">a smaller current in the long cables wastes less energy heating them</text>
</svg>
