<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-labelledby="t">
  <title id="t">Rhombus OABC with OA equal to a and OC equal to b. The diagonal OB is a plus b and the diagonal CA is a minus b. They cross at a right angle.</title>
  <line x1="50" y1="195" x2="200" y2="195" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <path d="M190,190 L200,195 L190,200" fill="none" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <line x1="50" y1="195" x2="110" y2="57" stroke="var(--t5-ink)" stroke-width="2.4"/>
  <path d="M100.8,61.5 L110,57 L110.0,67.2" fill="none" stroke="var(--t5-ink)" stroke-width="2.4"/>
  <line x1="200" y1="195" x2="260" y2="57" stroke="var(--muted)" stroke-width="1.4"/>
  <line x1="110" y1="57" x2="260" y2="57" stroke="var(--muted)" stroke-width="1.4"/>
  <line x1="50" y1="195" x2="260" y2="57" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="110" y1="57" x2="200" y2="195" stroke="var(--t3-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M163.4,120.5 L157.9,112.1 L149.5,117.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <g font-size="15" font-family="inherit" font-weight="600">
    <text x="36" y="212" fill="currentColor">O</text>
    <text x="202" y="214" fill="currentColor">A</text>
    <text x="266" y="56" fill="currentColor">B</text>
    <text x="96" y="50" fill="currentColor">C</text>
    <text x="120" y="214" fill="var(--t1-ink)">a</text>
    <text x="62" y="124" fill="var(--t5-ink)">b</text>
    <text x="160" y="84" fill="currentColor">a + b</text>
    <text x="177" y="152" fill="var(--t3-ink)">a − b</text>
  </g>
</svg>
