<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="t">
  <title id="t">Two lines in the plane: crossing once, parallel, and the same line</title>
  <g stroke="var(--muted)" stroke-width="1">
    <rect x="20" y="20" width="160" height="160" fill="none" rx="6"/>
    <rect x="220" y="20" width="160" height="160" fill="none" rx="6"/>
    <rect x="420" y="20" width="160" height="160" fill="none" rx="6"/>
  </g>
  <line x1="30" y1="160" x2="170" y2="40" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <line x1="30" y1="60" x2="170" y2="150" stroke="var(--t5-ink)" stroke-width="2.5"/>
  <circle cx="96.7" cy="102.9" r="5" fill="currentColor"/>
  <line x1="230" y1="140" x2="370" y2="50" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <line x1="230" y1="172" x2="370" y2="82" stroke="var(--t5-ink)" stroke-width="2.5"/>
  <line x1="430" y1="160" x2="570" y2="45" stroke="var(--t1-ink)" stroke-width="5"/>
  <line x1="430" y1="160" x2="570" y2="45" stroke="var(--t5-ink)" stroke-width="2" stroke-dasharray="8 6"/>
  <g font-size="15" font-family="inherit" fill="currentColor" text-anchor="middle">
    <text x="100" y="206">one solution</text>
    <text x="300" y="206">no solution</text>
    <text x="500" y="206">infinitely many</text>
  </g>
</svg>
