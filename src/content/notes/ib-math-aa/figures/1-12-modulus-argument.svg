<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-labelledby="t">
  <title id="t">The point minus 4 plus 3i joined to the origin by a line of length 5, with the argument theta from the positive real axis and the acute angle alpha from the negative real axis</title>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="20" y1="190" x2="340" y2="190"/>
    <line x1="200" y1="20" x2="200" y2="270"/>
  </g>
  <g fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 3">
    <line x1="60" y1="85" x2="60" y2="190"/>
    <line x1="60" y1="85" x2="200" y2="85"/>
  </g>
  <line x1="200" y1="190" x2="60" y2="85" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <path d="M230 190 A30 30 0 0 0 176 172" fill="none" stroke="var(--t5-ink)" stroke-width="1.8"/>
  <path d="M150 190 A50 50 0 0 1 160 160" fill="none" stroke="var(--t3-ink)" stroke-width="1.8"/>
  <circle cx="60" cy="85" r="4.5" fill="var(--t1-ink)"/>
  <circle cx="200" cy="190" r="3" fill="currentColor"/>
  <g font-size="13" fill="currentColor" font-family="inherit">
    <text x="334" y="182" text-anchor="end">Re</text>
    <text x="208" y="28">Im</text>
    <text x="206" y="206">O</text>
  </g>
  <g font-size="12" fill="var(--muted)" font-family="inherit">
    <text x="60" y="207" text-anchor="middle">−4</text>
    <text x="208" y="89">3</text>
  </g>
  <g font-size="14" font-family="inherit">
    <text x="36" y="72" fill="var(--t1-ink)">z = −4 + 3i</text>
    <text x="140" y="126" fill="var(--t1-ink)">|z| = 5</text>
    <text x="224" y="164" fill="var(--t5-ink)">θ</text>
    <text x="130" y="178" fill="var(--t3-ink)">α</text>
  </g>
</svg>
