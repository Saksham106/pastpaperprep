    <circle cx="120" cy="120" r="5"/>
    <circle cx="190" cy="90" r="4"/>
    <circle cx="260" cy="60" r="4"/>
    <circle cx="330" cy="30" r="4"/>
  </g>
  <g font-size="14" font-family="inherit" fill="currentColor">
    <text x="24" y="250">O</text>
    <text x="8" y="138">λ = −1</text>
    <text x="70" y="100">A, λ = 0</text>
    <text x="176" y="72">λ = 1</text>
    <text x="246" y="42">λ = 2</text>
    <text x="316" y="14">λ = 3</text>
    <text x="388" y="30">L</text>
  </g>
  <g font-size="17" font-weight="700" font-family="inherit">
    <text x="62" y="170" fill="var(--t3-ink)">a</text>
    <text x="146" y="92" fill="var(--t5-ink)">b</text>
