<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="t">
  <title id="t">Three ways a line and a plane can sit: meeting at one point, parallel, or lying in the plane</title>
  <g stroke="var(--muted)" stroke-width="1" fill="none">
    <rect x="6" y="6" width="190" height="176" rx="6"/>
    <rect x="205" y="6" width="190" height="176" rx="6"/>
    <rect x="404" y="6" width="190" height="176" rx="6"/>
  </g>
  <g fill="var(--t2-ink)" fill-opacity="0.15" stroke="var(--t2-ink)" stroke-width="1.5">
    <polygon points="16,150 156,150 186,100 46,100"/>
    <polygon points="215,150 355,150 385,100 245,100"/>
    <polygon points="414,150 554,150 584,100 444,100"/>
  </g>
  <line x1="66" y1="28" x2="101" y2="125" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <line x1="101" y1="125" x2="115" y2="164" stroke="var(--t1-ink)" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="101" cy="125" r="4.5" fill="currentColor"/>
  <line x1="222" y1="52" x2="378" y2="52" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <g stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="262" y1="52" x2="262" y2="125"/>
    <line x1="338" y1="52" x2="338" y2="125"/>
  </g>
  <line x1="430" y1="140" x2="570" y2="110" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <g font-size="14" font-family="inherit" fill="currentColor" text-anchor="middle">
    <text x="101" y="202">one point</text>
    <text x="300" y="202">parallel: never meets</text>
    <text x="499" y="202">lies in the plane</text>
  </g>
</svg>
