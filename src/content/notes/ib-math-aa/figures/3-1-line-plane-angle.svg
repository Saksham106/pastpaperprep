<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" role="img" aria-labelledby="t">
  <title id="t">A line meets a plane at A and rises to P; the perpendicular from P meets the plane at N, and theta is the angle PAN</title>
