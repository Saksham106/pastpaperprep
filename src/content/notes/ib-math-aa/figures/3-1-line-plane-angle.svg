  <polygon points="90,175 250,165 250,40" fill="var(--t1-ink)" fill-opacity="0.12" stroke="none"/>
  <line x1="90" y1="175" x2="280" y2="15" stroke="currentColor" stroke-width="2.5"/>
  <line x1="250" y1="40" x2="250" y2="165" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="90" y1="175" x2="250" y2="165" stroke="var(--t1-ink)" stroke-width="2"/>
  <path d="M240,165.6 L240,155.6 L250,155" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M123.9,172.9 A34,34 0 0,0 116,153.1" fill="none" stroke="currentColor" stroke-width="1.4"/>
