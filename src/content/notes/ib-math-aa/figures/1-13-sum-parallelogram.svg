<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">Argand diagram showing a parallelogram with vertices O, z, z plus w and w. The diagonal from O to z plus w is the sum. The dashed segment from w to z is z minus w.</title>
  <line x1="20" y1="200" x2="300" y2="200" stroke="var(--muted)" stroke-width="1.2"/>
  <line x1="50" y1="225" x2="50" y2="15" stroke="var(--muted)" stroke-width="1.2"/>
  <path d="M294,196 L300,200 L294,204" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
  <path d="M46,21 L50,15 L54,21" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
  <line x1="50" y1="200" x2="210" y2="160" stroke="var(--t1-ink)" stroke-width="2.2"/>
  <line x1="50" y1="200" x2="110" y2="80" stroke="var(--t5-ink)" stroke-width="2.2"/>
  <line x1="210" y1="160" x2="270" y2="40" stroke="var(--t5-ink)" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="110" y1="80" x2="270" y2="40" stroke="var(--t1-ink)" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="50" y1="200" x2="270" y2="40" stroke="currentColor" stroke-width="2.8"/>
  <line x1="110" y1="80" x2="210" y2="160" stroke="var(--t3-ink)" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="210" cy="160" r="4.5" fill="var(--t1-ink)"/>
  <circle cx="110" cy="80" r="4.5" fill="var(--t5-ink)"/>
  <circle cx="270" cy="40" r="4.5" fill="currentColor"/>
  <circle cx="50" cy="200" r="3" fill="currentColor"/>
  <g font-size="14" font-family="inherit">
    <text x="218" y="176" fill="var(--t1-ink)">z</text>
    <text x="88" y="74" fill="var(--t5-ink)">w</text>
    <text x="276" y="40" fill="currentColor">z + w</text>
    <text x="164" y="112" fill="var(--t3-ink)">z − w</text>
    <text x="34" y="216" fill="currentColor">O</text>
    <text x="282" y="218" fill="var(--muted)" font-size="12">Re</text>
    <text x="58" y="26" fill="var(--muted)" font-size="12">Im</text>
  </g>
</svg>
