<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-labelledby="t">
  <title id="t">The unit circle with the point P at angle theta in the first quadrant, coordinates c, s, and the point Q at angle pi over 2 minus theta, coordinates s, c. Q is the mirror image of P in the dashed line y equals x.</title>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="60" y1="160" x2="330" y2="160"/>
    <line x1="190" y1="35" x2="190" y2="285"/>
  </g>
  <circle cx="190" cy="160" r="100" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <line x1="80" y1="270" x2="310" y2="40" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="312" y="48" font-size="13" fill="var(--muted)" font-family="inherit">y = x</text>
  <line x1="280.6" y1="117.7" x2="232.3" y2="69.4" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" opacity="0.7"/>
  <g stroke-width="2">
    <line x1="190" y1="160" x2="280.6" y2="117.7" stroke="var(--t1-ink)"/>
    <line x1="190" y1="160" x2="232.3" y2="69.4" stroke="var(--t2-ink)"/>
  </g>
  <circle cx="280.6" cy="117.7" r="4.5" fill="var(--t1-ink)"/>
  <circle cx="232.3" cy="69.4" r="4.5" fill="var(--t2-ink)"/>
  <path d="M220 160 A30 30 0 0 0 217.2 147.3" fill="none" stroke="var(--t1-ink)" stroke-width="1.3"/>
  <path d="M190 138 A22 22 0 0 1 199.3 140.1" fill="none" stroke="var(--t2-ink)" stroke-width="1.3"/>
  <g font-size="13" font-family="inherit">
    <text x="289.6" y="121.7" fill="var(--t1-ink)">P: (c, s)</text>
    <text x="182" y="52" text-anchor="end" fill="var(--t2-ink)">Q: (s, c)</text>
    <text x="226" y="156" fill="var(--t1-ink)">θ</text>
    <text x="193" y="133" fill="var(--t2-ink)">θ</text>
  </g>
  <g font-size="13" fill="currentColor" font-family="inherit">
    <text x="176" y="176">O</text>
    <text x="324" y="154" text-anchor="end">x</text>
    <text x="198" y="45">y</text>
  </g>
</svg>
