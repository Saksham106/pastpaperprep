<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" role="img" aria-labelledby="t">
  <title id="t">Tree of counts for 20000 bolts. 100 are cracked: the alarm sounds for 98 and not for 2. 19900 are good: the alarm sounds for 597 and not for 19303. The two alarm branches, 98 and 597, are highlighted.</title>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="70" y1="125" x2="170" y2="65"/>
    <line x1="70" y1="125" x2="170" y2="185"/>
    <line x1="250" y1="65" x2="330" y2="100"/>
    <line x1="250" y1="185" x2="330" y2="220"/>
  </g>
  <g stroke="var(--t3-ink)" stroke-width="3" fill="none">
    <line x1="250" y1="65" x2="330" y2="30"/>
    <line x1="250" y1="185" x2="330" y2="150"/>
  </g>
  <g font-family="inherit" font-size="14" fill="currentColor">
    <text x="8" y="130" font-weight="bold">20 000</text>
    <text x="176" y="62" fill="var(--t1-ink)" font-weight="bold">100</text>
    <text x="176" y="80" fill="var(--t1-ink)">cracked</text>
    <text x="176" y="182" fill="var(--t1-ink)" font-weight="bold">19 900</text>
    <text x="176" y="200" fill="var(--t1-ink)">good</text>
    <text x="338" y="35" fill="var(--t3-ink)" font-weight="bold">98  alarm</text>
    <text x="338" y="105">2  no alarm</text>
    <text x="338" y="155" fill="var(--t3-ink)" font-weight="bold">597  alarm</text>
    <text x="338" y="225">19 303  no alarm</text>
  </g>
  <g font-family="inherit" font-size="12" fill="var(--muted)">
    <text x="95" y="82">0.5%</text>
    <text x="95" y="178">99.5%</text>
    <text x="268" y="40">98%</text>
    <text x="268" y="100">2%</text>
    <text x="268" y="160">3%</text>
    <text x="268" y="220">97%</text>
  </g>
</svg>
