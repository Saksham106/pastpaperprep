<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" role="img" aria-labelledby="t">
  <title id="t">Vectors v and w lie in a flat plane, drawn from the same point. The vector v cross w points straight up out of the plane. The vector w cross v points straight down, the opposite way.</title>
