  <title id="t">Dashed parabola y equals f of x, where f of x is 4 minus x squared, with x-intercepts at minus 2 and 2 and y-intercept 4. The vertical stretch y equals 2 f of x keeps the x-intercepts and doubles the height to (0, 8). The horizontal stretch y equals f of 2x keeps the height 4 and moves the x-intercepts in to minus 1 and 1.</title>
