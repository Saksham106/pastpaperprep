<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" role="img" aria-labelledby="t">
  <title id="t">Number line with the box from Q1 to Q3, a distance of 1.5 times the IQR marked out on each side to the lower and upper fences, and the regions beyond the fences labelled outliers</title>
  <g fill="var(--t4-ink)" fill-opacity="0.16" stroke="none">
    <rect x="8" y="72" width="52" height="48" />
    <rect x="300" y="72" width="52" height="48" />
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="8" y1="120" x2="352" y2="120" />
    <line x1="60" y1="114" x2="60" y2="126" />
    <line x1="150" y1="114" x2="150" y2="126" />
    <line x1="210" y1="114" x2="210" y2="126" />
    <line x1="300" y1="114" x2="300" y2="126" />
  </g>
  <rect x="150" y="80" width="60" height="28" fill="none" stroke="var(--t4-ink)" stroke-width="2.2" />
  <g stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <line x1="60" y1="72" x2="60" y2="120" />
    <line x1="300" y1="72" x2="300" y2="120" />
  </g>
  <g stroke="currentColor" stroke-width="1" fill="none">
    <polyline points="60,56 60,50 150,50 150,56" />
    <polyline points="150,56 150,50 210,50 210,56" />
    <polyline points="210,56 210,50 300,50 300,56" />
  </g>
  <g fill="currentColor" font-size="12" font-family="inherit" text-anchor="middle">
    <text x="105" y="42">1.5 × IQR</text>
    <text x="180" y="42">IQR</text>
    <text x="255" y="42">1.5 × IQR</text>
    <text x="150" y="142">Q1</text>
    <text x="210" y="142">Q3</text>
    <text x="60" y="142">lower</text>
    <text x="60" y="156">fence</text>
    <text x="300" y="142">upper</text>
    <text x="300" y="156">fence</text>
  </g>
  <g fill="var(--t4-ink)" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="34" y="100">outliers</text>
    <text x="326" y="100">outliers</text>
  </g>
</svg>
