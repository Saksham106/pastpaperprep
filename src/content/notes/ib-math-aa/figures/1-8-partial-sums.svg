<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 285" role="img" aria-labelledby="t">
  <title id="t">Partial sums of two geometric series plotted against n from 1 to 8. The sums of 1 plus a half plus a quarter and so on rise towards a dashed line at 2. The sums of 1 minus a half plus a quarter and so on zigzag above and below a dashed line at two thirds, closing in on it.</title>
  <g stroke="currentColor" stroke-width="1" opacity="0.6"><line x1="50" y1="220" x2="385" y2="220"/><line x1="50" y1="220" x2="50" y2="18"/></g>
  <g stroke="currentColor" stroke-width="1"><line x1="90" y1="220" x2="90" y2="225"/><line x1="130" y1="220" x2="130" y2="225"/><line x1="170" y1="220" x2="170" y2="225"/><line x1="210" y1="220" x2="210" y2="225"/><line x1="250" y1="220" x2="250" y2="225"/><line x1="290" y1="220" x2="290" y2="225"/><line x1="330" y1="220" x2="330" y2="225"/><line x1="370" y1="220" x2="370" y2="225"/><line x1="45" y1="130.0" x2="50" y2="130.0"/><line x1="45" y1="40.0" x2="50" y2="40.0"/></g>
  <g stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 4"><line x1="50" y1="40.0" x2="385" y2="40.0"/><line x1="50" y1="160.0" x2="385" y2="160.0"/></g>
  <polyline points="90.0,130.0 130.0,85.0 170.0,62.5 210.0,51.2 250.0,45.6 290.0,42.8 330.0,41.4 370.0,40.7" fill="none" stroke="var(--t1-ink)" stroke-width="1.5"/>
  <polyline points="90.0,130.0 130.0,175.0 170.0,152.5 210.0,163.8 250.0,158.1 290.0,160.9 330.0,159.5 370.0,160.2" fill="none" stroke="var(--t3-ink)" stroke-width="1.5"/>
  <g fill="var(--t1-ink)"><circle cx="90.0" cy="130.0" r="4.5"/><circle cx="130.0" cy="85.0" r="4.5"/><circle cx="170.0" cy="62.5" r="4.5"/><circle cx="210.0" cy="51.2" r="4.5"/><circle cx="250.0" cy="45.6" r="4.5"/><circle cx="290.0" cy="42.8" r="4.5"/><circle cx="330.0" cy="41.4" r="4.5"/><circle cx="370.0" cy="40.7" r="4.5"/></g>
  <g fill="var(--t3-ink)"><circle cx="90.0" cy="130.0" r="4.5"/><circle cx="130.0" cy="175.0" r="4.5"/><circle cx="170.0" cy="152.5" r="4.5"/><circle cx="210.0" cy="163.8" r="4.5"/><circle cx="250.0" cy="158.1" r="4.5"/><circle cx="290.0" cy="160.9" r="4.5"/><circle cx="330.0" cy="159.5" r="4.5"/><circle cx="370.0" cy="160.2" r="4.5"/></g>
  <g font-size="12" fill="currentColor" font-family="inherit">
    <text x="90" y="239" text-anchor="middle">1</text><text x="130" y="239" text-anchor="middle">2</text><text x="170" y="239" text-anchor="middle">3</text><text x="210" y="239" text-anchor="middle">4</text><text x="250" y="239" text-anchor="middle">5</text><text x="290" y="239" text-anchor="middle">6</text><text x="330" y="239" text-anchor="middle">7</text><text x="370" y="239" text-anchor="middle">8</text>
    <text x="41" y="134.0" text-anchor="end">1</text>
    <text x="41" y="44.0" text-anchor="end">2</text>
    <text x="378" y="212" text-anchor="end">n</text>
    <text x="58" y="26">Sₙ</text>
    <text x="385" y="32.0" text-anchor="end" fill="var(--t1-ink)">r = 1/2: sums rise towards 2</text>
    <text x="385" y="182.0" text-anchor="end" fill="var(--t3-ink)">r = −1/2: sums zigzag towards 2/3</text>
  </g>
  <text x="200" y="272" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">both series start at 1; the dashed lines are the sums to infinity</text>
</svg>
