<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 250" role="img" aria-labelledby="t">
  <title id="t">Two panels. Both show the dashed parabola y equals f of x, where f of x equals x squared minus 2x minus 3, with x-intercepts minus 1 and 3 and lowest point 1, minus 4. Left panel: y equals the modulus of f of x. The part between minus 1 and 3 is reflected above the x-axis, giving a hump with top 1, 4 and sharp corners at minus 1 and 3. Right panel: y equals f of the modulus of x. The right half of the parabola is kept and mirrored in the y-axis, giving a W shape with lowest points minus 1, minus 4 and 1, minus 4, a sharp corner at 0, minus 3 and x-intercepts minus 3 and 3.</title>
