<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="t">
  <title id="t">The V-shaped graph y equals the modulus of x plus 1, with its corner at minus 1, 0, and the line y equals 2x minus 4. They meet once, at 5, 6. A dashed line continues the left arm of the V, y equals minus x minus 1, below the x-axis. It meets the line at 1, minus 2, marked with an open circle, which is not on the V.</title>
