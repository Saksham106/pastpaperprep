  <line x1="194.9" y1="205.2" x2="204.1" y2="221.1" stroke="var(--t2-ink)" stroke-width="1.5" marker-end="url(#pt-arrow)"/>
  <line x1="229.1" y1="205.2" x2="219.9" y2="221.1" stroke="var(--t2-ink)" stroke-width="1.5" marker-end="url(#pt-arrow)"/>
