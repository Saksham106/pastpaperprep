<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 196" role="img" aria-labelledby="t">
  <title id="t">Two box and whisker diagrams of test marks on one scale. Class A: 30, 48, 57, 66, 84, symmetric. Class B: 35, 55, 65, 69, 78, with a long left whisker. Neither class has an outlier</title>
  <g stroke="var(--muted)" stroke-width="0.6">
