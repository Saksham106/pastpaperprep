    <line x1="115.0" y1="18" x2="115.0" y2="152"/>
    <line x1="160.0" y1="18" x2="160.0" y2="152"/>
    <line x1="205.0" y1="18" x2="205.0" y2="152"/>
    <line x1="250.0" y1="18" x2="250.0" y2="152"/>
    <line x1="295.0" y1="18" x2="295.0" y2="152"/>
    <line x1="340.0" y1="18" x2="340.0" y2="152"/>
  </g>
  <g stroke="var(--t4-ink)" stroke-width="2" fill="none">
    <rect x="151.0" y="36.0" width="81.0" height="28" fill="var(--t4-ink)" fill-opacity="0.14"/>
    <line x1="191.5" y1="36.0" x2="191.5" y2="64.0"/>
    <line x1="70.0" y1="50.0" x2="151.0" y2="50.0"/>
    <line x1="232.0" y1="50.0" x2="313.0" y2="50.0"/>
