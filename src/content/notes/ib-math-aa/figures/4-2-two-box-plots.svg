  <text x="60" y="54.0" fill="currentColor" font-size="12" font-family="inherit" text-anchor="end">Class A</text>
  <g stroke="var(--t4-ink)" stroke-width="2" fill="none">
    <rect x="182.5" y="100.0" width="63.0" height="28" fill="var(--t4-ink)" fill-opacity="0.14"/>
    <line x1="227.5" y1="100.0" x2="227.5" y2="128.0"/>
    <line x1="92.5" y1="114.0" x2="182.5" y2="114.0"/>
    <line x1="245.5" y1="114.0" x2="286.0" y2="114.0"/>
    <line x1="92.5" y1="106.0" x2="92.5" y2="122.0"/>
