  <text x="60" y="118.0" fill="currentColor" font-size="12" font-family="inherit" text-anchor="end">Class B</text>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="70" y1="152" x2="340" y2="152"/>
    <line x1="70.0" y1="152" x2="70.0" y2="157"/>
    <line x1="115.0" y1="152" x2="115.0" y2="157"/>
    <line x1="160.0" y1="152" x2="160.0" y2="157"/>
    <line x1="205.0" y1="152" x2="205.0" y2="157"/>
    <line x1="250.0" y1="152" x2="250.0" y2="157"/>
    <line x1="295.0" y1="152" x2="295.0" y2="157"/>
    <line x1="340.0" y1="152" x2="340.0" y2="157"/>
  </g>
  <g fill="currentColor" font-size="12" font-family="inherit" text-anchor="middle">
