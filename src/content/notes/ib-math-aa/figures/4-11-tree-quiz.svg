<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" role="img" aria-labelledby="t">
  <title id="t">Tree diagram. First stage: easy question E with probability 3/4, hard question E prime with probability 1/4. After E: correct C with 4/5, wrong C prime with 1/5. After E prime: correct C with 1/3, wrong C prime with 2/3. Path products: 3/5, 3/20, 1/12 and 1/6. The two paths ending in C prime are highlighted.</title>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="20" y1="125" x2="135" y2="65"/>
    <line x1="20" y1="125" x2="135" y2="185"/>
    <line x1="165" y1="65" x2="280" y2="30"/>
    <line x1="165" y1="185" x2="280" y2="150"/>
  </g>
  <g stroke="var(--t3-ink)" stroke-width="3" fill="none">
    <line x1="165" y1="65" x2="280" y2="100"/>
    <line x1="165" y1="185" x2="280" y2="220"/>
  </g>
  <g font-family="inherit" font-size="14" fill="currentColor">
    <text x="142" y="70" fill="var(--t1-ink)" font-weight="bold">E</text>
    <text x="142" y="190" fill="var(--t1-ink)" font-weight="bold">E′</text>
    <text x="288" y="35" fill="var(--t2-ink)" font-weight="bold">C</text>
    <text x="288" y="105" fill="var(--t3-ink)" font-weight="bold">C′</text>
    <text x="288" y="155" fill="var(--t2-ink)" font-weight="bold">C</text>
    <text x="288" y="225" fill="var(--t3-ink)" font-weight="bold">C′</text>
  </g>
  <g font-family="inherit" font-size="13" fill="currentColor">
    <text x="58" y="82">3/4</text>
    <text x="58" y="180">1/4</text>
    <text x="210" y="36">4/5</text>
    <text x="210" y="104">1/5</text>
    <text x="210" y="156">1/3</text>
    <text x="210" y="224">2/3</text>
  </g>
  <g font-family="inherit" font-size="13" fill="var(--muted)">
    <text x="318" y="35">3/4 × 4/5 = 3/5</text>
    <text x="318" y="105">3/4 × 1/5 = 3/20</text>
    <text x="318" y="155">1/4 × 1/3 = 1/12</text>
    <text x="318" y="225">1/4 × 2/3 = 1/6</text>
  </g>
</svg>
