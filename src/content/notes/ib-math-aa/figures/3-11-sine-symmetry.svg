  <title id="t">Graph of y equals sin x for x from 0 to 2 pi, with a dashed mirror line x equals pi over 2 and a centre of half-turn symmetry at the point pi, 0. Two points at equal distances either side of the mirror line have the same height. Two points at equal distances either side of pi have opposite heights, joined by a dotted segment through the centre.</title>
