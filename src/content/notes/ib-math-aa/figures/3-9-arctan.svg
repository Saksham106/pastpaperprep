  <title id="t">Graph of y equals arctan x for x from minus 6 to 6. It rises from left to right through the origin. As x gets very large it gets closer and closer to the dashed horizontal asymptote y equals pi over 2, and as x gets very negative it gets closer to the dashed asymptote y equals minus pi over 2. It never reaches either line.</title>
