  <rect x="130" y="40" width="40" height="130" fill="var(--t3-ink)" fill-opacity="0.12" stroke="var(--t3-ink)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="170" y="140" width="40" height="130" fill="var(--t1-ink)" fill-opacity="0.18" stroke="var(--t1-ink)" stroke-width="1.5"/>
  <rect x="170" y="40" width="40" height="100" fill="var(--t3-ink)" fill-opacity="0.12" stroke="var(--t3-ink)" stroke-width="1.5" stroke-dasharray="5 3"/>
