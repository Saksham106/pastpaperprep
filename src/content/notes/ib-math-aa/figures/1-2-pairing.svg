  <rect x="210" y="40" width="40" height="70" fill="var(--t3-ink)" fill-opacity="0.12" stroke="var(--t3-ink)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="250" y="80" width="40" height="190" fill="var(--t1-ink)" fill-opacity="0.18" stroke="var(--t1-ink)" stroke-width="1.5"/>
  <rect x="250" y="40" width="40" height="40" fill="var(--t3-ink)" fill-opacity="0.12" stroke="var(--t3-ink)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <g font-size="13" font-family="inherit" text-anchor="middle">
