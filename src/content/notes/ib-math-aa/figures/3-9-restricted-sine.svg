<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 330" role="img" aria-labelledby="t">
  <title id="t">Graphs of y equals sin x for x from minus pi over 2 to pi over 2, and of y equals arcsin x for x from minus 1 to 1, with the dashed line y equals x between them. The sine piece rises from (minus pi over 2, minus 1) through the origin to (pi over 2, 1). The arcsin curve rises from (minus 1, minus pi over 2) through the origin to (1, pi over 2). Each curve is the reflection of the other in the line y equals x.</title>
