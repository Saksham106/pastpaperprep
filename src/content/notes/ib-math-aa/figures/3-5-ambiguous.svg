  <line x1="247.8" y1="80" x2="127.8" y2="200" stroke="var(--t5-ink)" stroke-width="2.4"/>
  <path d="M80 200 A40 40 0 0 0 74.6 180" fill="none" stroke="currentColor" stroke-width="1.3"/>
