<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 275" role="img" aria-labelledby="t">
  <title id="t">Two triangles with angle A of 30 degrees, AC of 6 and BC of 3 root 2: B1 gives an acute angle, B2 an obtuse angle</title>
  <line x1="40" y1="200" x2="390" y2="200" stroke="currentColor" stroke-width="1.6"/>
  <path d="M127.8 200 A169.7 169.7 0 0 0 367.8 200" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="40" y1="200" x2="247.8" y2="80" stroke="currentColor" stroke-width="2.2"/>
