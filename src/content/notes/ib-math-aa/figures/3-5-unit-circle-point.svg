  <circle cx="150" cy="150" r="100" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="214.3" y2="73.4" stroke="currentColor" stroke-width="2.2"/>
  <line x1="150" y1="150" x2="214.3" y2="150" stroke="var(--t1-ink)" stroke-width="3"/>
  <line x1="214.3" y1="150" x2="214.3" y2="73.4" stroke="var(--t5-ink)" stroke-width="3"/>
  <path d="M202.3 150 L202.3 138 L214.3 138" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
