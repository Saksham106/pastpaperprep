<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" role="img" aria-labelledby="t">
  <title id="t">The unit circle with a radius of length 1 at angle theta ending at P, with horizontal leg cos theta and vertical leg sin theta</title>
