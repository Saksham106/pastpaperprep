<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" role="img" aria-labelledby="t">
  <title id="t">Bar chart of the probability distribution of the number of goals, balanced on a pivot at the expected value 2.15.</title>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="48" y1="20" x2="48" y2="170" />
    <line x1="48" y1="170" x2="336" y2="170" />
    <line x1="44" y1="170" x2="48" y2="170" /><line x1="44" y1="130" x2="48" y2="130" /><line x1="44" y1="90" x2="48" y2="90" /><line x1="44" y1="50" x2="48" y2="50" />
  </g>
  <g fill="var(--t4-ink)" fill-opacity="0.35" stroke="var(--t4-ink)" stroke-width="1.2">
    <rect x="62" y="150" width="28" height="20" />
    <rect x="122" y="50" width="28" height="120" />
    <rect x="182" y="50" width="28" height="120" />
    <rect x="242" y="110" width="28" height="60" />
    <rect x="302" y="90" width="28" height="80" />
  </g>
  <polygon points="205,171 198,186 212,186" fill="var(--t2-ink)" stroke="var(--t2-ink)" stroke-width="1" />
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="end">
    <text x="40" y="174">0</text><text x="40" y="134">0.1</text><text x="40" y="94">0.2</text><text x="40" y="54">0.3</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="76" y="200">0</text><text x="136" y="200">1</text><text x="196" y="200">2</text><text x="256" y="200">3</text><text x="316" y="200">4</text>
    <text x="192" y="238">number of goals, x</text>
  </g>
  <g fill="var(--t2-ink)" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="205" y="218">pivot at E(X) = 2.15</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="start">
    <text x="56" y="14">P(X = x)</text>
  </g>
</svg>
