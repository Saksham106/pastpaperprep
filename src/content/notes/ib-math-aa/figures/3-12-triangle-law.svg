<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t">
  <title id="t">Arrow u, then arrow v drawn from the head of u. The arrow from the start of u to the head of v is u plus v. Dashed copies of v then u, taken in the other order, complete a parallelogram and end at the same point.</title>
  <line x1="40.0" y1="200.0" x2="110.0" y2="90.0" stroke="var(--t5-ink)" stroke-width="1.4" stroke-dasharray="5 3"/><path d="M108.5,99.9 L110.0,90.0 L101.7,95.5" fill="none" stroke="var(--t5-ink)" stroke-width="1.4" stroke-linejoin="round"/>
  <line x1="110.0" y1="90.0" x2="280.0" y2="50.0" stroke="var(--t1-ink)" stroke-width="1.4" stroke-dasharray="5 3"/><path d="M272.0,56.1 L280.0,50.0 L270.2,48.1" fill="none" stroke="var(--t1-ink)" stroke-width="1.4" stroke-linejoin="round"/>
  <line x1="40.0" y1="200.0" x2="210.0" y2="160.0" stroke="var(--t1-ink)" stroke-width="2.2"/><path d="M202.0,166.1 L210.0,160.0 L200.2,158.1" fill="none" stroke="var(--t1-ink)" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="210.0" y1="160.0" x2="280.0" y2="50.0" stroke="var(--t5-ink)" stroke-width="2.2"/><path d="M278.5,59.9 L280.0,50.0 L271.7,55.5" fill="none" stroke="var(--t5-ink)" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="40.0" y1="200.0" x2="280.0" y2="50.0" stroke="currentColor" stroke-width="2.6"/><path d="M274.4,58.3 L280.0,50.0 L270.1,51.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
  <g font-size="15" font-family="inherit" font-weight="bold">
    <text x="125.0" y="200.0" fill="var(--t1-ink)">u</text>
    <text x="255.0" y="109.0" fill="var(--t5-ink)">v</text>
    <text x="150.0" y="115.0" fill="currentColor" text-anchor="end">u + v</text>
    <text x="61.0" y="145.0" fill="var(--t5-ink)">v</text>
    <text x="195.0" y="62.0" fill="var(--t1-ink)">u</text>
  </g>
</svg>
