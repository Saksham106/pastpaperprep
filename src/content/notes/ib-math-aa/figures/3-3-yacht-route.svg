<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">A yacht sails 20 km from P on a bearing of 075 degrees to Q, then 14 km on a bearing of 200 degrees to R. North lines are drawn at P and Q. The distance PR is unknown.</title>
  <line x1="40" y1="130" x2="40" y2="40" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M36,48 L40,40 L44,48" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <line x1="233" y1="78" x2="233" y2="20" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M229,28 L233,20 L237,28" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <line x1="40" y1="130" x2="233" y2="78" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <line x1="233" y1="78" x2="185" y2="210" stroke="var(--t3-ink)" stroke-width="2.5"/>
  <line x1="40" y1="130" x2="185" y2="210" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M40,100 A30,30 0 0 1 69,122.2" fill="none" stroke="var(--t1-ink)" stroke-width="1.5"/>
  <path d="M233,56 A22,22 0 1 1 225.5,98.7" fill="none" stroke="var(--t3-ink)" stroke-width="1.5"/>
  <g fill="currentColor">
    <circle cx="40" cy="130" r="3.5"/>
    <circle cx="233" cy="78" r="3.5"/>
    <circle cx="185" cy="210" r="3.5"/>
  </g>
  <g font-size="14" fill="currentColor" font-family="inherit">
    <text x="24" y="146" font-style="italic">P</text>
    <text x="242" y="74" font-style="italic">Q</text>
    <text x="176" y="228" font-style="italic">R</text>
    <text x="34" y="34" fill="var(--muted)" font-size="12">N</text>
    <text x="227" y="14" fill="var(--muted)" font-size="12">N</text>
    <text x="48" y="96" fill="var(--t1-ink)" font-size="12">075°</text>
    <text x="258" y="104" fill="var(--t3-ink)" font-size="12">200°</text>
    <text x="126" y="94" fill="var(--t1-ink)">20 km</text>
    <text x="214" y="160" fill="var(--t3-ink)">14 km</text>
    <text x="98" y="186">?</text>
  </g>
</svg>
