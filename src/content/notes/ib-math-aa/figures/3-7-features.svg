<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 255" role="img" aria-labelledby="t">
  <title id="t">Graph of y equals 2 sin 2x plus 3 for x from 0 to 2 pi. The wave swings about the dashed principal axis y equals 3, reaching up to y equals 5 and down to y equals 1. A vertical arrow from the axis to a maximum is labelled amplitude 2. A bracket from the maximum at pi over 4 to the next maximum at 5 pi over 4 is labelled period pi. Two full waves fit between 0 and 2 pi.</title>
