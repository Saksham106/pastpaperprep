<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 215" role="img" aria-labelledby="t">
  <title id="t">Graphs of y equals sin x, solid, and y equals cos x, dashed, for x from 0 to 2 pi. Both waves stay between minus 1 and 1. The sine curve starts at the origin, reaches its maximum 1 at pi over 2, crosses the axis at pi, reaches its minimum minus 1 at 3 pi over 2 and is back on the axis at 2 pi. The cosine curve starts at its maximum 1 at x equals 0, crosses the axis at pi over 2, reaches minus 1 at pi, crosses again at 3 pi over 2 and is back at 1 at 2 pi.</title>
