<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="t">
  <title id="t">Cuboid with edges a, b and c; the floor diagonal f meets the vertical edge c at a right angle, and the space diagonal d joins A to B</title>
  <polygon points="60,220 310,170 310,70" fill="var(--t1-ink)" fill-opacity="0.12" stroke="none"/>
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round">
    <polygon points="60,220 240,220 240,120 60,120"/>
    <polyline points="60,120 130,70 310,70 240,120"/>
    <polyline points="240,220 310,170 310,70"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.55" stroke-dasharray="5 4">
    <line x1="60" y1="220" x2="130" y2="170"/>
    <line x1="130" y1="170" x2="310" y2="170"/>
    <line x1="130" y1="170" x2="130" y2="70"/>
  </g>
  <line x1="60" y1="220" x2="310" y2="170" stroke="var(--t2-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="60" y1="220" x2="310" y2="70" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <path d="M300.2,172 L300.2,162 L310,160" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="60" cy="220" r="3.5" fill="currentColor"/>
  <circle cx="310" cy="70" r="3.5" fill="currentColor"/>
  <g font-size="14" fill="currentColor" font-family="inherit">
    <text x="42" y="236">A</text>
    <text x="316" y="64">B</text>
    <text x="146" y="240" font-style="italic">a</text>
    <text x="282" y="210" font-style="italic">b</text>
    <text x="318" y="125" font-style="italic">c</text>
    <text x="196" y="208" font-style="italic" fill="var(--t2-ink)">f</text>
    <text x="178" y="138" font-style="italic" fill="var(--t1-ink)">d</text>
  </g>
</svg>
