<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-labelledby="t">
  <title id="t">A rectangle labelled U holds two overlapping circles, A on the left and B on the right. Circle B is shaded and outlined boldly as the new sample space; everything outside B is faded and crossed out as ruled out. The overlap of A and B is labelled as the only part of A still possible.</title>
  <rect x="10" y="10" width="400" height="240" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.45"/>
  <circle cx="165" cy="128" r="88" fill="none" stroke="var(--t1-ink)" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.6"/>
  <circle cx="255" cy="128" r="88" fill="var(--t2-ink)" fill-opacity="0.16" stroke="var(--t2-ink)" stroke-width="3"/>
  <g font-family="inherit" font-size="15">
    <text x="24" y="34" fill="var(--muted)">U</text>
    <text x="92" y="52" fill="var(--t1-ink)" font-weight="bold" fill-opacity="0.7">A</text>
    <text x="318" y="52" fill="var(--t2-ink)" font-weight="bold">B</text>
  </g>
  <g font-family="inherit" font-size="13" text-anchor="middle">
    <text x="112" y="133" fill="var(--muted)">ruled out</text>
    <text x="210" y="128" fill="currentColor" font-weight="bold">A ∩ B</text>
    <text x="210" y="146" fill="currentColor">still possible</text>
    <text x="298" y="133" fill="currentColor">A′ ∩ B</text>
    <text x="345" y="238" fill="var(--muted)">ruled out</text>
  </g>
</svg>
