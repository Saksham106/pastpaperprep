<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 245" role="img" aria-labelledby="t">
  <title id="t">Graph of y equals tan x for x from 0 to 2 pi. Dashed vertical asymptotes at x equals pi over 2 and x equals 3 pi over 2 split it into three pieces. Each piece rises from left to right. The curve passes through the origin and the point (pi over 4, 1), climbs towards the asymptote at pi over 2, comes back up from very negative values through (pi, 0), climbs to the asymptote at 3 pi over 2, then rises again from very negative values to (2 pi, 0).</title>
