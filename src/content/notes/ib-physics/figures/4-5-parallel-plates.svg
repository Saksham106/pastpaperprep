<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 265" role="img" aria-labelledby="t45pp">
<title id="t45pp">Two horizontal parallel plates a distance d apart, the top plate positive and the bottom plate negative. Between the plates, away from the ends, the field lines are straight, parallel, equally spaced and point straight down from the positive plate to the negative plate. Near each end of the plates the lines bulge outwards in curves and are further apart, showing a weaker, non-uniform field. These are the edge effects.</title>
