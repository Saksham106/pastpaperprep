  <title id="t">Two panels. Left: a point source with four concentric circular wavefronts around it and eight rays pointing straight outwards from the source, each ray crossing the circles at right angles. Right: six parallel straight wavefronts, evenly spaced, with three parallel rays crossing them at right angles. The gap between neighbouring wavefronts is labelled lambda, one wavelength.</title>
