<title id="t">Side view of a lorry on a level road, accelerating to the right, shown by an arrow labelled acceleration a above the lorry. A small mass hangs on a string from a point on the roof inside the cargo box. The string is tilted backwards, towards the rear of the lorry, at an angle theta to a dashed vertical line. Two forces act on the mass: the tension T, pulling up along the string, and the weight m g, pulling straight down.</title>
