<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-labelledby="t510ln">
  <title id="t510ln">Graph of the natural log of corrected count rate against time in minutes. Seven data points lie close to a straight best-fit line that falls from 6.20 at 0 minutes to about 3.68 at 60 minutes. A gradient triangle on the line runs from 10 minutes, where ln C is 5.78, to 50 minutes, where ln C is 4.10.</title>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="70" y1="230" x2="70" y2="24"/>
    <line x1="70" y1="230" x2="450" y2="230"/>
  </g>
  <g stroke="currentColor" stroke-width="1">
    <line x1="64" y1="230" x2="70" y2="230"/><line x1="64" y1="180" x2="70" y2="180"/><line x1="64" y1="130" x2="70" y2="130"/>
    <line x1="64" y1="80" x2="70" y2="80"/><line x1="64" y1="30" x2="70" y2="30"/>
    <line x1="130" y1="230" x2="130" y2="236"/><line x1="190" y1="230" x2="190" y2="236"/><line x1="250" y1="230" x2="250" y2="236"/>
    <line x1="310" y1="230" x2="310" y2="236"/><line x1="370" y1="230" x2="370" y2="236"/><line x1="430" y1="230" x2="430" y2="236"/>
  </g>
  <line x1="70" y1="70" x2="430" y2="196" stroke="var(--t1-ink)" stroke-width="2"/>
  <g fill="currentColor">
    <circle cx="70" cy="72.1" r="3.5"/><circle cx="130" cy="90.6" r="3.5"/><circle cx="190" cy="113.0" r="3.5"/>
    <circle cx="250" cy="132.2" r="3.5"/><circle cx="310" cy="153.0" r="3.5"/><circle cx="370" cy="178.5" r="3.5"/>
    <circle cx="430" cy="199.9" r="3.5"/>
  </g>
  <g stroke="var(--t5-ink)" stroke-width="1.5" stroke-dasharray="5 3" fill="none">
    <line x1="130" y1="91" x2="370" y2="91"/>
    <line x1="370" y1="91" x2="370" y2="175"/>
  </g>
  <g font-size="12" fill="currentColor" font-family="inherit">
    <text x="58" y="234" text-anchor="end">3</text><text x="58" y="184" text-anchor="end">4</text><text x="58" y="134" text-anchor="end">5</text>
    <text x="58" y="84" text-anchor="end">6</text><text x="58" y="34" text-anchor="end">7</text>
    <text x="70" y="250" text-anchor="middle">0</text><text x="130" y="250" text-anchor="middle">10</text><text x="190" y="250" text-anchor="middle">20</text>
    <text x="250" y="250" text-anchor="middle">30</text><text x="310" y="250" text-anchor="middle">40</text><text x="370" y="250" text-anchor="middle">50</text>
    <text x="430" y="250" text-anchor="middle">60</text>
    <text x="260" y="272" text-anchor="middle" fill="var(--muted)">t / min</text>
    <text x="0" y="0" transform="translate(24,175) rotate(-90)" fill="var(--muted)">ln(C / min⁻¹)</text>
    <text x="250" y="84" text-anchor="middle" fill="var(--t5-ink)">Δt = 40 min</text>
    <text x="378" y="130" fill="var(--t5-ink)">Δ(ln C) = −1.68</text>
    <text x="134" y="84" fill="var(--t5-ink)">(10, 5.78)</text>
    <text x="362" y="200" text-anchor="end" fill="var(--t5-ink)">(50, 4.10)</text>
  </g>
</svg>
