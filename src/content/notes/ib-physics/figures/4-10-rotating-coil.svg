  <path d="M230,135 A30,30 0 0 0 219.3,112.0" fill="none" stroke="var(--t5-ink)" stroke-width="1.3"/>
  <line x1="261.3" y1="186.4" x2="294.7" y2="146.6" stroke="var(--t1-ink)" stroke-width="2" marker-end="url(#m410rc-v)"/>
