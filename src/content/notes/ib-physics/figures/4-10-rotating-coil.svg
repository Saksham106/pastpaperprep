<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-labelledby="t410rc">
  <title id="t410rc">End-on view of a rectangular coil between the N and S poles of a magnet. The field points from N to S, left to right. The coil is seen edge-on as a line through the rotation axis, turning anticlockwise. Its normal makes an angle theta with the field. The two long sides move in circles; each velocity arrow also makes the angle theta with the field.</title>
