<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" role="img" aria-labelledby="t513px">
  <title id="t513px">Stellar parallax, not to scale. The Sun is at the bottom centre, with the Earth shown at two points of its orbit six months apart, one on each side of the Sun, each 1 AU from it. A nearby star is above the Sun, a distance d away. Lines of sight from the two Earth positions pass through the nearby star and continue to a row of very distant background stars at the top, meeting it at two different points: the star appears in different places against the background. At the nearby star, the parallax angle p is marked between the line to the Sun and the line to one Earth position.</title>
  <g fill="currentColor" opacity="0.7">
    <circle cx="60" cy="22" r="2"/><circle cx="120" cy="16" r="2"/><circle cx="175" cy="24" r="2"/><circle cx="330" cy="18" r="2"/><circle cx="390" cy="25" r="2"/><circle cx="450" cy="15" r="2"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="160" y1="230" x2="278" y2="20"/>
    <line x1="340" y1="230" x2="222" y2="20"/>
    <line x1="160" y1="230" x2="340" y2="230" stroke="var(--muted)"/>
  </g>
  <line x1="250" y1="70" x2="250" y2="230" stroke="var(--t1-ink)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M250,104 A34,34 0 0,0 266.7,99.6" fill="none" stroke="var(--t2-ink)" stroke-width="1.6"/>
  <g fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3">
    <circle cx="222" cy="20" r="6"/><circle cx="278" cy="20" r="6"/>
  </g>
  <circle cx="250" cy="70" r="5" fill="var(--t3-ink)"/>
  <circle cx="250" cy="230" r="9" fill="var(--t5-ink)"/>
  <circle cx="160" cy="230" r="5" fill="var(--t1-ink)"/>
  <circle cx="340" cy="230" r="5" fill="var(--t1-ink)"/>
  <g font-size="12" fill="currentColor" font-family="inherit">
    <text x="12" y="44" fill="var(--muted)">very distant background stars</text>
    <text x="300" y="44" fill="var(--muted)">apparent positions</text>
    <text x="262" y="66">nearby star</text>
    <text x="250" y="256" text-anchor="middle">Sun</text>
    <text x="160" y="256" text-anchor="middle">Earth</text>
    <text x="340" y="256" text-anchor="middle">Earth 6 months later</text>
    <text x="205" y="222" text-anchor="middle" fill="var(--muted)">1 AU</text>
    <text x="240" y="160" text-anchor="end" fill="var(--t1-ink)" font-style="italic">d</text>
    <text x="262" y="124" fill="var(--t2-ink)" font-style="italic">p</text>
    <text x="490" y="282" text-anchor="end" fill="var(--muted)" font-size="11">not to scale</text>
  </g>
</svg>
