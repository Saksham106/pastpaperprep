<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t59lv">
  <title id="t59lv">Energy-level diagram, not to scale. On the left, a short horizontal line high up is the parent nucleus. On the right, two horizontal lines are levels of the daughter nucleus: an excited state 0.29 MeV above the ground state, and the ground state at the bottom. A long arrow labelled alpha 1, 6.05 MeV, goes down from the parent to the daughter's ground state. A shorter arrow labelled alpha 2, 5.76 MeV, goes down from the parent to the excited state. A vertical arrow labelled gamma, 0.29 MeV, goes down from the excited state to the ground state.</title>
  <defs>
    <marker id="m59lv-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="30" y1="40" x2="170" y2="40"/>
    <line x1="220" y1="170" x2="450" y2="170"/>
    <line x1="220" y1="260" x2="450" y2="260"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="80" y1="42" x2="250" y2="257" marker-end="url(#m59lv-head)"/>
    <line x1="130" y1="42" x2="290" y2="167" marker-end="url(#m59lv-head)"/>
  </g>
  <line x1="400" y1="172" x2="400" y2="257" stroke="var(--t3-ink)" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#m59lv-head)"/>
  <g font-family="inherit" font-size="12" fill="currentColor">
    <text x="30" y="30">parent nucleus</text>
    <text x="450" y="160" text-anchor="end">excited state, 0.29 MeV</text>
    <text x="450" y="280" text-anchor="end">ground state, 0</text>
    <text x="225" y="300" dy="-4">daughter nucleus</text>
    <text x="60" y="190">α1: 6.05 MeV</text>
    <text x="215" y="95">α2: 5.76 MeV</text>
    <text x="410" y="218" fill="var(--t3-ink)">γ: 0.29 MeV</text>
  </g>
</svg>
