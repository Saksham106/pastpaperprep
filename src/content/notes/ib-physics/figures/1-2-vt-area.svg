<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 285" role="img" aria-labelledby="t12va">
  <title id="t12va">Velocity against time graph for uniform acceleration. A straight line rises from velocity u on the vertical axis at time zero to velocity v at time t, and its gradient is labelled a. The area under the line, down to the time axis, is split into two parts. The lower part is a rectangle of height u and width t, labelled area u t. The upper part is a triangle of width t and height v minus u, which equals a t, labelled area one half a t squared. Together they make the displacement s.</title>
  <defs>
    <marker id="m12va-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="60" y1="240" x2="60" y2="20" marker-end="url(#m12va-head)"/>
    <line x1="60" y1="240" x2="420" y2="240" marker-end="url(#m12va-head)"/>
  </g>
  <g font-family="inherit" font-size="12" fill="currentColor">
    <text x="22" y="130" text-anchor="middle" transform="rotate(-90 22 130)">velocity / m s⁻¹</text>
    <text x="420" y="268" text-anchor="end">time t / s</text>
    <text x="54" y="254" text-anchor="end">0</text>
  </g>
  <rect x="60" y="180" width="300" height="60" fill="var(--t1-ink)" fill-opacity="0.15" stroke="none"/>
  <polygon points="60,180 360,180 360,70" fill="var(--t2-ink)" fill-opacity="0.15" stroke="none"/>
  <g stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <line x1="60" y1="180" x2="360" y2="180"/>
    <line x1="360" y1="70" x2="360" y2="240"/>
    <line x1="60" y1="70" x2="360" y2="70"/>
  </g>
  <line x1="60" y1="180" x2="360" y2="70" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <g font-family="inherit" font-size="13" fill="currentColor">
    <text x="52" y="184" text-anchor="end">u</text>
    <text x="52" y="74" text-anchor="end">v</text>
    <text x="360" y="256" text-anchor="middle">t</text>
    <text x="210" y="215" text-anchor="middle" fill="var(--t1-ink)">area = ut</text>
    <text x="290" y="165" text-anchor="middle" fill="var(--t2-ink)">area = ½at²</text>
    <text x="372" y="130" fill="var(--muted)">v − u = at</text>
    <text x="150" y="128" fill="var(--t1-ink)" transform="rotate(-20 150 128)">gradient = a</text>
  </g>
</svg>
