  <title id="t">Graph of intensity against angle from the centre line for single-slit diffraction of monochromatic light. A tall central maximum is centred on zero and falls to zero intensity at angles of plus and minus lambda over b, so it is 2 lambda over b wide. On each side are much dimmer secondary maxima, each lambda over b wide, with zero-intensity minima at plus and minus 2 lambda over b.</title>
