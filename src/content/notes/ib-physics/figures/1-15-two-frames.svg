<polygon points="290,30 281,34.5 281,25.5" fill="var(--t3-ink)"/>
<text font-family="inherit" font-size="13" x="298" y="34" fill="var(--t3-ink)" text-anchor="start">v</text>
<path d="M200 70 L486 70" fill="none" stroke="var(--t1-ink)" stroke-width="1.6"/>
