<polygon points="420,96 411,100.5 411,91.5" fill="var(--t1-ink)"/>
<polygon points="220,96 229,100.5 229,91.5" fill="var(--t1-ink)"/>
<text font-family="inherit" font-size="13" x="320" y="114" fill="var(--t1-ink)" text-anchor="middle">x′</text>
