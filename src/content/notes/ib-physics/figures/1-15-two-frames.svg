<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-labelledby="t">
<title id="t">Two parallel horizontal x-axes. The lower axis belongs to frame S, with origin O at the left. The upper axis belongs to frame S prime, with origin O prime further to the right, and an arrow labelled v shows that frame S prime moves to the right relative to S. A dashed vertical line marks event P, to the right of both origins. Below the axes, an arrow from O to O prime is labelled v t, and a longer arrow from O to P is labelled x. Beside the upper axis, an arrow from O prime to P is labelled x prime. So x equals v t plus x prime.</title>
<text font-family="inherit" font-size="12" x="420" y="30" fill="currentColor" text-anchor="middle">event P</text>
