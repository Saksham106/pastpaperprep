<text font-family="inherit" font-size="12" x="500" y="58" fill="var(--t1-ink)" text-anchor="end">x′ (frame S′)</text>
<path d="M220 60 V80" stroke="var(--t1-ink)" stroke-width="1.6"/>
<text font-family="inherit" font-size="12" x="220" y="54" fill="var(--t1-ink)" text-anchor="middle">O′</text>
