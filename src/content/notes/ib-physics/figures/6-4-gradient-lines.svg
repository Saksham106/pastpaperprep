  <title id="t64gl">Force in newtons, 0 to 6, against extension in metres, 0 to 0.12. Five points at extensions 0.02, 0.04, 0.06, 0.08 and 0.10 metres rise in a straight trend, each with a vertical uncertainty bar of plus or minus 0.2 newtons. A solid line of best fit runs through every bar. A dashed steepest line, gradient 52.6 newtons per metre, and a dashed shallowest line, gradient 44.2 newtons per metre, also pass through every bar; they cross near the middle point. The best line has gradient 48.4 newtons per metre.</title>
