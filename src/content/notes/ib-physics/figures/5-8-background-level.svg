  <title id="t58bg">Graph of count rate in counts per minute against time in minutes, from 0 to 24 minutes. The measured count rate starts at 630 and falls, then levels off at a dashed horizontal line at 30 counts per minute, labelled background. A second, lower curve, the corrected count rate, starts at 600 and falls towards zero, halving every 4 minutes. The gap between the two curves is always 30.</title>
