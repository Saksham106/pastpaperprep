<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 245" role="img" aria-labelledby="t">
  <title id="t">A stretched string shown at five instants during one oscillation of a standing wave. The string has four nodes, marked N, evenly spaced along it, including both ends, and an antinode, marked A, halfway between each pair of nodes. At the nodes the string never moves. At the antinodes it swings furthest, between the solid curve at its highest and the opposite solid curve at its lowest, with dashed curves at in-between times. The distance from one node to the next is marked half a wavelength, and so is the distance from one antinode to the next.</title>
