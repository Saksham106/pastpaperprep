<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-labelledby="t">
  <title id="t">One snapshot of a standing wave with two loops between three nodes, marked N, drawn inside its dashed envelope. In the left loop, point P sits at the antinode and point Q sits closer to the left-hand node, so Q has a smaller amplitude. Both P and Q have arrows pointing up: they move upwards together, in phase. In the right loop, point R is on the far side of the middle node and has an arrow pointing down: it moves opposite to P and Q, in antiphase.</title>
