<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t56bc">
  <title id="t56bc">Graph of binding energy per nucleon in MeV against nucleon number A, from 0 to 250. The curve rises steeply from hydrogen-2 at about 1.1 MeV. Helium-4 sits well above the curve near it, at about 7.1 MeV, and oxygen-16 is marked at about 8.0 MeV. The curve reaches a broad maximum of about 8.8 MeV at iron-56, then falls slowly to about 7.6 MeV at uranium-238. To the left of the peak, an arrow pointing right shows that fusing light nuclei releases energy. To the right of the peak, an arrow pointing left shows that splitting heavy nuclei releases energy.</title>
