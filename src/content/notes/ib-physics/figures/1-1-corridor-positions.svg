<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-labelledby="t">
<title id="t">A straight horizontal line marked in metres from minus 1 to 10, with the origin O at 0 and an arrow showing that the positive direction is to the right. A person starts at P, position plus 2 metres, walks right to Q at plus 8 metres, then turns and walks back left to R at plus 5 metres. Arrows above the line show the two legs, labelled 6 metres and 3 metres, so the distance travelled is 9 metres. A thin arrow from O to R shows the position of R, plus 5 metres. Below the line, a single arrow from P to R shows the displacement, plus 3 metres.</title>
<text font-family="inherit" font-size="12" x="260" y="24" fill="var(--t1-ink)" text-anchor="middle">distance travelled = 6 m + 3 m = 9 m</text>
<path d="M20 150 L486 150" fill="none" stroke="currentColor" stroke-width="1.6"/>
<polygon points="495,150 486,154.5 486,145.5" fill="currentColor"/>
<text font-family="inherit" font-size="14" x="495" y="140" fill="currentColor" text-anchor="end">+</text>
<text font-family="inherit" font-size="12" x="500" y="172" fill="currentColor" text-anchor="end">x / m</text>
<path d="M20 145 V155" stroke="currentColor" stroke-width="1.2"/>
