<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="t43e">
<title id="t43e">Graph of energy against orbital radius r for a satellite in a circular orbit, starting at the planet's surface. The kinetic energy curve is positive and falls towards zero as r increases. The potential energy curve is negative, starts twice as far below zero as the kinetic energy is above it, and rises towards zero. The total energy curve is negative, a mirror image of the kinetic energy curve in the r axis, and also rises towards zero.</title>
