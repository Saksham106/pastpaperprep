<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" role="img" aria-labelledby="t211fp">
  <title id="t211fp">Pressure against volume for a fixed amount of ideal gas. Four lines start from the same state S. A vertical line rises from S, labelled isovolumetric, V constant. A horizontal line runs to the right from S, labelled isobaric, P constant. Two curves fall to the right from S: the gentler one is labelled isothermal, T constant, and the steeper one, which ends lower, is labelled adiabatic, Q equals 0.</title>
