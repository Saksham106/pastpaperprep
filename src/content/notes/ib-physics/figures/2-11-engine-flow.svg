<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" role="img" aria-labelledby="t211ef">
  <title id="t211ef">Energy flow in a heat engine. A box at the top is labelled hot reservoir at temperature T h. A thick arrow labelled Q h goes down from it into a circle labelled engine. An arrow labelled W, useful work, leaves the engine to the right. An arrow labelled Q c goes down from the engine into a box at the bottom labelled cold reservoir at temperature T c.</title>
  <defs>
    <marker id="a211ef" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="150" y="20" width="260" height="56" rx="8" fill="var(--t5-ink)" fill-opacity="0.18" stroke="currentColor" stroke-width="1.6"/>
  <rect x="150" y="294" width="260" height="56" rx="8" fill="var(--t1-ink)" fill-opacity="0.18" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="280" cy="185" r="46" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <g stroke="currentColor" fill="none">
    <line x1="280" y1="78" x2="280" y2="128" stroke-width="10" marker-end="url(#a211ef)"/>
    <line x1="280" y1="232" x2="280" y2="282" stroke-width="7" marker-end="url(#a211ef)"/>
    <line x1="327" y1="185" x2="440" y2="185" stroke-width="5" marker-end="url(#a211ef)"/>
  </g>
  <g font-size="14" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="280" y="53">hot reservoir, temperature T<tspan dy="4" font-size="10">h</tspan></text>
    <text x="280" y="327">cold reservoir, temperature T<tspan dy="4" font-size="10">c</tspan></text>
    <text x="280" y="190">engine</text>
    <text x="310" y="110" text-anchor="start">Q<tspan dy="4" font-size="10">h</tspan></text>
    <text x="300" y="265" text-anchor="start">Q<tspan dy="4" font-size="10">c</tspan></text>
    <text x="480" y="180">W</text>
    <text x="480" y="200">useful work</text>
  </g>
</svg>
