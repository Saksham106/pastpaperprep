<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="t">
<title id="t">Graph of speed against time for a body falling from rest through air. Speed on the vertical axis in metres per second, time on the horizontal axis in seconds. The curve starts at the origin with its steepest gradient, equal to g, shown by a dashed tangent line. The gradient then decreases, and the curve levels off towards a horizontal dashed line labelled terminal speed.</title>
