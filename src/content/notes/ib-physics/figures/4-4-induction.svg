<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="t44in">
<title id="t44in">Charging a metal sphere by induction, in four panels from left to right. Each panel shows a metal sphere on an insulating stand. Panel 1: a negatively charged rod is held near the left side of the sphere without touching it. Positive charges are marked on the left side of the sphere, nearest the rod, and negative charges on the right side, because free electrons have been pushed away from the rod. Panel 2: the rod is still near, and the right side of the sphere is connected to earth by a wire. An arrow along the wire shows electrons flowing from the sphere down to earth. Only the positive charges on the left side remain. Panel 3: the earth wire has been removed while the rod is still near. The positive charges stay on the left side. Panel 4: the rod has been taken away. The same positive charges are now spread evenly around the whole surface, so the sphere has a net positive charge.</title>
