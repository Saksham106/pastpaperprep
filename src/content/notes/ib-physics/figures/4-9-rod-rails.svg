<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-labelledby="t49rr">
  <title id="t49rr">Top view of a metal rod of length L sliding right at speed v along two parallel rails joined by a resistor, in a magnetic field into the page. The top of the rod is positive. Current flows up the rod, left along the top rail, down through the resistor and right along the bottom rail. The magnetic force on the rod points left, against its motion.</title>
  <defs>
    <marker id="m49rr-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t5-ink)"/>
    </marker>
    <marker id="m49rr-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t2-ink)"/>
    </marker>
    <marker id="m49rr-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t3-ink)"/>
    </marker>
    <marker id="m49rr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- field into the page -->
  <g font-size="16" fill="var(--muted)" text-anchor="middle" font-family="inherit">
    <text x="120" y="96">×</text><text x="175" y="96">×</text><text x="230" y="96">×</text><text x="285" y="96">×</text>
    <text x="390" y="96">×</text><text x="445" y="96">×</text><text x="500" y="96">×</text>
    <text x="120" y="131">×</text><text x="175" y="131">×</text><text x="230" y="131">×</text><text x="285" y="131">×</text>
    <text x="460" y="131">×</text><text x="515" y="131">×</text>
    <text x="120" y="166">×</text><text x="175" y="166">×</text><text x="230" y="166">×</text>
    <text x="390" y="166">×</text><text x="445" y="166">×</text><text x="500" y="166">×</text>
  </g>

  <!-- rails and resistor -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="70" y1="60" x2="540" y2="60"/>
    <line x1="70" y1="190" x2="540" y2="190"/>
    <line x1="70" y1="60" x2="70" y2="100"/>
    <rect x="60" y="100" width="20" height="50"/>
    <line x1="70" y1="150" x2="70" y2="190"/>
  </g>

  <!-- rod -->
  <line x1="330" y1="48" x2="330" y2="202" stroke="var(--t1-ink)" stroke-width="6" stroke-linecap="round"/>

  <!-- velocity -->
  <line x1="338" y1="125" x2="408" y2="125" stroke="var(--t5-ink)" stroke-width="2" marker-end="url(#m49rr-v)"/>

  <!-- induced current -->
  <g stroke="var(--t2-ink)" stroke-width="2" marker-end="url(#m49rr-i)">
    <line x1="346" y1="108" x2="346" y2="72"/>
    <line x1="270" y1="60" x2="205" y2="60"/>
    <line x1="205" y1="190" x2="270" y2="190"/>
  </g>
  <line x1="42" y1="110" x2="42" y2="145" stroke="var(--t2-ink)" stroke-width="2" marker-end="url(#m49rr-i)"/>

  <!-- magnetic force on the rod -->
  <line x1="322" y1="150" x2="262" y2="150" stroke="var(--t3-ink)" stroke-width="2" marker-end="url(#m49rr-f)"/>

  <!-- length L -->
  <line x1="565" y1="64" x2="565" y2="186" stroke="var(--muted)" stroke-width="1.2" marker-start="url(#m49rr-dim)" marker-end="url(#m49rr-dim)"/>

  <g font-size="13" fill="currentColor" font-family="inherit">
    <text x="88" y="130">R</text>
    <text x="414" y="129" font-style="italic" fill="var(--t5-ink)">v</text>
    <text x="352" y="94" font-style="italic" fill="var(--t2-ink)">I</text>
    <text x="238" y="52" text-anchor="middle" font-style="italic" fill="var(--t2-ink)">I</text>
    <text x="238" y="210" text-anchor="middle" font-style="italic" fill="var(--t2-ink)">I</text>
    <text x="34" y="132" text-anchor="end" font-style="italic" fill="var(--t2-ink)">I</text>
    <text x="256" y="155" text-anchor="end" fill="var(--t3-ink)"><tspan font-style="italic">F</tspan> = <tspan font-style="italic">BIL</tspan></text>
    <text x="575" y="130" font-style="italic">L</text>
    <text x="316" y="44" text-anchor="middle" font-size="15">+</text>
    <text x="316" y="216" text-anchor="middle" font-size="15">−</text>
    <text x="70" y="238"><tspan font-style="italic">B</tspan> into the page (×)</text>
  </g>
</svg>
