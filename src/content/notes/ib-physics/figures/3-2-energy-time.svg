<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" role="img" aria-labelledby="t32et">
  <title id="t32et">Energy E against time t over one period T, for an oscillator that passes through equilibrium at t equals 0. The total energy ET is a horizontal line. The dashed kinetic energy curve starts at ET, falls to zero at T over 4, rises to ET at T over 2, falls to zero at 3T over 4 and returns to ET at T. The solid potential energy curve does the opposite: zero at 0, T over 2 and T, and ET at T over 4 and 3T over 4. Neither curve goes below zero, and each repeats twice in one period of the oscillation.</title>
