<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-labelledby="t">
  <title id="t">An electromagnetic wave drawn in perspective, travelling to the right along a horizontal axis labelled direction of travel. An electric field wave, labelled E, oscillates up and down in a vertical plane. A magnetic field wave, labelled B, oscillates in a horizontal plane, drawn slanting into and out of the page. The two waves have the same wavelength and reach their peaks at the same places. Small arrows from the axis show the field directions: the electric field arrows are vertical, the magnetic field arrows are horizontal, and both are at right angles to the direction of travel.</title>
