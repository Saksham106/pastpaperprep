<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-labelledby="t">
<title id="t">Two copies of the same light rod, 0.80 m long, with a 0.60 kg mass at each end and a 0.20 kg mass at its centre. In the top copy, labelled a, a dashed axis perpendicular to the rod passes through the centre, so each end mass is 0.40 m from the axis and the centre mass is on the axis. In the bottom copy, labelled b, the dashed axis passes through the left end, so the centre mass is 0.40 m from the axis and the far end mass is 0.80 m from it.</title>
<text font-family="inherit" font-size="12" x="10" y="20" fill="currentColor">(a) axis through the centre</text>
<path d="M70 75 H350" stroke="currentColor" stroke-width="2"/>
<circle cx="70" cy="75" r="12" fill="var(--t1-ink)"/>
<circle cx="350" cy="75" r="12" fill="var(--t1-ink)"/>
<circle cx="210" cy="75" r="7" fill="var(--t2-ink)"/>
<text font-family="inherit" font-size="11" x="70" y="55" fill="var(--t1-ink)" text-anchor="middle">0.60 kg</text>
<text font-family="inherit" font-size="11" x="350" y="55" fill="var(--t1-ink)" text-anchor="middle">0.60 kg</text>
<text font-family="inherit" font-size="11" x="232" y="55" fill="var(--t2-ink)" text-anchor="start">0.20 kg</text>
<path d="M210 32 V118" stroke="var(--t4-ink)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text font-family="inherit" font-size="11" x="200" y="40" fill="var(--t4-ink)" text-anchor="end">axis</text>
<path d="M70 102 H210 M210 102 H350" stroke="var(--muted)" stroke-width="1"/>
<path d="M70 96 V108 M350 96 V108" stroke="var(--muted)" stroke-width="1"/>
<text font-family="inherit" font-size="11" x="140" y="118" fill="var(--muted)" text-anchor="middle">0.40 m</text>
<text font-family="inherit" font-size="11" x="280" y="118" fill="var(--muted)" text-anchor="middle">0.40 m</text>
<text font-family="inherit" font-size="12" x="10" y="155" fill="currentColor">(b) axis through one end</text>
<path d="M70 205 H350" stroke="currentColor" stroke-width="2"/>
<circle cx="70" cy="205" r="12" fill="var(--t1-ink)"/>
<circle cx="350" cy="205" r="12" fill="var(--t1-ink)"/>
<circle cx="210" cy="205" r="7" fill="var(--t2-ink)"/>
<text font-family="inherit" font-size="11" x="92" y="185" fill="var(--t1-ink)" text-anchor="start">0.60 kg</text>
<text font-family="inherit" font-size="11" x="350" y="185" fill="var(--t1-ink)" text-anchor="middle">0.60 kg</text>
<text font-family="inherit" font-size="11" x="210" y="185" fill="var(--t2-ink)" text-anchor="middle">0.20 kg</text>
<path d="M70 162 V248" stroke="var(--t4-ink)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text font-family="inherit" font-size="11" x="60" y="170" fill="var(--t4-ink)" text-anchor="end">axis</text>
<path d="M70 232 H210" stroke="var(--muted)" stroke-width="1"/>
<path d="M70 252 H350" stroke="var(--muted)" stroke-width="1"/>
<path d="M210 226 V238 M350 246 V258" stroke="var(--muted)" stroke-width="1"/>
<text font-family="inherit" font-size="11" x="140" y="228" fill="var(--muted)" text-anchor="middle">0.40 m</text>
<text font-family="inherit" font-size="11" x="280" y="266" fill="var(--muted)" text-anchor="middle">0.80 m</text>
</svg>
