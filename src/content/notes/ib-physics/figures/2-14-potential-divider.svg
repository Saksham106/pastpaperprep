<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" role="img" aria-labelledby="t214pd">
  <title id="t214pd">Potential divider. A supply of potential difference V in, with negligible internal resistance, on the left. On the right, a fixed resistor R1 on top and a thermistor R2 below it are joined in series between the top and bottom wires. Output wires run from the junction between them and from the bottom wire to two open terminals, so the output potential difference V out is the pd across the thermistor.</title>
  <g stroke="currentColor" stroke-width="2.2" fill="none">
    <line x1="80" y1="40" x2="280" y2="40"/>
    <line x1="80" y1="40" x2="80" y2="162"/>
    <line x1="80" y1="178" x2="80" y2="300"/>
    <line x1="80" y1="300" x2="280" y2="300"/>
    <line x1="280" y1="40" x2="280" y2="70"/>
    <rect x="270" y="70" width="20" height="60"/>
    <line x1="280" y1="130" x2="280" y2="180"/>
    <rect x="270" y="180" width="20" height="60"/>
    <line x1="280" y1="240" x2="280" y2="300"/>
    <!-- thermistor: diagonal line with a flat tail -->
    <polyline points="256,250 264,250 300,170"/>
    <line x1="280" y1="155" x2="420" y2="155"/>
    <line x1="280" y1="300" x2="420" y2="300"/>
  </g>
  <line x1="58" y1="162" x2="102" y2="162" stroke="currentColor" stroke-width="2.2"/>
  <line x1="69" y1="178" x2="91" y2="178" stroke="currentColor" stroke-width="6"/>
  <circle cx="280" cy="155" r="4" fill="currentColor"/>
  <circle cx="280" cy="300" r="4" fill="currentColor"/>
  <circle cx="425" cy="155" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="425" cy="300" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="460" y1="168" x2="460" y2="287" stroke="var(--t1-ink)" stroke-width="2"/>
  <g font-family="inherit" font-size="15" fill="currentColor">
    <text x="40" y="150" text-anchor="end">+</text>
    <text x="50" y="215" text-anchor="end">V<tspan font-size="11" dy="4">in</tspan></text>
    <text x="305" y="104">fixed resistor R<tspan font-size="11" dy="4">1</tspan></text>
    <text x="310" y="214">thermistor R<tspan font-size="11" dy="4">2</tspan></text>
    <text x="472" y="232" fill="var(--t1-ink)">V<tspan font-size="11" dy="4">out</tspan></text>
  </g>
  <text x="270" y="332" text-anchor="middle" font-family="inherit" font-size="13" fill="var(--muted)">same current in R1 and R2, so the pd divides in the ratio R1 : R2</text>
</svg>
