<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" role="img" aria-labelledby="t116ts">
  <title id="t116ts">A space station sits in the middle of a horizontal line. An arrow at the top shows that the positive direction is to the right. Spaceship A is to the right of the station and moves to the right with velocity plus 0.70 c relative to the station. Spaceship B is to the left of the station and moves to the left with velocity minus 0.50 c relative to the station. The two ships move apart.</title>
  <defs>
    <marker id="m116ts-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="m116ts-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/>
    </marker>
    <marker id="m116ts-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t4-ink)"/>
    </marker>
  </defs>
  <line x1="190" y1="22" x2="250" y2="22" stroke="currentColor" stroke-width="1.4" marker-end="url(#m116ts-head)"/>
  <text x="256" y="26" font-family="inherit" font-size="12" fill="currentColor">positive</text>
  <g stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"><line x1="20" y1="110" x2="60" y2="110"/><line x1="122" y1="110" x2="183" y2="110"/><line x1="257" y1="110" x2="318" y2="110"/><line x1="380" y1="110" x2="420" y2="110"/></g>
  <rect x="200" y="92" width="40" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <line x1="185" y1="110" x2="200" y2="110" stroke="currentColor" stroke-width="1.6"/>
  <line x1="240" y1="110" x2="255" y2="110" stroke="currentColor" stroke-width="1.6"/>
  <text x="220" y="150" text-anchor="middle" font-family="inherit" font-size="12" fill="currentColor">station</text>
  <path d="M320,98 L360,98 L378,110 L360,122 L320,122 Z" fill="none" stroke="var(--t1-ink)" stroke-width="1.8"/>
  <text x="345" y="114" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--t1-ink)">A</text>
  <line x1="330" y1="74" x2="400" y2="74" stroke="var(--t1-ink)" stroke-width="1.8" marker-end="url(#m116ts-a)"/>
  <text x="365" y="66" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--t1-ink)">+0.70c</text>
  <path d="M120,98 L80,98 L62,110 L80,122 L120,122 Z" fill="none" stroke="var(--t4-ink)" stroke-width="1.8"/>
  <text x="95" y="114" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--t4-ink)">B</text>
  <line x1="110" y1="74" x2="40" y2="74" stroke="var(--t4-ink)" stroke-width="1.8" marker-end="url(#m116ts-b)"/>
  <text x="75" y="66" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--t4-ink)">−0.50c</text>
</svg>
