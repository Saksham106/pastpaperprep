<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t52sp">
  <title id="t52sp">Three spectra on the same wavelength scale from 400 to 700 nanometres. Top: a continuous spectrum, a band filled at every wavelength. Middle: the emission spectrum of gas X, an empty band with three bright lines at 450, 520 and 610 nanometres. Bottom: the absorption spectrum of gas X, a filled band with three gaps where light is missing, at the same 450, 520 and 610 nanometres.</title>
  <g font-family="inherit" font-size="13" fill="currentColor">
    <text x="80" y="30">continuous spectrum (hot filament)</text>
    <text x="80" y="110">emission spectrum of gas X (hot, low pressure)</text>
    <text x="80" y="190">absorption spectrum of gas X (white light through cool gas)</text>
  </g>
  <rect x="80" y="40" width="480" height="40" fill="var(--t2-ink)" fill-opacity="0.45"/>
  <rect x="80" y="120" width="480" height="40" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <g stroke="var(--t1-ink)" stroke-width="5">
    <line x1="160" y1="120" x2="160" y2="160"/>
    <line x1="272" y1="120" x2="272" y2="160"/>
    <line x1="416" y1="120" x2="416" y2="160"/>
  </g>
  <g fill="var(--t2-ink)" fill-opacity="0.45">
    <rect x="80" y="200" width="77.5" height="40"/>
    <rect x="162.5" y="200" width="107" height="40"/>
    <rect x="274.5" y="200" width="139" height="40"/>
    <rect x="418.5" y="200" width="141.5" height="40"/>
  </g>
  <g stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="160" y1="160" x2="160" y2="200"/>
    <line x1="272" y1="160" x2="272" y2="200"/>
    <line x1="416" y1="160" x2="416" y2="200"/>
  </g>
  <g stroke="currentColor" stroke-width="1">
    <line x1="80" y1="250" x2="560" y2="250"/>
    <line x1="80" y1="250" x2="80" y2="255"/>
    <line x1="240" y1="250" x2="240" y2="255"/>
    <line x1="400" y1="250" x2="400" y2="255"/>
    <line x1="560" y1="250" x2="560" y2="255"/>
  </g>
  <g font-family="inherit" font-size="12" fill="currentColor" text-anchor="middle">
    <text x="80" y="270">400</text>
    <text x="240" y="270">500</text>
    <text x="400" y="270">600</text>
    <text x="560" y="270">700</text>
    <text x="320" y="292" fill="var(--muted)">wavelength / nm</text>
  </g>
</svg>
