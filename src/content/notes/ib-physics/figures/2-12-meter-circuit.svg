<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-labelledby="t212mc">
  <title id="t212mc">A single loop containing a cell, a switch, a lamp and an ammeter, all in series. The cell and the switch are on the top wire, the ammeter is on the right-hand wire and the lamp is on the bottom wire. A voltmeter sits on a separate branch below the lamp: its two wires join the main loop on either side of the lamp, at two junction dots, so the voltmeter is in parallel across the lamp.</title>
  <g stroke="currentColor" stroke-width="2.2" fill="none">
    <!-- top wire: switch then cell -->
    <line x1="110" y1="50" x2="170" y2="50"/>
    <line x1="170" y1="50" x2="202" y2="32"/>
    <line x1="206" y1="50" x2="290" y2="50"/>
    <line x1="310" y1="50" x2="440" y2="50"/>
    <!-- right side with ammeter -->
    <line x1="440" y1="50" x2="440" y2="109"/>
    <line x1="440" y1="141" x2="440" y2="200"/>
    <circle cx="440" cy="125" r="16"/>
    <!-- bottom wire with lamp -->
    <line x1="440" y1="200" x2="286" y2="200"/>
    <line x1="254" y1="200" x2="110" y2="200"/>
    <circle cx="270" cy="200" r="16"/>
    <line x1="258.7" y1="188.7" x2="281.3" y2="211.3"/>
    <line x1="281.3" y1="188.7" x2="258.7" y2="211.3"/>
    <!-- left side -->
    <line x1="110" y1="200" x2="110" y2="50"/>
    <!-- voltmeter branch -->
    <line x1="215" y1="200" x2="215" y2="262"/>
    <line x1="215" y1="262" x2="254" y2="262"/>
    <circle cx="270" cy="262" r="16"/>
    <line x1="286" y1="262" x2="325" y2="262"/>
    <line x1="325" y1="262" x2="325" y2="200"/>
  </g>
  <line x1="290" y1="28" x2="290" y2="72" stroke="currentColor" stroke-width="2.2"/>
  <line x1="310" y1="39" x2="310" y2="61" stroke="currentColor" stroke-width="6"/>
  <circle cx="170" cy="50" r="2.5" fill="currentColor"/>
  <circle cx="206" cy="50" r="2.5" fill="currentColor"/>
  <circle cx="215" cy="200" r="4" fill="currentColor"/>
  <circle cx="325" cy="200" r="4" fill="currentColor"/>
  <g font-size="14" fill="currentColor" font-family="inherit">
    <text x="440" y="130" text-anchor="middle" font-size="15">A</text>
    <text x="270" y="267" text-anchor="middle" font-size="15">V</text>
    <text x="300" y="96" text-anchor="middle">cell</text>
    <text x="188" y="80" text-anchor="middle">switch</text>
    <text x="270" y="172" text-anchor="middle">lamp</text>
    <text x="466" y="122">ammeter:</text>
    <text x="466" y="139">in series</text>
    <text x="345" y="258">voltmeter: in parallel</text>
    <text x="345" y="275">across the lamp</text>
  </g>
</svg>
