<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" role="img" aria-labelledby="t22pm">
  <title id="t22pm">Particle models of a solid, a liquid and a gas. Solid: particles in a regular grid, touching, vibrating about fixed positions. Liquid: particles close together but irregular, filling the bottom of the container. Gas: a few particles far apart, each moving in a different direction.</title>
