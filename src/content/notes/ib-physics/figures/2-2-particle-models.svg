    <rect x="15" y="20" width="180" height="150"/>
    <polyline points="210,20 210,170 390,170 390,20"/>
    <rect x="405" y="20" width="180" height="150"/>
  </g>
  <g fill="var(--t1-ink)" fill-opacity="0.35" stroke="var(--t1-ink)" stroke-width="1.2">
