    <circle cx="55" cy="145" r="12"/><circle cx="80" cy="145" r="12"/><circle cx="105" cy="145" r="12"/><circle cx="130" cy="145" r="12"/><circle cx="155" cy="145" r="12"/>
  </g>
  <g fill="var(--t2-ink)" fill-opacity="0.35" stroke="var(--t2-ink)" stroke-width="1.2">
    <circle cx="240" cy="150" r="12"/><circle cx="266" cy="152" r="12"/><circle cx="292" cy="148" r="12"/><circle cx="318" cy="151" r="12"/><circle cx="344" cy="149" r="12"/><circle cx="368" cy="150" r="12"/>
    <circle cx="252" cy="127" r="12"/><circle cx="279" cy="125" r="12"/><circle cx="305" cy="128" r="12"/><circle cx="331" cy="124" r="12"/><circle cx="357" cy="127" r="12"/>
    <circle cx="240" cy="103" r="12"/><circle cx="266" cy="101" r="12"/><circle cx="293" cy="104" r="12"/><circle cx="320" cy="100" r="12"/><circle cx="347" cy="104" r="12"/><circle cx="372" cy="108" r="12"/>
  </g>
