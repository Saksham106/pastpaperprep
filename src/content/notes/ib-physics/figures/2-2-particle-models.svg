    <circle cx="440" cy="50" r="12"/><circle cx="530" cy="45" r="12"/><circle cx="480" cy="100" r="12"/>
    <circle cx="555" cy="120" r="12"/><circle cx="435" cy="140" r="12"/><circle cx="510" cy="150" r="12"/>
  </g>
  <defs>
