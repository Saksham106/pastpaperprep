<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" role="img" aria-labelledby="t">
<title id="t">Graph of displacement x against time t for an oscillation. The curve is a smooth wave that starts at its highest point, x0, falls through zero to its lowest point, minus x0, and rises back to x0, then repeats once more. The horizontal time axis is the line x = 0, labelled equilibrium. A vertical double arrow from the axis up to a crest is labelled amplitude x0. A horizontal double arrow from one crest to the next is labelled period T.</title>
