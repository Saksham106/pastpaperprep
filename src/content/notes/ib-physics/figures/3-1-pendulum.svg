<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="t">
<title id="t">A simple pendulum: a bob hangs from a fixed pivot on a string of length l. The bob has been pulled to the right so the string makes an angle theta with the dashed vertical line, which marks the equilibrium position. A dashed arc shows the path of the bob. Two forces act on the bob: the tension along the string towards the pivot, and weight mg straight down. A dashed arrow at the bob, along the arc and pointing back towards the equilibrium position, is the component of the weight mg sin theta, the restoring force.</title>
