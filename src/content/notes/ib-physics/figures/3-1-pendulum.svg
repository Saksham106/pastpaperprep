<text font-family="inherit" font-size="11" x="200" y="266" fill="var(--muted)" text-anchor="middle">equilibrium position</text>
<path d="M115.5 211.3 A200 200 0 0 0 284.5 211.3" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4"/>
<path d="M200 30 L284.5 211.3" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text font-family="inherit" font-size="12" x="250" y="118" fill="currentColor" text-anchor="start">l</text>
<path d="M200 70 A40 40 0 0 0 216.9 66.3" fill="none" stroke="currentColor" stroke-width="1"/>
<text font-family="inherit" font-size="12" x="209" y="86" fill="currentColor" text-anchor="middle">θ</text>
<path d="M284.5 211.3 L257.9 154.2" fill="none" stroke="var(--t3-ink)" stroke-width="2.2"/>
<polygon points="254.1,146.0 254.3,155.9 261.5,152.5" fill="var(--t3-ink)"/>
<text font-family="inherit" font-size="12" x="250" y="156" fill="var(--t3-ink)" text-anchor="end">tension</text>
<path d="M284.5 211.3 L284.5 282" fill="none" stroke="var(--t1-ink)" stroke-width="2.2"/>
<polygon points="284.5,291 280,282 289,282" fill="var(--t1-ink)"/>
<text font-family="inherit" font-size="12" x="292" y="288" fill="var(--t1-ink)" text-anchor="start">weight mg</text>
<path d="M284.5 211.3 L261.7 221.9" fill="none" stroke="var(--t2-ink)" stroke-width="2" stroke-dasharray="4 3"/>
