<text font-family="inherit" font-size="12" x="209.77150840510865" y="137.40918182633925" fill="var(--t3-ink)" text-anchor="start">tension T</text>
<path d="M150.0 170.0 L105.2 170.0" fill="none" stroke="var(--t4-ink)" stroke-width="2.2"/>
