<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 345" role="img" aria-labelledby="t">
<title id="t">Free-body diagram of a box being dragged to the right across a rough floor by a rope. The box is drawn as a dot. Four labelled arrows start at the dot: weight W, the longest, pointing vertically down; normal force F N pointing vertically up, a little shorter than the weight; tension T pointing up and to the right along the rope, at 28 degrees above a dashed horizontal line; and friction F f pointing horizontally to the left, opposite to the motion. An arrow above the diagram shows the direction of motion to the right. Arrow lengths are roughly to scale.</title>
<path d="M150.0 170.0 L150.0 45.4" fill="none" stroke="var(--t2-ink)" stroke-width="2.2"/>
