<text font-family="inherit" font-size="12" x="158" y="50.44" fill="var(--t2-ink)" text-anchor="start">normal force F<tspan baseline-shift="sub" font-size="9">N</tspan></text>
<path d="M150.0 170.0 L150.0 323.1" fill="none" stroke="var(--t1-ink)" stroke-width="2.2"/>
<polygon points="150.0,332.1 145.5,323.1 154.5,323.1" fill="var(--t1-ink)"/>
<text font-family="inherit" font-size="12" x="158" y="326.12" fill="var(--t1-ink)" text-anchor="start">weight W</text>
<path d="M150 170 H245" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>
