    <marker id="m58dt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/></marker>
  </defs>
  <circle cx="120" cy="140" r="9" fill="var(--t4-ink)"/>
  <g stroke="var(--t1-ink)" stroke-width="1.6" fill="none" marker-end="url(#m58dt-a)"><line x1="133.9" y1="141.4" x2="189.7" y2="147.0"/><line x1="132.3" y1="146.6" x2="181.7" y2="173.1"/><line x1="128.9" y1="150.8" x2="164.3" y2="194.2"/><line x1="124.0" y1="153.4" x2="140.2" y2="207.0"/><line x1="118.6" y1="153.9" x2="113.0" y2="209.7"/><line x1="113.4" y1="152.3" x2="86.9" y2="201.7"/><line x1="109.2" y1="148.9" x2="65.8" y2="184.3"/><line x1="106.6" y1="144.0" x2="53.0" y2="160.2"/><line x1="106.1" y1="138.6" x2="50.3" y2="133.0"/><line x1="107.7" y1="133.4" x2="58.3" y2="106.9"/><line x1="111.1" y1="129.2" x2="75.7" y2="85.8"/><line x1="116.0" y1="126.6" x2="99.8" y2="73.0"/><line x1="121.4" y1="126.1" x2="127.0" y2="70.3"/><line x1="126.6" y1="127.7" x2="153.1" y2="78.3"/><line x1="130.8" y1="131.1" x2="174.2" y2="95.7"/><line x1="133.4" y1="136.0" x2="187.0" y2="119.8"/></g>
  <g stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <line x1="120" y1="140" x2="330" y2="122"/>
