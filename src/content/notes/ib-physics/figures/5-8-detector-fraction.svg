<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-labelledby="t58dt">
  <title id="t58dt">A small radioactive source on the left sends radiation out in all directions, shown by sixteen short arrows pointing every way. A Geiger-Muller tube on the right points at the source. Two faint lines from the source to the edges of the tube's window mark a narrow cone: only radiation inside this cone can enter the tube. The tube is wired to a counter.</title>
