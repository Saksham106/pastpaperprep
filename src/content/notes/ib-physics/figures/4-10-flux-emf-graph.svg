<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 385" role="img" aria-labelledby="t410fe">
  <title id="t410fe">Two graphs against time for one turn of a coil in a uniform field. Top: flux linkage is a cosine curve, largest at time 0, zero at a quarter period, most negative at half a period, zero at three quarters and largest again after one period. Bottom: emf is a sine curve, zero at time 0, largest at a quarter period, zero at half a period, most negative at three quarters, zero after one period. Small drawings above show the coil edge-on: across the field at 0, half and one period; along the field at a quarter and three quarters.</title>
