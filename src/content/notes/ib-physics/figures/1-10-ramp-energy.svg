<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="inherit" font-size="13" fill="currentColor" role="img" aria-labelledby="t110re">
  <title id="t110re">A frictionless skate ramp. A skateboarder starts at rest at point A, 3.2 metres above the lowest point B. The track then rises to point C, 1.6 metres above B. Bar charts below show the energy at each point, taking B as the zero of gravitational potential energy. At A all the mechanical energy is gravitational potential energy. At B it is all kinetic energy. At C it is half of each. The total is the same at all three points.</title>
  <defs>
    <marker id="m110re" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <path d="M60 230 L500 230" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M50 70 L90 70 C170 70 210 230 280 230 C340 230 380 150 440 150 L480 150" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="90" cy="70" r="5" fill="var(--t2-ink)"/>
  <circle cx="280" cy="230" r="5" fill="var(--t2-ink)"/>
  <circle cx="440" cy="150" r="5" fill="var(--t2-ink)"/>
  <text x="90" y="56" text-anchor="middle" font-weight="bold">A (at rest)</text>
  <text x="280" y="252" text-anchor="middle" font-weight="bold">B</text>
  <text x="440" y="136" text-anchor="middle" font-weight="bold">C</text>
  <line x1="30" y1="74" x2="30" y2="226" stroke="var(--muted)" stroke-width="1.4" marker-start="url(#m110re)" marker-end="url(#m110re)"/>
  <path d="M30 70 L50 70" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="36" y="155" text-anchor="start" fill="var(--muted)">3.2 m</text>
  <line x1="505" y1="154" x2="505" y2="226" stroke="var(--muted)" stroke-width="1.4" marker-start="url(#m110re)" marker-end="url(#m110re)"/>
  <path d="M480 150 L510 150" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="499" y="195" text-anchor="end" fill="var(--muted)">1.6 m</text>
  <path d="M40 370 L520 370" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="98" y="290" width="22" height="80" fill="var(--t4-ink)" fill-opacity="0.75"/>
  <text x="109" y="285" text-anchor="middle">A</text>
  <rect x="258" y="290" width="22" height="80" fill="var(--t1-ink)" fill-opacity="0.75"/>
  <text x="269" y="285" text-anchor="middle">B</text>
  <rect x="418" y="330" width="22" height="40" fill="var(--t1-ink)" fill-opacity="0.75"/>
  <rect x="446" y="330" width="22" height="40" fill="var(--t4-ink)" fill-opacity="0.75"/>
  <text x="443" y="285" text-anchor="middle">C</text>
  <text x="40" y="285" text-anchor="start" fill="var(--muted)">energy</text>
  <rect x="150" y="381" width="12" height="12" fill="var(--t1-ink)" fill-opacity="0.75"/>
  <text x="168" y="392" text-anchor="start">kinetic energy</text>
  <rect x="290" y="381" width="12" height="12" fill="var(--t4-ink)" fill-opacity="0.75"/>
  <text x="308" y="392" text-anchor="start">gravitational potential energy</text>
</svg>
