<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="t57nz">
  <title id="t57nz">A grid with proton number Z increasing to the right and neutron number N increasing upwards. A parent nucleus sits at the point Z, N. An arrow for alpha decay goes two squares left and two squares down, to Z minus 2, N minus 2. An arrow for beta-minus decay goes one square right and one square down, to Z plus 1, N minus 1. An arrow for beta-plus decay goes one square left and one square up, to Z minus 1, N plus 1. Gamma decay does not move the nucleus on the grid: it stays at Z, N with less energy.</title>
  <defs><marker id="m57nz-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="m57nz-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/></marker><marker id="m57nz-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t2-ink)"/></marker><marker id="m57nz-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t3-ink)"/></marker></defs>
  <g stroke="var(--muted)" stroke-width="0.8" stroke-dasharray="3 4">
    <line x1="80" y1="40" x2="80" y2="280"/><line x1="130" y1="40" x2="130" y2="280"/><line x1="180" y1="40" x2="180" y2="280"/>
    <line x1="230" y1="40" x2="230" y2="280"/><line x1="280" y1="40" x2="280" y2="280"/><line x1="330" y1="40" x2="330" y2="280"/>
    <line x1="60" y1="60" x2="350" y2="60"/><line x1="60" y1="110" x2="350" y2="110"/><line x1="60" y1="160" x2="350" y2="160"/>
    <line x1="60" y1="210" x2="350" y2="210"/><line x1="60" y1="260" x2="350" y2="260"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#m57nz-k)">
    <line x1="60" y1="290" x2="355" y2="290"/>
    <line x1="60" y1="290" x2="60" y2="30"/>
  </g>
  <g stroke-width="2.2" fill="none">
    <line x1="224" y1="166" x2="136" y2="254" stroke="var(--t1-ink)" marker-end="url(#m57nz-1)"/>
    <line x1="236" y1="166" x2="274" y2="204" stroke="var(--t2-ink)" marker-end="url(#m57nz-2)"/>
    <line x1="224" y1="154" x2="186" y2="116" stroke="var(--t3-ink)" marker-end="url(#m57nz-3)"/>
  </g>
  <circle cx="230" cy="160" r="7" fill="var(--t4-ink)"/>
  <circle cx="130" cy="260" r="5" fill="none" stroke="var(--t1-ink)" stroke-width="1.6"/>
  <circle cx="280" cy="210" r="5" fill="none" stroke="var(--t2-ink)" stroke-width="1.6"/>
  <circle cx="180" cy="110" r="5" fill="none" stroke="var(--t3-ink)" stroke-width="1.6"/>
  <g font-size="12" fill="currentColor">
    <text x="130" y="306" text-anchor="middle">Z − 2</text><text x="180" y="306" text-anchor="middle">Z − 1</text>
    <text x="230" y="306" text-anchor="middle">Z</text><text x="280" y="306" text-anchor="middle">Z + 1</text>
    <text x="52" y="64" text-anchor="end">N + 2</text><text x="52" y="114" text-anchor="end">N + 1</text>
    <text x="52" y="164" text-anchor="end">N</text><text x="52" y="214" text-anchor="end">N − 1</text><text x="52" y="264" text-anchor="end">N − 2</text>
    <text x="355" y="322" text-anchor="end">proton number Z</text>
    <text x="14" y="24">neutron number N</text>
    <text x="244" y="152">parent</text>
    <text x="150" y="222" fill="var(--t1-ink)">α</text>
    <text x="262" y="182" fill="var(--t2-ink)">β−</text>
    <text x="190" y="146" fill="var(--t3-ink)">β+</text>
  </g>
  <g font-size="12" fill="currentColor">
    <text x="380" y="70" fill="var(--t1-ink)">α: Z − 2, N − 2, A − 4</text>
    <text x="380" y="110" fill="var(--t2-ink)">β−: Z + 1, N − 1, A same</text>
    <text x="380" y="150" fill="var(--t3-ink)">β+: Z − 1, N + 1, A same</text>
    <text x="380" y="190">γ: no move; Z, N, A same,</text>
    <text x="380" y="206">nucleus loses energy</text>
  </g>
</svg>
