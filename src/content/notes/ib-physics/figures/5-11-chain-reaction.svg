  <g font-size="12" fill="currentColor">
    <text x="150" y="76" text-anchor="middle" fill="var(--t5-ink)">absorbed</text>
    <text x="48" y="196" text-anchor="middle">1</text><text x="118" y="196" text-anchor="middle">1</text><text x="188" y="196" text-anchor="middle">1</text><text x="258" y="196" text-anchor="middle">1</text>
