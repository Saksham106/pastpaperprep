  <title id="t55cg">Compton scattering. An incident photon, drawn as a wavy arrow with a short wavelength, travels from the left towards an electron at rest. A dashed line continues the original direction to the right. The scattered photon leaves up and to the right at angle theta to the dashed line, drawn with a longer wavelength. The electron recoils down and to the right. Not to scale.</title>
