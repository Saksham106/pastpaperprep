<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="t62cv">
  <title id="t62cv">Left: a puck's velocities. The initial velocity, 6.0 metres per second east, is a long arrow pointing right. The final velocity, 2.5 metres per second north, is a shorter arrow pointing up. Right: the subtraction drawn head to tail. The final velocity arrow points up. From its head, the negative of the initial velocity, 6.0 metres per second, points left. The change in velocity runs from the tail of the final velocity to the head of the reversed initial velocity, pointing up and to the left, that is north of west, with magnitude 6.5 metres per second.</title>
  <defs>
    <marker id="m62cv-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/>
    </marker>
    <marker id="m62cv-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t3-ink)"/>
    </marker>
    <marker id="m62cv-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t2-ink)"/>
    </marker>
  </defs>

  <text x="115" y="26" font-size="12" fill="var(--muted)" font-family="inherit" text-anchor="middle">velocities</text>
  <line x1="25" y1="80" x2="205" y2="80" stroke="var(--t1-ink)" stroke-width="2.4" marker-end="url(#m62cv-1)"/>
  <text x="115" y="104" font-size="12" fill="var(--t1-ink)" font-family="inherit" text-anchor="middle">initial: 6.0 m s⁻¹ east</text>
  <line x1="115" y1="250" x2="115" y2="175" stroke="var(--t3-ink)" stroke-width="2.4" marker-end="url(#m62cv-3)"/>
  <text x="125" y="208" font-size="12" fill="var(--t3-ink)" font-family="inherit">final:</text>
  <text x="125" y="224" font-size="12" fill="var(--t3-ink)" font-family="inherit">2.5 m s⁻¹ north</text>

  <line x1="240" y1="20" x2="240" y2="270" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="360" y="26" font-size="12" fill="var(--muted)" font-family="inherit" text-anchor="middle">final + (− initial)</text>
  <line x1="450" y1="250" x2="450" y2="175" stroke="var(--t3-ink)" stroke-width="2.4" marker-end="url(#m62cv-3)"/>
  <text x="456" y="218" font-size="12" fill="var(--t3-ink)" font-family="inherit">2.5</text>
  <line x1="450" y1="175" x2="270" y2="175" stroke="var(--t1-ink)" stroke-width="2.4" stroke-dasharray="7 4" marker-end="url(#m62cv-1)"/>
  <text x="360" y="165" font-size="12" fill="var(--t1-ink)" font-family="inherit" text-anchor="middle">− initial: 6.0 west</text>
  <line x1="450" y1="250" x2="270" y2="175" stroke="var(--t2-ink)" stroke-width="2.6" marker-end="url(#m62cv-2)"/>
  <text x="352" y="238" font-size="13" fill="var(--t2-ink)" font-family="inherit" text-anchor="middle">Δv = 6.5 m s⁻¹</text>

  <text x="20" y="282" font-size="11" fill="var(--muted)" font-family="inherit">north is up the page, east is to the right</text>
</svg>
