<text font-family="inherit" font-size="12" x="167" y="274" fill="var(--t2-ink)" text-anchor="middle">rear sensor: reached first</text>
<text font-family="inherit" font-size="12" x="453" y="274" fill="var(--t2-ink)" text-anchor="end">front sensor: not reached yet</text>
