<rect x="110" y="200" width="300" height="56" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="160" y="200" width="300" height="56" fill="none" stroke="currentColor" stroke-width="1.6"/>
<rect x="162" y="218" width="10" height="20" fill="var(--t2-ink)"/>
<rect x="448" y="218" width="10" height="20" fill="var(--t2-ink)"/>
<path d="M254 222 L266 234 M266 222 L254 234" stroke="var(--t3-ink)" stroke-width="2"/>
<path d="M252 228 H183" fill="none" stroke="var(--t1-ink)" stroke-width="1.8"/>
<polygon points="174,228 183,223.5 183,232.5" fill="var(--t1-ink)"/>
<path d="M268 228 H337" fill="none" stroke="var(--t1-ink)" stroke-width="1.8"/>
<polygon points="346,228 337,223.5 337,232.5" fill="var(--t1-ink)"/>
