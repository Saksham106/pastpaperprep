<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="t45mw">
<title id="t45mw">Left: field lines around a bar magnet, north pole on the right and south pole on the left. The lines leave the north pole, curve round outside the magnet and enter the south pole. They are crowded near the poles and spread out further away. Right: a straight wire seen end on, drawn as a circle with a dot because the current flows out of the page. The field lines are circles centred on the wire, with arrows going anticlockwise. The gaps between neighbouring circles get bigger further from the wire.</title>
