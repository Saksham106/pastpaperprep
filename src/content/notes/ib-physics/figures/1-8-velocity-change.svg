<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" role="img" aria-labelledby="t">
<title id="t">A body moves clockwise round a circle at constant speed. At point A, at the top of the circle, the velocity v A is drawn along the tangent, pointing right. At point B, 60 degrees further round, its velocity arrow v B is the same length but points along the new tangent, down and to the right. Dashed radii join A and B to the centre. Halfway between A and B an arrow labelled a points from the body towards the centre of the circle. To the right, a vector diagram draws v A and v B from the same point; the arrow from the tip of v A to the tip of v B is the change in velocity, delta v, and it points in the same direction as the arrow towards the centre.</title>
<circle cx="150" cy="150" r="100" fill="none" stroke="currentColor" stroke-width="1.4"/>
<circle cx="150" cy="150" r="3" fill="var(--muted)"/>
<text font-family="inherit" font-size="11" x="150.0" y="168.0" fill="var(--muted)" text-anchor="middle">centre</text>
<path d="M150 150 L150.0 50.0" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M150 150 L236.6 100.0" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M150.0 50.0 L203.0 50.0" fill="none" stroke="var(--t2-ink)" stroke-width="2.2"/>
<polygon points="212.0,50.0 203.0,54.5 203.0,45.5" fill="var(--t2-ink)"/>
<circle cx="150.0" cy="50.0" r="5" fill="currentColor"/>
<path d="M236.6 100.0 L263.1 145.9" fill="none" stroke="var(--t2-ink)" stroke-width="2.2"/>
<polygon points="267.6,153.7 259.2,148.1 267.0,143.6" fill="var(--t2-ink)"/>
<circle cx="236.6" cy="100.0" r="5" fill="currentColor"/>
<text font-family="inherit" font-size="12" x="144.0" y="40.0" fill="currentColor" text-anchor="end">A</text>
<text font-family="inherit" font-size="12" x="216.0" y="54.0" fill="var(--t2-ink)" text-anchor="start">v<tspan baseline-shift="sub" font-size="9">A</tspan></text>
<text font-family="inherit" font-size="12" x="248.6" y="98.0" fill="currentColor" text-anchor="start">B</text>
<text font-family="inherit" font-size="12" x="274.6" y="160.0" fill="var(--t2-ink)" text-anchor="start">v<tspan baseline-shift="sub" font-size="9">B</tspan></text>
<path d="M200.0 63.4 L182.5 93.7" fill="none" stroke="var(--t1-ink)" stroke-width="2.2"/>
<polygon points="178.0,101.5 178.6,91.5 186.4,96.0" fill="var(--t1-ink)"/>
<text font-family="inherit" font-size="12" x="170.0" y="93.4" fill="var(--t1-ink)" text-anchor="end">a</text>
<text font-family="inherit" font-size="11" x="150.0" y="20.0" fill="var(--muted)" text-anchor="middle">clockwise at constant speed</text>
<path d="M320.0 90.0 L373.0 90.0" fill="none" stroke="var(--t2-ink)" stroke-width="2.2"/>
<polygon points="382.0,90.0 373.0,94.5 373.0,85.5" fill="var(--t2-ink)"/>
<path d="M320.0 90.0 L346.5 135.9" fill="none" stroke="var(--t2-ink)" stroke-width="2.2"/>
<polygon points="351.0,143.7 342.6,138.1 350.4,133.6" fill="var(--t2-ink)"/>
<path d="M382.0 90.0 L355.5 135.9" fill="none" stroke="var(--t1-ink)" stroke-width="2.2"/>
<polygon points="351.0,143.7 351.6,133.6 359.4,138.1" fill="var(--t1-ink)"/>
<text font-family="inherit" font-size="12" x="388.0" y="84.0" fill="var(--t2-ink)" text-anchor="start">v<tspan baseline-shift="sub" font-size="9">A</tspan></text>
<text font-family="inherit" font-size="12" x="343.0" y="157.7" fill="var(--t2-ink)" text-anchor="end">v<tspan baseline-shift="sub" font-size="9">B</tspan></text>
<text font-family="inherit" font-size="12" x="376.5" y="120.8" fill="var(--t1-ink)" text-anchor="start">Δv</text>
<text font-family="inherit" font-size="11" x="350.0" y="68.0" fill="var(--muted)" text-anchor="middle">change in velocity</text>
<text font-family="inherit" font-size="11" x="350.0" y="215.0" fill="var(--muted)" text-anchor="middle">Δv = v<tspan baseline-shift="sub" font-size="9">B</tspan> − v<tspan baseline-shift="sub" font-size="9">A</tspan> points</text>
<text font-family="inherit" font-size="11" x="350.0" y="230.0" fill="var(--muted)" text-anchor="middle">towards the centre</text>
</svg>
