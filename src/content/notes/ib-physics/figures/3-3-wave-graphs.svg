<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-labelledby="t">
  <title id="t">Two graphs side by side. Left: displacement against position x for a wave at one instant. A sine-shaped curve; the horizontal distance from one crest to the next is labelled wavelength, lambda, and the distance from the zero line down to a trough is labelled amplitude, A. Right: displacement against time t for one particle of the medium. A sine-shaped curve of the same height; the time from one peak to the next is labelled period, T, and the distance from the zero line down to a trough is again labelled amplitude, A.</title>
