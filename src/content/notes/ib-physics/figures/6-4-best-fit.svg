  <line x1="68.0" y1="221.8" x2="452.0" y2="68.2" stroke="var(--t1-ink)" stroke-width="2.2"/>
  <g font-size="12" fill="currentColor">
    <text x="68" y="24" fill="var(--muted)">y / unit</text>
    <text x="480" y="270" text-anchor="end" fill="var(--muted)">x / unit</text>
    <text x="324.0" y="69.0" text-anchor="end" fill="var(--t3-ink)">anomalous: check it,</text>
    <text x="324.0" y="84.0" text-anchor="end" fill="var(--t3-ink)">then leave it out</text>
    <text x="386.0" y="126.2" fill="var(--t1-ink)">line of best fit</text>
