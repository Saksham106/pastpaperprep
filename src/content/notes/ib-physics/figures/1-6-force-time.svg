<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 285" role="img" aria-labelledby="t16ft">
  <title id="t16ft">Graph of force in newtons against time in milliseconds for a push on a trolley. The force rises in a straight line from 0 at time 0 to 36 newtons at 50 milliseconds, stays at 36 newtons until 150 milliseconds, then falls in a straight line to 0 at 200 milliseconds. The area under the line is shaded and split into a left triangle of area 0.90 newton seconds, a middle rectangle of area 3.6 newton seconds and a right triangle of area 0.90 newton seconds.</title>
  <defs>
    <marker id="m16ft-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <polygon points="70,230 150,86 150,230" fill="var(--t2-ink)" fill-opacity="0.18" stroke="none"/>
  <rect x="150" y="86" width="160" height="144" fill="var(--t1-ink)" fill-opacity="0.15" stroke="none"/>
  <polygon points="310,86 390,230 310,230" fill="var(--t2-ink)" fill-opacity="0.18" stroke="none"/>
  <g stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <line x1="70" y1="86" x2="150" y2="86"/>
    <line x1="150" y1="86" x2="150" y2="230"/>
    <line x1="310" y1="86" x2="310" y2="230"/>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="70" y1="230" x2="70" y2="30" marker-end="url(#m16ft-head)"/>
    <line x1="70" y1="230" x2="420" y2="230" marker-end="url(#m16ft-head)"/>
    <line x1="150" y1="230" x2="150" y2="235"/>
    <line x1="230" y1="230" x2="230" y2="235"/>
    <line x1="310" y1="230" x2="310" y2="235"/>
    <line x1="390" y1="230" x2="390" y2="235"/>
    <line x1="65" y1="86" x2="70" y2="86"/>
  </g>
  <polyline points="70,230 150,86 310,86 390,230" fill="none" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <g font-family="inherit" font-size="12" fill="currentColor">
    <text x="24" y="130" text-anchor="middle" transform="rotate(-90 24 130)">force F / N</text>
    <text x="420" y="270" text-anchor="end">time t / ms</text>
    <text x="64" y="244" text-anchor="end">0</text>
    <text x="150" y="249" text-anchor="middle">50</text>
    <text x="230" y="249" text-anchor="middle">100</text>
    <text x="310" y="249" text-anchor="middle">150</text>
    <text x="390" y="249" text-anchor="middle">200</text>
    <text x="61" y="90" text-anchor="end">36</text>
  </g>
  <g font-family="inherit" font-size="11">
    <text x="120" y="218" text-anchor="middle" fill="var(--t2-ink)">0.90 N s</text>
    <text x="230" y="164" text-anchor="middle" fill="var(--t1-ink)">3.6 N s</text>
    <text x="340" y="218" text-anchor="middle" fill="var(--t2-ink)">0.90 N s</text>
  </g>
</svg>
