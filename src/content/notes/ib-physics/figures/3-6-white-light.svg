<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 182" role="img" aria-labelledby="t">
  <title id="t">A strip of screen showing the pattern from white light through a diffraction grating. At the centre is a narrow white maximum labelled n equals 0. On each side is a first-order spectrum, n equals 1, with its violet end nearer the centre and its red end further out. Further out on each side is a second-order spectrum, n equals 2, again violet nearest the centre and red outermost, spread over a wider distance than the first order.</title>
  <rect x="30" y="70" width="480" height="40" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="265" y="70" width="10" height="40" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="270" y="60" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">n = 0: white</text>
  <rect x="306.98001308168193" y="70" width="30.144849126271822" height="40" fill="var(--t3-ink)" fill-opacity="0.35"/>
  <text x="322.0524376448178" y="60" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">n = 1</text>
  <text x="306.98001308168193" y="126" font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">V</text>
  <text x="337.12486220795375" y="140" font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">R</text>
  <rect x="348.07200583588263" y="70" width="86.91957644097846" height="40" fill="var(--t3-ink)" fill-opacity="0.35"/>
  <text x="391.53179405637184" y="60" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">n = 2</text>
  <text x="348.07200583588263" y="126" font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">V</text>
  <text x="434.9915822768611" y="140" font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">R</text>
  <rect x="202.87513779204625" y="70" width="30.144849126271822" height="40" fill="var(--t3-ink)" fill-opacity="0.35"/>
  <text x="217.94756235518216" y="60" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">n = 1</text>
  <text x="233.01998691831807" y="126" font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">V</text>
  <text x="202.87513779204625" y="140" font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">R</text>
  <rect x="105.0084177231389" y="70" width="86.91957644097846" height="40" fill="var(--t3-ink)" fill-opacity="0.35"/>
  <text x="148.46820594362813" y="60" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">n = 2</text>
  <text x="191.92799416411737" y="126" font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">V</text>
  <text x="105.0084177231389" y="140" font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">R</text>
  <text x="270" y="168" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">V = violet end, R = red end of each spectrum</text>
</svg>
