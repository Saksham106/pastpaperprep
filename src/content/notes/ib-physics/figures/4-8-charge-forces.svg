<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="t48cf">
  <title id="t48cf">Two panels in a uniform magnetic field into the page. Left: a positive charge moves to the right and the magnetic force on it points up the page. Right: an electron moves to the right and the magnetic force on it points down the page, the opposite way.</title>
  <defs>
    <marker id="m48cf-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t5-ink)"/>
    </marker>
    <marker id="m48cf-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t3-ink)"/>
    </marker>
  </defs>

  <!-- panels -->
  <g stroke="var(--muted)" stroke-width="1.2" fill="none" stroke-dasharray="5 4">
    <rect x="20" y="20" width="270" height="200"/>
    <rect x="310" y="20" width="270" height="200"/>
  </g>

  <!-- field into the page -->
  <g font-size="16" fill="var(--muted)" text-anchor="middle" font-family="inherit">
    <text x="55" y="55">×</text><text x="115" y="55">×</text><text x="235" y="55">×</text>
    <text x="55" y="125">×</text><text x="255" y="125">×</text>
    <text x="55" y="195">×</text><text x="115" y="195">×</text><text x="175" y="195">×</text><text x="235" y="195">×</text>
    <text x="345" y="55">×</text><text x="525" y="55">×</text><text x="555" y="55">×</text>
    <text x="345" y="125">×</text><text x="545" y="125">×</text>
    <text x="345" y="195">×</text><text x="405" y="195">×</text><text x="525" y="195">×</text>
  </g>

  <!-- left: positive charge -->
  <circle cx="130" cy="120" r="11" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="130" y="125" text-anchor="middle" font-size="16" fill="currentColor" font-family="inherit">+</text>
  <line x1="144" y1="120" x2="214" y2="120" stroke="var(--t5-ink)" stroke-width="2.5" marker-end="url(#m48cf-v)"/>
  <line x1="130" y1="106" x2="130" y2="46" stroke="var(--t3-ink)" stroke-width="2.5" marker-end="url(#m48cf-f)"/>

  <!-- right: electron -->
  <circle cx="420" cy="120" r="11" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="420" y="125" text-anchor="middle" font-size="16" fill="currentColor" font-family="inherit">−</text>
  <line x1="434" y1="120" x2="504" y2="120" stroke="var(--t5-ink)" stroke-width="2.5" marker-end="url(#m48cf-v)"/>
  <line x1="420" y1="134" x2="420" y2="194" stroke="var(--t3-ink)" stroke-width="2.5" marker-end="url(#m48cf-f)"/>

  <g font-size="14" fill="currentColor" font-family="inherit">
    <text x="222" y="125" font-style="italic" fill="var(--t5-ink)">v</text>
    <text x="140" y="62" font-style="italic" fill="var(--t3-ink)">F</text>
    <text x="512" y="125" font-style="italic" fill="var(--t5-ink)">v</text>
    <text x="430" y="186" font-style="italic" fill="var(--t3-ink)">F</text>
    <text x="155" y="245" text-anchor="middle">Positive charge: force up</text>
    <text x="445" y="245" text-anchor="middle">Electron: force down</text>
  </g>
  <text x="300" y="14" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="inherit"><tspan font-style="italic">B</tspan> into the page (×)</text>
</svg>
