  <g font-size="12" fill="currentColor" font-family="inherit">
    <text x="38" y="36" text-anchor="end" font-style="italic">V</text>
    <text x="292" y="228" font-style="italic">r</text>
    <text x="110" y="226" text-anchor="middle" font-style="italic">R</text>
    <text x="50" y="226" text-anchor="middle">0</text>
    <text x="44" y="64" text-anchor="end">kQ/R</text>
    <text x="80" y="52" text-anchor="middle" font-size="11" fill="var(--muted)">inside</text>
    <text x="190" y="140" font-size="11" fill="var(--muted)">kQ/r</text>
    <text x="170" y="250" text-anchor="middle">potential V</text>
    <text x="338" y="36" text-anchor="end" font-style="italic">E</text>
    <text x="592" y="228" font-style="italic">r</text>
    <text x="410" y="226" text-anchor="middle" font-style="italic">R</text>
