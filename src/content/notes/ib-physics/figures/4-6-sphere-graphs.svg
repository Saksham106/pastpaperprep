<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="t46sp">
  <title id="t46sp">Two graphs for a positively charged conducting sphere of radius R, solid or hollow, against distance r from its centre. Left: electric potential V. From the centre out to r equals R the line is horizontal at the value k Q over R, so the potential is constant inside. Beyond R it falls along the curve k Q over r, approaching zero far away. Right: electric field strength E. It is zero from the centre out to R, jumps to k Q over R squared at the surface, then falls along the curve k Q over r squared, approaching zero. The flat potential inside goes with the zero field inside.</title>
  <defs>
    <marker id="m46sp-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.3" fill="none">
    <line x1="50" y1="210" x2="290" y2="210" marker-end="url(#m46sp-ax)"/>
    <line x1="50" y1="210" x2="50" y2="30" marker-end="url(#m46sp-ax)"/>
    <line x1="350" y1="210" x2="590" y2="210" marker-end="url(#m46sp-ax)"/>
    <line x1="350" y1="210" x2="350" y2="30" marker-end="url(#m46sp-ax)"/>
  </g>
  <g stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <line x1="110" y1="60" x2="110" y2="210"/>
    <line x1="410" y1="60" x2="410" y2="210"/>
    <line x1="350" y1="60" x2="410" y2="60"/>
  </g>
