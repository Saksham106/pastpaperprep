<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" role="img" aria-labelledby="t">
  <title id="t">Graph of intensity against angle for a double slit whose slit separation d is four times the slit width b. Narrow, evenly spaced interference fringes, lambda over d apart, sit under a dashed single-slit envelope. The fringes are brightest at the centre and get dimmer outwards, following the envelope. The envelope falls to zero at plus and minus lambda over b, so the fringe that would be there is missing, leaving seven bright fringes inside the central maximum of the envelope. Dimmer groups of fringes lie between lambda over b and 2 lambda over b on each side.</title>
  <path d="M40 210 H510" stroke="currentColor" stroke-width="1.4"/>
  <path d="M270.0 210.0 L270.0 31.0" fill="none" stroke="currentColor" stroke-width="1.2"/><polygon points="270.0,25.0 273.0,31.0 267.0,31.0" fill="currentColor"/>
