<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-labelledby="t64log">
  <title id="t64log">A logarithmic axis of frequency in hertz with major marks at 1, 10, 100, 1000 and 10 000, equally spaced. Each gap is labelled times 10. Between the major marks, minor marks for 2 to 9 crowd closer together towards the next power of ten. A marker halfway between 100 and 1000 reads 316, not 550. A second marker 0.70 of the way from 100 to 1000 reads about 500.</title>
  <defs>
    <marker id="m64log-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <line x1="40" y1="95" x2="540" y2="95" stroke="currentColor" stroke-width="1.2" marker-end="url(#m64log-head)"/>
  <g stroke="currentColor" stroke-width="1.2"><line x1="40.0" y1="85" x2="40.0" y2="105"/><line x1="76.1" y1="90" x2="76.1" y2="100"/><line x1="97.3" y1="90" x2="97.3" y2="100"/><line x1="112.2" y1="90" x2="112.2" y2="100"/><line x1="123.9" y1="90" x2="123.9" y2="100"/><line x1="133.4" y1="90" x2="133.4" y2="100"/><line x1="141.4" y1="90" x2="141.4" y2="100"/><line x1="148.4" y1="90" x2="148.4" y2="100"/><line x1="154.5" y1="90" x2="154.5" y2="100"/><line x1="160.0" y1="85" x2="160.0" y2="105"/><line x1="196.1" y1="90" x2="196.1" y2="100"/><line x1="217.3" y1="90" x2="217.3" y2="100"/><line x1="232.2" y1="90" x2="232.2" y2="100"/><line x1="243.9" y1="90" x2="243.9" y2="100"/><line x1="253.4" y1="90" x2="253.4" y2="100"/><line x1="261.4" y1="90" x2="261.4" y2="100"/><line x1="268.4" y1="90" x2="268.4" y2="100"/><line x1="274.5" y1="90" x2="274.5" y2="100"/><line x1="280.0" y1="85" x2="280.0" y2="105"/><line x1="316.1" y1="90" x2="316.1" y2="100"/><line x1="337.3" y1="90" x2="337.3" y2="100"/><line x1="352.2" y1="90" x2="352.2" y2="100"/><line x1="363.9" y1="90" x2="363.9" y2="100"/><line x1="373.4" y1="90" x2="373.4" y2="100"/><line x1="381.4" y1="90" x2="381.4" y2="100"/><line x1="388.4" y1="90" x2="388.4" y2="100"/><line x1="394.5" y1="90" x2="394.5" y2="100"/><line x1="400.0" y1="85" x2="400.0" y2="105"/><line x1="436.1" y1="90" x2="436.1" y2="100"/><line x1="457.3" y1="90" x2="457.3" y2="100"/><line x1="472.2" y1="90" x2="472.2" y2="100"/><line x1="483.9" y1="90" x2="483.9" y2="100"/><line x1="493.4" y1="90" x2="493.4" y2="100"/><line x1="501.4" y1="90" x2="501.4" y2="100"/><line x1="508.4" y1="90" x2="508.4" y2="100"/><line x1="514.5" y1="90" x2="514.5" y2="100"/><line x1="520.0" y1="85" x2="520.0" y2="105"/></g>
  <g font-size="12" fill="currentColor"><text x="40.0" y="121" text-anchor="middle">1</text><text x="160.0" y="121" text-anchor="middle">10</text><text x="280.0" y="121" text-anchor="middle">100</text><text x="400.0" y="121" text-anchor="middle">1000</text><text x="520.0" y="121" text-anchor="middle">10 000</text><text x="64.0" y="73" text-anchor="middle" fill="var(--muted)">× 10</text><text x="184.0" y="73" text-anchor="middle" fill="var(--muted)">× 10</text><text x="304.0" y="73" text-anchor="middle" fill="var(--muted)">× 10</text><text x="424.0" y="73" text-anchor="middle" fill="var(--muted)">× 10</text><text x="540" y="141" text-anchor="end" fill="var(--muted)">f / Hz</text><text x="336.0" y="45" text-anchor="end" fill="var(--t2-ink)">halfway: 316, not 550</text><text x="368.0" y="157" fill="var(--t1-ink)">0.70 of a decade: 10<tspan baseline-shift="super" font-size="9">2.70</tspan> ≈ 500</text></g>
  <line x1="340.0" y1="51" x2="340.0" y2="81" stroke="var(--t2-ink)" stroke-width="1.5" marker-end="url(#m64log-head)"/>
  <line x1="364.0" y1="145" x2="364.0" y2="109" stroke="var(--t1-ink)" stroke-width="1.5" marker-end="url(#m64log-head)"/>
</svg>
