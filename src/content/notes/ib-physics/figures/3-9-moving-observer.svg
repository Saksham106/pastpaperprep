<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" role="img" aria-labelledby="t">
  <title id="t">Wavefront diagram for a stationary source on the left. The wavefronts are concentric circles centred on the source, all the same distance apart; one gap is marked lambda, and a note says the spacing is one wavelength everywhere. An observer to the right has an arrow pointing left, towards the source, labelled observer moving towards source: meets wavefronts more often, so hears a higher frequency.</title>
  <defs><clipPath id="c39o"><rect x="10" y="10" width="500" height="230"/></clipPath></defs>
  <g clip-path="url(#c39o)">
  <circle cx="90" cy="130" r="30" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="60" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="90" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="120" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="150" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="180" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="210" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="240" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="270" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="300" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="330" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="360" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="390" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <circle cx="90" cy="130" r="420" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  </g>
  <circle cx="90" cy="130" r="5" fill="currentColor"/>
  <text x="90" y="152" font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">source at rest</text>
  <path d="M300 130 L330 130" stroke="var(--t3-ink)" stroke-width="3"/>
  <text x="315" y="122" font-size="13" fill="var(--t3-ink)" font-family="inherit" text-anchor="middle" font-style="italic">λ</text>
  <circle cx="420" cy="130" r="5" fill="var(--t1-ink)"/>
  <text x="420" y="116" font-size="12" fill="var(--t1-ink)" font-family="inherit" text-anchor="middle">observer</text>
  <path d="M440 156 L400.0 156.0" fill="none" stroke="var(--t1-ink)" stroke-width="1.8"/><polygon points="392,156 400.0,160.0 400.0,152.0" fill="var(--t1-ink)"/>
  <text x="260" y="262" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">Spacing is one wavelength everywhere: the wavelength does not change.</text>
  <text x="260" y="280" font-size="12" fill="var(--t1-ink)" font-family="inherit" text-anchor="middle">The moving observer meets wavefronts more often, so hears a higher frequency.</text>
</svg>
