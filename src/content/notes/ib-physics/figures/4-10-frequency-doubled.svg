  <title id="t410fd">Graph of emf against time for the same generator at two speeds. The solid sine curve, at rotation frequency f, has peak emf epsilon nought and period T, completing two cycles. The dashed sine curve, at frequency 2f, has peak emf two epsilon nought and period T over 2, completing four cycles in the same time.</title>
