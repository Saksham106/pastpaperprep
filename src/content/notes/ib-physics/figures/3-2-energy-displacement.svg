<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="t32ed">
  <title id="t32ed">Energy E against displacement x, from minus x0 to plus x0. A horizontal straight line at height ET shows the total energy, which is constant. A solid U-shaped parabola shows the potential energy: zero at x equals 0, rising to ET at x equals plus and minus x0. A dashed upside-down parabola shows the kinetic energy: ET at x equals 0, falling to zero at x equals plus and minus x0. The two parabolas cross at half of ET, at x equals plus and minus x0 over root 2.</title>
