<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" role="img" aria-labelledby="t44lu">
<title id="t44lu">Three pairs of small charged spheres, one pair per row. Top row: two positive charges, each with a force arrow pointing away from the other, labelled like charges repel. Middle row: two negative charges, again with arrows pointing away from each other, labelled like charges repel. Bottom row: a positive and a negative charge, with arrows pointing towards each other, labelled unlike charges attract. In every row the two arrows are the same length, because the forces form a Newton's third law pair.</title>
