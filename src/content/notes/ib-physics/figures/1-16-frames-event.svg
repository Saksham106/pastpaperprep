<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 310" role="img" aria-labelledby="t116fe">
  <title id="t116fe">Two panels showing the standard set-up of frames S and S prime. Top panel, at t equals t prime equals zero: the origins O of frame S and O prime of frame S prime are at the same point, and S prime moves at velocity v in the positive x direction. Bottom panel, a later time t in frame S: O prime has moved a distance v t along the x axis from O. An event E happens further along the axis. Its coordinate in S is x, the distance from O to E. The distance from O prime to E, measured in S, is x minus v t. A note says that S prime measures x prime equals gamma times x minus v t, which is longer by the factor gamma.</title>
  <defs>
    <marker id="m116fe-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="m116fe-head2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t2-ink)"/>
    </marker>
  </defs>
  <g font-family="inherit" font-size="12" fill="var(--muted)">
    <text x="20" y="20">At t = t′ = 0: the origins coincide</text>
    <text x="20" y="160">Later, at time t in S</text>
  </g>
  <!-- top panel -->
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="60" y1="120" x2="420" y2="120" marker-end="url(#m116fe-head)"/>
    <line x1="60" y1="120" x2="60" y2="40" marker-end="url(#m116fe-head)"/>
  </g>
  <g stroke="var(--t2-ink)" stroke-width="1.6" fill="none" stroke-dasharray="6 3">
    <line x1="64" y1="116" x2="64" y2="46"/>
  </g>
  <line x1="90" y1="70" x2="150" y2="70" stroke="var(--t2-ink)" stroke-width="1.6" marker-end="url(#m116fe-head2)"/>
  <g font-family="inherit" font-size="13" fill="currentColor">
    <text x="48" y="136" text-anchor="middle">O</text>
    <text x="72" y="136" fill="var(--t2-ink)">O′</text>
    <text x="40" y="56" text-anchor="middle">S</text>
    <text x="74" y="48" fill="var(--t2-ink)">S′</text>
    <text x="158" y="74" fill="var(--t2-ink)">v</text>
    <text x="412" y="138" text-anchor="end">x</text>
  </g>
  <!-- bottom panel -->
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="60" y1="260" x2="420" y2="260" marker-end="url(#m116fe-head)"/>
    <line x1="60" y1="260" x2="60" y2="180" marker-end="url(#m116fe-head)"/>
  </g>
  <line x1="190" y1="260" x2="190" y2="186" stroke="var(--t2-ink)" stroke-width="1.6" stroke-dasharray="6 3"/>
  <line x1="215" y1="210" x2="275" y2="210" stroke="var(--t2-ink)" stroke-width="1.6" marker-end="url(#m116fe-head2)"/>
  <path d="M340,248 L343.5,255 L351,255.5 L345.5,260.5 L347,268 L340,264 L333,268 L334.5,260.5 L329,255.5 L336.5,255 Z" fill="var(--t3-ink)" stroke="none"/>
  <g font-family="inherit" font-size="13" fill="currentColor">
    <text x="48" y="276" text-anchor="middle">O</text>
    <text x="190" y="276" text-anchor="middle" fill="var(--t2-ink)">O′</text>
    <text x="40" y="196" text-anchor="middle">S</text>
    <text x="198" y="190" fill="var(--t2-ink)">S′</text>
    <text x="283" y="214" fill="var(--t2-ink)">v</text>
    <text x="356" y="254" fill="var(--t3-ink)">E</text>
    <text x="412" y="278" text-anchor="end">x</text>
  </g>
  <g stroke="var(--muted)" stroke-width="1" fill="none">
    <line x1="60" y1="288" x2="190" y2="288"/>
    <line x1="60" y1="284" x2="60" y2="292"/>
    <line x1="190" y1="284" x2="190" y2="292"/>
    <line x1="190" y1="236" x2="340" y2="236"/>
    <line x1="190" y1="232" x2="190" y2="240"/>
    <line x1="340" y1="232" x2="340" y2="240"/>
    <line x1="60" y1="300" x2="340" y2="300"/>
    <line x1="340" y1="296" x2="340" y2="304"/>
    <line x1="60" y1="296" x2="60" y2="304"/>
  </g>
  <g font-family="inherit" font-size="11" fill="currentColor">
    <text x="125" y="284" text-anchor="middle">vt</text>
    <text x="265" y="231" text-anchor="middle">x − vt (measured in S)</text>
    <text x="350" y="304">x</text>
  </g>
  <g font-family="inherit" font-size="11" fill="var(--t2-ink)">
    <text x="420" y="180" text-anchor="end">S′ measures</text>
    <text x="420" y="194" text-anchor="end">x′ = γ(x − vt)</text>
  </g>
</svg>
