<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="t">
<title id="t">Two paths launched from the same point on level ground with the same initial velocity, at the same angle. The dashed path, with no air resistance, is a symmetrical parabola: it rises highest and lands furthest away. The solid path, with air resistance, rises to a lower maximum height, and its highest point is past the middle of its range. It comes down more steeply than it went up and lands at about half the range of the dashed path.</title>
