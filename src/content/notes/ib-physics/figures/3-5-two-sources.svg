<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" role="img" aria-labelledby="t">
  <title id="t">Two sources, S1 and S2, two wavelengths apart on the left edge, send circular waves to the right. Crests are solid arcs and troughs are dashed arcs. Along the centre line, equidistant from both sources, crests meet crests: a maximum where the path difference is zero. On each side of it a curved line where crests meet troughs is labelled minimum, path difference half a wavelength. Further out on each side a curved line is labelled maximum, path difference one wavelength.</title>
