<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="t45cs">
<title id="t45cs">Left: a flat circular coil cut through along its axis, so it shows as two wire ends: the top one has a dot (current out of the page) and the bottom one a cross (current into the page). Field lines loop round each wire end, and through the middle of the coil they run nearly straight and point to the right. Right: a solenoid cut through along its axis, with a row of dots along the top and a row of crosses along the bottom. Inside, the field lines are straight, parallel, equally spaced and point to the right. Outside they spread out and loop back from the right-hand end to the left-hand end, like a bar magnet's field. The right-hand end is labelled N and the left-hand end S.</title>
