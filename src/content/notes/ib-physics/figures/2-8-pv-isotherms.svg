<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" role="img" aria-labelledby="t28pv">
  <title id="t28pv">Pressure against volume for a fixed amount of ideal gas. Two curved isotherms fall from top left to bottom right; the curve for the higher temperature T2 lies further from the origin than the curve for T1. State A is on the T1 curve. A vertical arrow goes up from A to state B on the T2 curve, labelled constant volume. A horizontal arrow goes right from A to state C on the T2 curve, labelled constant pressure.</title>
