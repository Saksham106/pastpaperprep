<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img" aria-labelledby="t">
<title id="t">Graph of energy E against time t for one complete oscillation of period T, for an oscillator released from rest at maximum displacement at t = 0. A horizontal straight line at the top is the total energy, constant. The potential energy curve, dashed, starts at the total energy, falls to zero at T/4, rises back to the total at T/2, falls to zero at 3T/4 and returns to the total at T. The kinetic energy curve, solid, does the opposite: it starts at zero, peaks at the total energy at T/4 and 3T/4, and is zero at T/2 and T. At every moment the two curves add up to the total energy. Each energy goes through two full cycles in one period T.</title>
