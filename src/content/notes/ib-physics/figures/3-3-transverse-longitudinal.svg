<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="t">
  <title id="t">Two waves, both travelling to the right. Top, a transverse wave on a rope: a smooth wave shape of crests and troughs. One marked point on the rope has a double-headed arrow pointing up and down, labelled oscillation, at right angles to the arrow labelled direction of travel. Bottom, a longitudinal wave on a slinky spring, drawn as a row of vertical coils. In some places the coils are bunched together, labelled C for compression, and in between they are spread apart, labelled R for rarefaction. One marked coil has a double-headed arrow pointing left and right, labelled oscillation, parallel to the arrow labelled direction of travel.</title>
