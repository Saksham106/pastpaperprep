<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 312" role="img" aria-labelledby="t116gg">
  <title id="t116gg">Graph of the Lorentz factor gamma against speed as a fraction of c, for speeds from 0 to c. The curve starts at gamma equals 1 when the speed is zero and stays very close to 1 up to about 0.3 c. It then rises more and more steeply: gamma is about 1.15 at 0.5 c, 1.40 at 0.7 c and 2.29 at 0.9 c. Near c the curve shoots upwards towards a dashed vertical line at v over c equals 1, which it never reaches. A dashed horizontal line at gamma equals 1 marks the lowest value gamma can take.</title>
