<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" role="img" aria-labelledby="t">
<title id="t">Graph of displacement s in metres against time t in seconds, from 0 to 6 seconds and 0 to 18 metres. The curve starts at the origin and gets steeper, passing through 2 metres at 2 seconds, 4.5 metres at 3 seconds and 8 metres at 4 seconds. A straight chord joins the origin to the point at 4 seconds, 8 metres; its gradient, 2.0 metres per second, is the average velocity over the first 4 seconds. A dashed tangent touches the curve at 3 seconds and passes through 1.5 seconds, 0 metres and 5.5 seconds, 12 metres; its gradient, 3.0 metres per second, is the instantaneous velocity at 3 seconds. A dotted vertical line under the end of the tangent marks a rise of 12 metres, over a run of 4.0 seconds along the time axis.</title>
