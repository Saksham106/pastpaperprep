<title id="t45pc">Three field-line diagrams. Left: a positive point charge with twelve straight field lines pointing radially outwards, spreading apart further away. Middle: a negative point charge with twelve straight field lines pointing radially inwards. Right: a positively charged conducting sphere. Its charge sits on the surface, the field lines start on the surface and point radially outwards at right angles to it, and the label inside the sphere says E equals 0.</title>
