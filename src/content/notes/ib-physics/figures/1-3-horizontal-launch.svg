<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
<title id="t">A ball launched horizontally from a ledge follows a curved path down to the ground. Dots mark its position at equal time intervals: they are equally spaced horizontally, but the vertical gaps between them grow. A second ball dropped from rest at the same moment falls straight down below the launch point, and dotted lines show it is at the same height as the launched ball at every instant. At two points on the path, arrows show the velocity: a horizontal component that is the same length at both points, a downward vertical component that is longer at the later point, and the resultant velocity along the tangent to the path. A separate arrow pointing straight down is labelled acceleration g, the same at every point.</title>
