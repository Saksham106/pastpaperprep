  <path d="M300.0 30.0 L300.0 305.0" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="306.0" y="40.0" font-size="11" fill="var(--muted)" font-family="inherit" text-anchor="start">normal</text>
  <path d="M269.2 135.8 A46.0 46.0 0 0 1 300.0 124.0" fill="none" stroke="currentColor" stroke-width="1"/>
  <path d="M320.9 217.6 A52.0 52.0 0 0 1 300.0 222.0" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="282.0" y="116.0" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle" font-style="italic">θ</text>
