  <text x="311.0" y="238.0" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle" font-style="italic">θ</text>
  <text x="318.0" y="243.0" font-size="9" fill="currentColor" font-family="inherit" text-anchor="middle" font-style="italic">2</text>
  <text x="520.0" y="40.0" font-size="12" fill="currentColor" font-family="inherit" text-anchor="end">medium 1: wave faster,</text>
  <text x="520.0" y="54.0" font-size="12" fill="currentColor" font-family="inherit" text-anchor="end">wavefronts further apart</text>
  <text x="30.0" y="262.0" font-size="12" fill="currentColor" font-family="inherit" text-anchor="start">medium 2: wave slower,</text>
  <text x="30.0" y="276.0" font-size="12" fill="currentColor" font-family="inherit" text-anchor="start">wavefronts closer together</text>
  <text x="30.0" y="300.0" font-size="11" fill="var(--t3-ink)" font-family="inherit" text-anchor="start">ray bends towards the normal</text>
