<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" role="img" aria-labelledby="t">
  <title id="t">A beam of straight, evenly spaced wavefronts travels down and to the right towards a horizontal boundary. Above the boundary the wave is faster and the wavefronts are further apart. Below it the wave is slower and the wavefronts are closer together. Each wavefront kinks where it crosses the boundary. A ray drawn at right angles to the wavefronts meets the boundary at angle theta 1 to the dashed normal and continues below at a smaller angle theta 2: the ray bends towards the normal.</title>
