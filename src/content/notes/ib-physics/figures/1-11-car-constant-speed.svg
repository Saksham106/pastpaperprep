<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" font-family="sans-serif" font-size="14" fill="currentColor" role="img" aria-labelledby="t111car">
  <title id="t111car">Horizontal forces on a car moving at constant velocity</title>
  <defs>
    <marker id="a111car" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
  </defs>
  <line x1="20" y1="180" x2="540" y2="180" stroke="currentColor" stroke-width="2"/>
  <path d="M205,160 L205,128 L240,128 L262,104 L322,104 L344,128 L360,128 L360,160 Z" fill="var(--t2-ink)" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/>
  <circle cx="232" cy="165" r="14" fill="var(--muted)" stroke="currentColor" stroke-width="2"/>
  <circle cx="333" cy="165" r="14" fill="var(--muted)" stroke="currentColor" stroke-width="2"/>
  <circle cx="282" cy="140" r="4"/>
  <line x1="286" y1="140" x2="420" y2="140" stroke="var(--t1-ink)" stroke-width="3" marker-end="url(#a111car)"/>
  <text x="426" y="136" fill="var(--t1-ink)">driving force</text>
  <text x="426" y="154" fill="var(--t1-ink)">F</text>
  <line x1="278" y1="140" x2="144" y2="140" stroke="var(--t3-ink)" stroke-width="3" marker-end="url(#a111car)"/>
  <text x="138" y="128" text-anchor="end" fill="var(--t3-ink)">resistive forces</text>
  <text x="138" y="146" text-anchor="end" fill="var(--t3-ink)">(air resistance</text>
  <text x="138" y="164" text-anchor="end" fill="var(--t3-ink)">and friction)</text>
  <line x1="230" y1="60" x2="340" y2="60" stroke="currentColor" stroke-width="2" marker-end="url(#a111car)"/>
  <text x="346" y="65">velocity v (constant)</text>
  <text x="20" y="215" fill="var(--muted)" font-size="12">arrows to scale: the two horizontal forces are equal in size</text>
</svg>
