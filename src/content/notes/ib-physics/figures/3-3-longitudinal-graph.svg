<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="t">
  <title id="t">Top: a displacement against position graph for a longitudinal wave travelling to the right. Displacement to the right is positive. The curve starts at zero, rises to a positive maximum, falls through zero at half a wavelength, reaches a negative minimum, and returns to zero at one wavelength, then repeats. Bottom: the same particles drawn as dots, lined up under the graph. Where the curve crosses zero going from positive to negative, the dots are bunched together: this is labelled compression. Where the curve crosses zero going from negative to positive, the dots are spread out: this is labelled rarefaction. Dashed vertical lines join each crossing point on the graph to the matching compression or rarefaction.</title>
