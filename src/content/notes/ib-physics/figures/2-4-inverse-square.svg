<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img" aria-labelledby="t24inv">
  <title id="t24inv">Inverse square law: the same cone of radiation from a point source covers one square at distance d, four equal squares at 2d and nine at 3d, so the brightness falls to one quarter and then one ninth</title>
  <g stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="50" y1="160" x2="440" y2="100"/>
    <line x1="50" y1="160" x2="440" y2="220"/>
  </g>
  <circle cx="50" cy="160" r="6" fill="var(--t5-ink)"/>
  <g fill="var(--t1-ink)" fill-opacity="0.18" stroke="var(--t1-ink)" stroke-width="1.5">
    <rect x="180" y="140" width="40" height="40"/>
    <rect x="310" y="120" width="80" height="80"/>
    <rect x="440" y="100" width="120" height="120"/>
  </g>
  <g stroke="var(--t1-ink)" stroke-width="1">
    <line x1="350" y1="120" x2="350" y2="200"/>
    <line x1="310" y1="160" x2="390" y2="160"/>
    <line x1="480" y1="100" x2="480" y2="220"/>
    <line x1="520" y1="100" x2="520" y2="220"/>
    <line x1="440" y1="140" x2="560" y2="140"/>
    <line x1="440" y1="180" x2="560" y2="180"/>
  </g>
  <g font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="50" y="185">source</text>
    <text x="200" y="200">distance d</text>
    <text x="200" y="215">area A</text>
    <text x="350" y="220">distance 2d</text>
    <text x="350" y="235">area 4A</text>
    <text x="500" y="240">distance 3d</text>
    <text x="500" y="255">area 9A</text>
    <text x="200" y="130">brightness b</text>
    <text x="350" y="110">b/4</text>
    <text x="500" y="90">b/9</text>
    <text x="300" y="282" fill="var(--muted)">the same power passes through each shaded area</text>
  </g>
</svg>
