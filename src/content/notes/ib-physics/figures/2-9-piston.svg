<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-labelledby="t29pi">
  <title id="t29pi">Side view of a horizontal cylinder closed at the left end, holding gas at pressure P. A piston of area A starts at the dashed line and moves to the right by a distance delta x. The extra volume swept out, between the dashed line and the piston, is delta V equals A delta x. An arrow pointing right, below the cylinder, shows the force F equals P A that the gas exerts on the piston.</title>
  <defs>
    <marker id="a29pi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="b29pi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--t2-ink)"/>
    </marker>
  </defs>
  <rect x="62" y="62" width="218" height="136" fill="var(--t1-ink)" fill-opacity="0.12"/>
  <rect x="280" y="62" width="80" height="136" fill="var(--t3-ink)" fill-opacity="0.18"/>
  <g stroke="currentColor" stroke-width="2.2" fill="none">
    <line x1="60" y1="60" x2="490" y2="60"/>
    <line x1="60" y1="200" x2="490" y2="200"/>
    <line x1="60" y1="60" x2="60" y2="200"/>
  </g>
  <line x1="280" y1="62" x2="280" y2="198" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 5"/>
  <rect x="360" y="62" width="16" height="136" fill="currentColor"/>
  <line x1="376" y1="130" x2="470" y2="130" stroke="currentColor" stroke-width="4"/>
  <g stroke="currentColor" stroke-width="1.4" marker-end="url(#a29pi)" marker-start="url(#a29pi)">
    <line x1="283" y1="38" x2="357" y2="38"/>
  </g>
  <line x1="372" y1="230" x2="462" y2="230" stroke="var(--t2-ink)" stroke-width="2.4" marker-end="url(#b29pi)"/>
  <g font-size="14" fill="currentColor" font-family="inherit">
    <text x="90" y="125">gas at</text>
    <text x="90" y="143">pressure P</text>
    <text x="312" y="30">Δx</text>
    <text x="290" y="125" font-size="13">ΔV</text>
    <text x="288" y="143" font-size="13">= AΔx</text>
    <text x="392" y="100">piston,</text>
    <text x="392" y="117">area A</text>
    <text x="470" y="235" fill="var(--t2-ink)">F = PA</text>
  </g>
</svg>
