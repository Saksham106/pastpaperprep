<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-labelledby="t44mk">
<title id="t44mk">Millikan's oil-drop arrangement. Two horizontal metal plates a distance d apart, with a potential difference V between them: the upper plate is positive and the lower plate negative. A small negatively charged oil drop hangs at rest between the plates. An arrow from the drop points straight up, labelled electric force qE. An arrow of the same length points straight down, labelled weight mg. The two forces balance.</title>
