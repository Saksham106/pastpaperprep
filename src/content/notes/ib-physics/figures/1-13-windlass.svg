<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-labelledby="t">
<title id="t">A drum of radius r turns on a fixed horizontal axle at its centre. A rope is wound round the drum and leaves its right-hand edge, hanging straight down to a bucket. On the drum, the tension T acts straight down at the rim, where the rope leaves, a perpendicular distance r from the axle. A curved arrow labelled alpha shows the drum turning clockwise. On the bucket, the tension T acts straight up along the rope and the weight m g acts straight down, and the weight arrow is longer. An arrow labelled a beside the bucket shows its acceleration downwards.</title>
