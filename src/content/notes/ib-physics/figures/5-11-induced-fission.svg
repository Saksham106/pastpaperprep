<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-labelledby="t511if">
  <title id="t511if">A slow neutron travels right towards a uranium-235 nucleus. The nucleus absorbs it and becomes an unstable, stretched uranium-236 nucleus. This splits into two medium-mass fission fragments that fly apart, one up and to the right and one down and to the right, together with two fast neutrons moving to the right.</title>
  <defs><marker id="m511if" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="m511if-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t3-ink)"/></marker></defs>
  <circle cx="34" cy="120" r="7" fill="var(--t3-ink)"/>
  <line x1="44" y1="120" x2="98" y2="120" stroke="var(--t3-ink)" stroke-width="2" marker-end="url(#m511if-3)"/>
  <circle cx="150" cy="120" r="42" fill="var(--t1-ink)" fill-opacity="0.25" stroke="currentColor" stroke-width="1.2"/>
  <line x1="202" y1="120" x2="238" y2="120" stroke="currentColor" stroke-width="2" marker-end="url(#m511if)"/>
  <ellipse cx="300" cy="120" rx="54" ry="33" fill="var(--t1-ink)" fill-opacity="0.25" stroke="currentColor" stroke-width="1.2"/>
  <line x1="362" y1="120" x2="398" y2="120" stroke="currentColor" stroke-width="2" marker-end="url(#m511if)"/>
  <circle cx="450" cy="62" r="30" fill="var(--t2-ink)" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="450" cy="180" r="26" fill="var(--t4-ink)" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <line x1="478" y1="48" x2="540" y2="22" stroke="currentColor" stroke-width="2" marker-end="url(#m511if)"/>
  <line x1="474" y1="194" x2="540" y2="220" stroke="currentColor" stroke-width="2" marker-end="url(#m511if)"/>
  <circle cx="462" cy="112" r="6" fill="var(--t3-ink)"/>
  <circle cx="478" cy="130" r="6" fill="var(--t3-ink)"/>
  <line x1="470" y1="110" x2="540" y2="104" stroke="var(--t3-ink)" stroke-width="2" marker-end="url(#m511if-3)"/>
  <line x1="486" y1="132" x2="540" y2="138" stroke="var(--t3-ink)" stroke-width="2" marker-end="url(#m511if-3)"/>
  <g font-size="12" fill="currentColor">
    <text x="20" y="102" fill="var(--t3-ink)">slow neutron</text>
    <text x="150" y="182" text-anchor="middle">uranium-235</text>
    <text x="300" y="172" text-anchor="middle">uranium-236,</text>
    <text x="300" y="186" text-anchor="middle">unstable</text>
    <text x="548" y="26">fragment</text>
    <text x="548" y="226">fragment</text>
    <text x="548" y="118" fill="var(--t3-ink)">fast</text>
    <text x="548" y="132" fill="var(--t3-ink)">neutrons</text>
  </g>
</svg>
