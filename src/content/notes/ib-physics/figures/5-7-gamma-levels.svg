<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t57gl">
  <title id="t57gl">Energy-level diagram for a daughter nucleus. Three horizontal lines show its levels: the top line at 0.84 MeV, a middle line at 0.31 MeV, and the ground state at 0 at the bottom. A downward arrow labelled gamma 1 goes from the 0.84 MeV level to the 0.31 MeV level. A second downward arrow labelled gamma 2 goes from the 0.31 MeV level to the ground state. Each downward step emits one gamma photon.</title>
  <defs><marker id="m57gl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/></marker><marker id="m57gl-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <g stroke="currentColor" stroke-width="2">
    <line x1="110" y1="60" x2="330" y2="60"/>
    <line x1="110" y1="186" x2="330" y2="186"/>
    <line x1="110" y1="260" x2="330" y2="260"/>
  </g>
  <g stroke="var(--t1-ink)" stroke-width="2" fill="none" marker-end="url(#m57gl-a)">
    <line x1="190" y1="62" x2="190" y2="182"/>
    <line x1="260" y1="188" x2="260" y2="256"/>
  </g>
  <g font-size="12" fill="currentColor">
    <text x="340" y="64">0.84 MeV (excited)</text>
    <text x="340" y="190">0.31 MeV (excited)</text>
    <text x="340" y="264">0 (ground state)</text>
    <text x="200" y="128" fill="var(--t1-ink)">γ₁</text>
    <text x="270" y="228" fill="var(--t1-ink)">γ₂</text>
    <text x="100" y="30" fill="var(--muted)">energy of the daughter nucleus above its ground state</text>
  </g>
  <g stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#m57gl-k)">
    <line x1="70" y1="270" x2="70" y2="45"/>
  </g>
  <text x="62" y="160" font-size="12" fill="currentColor" text-anchor="middle" transform="rotate(-90 62 160)">energy</text>
</svg>
