<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="inherit" font-size="12" fill="currentColor" role="img" aria-labelledby="t61mn">
  <title id="t61mn">A close-up of a measuring cylinder holding water. The scale is marked every 1 cubic centimetre and labelled at 36, 38, 40, 42 and 44. The water surface curves down in the middle, forming a meniscus whose lowest point is level with the 41 cubic centimetre mark. Three eyes look at the meniscus from the right. The middle eye is level with the bottom of the meniscus, along a horizontal dashed line, and is labelled correct: read 41 cubic centimetres. An eye above, looking down, and an eye below, looking up, are each labelled parallax error.</title>
