<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" font-family="inherit" font-size="13" fill="currentColor" role="img" aria-labelledby="t110sa">
  <title id="t110sa">Graph of the force F on a spring against its extension. The graph is a straight line through the origin. The triangle under the line, up to extension delta x, is shaded. Its height is k times delta x and its area, one half k delta x squared, is the elastic potential energy stored.</title>
  <path d="M50 225 L370 225" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <polygon points="378,225 370,229.5 370,220.5" fill="currentColor"/>
  <path d="M50 225 L50 30" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <polygon points="50,22 54.5,30 45.5,30" fill="currentColor"/>
  <text x="378" y="248" text-anchor="end">extension / m</text>
  <text x="58" y="28" text-anchor="start">force F / N</text>
  <polygon points="50,225 270,225 270,85" fill="var(--t3-ink)" fill-opacity="0.22" stroke="none"/>
  <path d="M50 225 L340 40" fill="none" stroke="var(--t3-ink)" stroke-width="2.4"/>
  <path d="M270 225 L270 85" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M50 85 L270 85" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="270" y="244" text-anchor="middle">Δx</text>
  <text x="44" y="89" text-anchor="end">kΔx</text>
  <text x="196" y="192" text-anchor="middle" fill="var(--t3-ink)">area = ½k(Δx)²</text>
  <text x="196" y="210" text-anchor="middle" fill="var(--t3-ink)">= elastic potential energy</text>
  <text x="300" y="48" text-anchor="end" fill="var(--t3-ink)">gradient = k</text>
</svg>
