<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" role="img" aria-labelledby="t211cc">
  <title id="t211cc">Pressure against volume for a Carnot cycle. From A at the top left, the gas expands along the hotter isotherm, labelled T h, to B, taking in thermal energy Q h. From B it expands along a steeper adiabatic curve down to C. From C it is compressed along the cooler isotherm, labelled T c, to D, giving out thermal energy Q c. From D a steep adiabatic curve rises back to A. The cycle runs clockwise and the enclosed area is shaded.</title>
