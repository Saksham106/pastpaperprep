<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="t">
<title id="t">Free-body diagram of a small sphere falling at terminal speed through a fluid, drawn inside a shaded box of fluid. Three labelled arrows start on the sphere: weight W pointing vertically down from its bottom; viscous drag F d pointing vertically up from its top; and buoyancy F b, a shorter arrow, also pointing vertically up from its top. The drag and buoyancy arrows together are as long as the weight arrow. A separate arrow beside the sphere, not touching it, points down and is labelled velocity.</title>
<rect x="20" y="20" width="320" height="290" fill="var(--t5-ink)" fill-opacity="0.08" stroke="var(--muted)" stroke-width="1"/>
<text font-family="inherit" font-size="11" x="330.0" y="40.0" fill="var(--muted)" text-anchor="end">fluid</text>
<circle cx="170" cy="160" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M170.0 178.0 L170.0 289.0" fill="none" stroke="var(--t1-ink)" stroke-width="2.2"/>
<polygon points="170.0,298.0 165.5,289.0 174.5,289.0" fill="var(--t1-ink)"/>
<text font-family="inherit" font-size="12" x="178.0" y="292.0" fill="var(--t1-ink)" text-anchor="start">weight W</text>
<path d="M162.0 143.9 L162.0 62.9" fill="none" stroke="var(--t2-ink)" stroke-width="2.2"/>
<polygon points="162.0,53.9 166.5,62.9 157.5,62.9" fill="var(--t2-ink)"/>
<text font-family="inherit" font-size="12" x="155.0" y="64.0" fill="var(--t2-ink)" text-anchor="end">drag F<tspan baseline-shift="sub" font-size="9">d</tspan></text>
<path d="M178.0 143.9 L178.0 122.9" fill="none" stroke="var(--t3-ink)" stroke-width="2.2"/>
<polygon points="178.0,113.9 182.5,122.9 173.5,122.9" fill="var(--t3-ink)"/>
<text font-family="inherit" font-size="12" x="186.0" y="122.0" fill="var(--t3-ink)" text-anchor="start">buoyancy F<tspan baseline-shift="sub" font-size="9">b</tspan></text>
<path d="M270.0 140.0 L270.0 203.0" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
<polygon points="270.0,210.0 265.5,203.0 274.5,203.0" fill="var(--muted)"/>
<text font-family="inherit" font-size="11" x="278.0" y="180.0" fill="var(--muted)" text-anchor="start">velocity</text>
</svg>
