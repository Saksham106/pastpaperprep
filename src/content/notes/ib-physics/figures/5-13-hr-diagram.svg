<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" role="img" aria-labelledby="t513hr">
  <title id="t513hr">Hertzsprung-Russell diagram. Vertical axis: luminosity relative to the Sun, on a logarithmic scale from 10 to the minus 4 up to 10 to the 6. Horizontal axis: surface temperature in kelvin, on a logarithmic scale, decreasing from 40 000 K on the left to 2500 K on the right. The main sequence is a band running from hot, very luminous stars at the top left down to cool, dim stars at the bottom right, with the Sun near the middle at 5800 K and luminosity 1. Red giants are a group above and to the right of the main sequence, cool but about 100 to 1000 times the Sun's luminosity. Supergiants lie across the top of the diagram, at luminosities of about 10 to the 4 to 10 to the 6. White dwarfs are at the bottom left: hot but very dim. The instability strip is a narrow, almost vertical band at about 6000 to 7500 K, rising from the main sequence up to the supergiants. Three dashed lines of constant radius, labelled 0.01, 1 and 100 solar radii, slope down from left to right; radius increases towards the top right.</title>
