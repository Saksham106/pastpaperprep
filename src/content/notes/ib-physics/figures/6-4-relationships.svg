<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" role="img" aria-labelledby="t64rel">
  <title id="t64rel">Four sketch graphs with labelled but unscaled axes, y up and x across. First, direct proportionality: a straight line through the origin. Second, linear but not proportional: a straight line that crosses the y-axis above the origin. Third, inverse proportionality: a curve that falls steeply and then more gently, getting closer to both axes without touching them. Fourth, negative correlation: scattered points that tend to fall from top left to bottom right.</title>
