<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" role="img" aria-labelledby="t59sb">
  <title id="t59sb">Graph of neutron number N, from 0 to 150, against proton number Z, from 0 to 100. A dashed straight line shows N equal to Z. A shaded band of stable nuclides follows the N equals Z line for light nuclei, then curves above it as Z increases, passing calcium-40 at Z 20, N 20, iron-56 at Z 26, N 30, tin-120 at Z 50, N 70, and ending at lead-208 at Z 82, N 126. Nuclides above the band have too many neutrons and decay by beta-minus decay. Nuclides below the band have too few neutrons and decay by beta-plus decay. Beyond Z 82 no nuclide is stable, and many of these heavy nuclides decay by alpha decay.</title>
