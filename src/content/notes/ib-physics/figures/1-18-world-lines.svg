<text x="160" y="348" text-anchor="middle">2</text><text x="52" y="234" text-anchor="end">2</text>
<text x="210" y="348" text-anchor="middle">3</text><text x="52" y="184" text-anchor="end">3</text>
<text x="260" y="348" text-anchor="middle">4</text><text x="52" y="134" text-anchor="end">4</text>
<text x="310" y="348" text-anchor="middle">5</text><text x="52" y="84" text-anchor="end">5</text>
<text x="360" y="348" text-anchor="middle">6</text><text x="52" y="34" text-anchor="end">6</text>
