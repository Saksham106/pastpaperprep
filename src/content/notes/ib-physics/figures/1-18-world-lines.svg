<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 375" role="img" aria-labelledby="t118worldlines">
<title id="t118worldlines">Space-time diagram with x in kilometres on the horizontal axis and c t in kilometres on the vertical axis, both from 0 to 6 with the same scale. Three world lines are drawn. A vertical line at x equals 4 kilometres is the world line of a lamp at rest. A dashed line at 45 degrees from the origin is the world line of a light pulse. It meets the lamp's world line at event E, at x equals 4 kilometres and c t equals 4 kilometres. A third straight line from the origin to x equals 3, c t equals 6 is the world line of a particle moving at 0.50 c. The angle theta between this world line and the c t axis is marked.</title>
