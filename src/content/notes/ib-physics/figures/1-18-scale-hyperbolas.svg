<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 385" role="img" aria-labelledby="t118scalehyperbolas">
<title id="t118scalehyperbolas">Space-time diagram for frame S, with x in light-years on the horizontal axis and c t in light-years on the vertical axis, both from 0 to 4. The axes of frame S prime, moving at 0.60 c, are drawn through the origin: the c t prime axis tilts right of the c t axis and the x prime axis tilts up from the x axis, either side of a dashed 45 degree light line. Four grey curves are lines of constant space-time interval. Each curve crosses the c t axis at 1, 2, 3 and 4 light-years and bends to the right, approaching the light line. Where the curves cross the c t prime axis, the ticks are labelled c t prime equals 1, 2, 3 and 4 light-years. The first tick, c t prime equals 1 light-year, is level with c t equals 1.25 light-years. Ticks at x prime equals 1, 2 and 3 light-years are marked along the x prime axis, further from the origin than the matching ticks on the x axis.</title>
