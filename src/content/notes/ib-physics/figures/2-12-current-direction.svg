    </marker>
    <marker id="b212cd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--t4-ink)"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="2.2" fill="none">
    <line x1="170" y1="60" x2="310" y2="60"/>
    <line x1="330" y1="60" x2="470" y2="60"/>
    <line x1="470" y1="60" x2="470" y2="220"/>
    <line x1="470" y1="220" x2="336" y2="220"/>
    <line x1="304" y1="220" x2="170" y2="220"/>
