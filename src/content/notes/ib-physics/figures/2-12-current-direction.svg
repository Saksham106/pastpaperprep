<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="t212cd">
  <title id="t212cd">A cell and a lamp joined in a loop. The long thin plate of the cell is the positive terminal and the short thick plate is the negative terminal. On the left-hand wire, an arrow labelled conventional current points down, away from the positive terminal. Beside it, an arrow labelled electron flow points up, the opposite way.</title>
