  <line x1="145" y1="100" x2="145" y2="180" stroke="var(--t2-ink)" stroke-width="2.6" marker-end="url(#a212cd)"/>
  <line x1="195" y1="180" x2="195" y2="100" stroke="var(--t4-ink)" stroke-width="2.6" marker-end="url(#b212cd)"/>
  <g font-size="14" fill="currentColor" font-family="inherit">
