<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" role="img" aria-labelledby="t">
<title id="t">Graph of amplitude against driving frequency for the same oscillator with three amounts of damping. With light damping the curve rises slowly, then shoots up to a tall, narrow peak at the natural frequency f0, then falls away. With more damping the curve has a lower, broader peak, just to the left of f0. With heavy damping there is no peak: the amplitude falls steadily as the driving frequency increases. The more damped curves never rise above the lightly damped one, and all three start from the same amplitude at very low frequency.</title>
