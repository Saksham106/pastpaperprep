<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="t32pg">
  <title id="t32pg">Displacement x against time t for two oscillators with the same amplitude x0 and period T. The solid curve, phase angle 0, starts at zero displacement at t equals 0 and rises, reaching plus x0 at T over 4, zero at T over 2, minus x0 at 3T over 4 and zero again at T. The dashed curve, phase angle pi over 2, starts at plus x0 at t equals 0, falls to zero at T over 4, reaches minus x0 at T over 2, zero at 3T over 4 and plus x0 again at T. The dashed curve is a quarter of a cycle ahead of the solid one.</title>
