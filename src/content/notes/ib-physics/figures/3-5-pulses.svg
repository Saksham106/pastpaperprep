  <title id="t">Three snapshots of a stretched rope, one above the other. Top, before: pulse A, 3 centimetres high, on the left moving right, and pulse B, 2 centimetres high, on the right moving left. Middle, overlapping: the two pulses are at the same place, shown dashed, and the rope forms a single pulse 5 centimetres high. Bottom, after: pulse A is now on the right still moving right and pulse B on the left still moving left, each with its original height.</title>
