<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" role="img" aria-labelledby="t">
  <title id="t">Three panels. In each, straight wavefronts arrive from the left at a barrier, with the same spacing, one wavelength, before and after it. Left: a gap many wavelengths wide; the wavefronts pass through mostly straight, curving only slightly at the edges. Middle: a gap about one wavelength wide; the wavefronts after it are semicircles centred on the gap, so the wave spreads out strongly. Right: the edge of a barrier; below the edge the wavefronts carry on straight, and they curve round the edge into the region behind the barrier.</title>
