    <text x="218" y="14" text-anchor="end" fill="var(--t4-ink)">light</text>
    <text x="148" y="190" text-anchor="middle">emitter</text>
    <text x="370" y="75">collector</text>
    <text x="254" y="80" text-anchor="middle" fill="var(--t1-ink)">photoelectrons</text>
    <text x="260" y="38" text-anchor="middle" fill="var(--muted)">vacuum</text>
