    <line x1="178" y1="128" x2="330" y2="136"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <polyline points="160,110 100,110 100,270 200,270"/>
    <polyline points="350,150 350,170 420,170 420,270 330,270"/>
    <circle cx="215" cy="270" r="15"/>
    <polyline points="230,270 270,270"/>
    <line x1="270" y1="256" x2="270" y2="284"/>
    <line x1="282" y1="262" x2="282" y2="278" stroke-width="4"/>
    <polyline points="282,270 330,270"/>
    <line x1="258" y1="292" x2="300" y2="250" stroke-width="1.2" marker-end="url(#m54pc-a)"/>
