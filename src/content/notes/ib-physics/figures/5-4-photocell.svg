<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="t54pc">
  <title id="t54pc">An evacuated glass tube holds a curved metal plate, the emitter, on the left and a thin collecting electrode on the right. A beam of light enters from above and falls on the inner, curved face of the emitter, the face towards the collector. Small arrows show electrons travelling from the emitter across to the collector. Below the tube, wires join the emitter and collector through an ammeter and a variable power supply, and a voltmeter is connected across the supply.</title>
  <defs>
    <marker id="m54pc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/></marker>
    <marker id="m54pc-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--t4-ink)"/></marker>
  </defs>
  <ellipse cx="260" cy="110" rx="160" ry="80" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M170,60 Q145,110 170,160" fill="none" stroke="var(--t3-ink)" stroke-width="6"/>
  <line x1="350" y1="70" x2="350" y2="150" stroke="var(--t3-ink)" stroke-width="4"/>
  <g stroke="var(--t4-ink)" stroke-width="3" fill="none" marker-end="url(#m54pc-b)">
