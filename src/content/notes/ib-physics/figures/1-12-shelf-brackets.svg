<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" role="img" aria-labelledby="t112sb">
  <title id="t112sb">A uniform shelf 1.40 m long rests on a bracket at each end, A on the left and B on the right. A box sits on the shelf 0.30 m from end A. Four forces act on the shelf: an upward force F A at end A, a shorter upward force F B at end B, the push of the box, 5.0 g, downward at 0.30 m from A, and the weight of the shelf, 3.0 g, downward at its midpoint, 0.70 m from A, labelled centre of mass.</title>
  <defs>
    <marker id="m112sb-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t2-ink)"/>
    </marker>
    <marker id="m112sb-dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/>
    </marker>
    <marker id="m112sb-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- shelf -->
  <rect x="60" y="140" width="420" height="14" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- brackets -->
  <path d="M60 154 L60 200 L84 154" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M480 154 L480 200 L456 154" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <text x="44" y="200" font-size="13" fill="currentColor" font-family="inherit" text-anchor="end">A</text>
  <text x="496" y="200" font-size="13" fill="currentColor" font-family="inherit">B</text>

  <!-- box -->
  <rect x="122" y="104" width="56" height="36" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
  <text x="150" y="127" font-size="11" fill="var(--muted)" font-family="inherit" text-anchor="middle">box</text>

  <!-- upward support forces -->
  <line x1="66" y1="138" x2="66" y2="66" stroke="var(--t2-ink)" stroke-width="2.4" marker-end="url(#m112sb-up)"/>
  <text x="74" y="72" font-size="13" fill="var(--t2-ink)" font-family="inherit" font-style="italic">F<tspan baseline-shift="sub" font-size="10" font-style="normal">A</tspan></text>
  <line x1="474" y1="138" x2="474" y2="104" stroke="var(--t2-ink)" stroke-width="2.4" marker-end="url(#m112sb-up)"/>
  <text x="466" y="98" font-size="13" fill="var(--t2-ink)" font-family="inherit" font-style="italic" text-anchor="end">F<tspan baseline-shift="sub" font-size="10" font-style="normal">B</tspan></text>

  <!-- downward forces -->
  <line x1="150" y1="156" x2="150" y2="222" stroke="var(--t1-ink)" stroke-width="2.4" marker-end="url(#m112sb-dn)"/>
  <text x="158" y="214" font-size="12" fill="var(--t1-ink)" font-family="inherit">box: 5.0g</text>
  <line x1="270" y1="156" x2="270" y2="196" stroke="var(--t1-ink)" stroke-width="2.4" marker-end="url(#m112sb-dn)"/>
  <circle cx="270" cy="147" r="3.5" fill="currentColor"/>
  <text x="278" y="190" font-size="12" fill="var(--t1-ink)" font-family="inherit">shelf: 3.0g</text>
  <text x="270" y="128" font-size="11" fill="var(--muted)" font-family="inherit" text-anchor="middle">centre of mass</text>

  <!-- dimensions -->
  <g stroke="var(--muted)" stroke-width="1.1">
    <line x1="60" y1="250" x2="150" y2="250" marker-start="url(#m112sb-dim)" marker-end="url(#m112sb-dim)"/>
    <line x1="60" y1="276" x2="270" y2="276" marker-start="url(#m112sb-dim)" marker-end="url(#m112sb-dim)"/>
    <line x1="60" y1="302" x2="480" y2="302" marker-start="url(#m112sb-dim)" marker-end="url(#m112sb-dim)"/>
    <line x1="60" y1="240" x2="60" y2="310" stroke-dasharray="3 3"/>
    <line x1="150" y1="240" x2="150" y2="256" stroke-dasharray="3 3"/>
    <line x1="270" y1="240" x2="270" y2="282" stroke-dasharray="3 3"/>
    <line x1="480" y1="240" x2="480" y2="310" stroke-dasharray="3 3"/>
  </g>
  <g font-size="11" fill="var(--muted)" font-family="inherit">
    <text x="160" y="254">0.30 m</text>
    <text x="280" y="280">0.70 m</text>
    <text x="270" y="322" text-anchor="middle">1.40 m</text>
  </g>
</svg>
