<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-labelledby="t">
<title id="t">A block on a rough ramp that rises to the right at angle theta to the horizontal. The block is sliding down the ramp. Three labelled arrows start at a dot at the centre of the block: weight m g, the longest, pointing vertically down; normal force F N pointing away from the ramp, perpendicular to its surface; and a short friction arrow F f pointing up the ramp, against the sliding. Two dashed arrows show the components of the weight: m g sin theta down the ramp and m g cos theta into the ramp, perpendicular to the surface. The normal force arrow is the same length as the m g cos theta component.</title>
