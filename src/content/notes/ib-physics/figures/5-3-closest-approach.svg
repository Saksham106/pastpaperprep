<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-labelledby="t53ca">
  <title id="t53ca">Head-on collision of an alpha particle with a nucleus. On the left, far away, an alpha particle of charge plus 2e moves right with all its energy as kinetic energy. Further right, a dashed outline shows the alpha particle stopped for an instant, where all its energy is electric potential energy. On the far right is the nucleus, charge plus Ze. A double-headed arrow below marks d, the distance from the stopped alpha particle to the centre of the nucleus. Not to scale.</title>
  <defs>
    <marker id="m53ca-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <line x1="40" y1="100" x2="408" y2="100" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="60" cy="100" r="8" fill="var(--t1-ink)"/>
  <line x1="74" y1="100" x2="150" y2="100" stroke="currentColor" stroke-width="1.6" marker-end="url(#m53ca-a)"/>
  <circle cx="300" cy="100" r="8" fill="none" stroke="var(--t1-ink)" stroke-width="1.6" stroke-dasharray="3 2"/>
  <circle cx="430" cy="100" r="22" fill="var(--t4-ink)"/>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="300" y1="112" x2="300" y2="168" stroke-dasharray="2 3"/>
    <line x1="430" y1="124" x2="430" y2="168" stroke-dasharray="2 3"/>
    <line x1="302" y1="160" x2="428" y2="160" marker-start="url(#m53ca-a)" marker-end="url(#m53ca-a)"/>
  </g>
  <g font-size="12" fill="currentColor" font-family="inherit">
    <text x="60" y="72" text-anchor="middle">alpha particle, +2e</text>
    <text x="60" y="130" text-anchor="middle">far away:</text>
    <text x="60" y="145" text-anchor="middle">all kinetic energy</text>
    <text x="300" y="72" text-anchor="middle">stops: v = 0</text>
    <text x="250" y="130" text-anchor="end">all electric</text>
    <text x="250" y="145" text-anchor="end">potential energy</text>
    <text x="430" y="64" text-anchor="middle">nucleus, +Ze</text>
    <text x="365" y="154" text-anchor="middle">d</text>
    <text x="510" y="192" text-anchor="end" fill="var(--muted)">not to scale</text>
  </g>
</svg>
