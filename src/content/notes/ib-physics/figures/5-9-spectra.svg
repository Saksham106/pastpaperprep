<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" role="img" aria-labelledby="t59sp">
  <title id="t59sp">Two graphs side by side, each of number of particles against kinetic energy. Left, alpha particles from one nuclide: two narrow vertical lines, a taller one at 6.05 MeV and a shorter one at 5.76 MeV, with nothing in between. This is a line spectrum. Right, beta-minus particles from one nuclide: a smooth hump that starts at zero energy, rises to a peak at low energy, about a fifth of the maximum energy, then falls to zero at the maximum kinetic energy, E max. This is a continuous spectrum.</title>
  <defs>
    <marker id="m59sp-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="40" y1="210" x2="40" y2="20" marker-end="url(#m59sp-head)"/>
    <line x1="40" y1="210" x2="250" y2="210" marker-end="url(#m59sp-head)"/>
    <line x1="300" y1="210" x2="300" y2="20" marker-end="url(#m59sp-head)"/>
    <line x1="300" y1="210" x2="520" y2="210" marker-end="url(#m59sp-head)"/>
  </g>
  <g stroke="var(--t1-ink)" stroke-width="4"><line x1="120" y1="210" x2="120" y2="140"/><line x1="200" y1="210" x2="200" y2="50"/></g>
