<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 365" role="img" aria-labelledby="t118movingaxes">
<title id="t118movingaxes">Space-time diagram for frame S, with a horizontal x axis and a vertical c t axis meeting at origin O. The axes of frame S prime, moving at 0.50 c in the positive x direction, are drawn through the same origin. The c t prime axis is tilted to the right of the c t axis by an angle theta. The x prime axis is tilted up from the x axis by the same angle theta. A dashed 45 degree light line lies between the two primed axes. An event E is marked. A dashed line from E parallel to the x prime axis meets the c t prime axis, giving E's c t prime coordinate. A dashed line from E parallel to the c t prime axis meets the x prime axis, giving E's x prime coordinate. Dotted lines from E parallel to the x and c t axes give its coordinates in S.</title>
