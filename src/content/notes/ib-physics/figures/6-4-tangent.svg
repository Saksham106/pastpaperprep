  <title id="t64tan">Velocity in metres per second, 0 to 10, against time in seconds, 0 to 10. A curve rises from the origin, steeply at first and then more gently. A straight tangent touches the curve at 4.0 seconds, where the velocity is 5.0 metres per second. The tangent passes through 2.6 metres per second at 0 seconds and 8.6 metres per second at 10.0 seconds. A dashed triangle under the tangent shows a change in time of 10.0 seconds and a change in velocity of 6.0 metres per second.</title>
