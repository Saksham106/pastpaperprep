<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="t23cr">
  <title id="t23cr">Convection current in a room: air warmed by a heater near the floor on the left rises, flows across under the ceiling, cools and sinks beside a cold window on the right, and returns along the floor to the heater</title>
  <rect x="60" y="30" width="480" height="270" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="66" y="230" width="34" height="64" fill="var(--t5-ink)" fill-opacity="0.55" stroke="var(--t5-ink)" stroke-width="1.5"/>
  <rect x="532" y="90" width="14" height="120" fill="var(--t1-ink)" fill-opacity="0.35" stroke="var(--t1-ink)" stroke-width="1.5"/>
  <g stroke="var(--t5-ink)" stroke-width="2.5" fill="none">
    <path d="M 120 225 C 120 160, 120 100, 150 70"/>
    <polyline points="140,72 152,68 150,80"/>
    <path d="M 170 60 L 450 60"/>
    <polyline points="438,52 452,60 438,68"/>
  </g>
  <g stroke="var(--t1-ink)" stroke-width="2.5" fill="none">
    <path d="M 480 75 C 505 110, 505 200, 495 250"/>
    <polyline points="489,239 495,252 502,241"/>
    <path d="M 470 275 L 130 275"/>
    <polyline points="142,267 128,275 142,283"/>
  </g>
  <g font-size="13" fill="currentColor" font-family="inherit">
    <text x="83" y="318" text-anchor="middle">heater</text>
    <text x="555" y="80" text-anchor="middle">cold</text>
    <text x="555" y="226" text-anchor="middle">window</text>
    <text x="135" y="120">warm air expands,</text>
    <text x="135" y="136">becomes less dense</text>
    <text x="135" y="152">and rises</text>
    <text x="300" y="50" text-anchor="middle">warm air spreads under the ceiling</text>
    <text x="470" y="140" text-anchor="end">air cools, becomes</text>
    <text x="470" y="156" text-anchor="end">denser and sinks</text>
    <text x="300" y="265" text-anchor="middle">cool, dense air flows back along the floor</text>
  </g>
</svg>
