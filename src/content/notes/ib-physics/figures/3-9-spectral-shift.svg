<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 256" role="img" aria-labelledby="t">
  <title id="t">Three horizontal spectrum strips above a wavelength axis running from 400 to 700 nanometres. Top strip, laboratory source at rest: four dark lines, from violet to red. Middle strip, galaxy moving away: the same four lines in the same pattern, each moved to a longer wavelength, to the right, labelled redshift. Bottom strip, star moving towards us: the same pattern moved to shorter wavelengths, to the left, labelled blueshift. Dashed guide lines drop from the laboratory lines so the shifts can be seen; the red line on the right shifts the furthest.</title>
