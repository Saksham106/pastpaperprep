  <path d="M93.6 94 L93.6 140" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M93.6 160 L93.6 194" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M125.3 28 L125.3 74" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M125.3 94 L125.3 140" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M125.3 160 L125.3 194" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M194.8 28 L194.8 74" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M194.8 94 L194.8 140" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M194.8 160 L194.8 194" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M421.7 28 L421.7 74" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
