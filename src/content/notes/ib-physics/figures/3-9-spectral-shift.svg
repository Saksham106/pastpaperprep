  <path d="M421.7 160 L421.7 194" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="80" y="22" font-size="12" fill="currentColor" font-family="inherit" text-anchor="start">laboratory: source at rest</text>
  <rect x="80" y="28" width="400" height="28" fill="none" stroke="currentColor" stroke-width="1"/>
  <path d="M93.6 28 L93.6 56" stroke="currentColor" stroke-width="3"/>
