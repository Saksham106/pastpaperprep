  <text x="80" y="154" font-size="12" fill="currentColor" font-family="inherit" text-anchor="start">star moving towards us: blueshift (to shorter λ)</text>
  <rect x="80" y="160" width="400" height="28" fill="none" stroke="currentColor" stroke-width="1"/>
