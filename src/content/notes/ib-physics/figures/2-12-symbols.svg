<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="t212sy">
  <title id="t212sy">Twelve circuit symbols in a grid. Cell: a long thin plate beside a short thick plate. Battery: two cells joined by a dashed line. Open switch: a hinged line lifted away from a contact. Lamp: a circle with a cross inside. Resistor: a rectangle. Variable resistor: a rectangle with a diagonal arrow through it. Ammeter: a circle with A inside. Voltmeter: a circle with V inside. LDR: a rectangle with two arrows pointing in towards it. Thermistor: a rectangle crossed by a diagonal line with a short flat tail at its lower end. Potentiometer: a rectangle with an arrow pointing onto its middle from below. LED: a diode triangle and bar with two arrows pointing outwards.</title>
