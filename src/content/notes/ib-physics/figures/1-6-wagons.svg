<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-labelledby="t16wg">
  <title id="t16wg">Two diagrams of railway wagons on a straight track, with an arrow at the top marking right as the positive direction. Before: wagon A, mass 18 000 kilograms, on the left, moving right at 2.4 metres per second; wagon B, mass 12 000 kilograms, on the right, moving left at 0.90 metres per second, towards A. After: the two wagons are coupled together, total mass 30 000 kilograms, moving with an unknown velocity v marked to the right.</title>
  <defs>
    <marker id="m16wg-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="m16wg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/>
    </marker>
    <marker id="m16wg-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t3-ink)"/>
    </marker>
  </defs>
  <g font-family="inherit" font-size="12" fill="currentColor">
    <line x1="350" y1="22" x2="430" y2="22" stroke="currentColor" stroke-width="1.4" marker-end="url(#m16wg-head)"/>
    <text x="340" y="26" text-anchor="end">positive</text>
    <text x="20" y="50" font-weight="bold">Before</text>
    <text x="20" y="170" font-weight="bold">After</text>
  </g>
  <!-- before -->
  <line x1="20" y1="122" x2="440" y2="122" stroke="var(--muted)" stroke-width="1.2"/>
  <rect x="60" y="80" width="120" height="34" rx="3" fill="var(--t1-ink)" fill-opacity="0.15" stroke="var(--t1-ink)" stroke-width="1.6"/>
  <circle cx="82" cy="117" r="5" fill="currentColor"/>
  <circle cx="158" cy="117" r="5" fill="currentColor"/>
  <rect x="290" y="86" width="100" height="28" rx="3" fill="var(--t3-ink)" fill-opacity="0.15" stroke="var(--t3-ink)" stroke-width="1.6"/>
  <circle cx="310" cy="117" r="5" fill="currentColor"/>
  <circle cx="370" cy="117" r="5" fill="currentColor"/>
  <g font-family="inherit" font-size="12">
    <text x="120" y="101" text-anchor="middle" fill="currentColor">A  18 000 kg</text>
    <text x="340" y="104" text-anchor="middle" fill="currentColor">B  12 000 kg</text>
  </g>
  <line x1="190" y1="97" x2="250" y2="97" stroke="var(--t1-ink)" stroke-width="2.2" marker-end="url(#m16wg-a)"/>
  <text font-family="inherit" font-size="12" x="220" y="88" text-anchor="middle" fill="var(--t1-ink)">2.4 m s⁻¹</text>
  <line x1="282" y1="140" x2="232" y2="140" stroke="var(--t3-ink)" stroke-width="2.2" marker-end="url(#m16wg-b)"/>
  <text font-family="inherit" font-size="12" x="257" y="158" text-anchor="middle" fill="var(--t3-ink)">0.90 m s⁻¹</text>
  <!-- after -->
  <line x1="20" y1="232" x2="440" y2="232" stroke="var(--muted)" stroke-width="1.2"/>
  <rect x="100" y="190" width="120" height="34" rx="3" fill="var(--t1-ink)" fill-opacity="0.15" stroke="var(--t1-ink)" stroke-width="1.6"/>
  <circle cx="122" cy="227" r="5" fill="currentColor"/>
  <circle cx="198" cy="227" r="5" fill="currentColor"/>
  <line x1="220" y1="210" x2="226" y2="210" stroke="currentColor" stroke-width="2"/>
  <rect x="226" y="196" width="100" height="28" rx="3" fill="var(--t3-ink)" fill-opacity="0.15" stroke="var(--t3-ink)" stroke-width="1.6"/>
  <circle cx="246" cy="227" r="5" fill="currentColor"/>
  <circle cx="306" cy="227" r="5" fill="currentColor"/>
  <g font-family="inherit" font-size="12" fill="currentColor">
    <text x="160" y="211" text-anchor="middle">A</text>
    <text x="276" y="214" text-anchor="middle">B</text>
    <text x="213" y="182" text-anchor="middle">30 000 kg in total</text>
  </g>
  <line x1="340" y1="208" x2="400" y2="208" stroke="currentColor" stroke-width="2.2" marker-end="url(#m16wg-head)"/>
  <text font-family="inherit" font-size="13" x="370" y="199" text-anchor="middle" fill="currentColor">v ?</text>
</svg>
