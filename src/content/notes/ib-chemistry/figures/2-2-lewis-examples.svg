<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 232" role="img" aria-labelledby="t">
<title id="t">Three Lewis formulas with bonds as lines and lone pairs as pairs of dots. Methanol: a carbon atom bonded to three hydrogen atoms and to an oxygen atom, and the oxygen bonded to a hydrogen atom; the oxygen has two lone pairs. Hypochlorite ion: a chlorine atom singly bonded to an oxygen atom, each with three lone pairs, inside square brackets with a minus charge at the top right. Beryllium chloride: a beryllium atom singly bonded to two chlorine atoms, each chlorine with three lone pairs and beryllium with none, so beryllium has only four electrons around it.</title>
