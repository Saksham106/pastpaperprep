<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="t"><title id="t">A cobalt 3 plus ion at the centre with six ammonia molecules arranged around it, drawn flat: two on the left, two on the right, one above and one below. An arrow points from the nitrogen atom of each ammonia molecule to the cobalt ion, showing a coordination bond. The whole complex is in square brackets with a 3 plus charge outside. Labels below: cobalt 3 plus is the Lewis acid and accepts six electron pairs; each ammonia is a Lewis base and donates the lone pair on nitrogen. Charge: plus 3 plus six times zero gives 3 plus.</title>
<defs><marker id="f617-ch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--t3-ink)"/></marker><marker id="f617-cb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<text x="260.0" y="146.5" text-anchor="middle" font-size="18" fill="currentColor" font-family="inherit">Co³⁺</text>
<text x="272.0" y="54.5" text-anchor="middle" font-size="18" fill="currentColor" font-family="inherit">NH₃</text>
<line x1="260.0" y1="63.0" x2="260.0" y2="114.0" stroke="currentColor" stroke-width="2" marker-end="url(#f617-cb)"/>
<text x="351.7" y="100.5" text-anchor="middle" font-size="18" fill="currentColor" font-family="inherit">NH₃</text>
<line x1="326.7" y1="101.5" x2="282.5" y2="127.0" stroke="currentColor" stroke-width="2" marker-end="url(#f617-cb)"/>
<text x="351.7" y="192.5" text-anchor="middle" font-size="18" fill="currentColor" font-family="inherit">NH₃</text>
<line x1="326.7" y1="178.5" x2="282.5" y2="153.0" stroke="currentColor" stroke-width="2" marker-end="url(#f617-cb)"/>
<text x="272.0" y="238.5" text-anchor="middle" font-size="18" fill="currentColor" font-family="inherit">NH₃</text>
<line x1="260.0" y1="217.0" x2="260.0" y2="166.0" stroke="currentColor" stroke-width="2" marker-end="url(#f617-cb)"/>
<text x="168.3" y="192.5" text-anchor="middle" font-size="18" fill="currentColor" font-family="inherit">H₃N</text>
<line x1="193.3" y1="178.5" x2="237.5" y2="153.0" stroke="currentColor" stroke-width="2" marker-end="url(#f617-cb)"/>
<text x="168.3" y="100.5" text-anchor="middle" font-size="18" fill="currentColor" font-family="inherit">H₃N</text>
<line x1="193.3" y1="101.5" x2="237.5" y2="127.0" stroke="currentColor" stroke-width="2" marker-end="url(#f617-cb)"/>
<path d="M150 30 h-8 v222 h8" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M370 30 h8 v222 h-8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="398.0" y="42.5" text-anchor="middle" font-size="18" fill="currentColor" font-family="inherit">3+</text>
<text x="260.0" y="284.0" text-anchor="middle" font-size="13" fill="currentColor" font-family="inherit">Co³⁺: Lewis acid, accepts six electron pairs</text>
<text x="260.0" y="302.0" text-anchor="middle" font-size="13" fill="currentColor" font-family="inherit">NH₃: Lewis base, donates the lone pair on N</text>
<text x="260.0" y="320.0" text-anchor="middle" font-size="13" fill="currentColor" font-family="inherit">charge: (+3) + 6 × 0 = 3+</text>
</svg>