<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t">
<title id="t">Graph of mass of magnesium oxide in grams, from 0 to 0.60, against mass of magnesium in grams, from 0 to 0.40. Five points are plotted as crosses. Four of them, at 0.08, 0.16, 0.24 and 0.40 grams of magnesium, lie on a straight line of best fit drawn from the origin; the 0.40 gram point is at 0.663. The point at 0.32 grams of magnesium, 0.452, lies well below the line and is circled and labelled anomalous: left out.</title>
