<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t619hyd">
  <title id="t619hyd">Acid-catalysed hydration of ethene in three steps: the double bond attacks a hydrogen ion, water bonds to the carbocation, then the protonated alcohol loses a hydrogen ion to give ethanol</title>
  <defs>
    <marker id="m619hyd-curly" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/>
    </marker>
    <marker id="m619hyd-react" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="currentColor" font-family="inherit">

<text x="10" y="22" font-size="13" text-anchor="start" fill="var(--muted)">Step 1: the C=C bond attacks H⁺. Step 2: a lone pair on water bonds to the carbocation.</text>
<text x="64" y="106" font-size="16">C</text>
<text x="124" y="106" font-size="16">C</text>
<line x1="79" y1="96" x2="121" y2="96" stroke="currentColor" stroke-width="1.6"/>
<line x1="79" y1="104" x2="121" y2="104" stroke="currentColor" stroke-width="1.6"/>
<line x1="64" y1="91" x2="50" y2="74" stroke="currentColor" stroke-width="1.6"/>
<text x="38" y="72" font-size="16">H</text>
<line x1="64" y1="109" x2="50" y2="126" stroke="currentColor" stroke-width="1.6"/>
<text x="38" y="142" font-size="16">H</text>
<line x1="136" y1="91" x2="150" y2="74" stroke="currentColor" stroke-width="1.6"/>
<text x="150" y="72" font-size="16">H</text>
<line x1="136" y1="109" x2="150" y2="126" stroke="currentColor" stroke-width="1.6"/>
<text x="150" y="142" font-size="16">H</text>
<text x="196" y="106" font-size="16">H</text>
<text x="208" y="94" font-size="15">+</text>
<path d="M100,92 Q150,10 194,90" stroke="var(--t1-ink)" stroke-width="1.8" fill="none" marker-end="url(#m619hyd-curly)"/>
<line x1="240" y1="100" x2="285" y2="100" stroke="currentColor" stroke-width="1.6" marker-end="url(#m619hyd-react)"/>
<text x="262.5" y="90" font-size="12" text-anchor="middle" fill="var(--muted)">step 1</text>
<text x="303" y="106" font-size="16">CH<tspan font-size="11" dy="4">3</tspan></text>
<line x1="332" y1="100" x2="351" y2="100" stroke="currentColor" stroke-width="1.6"/>
<text x="354" y="106" font-size="16">C</text>
<text x="366" y="124" font-size="15">+</text>
<line x1="360" y1="90" x2="360" y2="72" stroke="currentColor" stroke-width="1.6"/>
<text x="354" y="68" font-size="16">H</text>
<line x1="360" y1="110" x2="360" y2="128" stroke="currentColor" stroke-width="1.6"/>
<text x="354" y="146" font-size="16">H</text>
<text x="420" y="106" font-size="16">H</text>
<line x1="434" y1="100" x2="448" y2="100" stroke="currentColor" stroke-width="1.6"/>
<text x="451" y="106" font-size="16">O</text>
<line x1="467" y1="100" x2="481" y2="100" stroke="currentColor" stroke-width="1.6"/>
<text x="484" y="106" font-size="16">H</text>
<circle cx="455" cy="82" r="1.8"/><circle cx="462" cy="82" r="1.8"/>
<path d="M458,78 Q420,50 376,94" stroke="var(--t1-ink)" stroke-width="1.8" fill="none" marker-end="url(#m619hyd-curly)"/>
<text x="170" y="160" font-size="12" text-anchor="middle" fill="var(--muted)">ethene + H⁺ (from the acid catalyst)</text>
<text x="410" y="160" font-size="12" text-anchor="middle" fill="var(--muted)">carbocation + water</text>
<text x="10" y="202" font-size="13" text-anchor="start" fill="var(--muted)">Step 3: an O–H bond breaks, giving ethanol and H⁺, so the catalyst is regenerated.</text>
<line x1="20" y1="270" x2="65" y2="270" stroke="currentColor" stroke-width="1.6" marker-end="url(#m619hyd-react)"/>
<text x="42.5" y="260" font-size="12" text-anchor="middle" fill="var(--muted)">step 2</text>
<text x="76" y="276" font-size="16">CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">CH</tspan><tspan font-size="11" dy="4">2</tspan></text>
<line x1="146" y1="270" x2="166" y2="270" stroke="currentColor" stroke-width="1.6"/>
<text x="169" y="276" font-size="16">O</text>
<text x="183" y="263" font-size="15">+</text>
<line x1="185" y1="270" x2="205" y2="270" stroke="currentColor" stroke-width="1.6"/>
<text x="208" y="276" font-size="16">H</text>
<line x1="175" y1="259" x2="175" y2="242" stroke="currentColor" stroke-width="1.6"/>
<text x="169" y="238" font-size="16">H</text>
<path d="M195,274 Q190,300 180,284" stroke="var(--t1-ink)" stroke-width="1.8" fill="none" marker-end="url(#m619hyd-curly)"/>
<line x1="240" y1="270" x2="285" y2="270" stroke="currentColor" stroke-width="1.6" marker-end="url(#m619hyd-react)"/>
<text x="262.5" y="260" font-size="12" text-anchor="middle" fill="var(--muted)">step 3</text>
<text x="300" y="276" font-size="16">CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">CH</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">OH</tspan></text>
<text x="395" y="276" font-size="16">+</text>
<text x="415" y="276" font-size="16">H</text>
<text x="427" y="264" font-size="15">+</text>
<text x="140" y="322" font-size="12" text-anchor="middle" fill="var(--muted)">protonated alcohol</text>
<text x="370" y="322" font-size="12" text-anchor="middle" fill="var(--muted)">ethanol + H⁺ (catalyst back)</text>
  </g>
</svg>
