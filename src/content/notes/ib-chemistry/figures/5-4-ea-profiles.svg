<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-labelledby="t54ea">
  <title id="t54ea">Two energy profiles, potential energy against reaction coordinate. Left, exothermic: the curve starts at a reactants level, rises over a hump and falls to a products level below the reactants. An upward arrow from the reactants level to the top of the hump is labelled activation energy, and a downward arrow from reactants to products is labelled delta H, negative. Right, endothermic: the products level is above the reactants level. An upward arrow from the reactants level to the top of the hump is labelled activation energy, and an upward arrow from reactants to products is labelled delta H, positive. In both, the activation energy is measured from the reactants up to the peak.</title>
  <g font-family="inherit" fill="currentColor"><text x="175" y="20" font-size="14" text-anchor="middle" font-weight="bold">Exothermic</text><text x="505" y="20" font-size="14" text-anchor="middle" font-weight="bold">Endothermic</text></g>
