<title id="t">Graph of temperature in degrees Celsius, from 18 to 36, against time in minutes, from 0 to 10. Readings at 0, 1 and 2 minutes are steady at 21.0. A dashed vertical line at 3 minutes is labelled mixing. Readings from 4 to 10 minutes fall slowly in a straight line from 34.1 to 33.4. The cooling line is extended back, dashed, to 3 minutes, where it reaches 34.2. An arrow labelled delta T runs from 21.0 up to 34.2.</title>
