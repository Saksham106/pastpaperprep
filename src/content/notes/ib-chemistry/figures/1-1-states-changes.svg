<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 345" role="img" aria-labelledby="t">
  <title id="t">Three boxes of particles arranged in a triangle. Bottom left, solid: circles packed closely in regular rows. Bottom right, liquid: circles still close together and mostly touching, but in an irregular arrangement. Top centre, gas: a few circles far apart. Pairs of arrows join each pair of boxes. Solid to liquid is melting and liquid to solid is freezing. Liquid to gas is vaporization and gas to liquid is condensation. Solid to gas is sublimation and gas to solid is deposition. The three arrows towards the gas or liquid, melting, vaporization and sublimation, are one colour and marked energy absorbed. The three reverse arrows, freezing, condensation and deposition, are another colour and marked energy released.</title>
