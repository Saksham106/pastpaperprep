<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 414" role="img" aria-labelledby="t36functionalgroups">
<title id="t36functionalgroups">Table of functional groups with their structures and the class of compound each gives: alkenyl C=C in alkenes; alkynyl C triple bond C in alkynes; halogeno, a halogen atom on carbon, in halogenoalkanes; hydroxyl OH in alcohols; carbonyl C=O, as CHO at the end of a chain in aldehydes or inside the chain in ketones; carboxyl COOH in carboxylic acids; alkoxy O R in ethers; amino NH2 in amines; amido CONH2 or CONH in amides; ester COO in esters; phenyl C6H5 in aromatic compounds</title>
<text x="20.0" y="34.0" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold" font-family="inherit">functional group</text>
<text x="190.0" y="34.0" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold" font-family="inherit">structure</text>
<text x="420.0" y="34.0" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold" font-family="inherit">class of compound</text>
<line x1="15.0" y1="44.0" x2="645.0" y2="44.0" stroke="currentColor" stroke-width="1.4"/>
<rect x="15" y="52" width="630" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="72.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">alkenyl</text>
<text x="190.0" y="72.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C=C</text>
<text x="420.0" y="72.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">alkenes</text>
<text x="20.0" y="102.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">alkynyl</text>
<text x="190.0" y="102.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C≡C</text>
<text x="420.0" y="102.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">alkynes</text>
<rect x="15" y="112" width="630" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="132.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">halogeno</text>
<text x="190.0" y="132.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">–X  (X = F, Cl, Br, I)</text>
<text x="420.0" y="132.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">halogenoalkanes</text>
<text x="20.0" y="162.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">hydroxyl</text>
<text x="190.0" y="162.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">–OH</text>
<text x="420.0" y="162.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">alcohols</text>
<rect x="15" y="172" width="630" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="192.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">carbonyl</text>
<text x="190.0" y="192.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">–CHO  or  C–CO–C</text>
<text x="420.0" y="192.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">aldehydes  or  ketones</text>
<text x="20.0" y="222.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">carboxyl</text>
<text x="190.0" y="222.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">–COOH</text>
<text x="420.0" y="222.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">carboxylic acids</text>
<rect x="15" y="232" width="630" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="252.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">alkoxy</text>
<text x="190.0" y="252.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">–O–R</text>
<text x="420.0" y="252.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">ethers</text>
<text x="20.0" y="282.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">amino</text>
<text x="190.0" y="282.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">–NH<tspan font-size="11" dy="4">2</tspan></text>
<text x="420.0" y="282.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">amines</text>
<rect x="15" y="292" width="630" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="312.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">amido</text>
<text x="190.0" y="312.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">–CONH<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">  or  –CONH–</tspan></text>
<text x="420.0" y="312.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">amides</text>
<text x="20.0" y="342.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">ester</text>
<text x="190.0" y="342.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">–COO–</text>
<text x="420.0" y="342.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">esters</text>
<rect x="15" y="352" width="630" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="372.0" font-size="15" text-anchor="start" fill="var(--t1-ink)" font-family="inherit">phenyl</text>
<text x="190.0" y="372.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">–C<tspan font-size="11" dy="4">6</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">5</tspan></text>
<text x="420.0" y="372.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">aromatic compounds</text>
<text x="330.0" y="402.0" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="inherit">R is a carbon chain; a skeletal or full formula shows the same groups</text>
</svg>
