<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" role="img" aria-labelledby="t">
<title id="t">The oxides of period 3 from sodium to sulfur, with their acid-base character and bonding. Sodium oxide and magnesium oxide are basic and ionic. Aluminium oxide is amphoteric. Silicon dioxide, phosphorus(V) oxide and sulfur trioxide are acidic and covalent.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
</defs>
<g font-family="inherit" fill="currentColor" font-size="12" text-anchor="middle">
<text x="65" y="22">Na</text><text x="150" y="22">Mg</text><text x="235" y="22">Al</text><text x="320" y="22">Si</text><text x="405" y="22">P</text><text x="490" y="22">S</text>
</g>
<g fill="none" stroke-width="1.5">
<rect x="25" y="34" width="80" height="40" rx="5" stroke="var(--t1-ink)"/>
<rect x="110" y="34" width="80" height="40" rx="5" stroke="var(--t1-ink)"/>
<rect x="195" y="34" width="80" height="40" rx="5" stroke="var(--t3-ink)"/>
<rect x="280" y="34" width="80" height="40" rx="5" stroke="var(--t2-ink)"/>
<rect x="365" y="34" width="80" height="40" rx="5" stroke="var(--t2-ink)"/>
<rect x="450" y="34" width="80" height="40" rx="5" stroke="var(--t2-ink)"/>
</g>
<g font-family="inherit" fill="currentColor" font-size="15" text-anchor="middle">
<text x="65" y="59">Na₂O</text><text x="150" y="59">MgO</text><text x="235" y="59">Al₂O₃</text><text x="320" y="59">SiO₂</text><text x="405" y="59">P₄O₁₀</text><text x="490" y="59">SO₃</text>
</g>
<g font-family="inherit" font-size="13" font-weight="600" text-anchor="middle">
<text x="107" y="100" fill="var(--t1-ink)">basic</text>
<text x="235" y="100" fill="var(--t3-ink)">amphoteric</text>
<text x="405" y="100" fill="var(--t2-ink)">acidic</text>
</g>
<g font-family="inherit" fill="currentColor" font-size="11" text-anchor="middle">
<text x="107" y="122">react with acids</text>
<text x="107" y="137">alkaline in water</text>
<text x="235" y="122">react with acids</text>
<text x="235" y="137">and with bases</text>
<text x="405" y="122">react with bases</text>
<text x="405" y="137">acidic in water (not SiO₂: insoluble)</text>
</g>
<g font-family="inherit" fill="currentColor" font-size="12" text-anchor="middle">
<text x="107" y="172">ionic (O²⁻ ions)</text>
<text x="235" y="172">ionic, some</text>
<text x="235" y="186">covalent character</text>
<text x="320" y="172">covalent</text>
<text x="320" y="186">network</text>
<text x="447" y="172">covalent molecules</text>
</g>
<line x1="40" y1="212" x2="520" y2="212" stroke="currentColor" stroke-width="1.2" marker-end="url(#a)"/>
<text x="280" y="236" font-family="inherit" fill="currentColor" font-size="12" text-anchor="middle">electronegativity of the element rises towards oxygen's: metal to non-metal</text>
</svg>
