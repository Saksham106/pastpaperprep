<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="t">
  <title id="t">Comparing the reaction quotient Q with the equilibrium constant K: a mixture always reacts so that Q moves towards K</title>
  <defs>
    <marker id="a510" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="a510f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/>
    </marker>
    <marker id="a510b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t4-ink)"/>
    </marker>
  </defs>
  <line x1="30" y1="130" x2="610" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a510)"/>
  <text x="612" y="172" font-size="13" font-family="inherit" fill="currentColor" text-anchor="end">value of Q</text>
  <line x1="320" y1="60" x2="320" y2="185" stroke="var(--t3-ink)" stroke-width="2.5"/>
  <text x="320" y="48" font-size="14" font-family="inherit" fill="var(--t3-ink)" text-anchor="middle" font-weight="bold">Q = K</text>
  <text x="320" y="205" font-size="12" font-family="inherit" fill="var(--t3-ink)" text-anchor="middle">at equilibrium:</text>
  <text x="320" y="221" font-size="12" font-family="inherit" fill="var(--t3-ink)" text-anchor="middle">no net change</text>
  <line x1="70" y1="105" x2="300" y2="105" stroke="var(--t1-ink)" stroke-width="2.5" marker-end="url(#a510f)"/>
  <text x="170" y="40" font-size="14" font-family="inherit" fill="var(--t1-ink)" text-anchor="middle" font-weight="bold">Q &lt; K</text>
  <text x="170" y="64" font-size="12" font-family="inherit" fill="var(--t1-ink)" text-anchor="middle">net forward reaction</text>
  <text x="170" y="82" font-size="12" font-family="inherit" fill="var(--t1-ink)" text-anchor="middle">products form, Q rises</text>
  <line x1="570" y1="105" x2="340" y2="105" stroke="var(--t4-ink)" stroke-width="2.5" marker-end="url(#a510b)"/>
  <text x="470" y="40" font-size="14" font-family="inherit" fill="var(--t4-ink)" text-anchor="middle" font-weight="bold">Q &gt; K</text>
  <text x="470" y="64" font-size="12" font-family="inherit" fill="var(--t4-ink)" text-anchor="middle">net backward reaction</text>
  <text x="470" y="82" font-size="12" font-family="inherit" fill="var(--t4-ink)" text-anchor="middle">reactants form, Q falls</text>
  <text x="40" y="152" font-size="12" font-family="inherit" fill="var(--muted)">more reactants</text>
  <text x="520" y="152" font-size="12" font-family="inherit" fill="var(--muted)" text-anchor="end">more products</text>
</svg>
