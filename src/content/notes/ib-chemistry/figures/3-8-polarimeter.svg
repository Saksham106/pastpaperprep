<title id="t38polarimeter">Polarimeter, left to right: a lamp gives light vibrating in all planes; a polarizer passes light vibrating in one vertical plane; this plane-polarized light passes through a tube holding a solution of one enantiomer; the plane comes out rotated by an angle alpha; an analyser is turned to find alpha, and an observer looks through it</title>
