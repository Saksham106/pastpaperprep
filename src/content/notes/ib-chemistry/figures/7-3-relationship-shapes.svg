<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-labelledby="t">
<title id="t">Four sketch graphs of y against x, with labelled but unscaled axes. First, direct proportionality: a straight line rising from the origin. Second, inverse proportionality: a curve that starts high near the y-axis and falls ever more slowly, approaching both axes without touching them. Third, positive correlation: points scattered about a rising straight line that starts above the origin. Fourth, negative correlation: points scattered about a falling straight line.</title>
