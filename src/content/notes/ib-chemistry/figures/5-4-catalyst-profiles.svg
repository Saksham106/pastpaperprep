<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="t54cat">
  <title id="t54cat">Two energy profiles, each with an uncatalysed curve and a catalysed curve. Left, exothermic; right, endothermic. In each panel both curves start at the same reactants level and end at the same products level. The catalysed curve, drawn dashed, rises over a much lower hump than the uncatalysed curve. Two upward arrows from the reactants level show the activation energies: the longer one reaches the top of the uncatalysed hump, the shorter one, labelled activation energy catalysed, reaches the top of the catalysed hump. One arrow between the reactants and products levels is labelled delta H, the same for both pathways.</title>
  <g font-family="inherit" fill="currentColor"><text x="175" y="20" font-size="14" text-anchor="middle" font-weight="bold">Exothermic</text><text x="510" y="20" font-size="14" text-anchor="middle" font-weight="bold">Endothermic</text></g>
