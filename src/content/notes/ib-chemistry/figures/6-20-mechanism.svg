<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t620mech">
  <title id="t620mech">Electrophilic substitution of benzene by an electrophile E plus, in two steps: the ring attacks E plus to give a carbocation intermediate, then the C–H bond breaks to restore the ring and release H plus</title>
  <defs>
    <marker id="m620-curly" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/>
    </marker>
    <marker id="m620-react" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- benzene -->
  <g stroke="currentColor" stroke-width="1.8" fill="none">
    <polygon points="80,120 114.6,140 114.6,180 80,200 45.4,180 45.4,140"/>
  </g>
  <circle cx="80" cy="160" r="22" fill="none" stroke="var(--t1-ink)" stroke-width="1.8"/>
  <g font-size="18" fill="currentColor" font-family="inherit">
    <text x="150" y="166">E</text>
    <text x="163" y="154" font-size="14">+</text>
  </g>
  <path d="M94,143 Q120,104 151,148" stroke="var(--t1-ink)" stroke-width="1.8" fill="none" marker-end="url(#m620-curly)"/>

  <!-- step 1 arrow -->
  <line x1="190" y1="160" x2="246" y2="160" stroke="currentColor" stroke-width="1.6" marker-end="url(#m620-react)"/>
  <g font-size="12" fill="var(--muted)" font-family="inherit" text-anchor="middle">
    <text x="218" y="148">step 1</text>
    <text x="218" y="178">slow</text>
  </g>

  <!-- intermediate -->
  <g stroke="currentColor" stroke-width="1.8" fill="none">
    <polygon points="340,120 374.6,140 374.6,180 340,200 305.4,180 305.4,140"/>
    <line x1="340" y1="120" x2="320" y2="96"/>
    <line x1="340" y1="120" x2="360" y2="96"/>
  </g>
  <path d="M321.6,144.6 A24,24 0 1,0 358.4,144.6" fill="none" stroke="var(--t1-ink)" stroke-width="1.8"/>
  <g font-size="18" fill="currentColor" font-family="inherit">
    <text x="306" y="92">H</text>
    <text x="362" y="92">E</text>
    <text x="340" y="172" font-size="16" text-anchor="middle">+</text>
  </g>
  <g font-size="40" fill="currentColor" font-family="inherit" font-weight="300">
    <text x="276" y="178">[</text>
    <text x="386" y="178">]</text>
  </g>
  <path d="M328,108 Q304,126 334,143" stroke="var(--t1-ink)" stroke-width="1.8" fill="none" marker-end="url(#m620-curly)"/>

  <!-- step 2 arrow -->
  <line x1="414" y1="160" x2="470" y2="160" stroke="currentColor" stroke-width="1.6" marker-end="url(#m620-react)"/>
  <g font-size="12" fill="var(--muted)" font-family="inherit" text-anchor="middle">
    <text x="442" y="148">step 2</text>
    <text x="442" y="178">fast</text>
  </g>

  <!-- product -->
  <g stroke="currentColor" stroke-width="1.8" fill="none">
    <polygon points="530,120 564.6,140 564.6,180 530,200 495.4,180 495.4,140"/>
    <line x1="530" y1="120" x2="530" y2="98"/>
  </g>
  <circle cx="530" cy="160" r="22" fill="none" stroke="var(--t1-ink)" stroke-width="1.8"/>
  <g font-size="18" fill="currentColor" font-family="inherit">
    <text x="524" y="92">E</text>
    <text x="578" y="166">+ H</text>
    <text x="611" y="154" font-size="14">+</text>
  </g>

  <g font-size="12" fill="var(--muted)" font-family="inherit" text-anchor="middle">
    <text x="80" y="228">benzene</text>
    <text x="340" y="228">carbocation intermediate</text>
    <text x="340" y="244">(broken ring over five carbons)</text>
    <text x="530" y="228">substituted product</text>
  </g>
  <text x="10" y="22" font-size="13" fill="var(--muted)" font-family="inherit">Curly arrows: step 1 from the ring to E⁺; step 2 from the C–H bond back into the ring</text>
</svg>
