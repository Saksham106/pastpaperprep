<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t613she">
  <title id="t613she">A standard hydrogen electrode joined to a silver half-cell by a wire through a voltmeter and by a salt bridge; the voltmeter reads +0.80 V, silver is the positive terminal and electrons flow from the hydrogen electrode to the silver</title>
  <defs>
    <marker id="m613she-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t5-ink)"/>
    </marker>
  </defs>

  <!-- solutions -->
  <rect x="62" y="170" width="156" height="118" fill="var(--t1-ink)" fill-opacity="0.12"/>
  <rect x="422" y="170" width="156" height="118" fill="var(--t2-ink)" fill-opacity="0.12"/>

  <!-- beakers -->
  <g stroke="currentColor" stroke-width="1.8" fill="none">
    <path d="M60,130 L60,290 L220,290 L220,130"/>
    <path d="M420,130 L420,290 L580,290 L580,130"/>
  </g>
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <line x1="62" y1="170" x2="218" y2="170"/>
    <line x1="422" y1="170" x2="578" y2="170"/>
  </g>

  <!-- salt bridge -->
  <path d="M200,215 L200,125 L440,125 L440,215" fill="none" stroke="var(--t3-ink)" stroke-width="14" stroke-linejoin="round" stroke-opacity="0.55"/>

  <!-- hydrogen electrode: glass tube, gas inlet, platinum -->
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <path d="M112,60 L112,232"/>
    <path d="M148,60 L148,232"/>
    <path d="M112,60 L148,60"/>
    <path d="M148,80 L182,80"/>
    <path d="M148,90 L182,90"/>
  </g>
  <line x1="130" y1="40" x2="130" y2="236" stroke="currentColor" stroke-width="1.5"/>
  <rect x="120" y="236" width="20" height="28" fill="var(--muted)" stroke="currentColor" stroke-width="1.2"/>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <circle cx="116" cy="248" r="3"/>
    <circle cx="146" cy="244" r="3"/>
    <circle cx="112" cy="232" r="2.5"/>
    <circle cx="150" cy="228" r="2.5"/>
  </g>
  <line x1="200" y1="85" x2="152" y2="85" stroke="var(--t5-ink)" stroke-width="1.5" marker-end="url(#m613she-head)"/>

  <!-- silver electrode -->
  <rect x="494" y="40" width="14" height="222" fill="var(--muted)" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/>

  <!-- wires and voltmeter -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M130,40 L130,28 L298,28"/>
    <path d="M342,28 L501,28 L501,40"/>
    <circle cx="320" cy="28" r="22"/>
  </g>
  <line x1="372" y1="14" x2="452" y2="14" stroke="var(--t5-ink)" stroke-width="1.5" marker-end="url(#m613she-head)"/>
  <line x1="190" y1="14" x2="270" y2="14" stroke="var(--t5-ink)" stroke-width="1.5" marker-end="url(#m613she-head)"/>

  <g font-size="13" fill="currentColor" font-family="inherit">
    <text x="320" y="33" text-anchor="middle" font-size="15">V</text>
    <text x="320" y="68" text-anchor="middle" fill="var(--t5-ink)">reads +0.80 V</text>
    <text x="230" y="10" text-anchor="middle" fill="var(--t5-ink)">e⁻</text>
    <text x="412" y="10" text-anchor="middle" fill="var(--t5-ink)">e⁻</text>
    <text x="320" y="152" text-anchor="middle" fill="var(--t3-ink)">salt bridge</text>
    <text x="188" y="106">H₂(g), 100 kPa</text>
    <text x="146" y="282" text-anchor="start">platinum</text>
    <text x="118" y="52" text-anchor="end">−</text>
    <text x="516" y="56">+ silver</text>
    <text x="140" y="310" text-anchor="middle">1.00 mol dm⁻³ H⁺(aq)</text>
    <text x="500" y="310" text-anchor="middle">1.00 mol dm⁻³ Ag⁺(aq)</text>
    <text x="140" y="332" text-anchor="middle" fill="var(--muted)">standard hydrogen electrode</text>
    <text x="500" y="332" text-anchor="middle" fill="var(--muted)">Ag⁺/Ag half-cell</text>
  </g>
</svg>
