<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 215" role="img" aria-labelledby="t37chain">
<title id="t37chain">Condensed structure of 2,4-dimethylhexane with the six-carbon parent chain drawn in a row and numbered 1 to 6 from the left, and a methyl branch hanging below carbon 2 and carbon 4</title>
<text x="50" y="96" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">CH<tspan font-size="13" dy="5">3</tspan><tspan dy="-5"></tspan></text>
<text x="50" y="52" font-size="15" text-anchor="middle" fill="var(--t1-ink)" font-family="inherit" font-weight="600">1</text>
<text x="140" y="96" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">CH</text>
<text x="140" y="52" font-size="15" text-anchor="middle" fill="var(--t1-ink)" font-family="inherit" font-weight="600">2</text>
<text x="230" y="96" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">CH<tspan font-size="13" dy="5">2</tspan><tspan dy="-5"></tspan></text>
<text x="230" y="52" font-size="15" text-anchor="middle" fill="var(--t1-ink)" font-family="inherit" font-weight="600">3</text>
<text x="320" y="96" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">CH</text>
<text x="320" y="52" font-size="15" text-anchor="middle" fill="var(--t1-ink)" font-family="inherit" font-weight="600">4</text>
<text x="410" y="96" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">CH<tspan font-size="13" dy="5">2</tspan><tspan dy="-5"></tspan></text>
<text x="410" y="52" font-size="15" text-anchor="middle" fill="var(--t1-ink)" font-family="inherit" font-weight="600">5</text>
<text x="500" y="96" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">CH<tspan font-size="13" dy="5">3</tspan><tspan dy="-5"></tspan></text>
<text x="500" y="52" font-size="15" text-anchor="middle" fill="var(--t1-ink)" font-family="inherit" font-weight="600">6</text>
<line x1="78" y1="90" x2="112" y2="90" stroke="var(--t1-ink)" stroke-width="2.4"/>
<line x1="168" y1="90" x2="202" y2="90" stroke="var(--t1-ink)" stroke-width="2.4"/>
<line x1="258" y1="90" x2="292" y2="90" stroke="var(--t1-ink)" stroke-width="2.4"/>
<line x1="348" y1="90" x2="382" y2="90" stroke="var(--t1-ink)" stroke-width="2.4"/>
<line x1="438" y1="90" x2="472" y2="90" stroke="var(--t1-ink)" stroke-width="2.4"/>
<line x1="140" y1="102" x2="140" y2="132" stroke="var(--t2-ink)" stroke-width="2.4"/>
<text x="140" y="156" font-size="18" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">CH<tspan font-size="13" dy="5">3</tspan><tspan dy="-5"></tspan></text>
<line x1="320" y1="102" x2="320" y2="132" stroke="var(--t2-ink)" stroke-width="2.4"/>
<text x="320" y="156" font-size="18" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">CH<tspan font-size="13" dy="5">3</tspan><tspan dy="-5"></tspan></text>
<text x="275" y="192" font-size="13" text-anchor="middle" fill="var(--t1-ink)" font-family="inherit">parent chain: six carbons, so the stem is hex-</text>
<text x="275" y="210" font-size="13" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">methyl branches on carbons 2 and 4</text>
</svg>
