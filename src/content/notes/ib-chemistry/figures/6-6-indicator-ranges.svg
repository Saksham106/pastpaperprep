    <text x="170" y="291" text-anchor="middle">0</text><text x="214" y="291" text-anchor="middle">2</text><text x="258" y="291" text-anchor="middle">4</text><text x="302" y="291" text-anchor="middle">6</text><text x="346" y="291" text-anchor="middle">8</text><text x="390" y="291" text-anchor="middle">10</text><text x="434" y="291" text-anchor="middle">12</text><text x="478" y="291" text-anchor="middle">14</text>
    <text x="324" y="310" text-anchor="middle">pH</text>
