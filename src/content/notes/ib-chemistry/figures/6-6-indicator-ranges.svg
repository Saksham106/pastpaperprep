<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 316" role="img" aria-labelledby="t66ir">
  <title id="t66ir">Colour-change ranges of seven indicators on a pH scale from 0 to 14, with a tick at each pKa. Methyl orange, pKa 3.7, range 3.1 to 4.4, red to yellow. Bromophenol blue, pKa 4.2, range 3.0 to 4.6, yellow to blue. Bromocresol green, pKa 4.7, range 4.0 to 5.6, yellow to blue. Methyl red, pKa 5.1, range 4.4 to 6.2, red to yellow. Bromothymol blue, pKa 7.0, range 6.0 to 7.6, yellow to blue. Phenol red, pKa 7.9, range 6.4 to 8.0, yellow to red. Phenolphthalein, pKa 9.6, range 8.0 to 10.0, colourless to pink. Every pKa tick lies inside its range.</title>
  <g font-size="12" font-family="inherit">
  <text x="160" y="45" text-anchor="end" fill="currentColor">methyl orange</text>
  <rect x="238.2" y="32" width="28.6" height="16" rx="3" fill="var(--t1-ink)" opacity="0.35"/>
  <line x1="251.4" y1="29" x2="251.4" y2="51" stroke="currentColor" stroke-width="2"/>
  <text x="233.2" y="44" text-anchor="end" font-size="10" fill="var(--muted)">red</text>
  <text x="271.8" y="44" font-size="10" fill="var(--muted)">yellow</text>
  <text x="160" y="79" text-anchor="end" fill="currentColor">bromophenol blue</text>
  <rect x="236.0" y="66" width="35.2" height="16" rx="3" fill="var(--t2-ink)" opacity="0.35"/>
  <line x1="262.4" y1="63" x2="262.4" y2="85" stroke="currentColor" stroke-width="2"/>
  <text x="231.0" y="78" text-anchor="end" font-size="10" fill="var(--muted)">yellow</text>
  <text x="276.2" y="78" font-size="10" fill="var(--muted)">blue</text>
  <text x="160" y="113" text-anchor="end" fill="currentColor">bromocresol green</text>
  <rect x="258.0" y="100" width="35.2" height="16" rx="3" fill="var(--t3-ink)" opacity="0.35"/>
  <line x1="273.4" y1="97" x2="273.4" y2="119" stroke="currentColor" stroke-width="2"/>
  <text x="253.0" y="112" text-anchor="end" font-size="10" fill="var(--muted)">yellow</text>
  <text x="298.2" y="112" font-size="10" fill="var(--muted)">blue</text>
  <text x="160" y="147" text-anchor="end" fill="currentColor">methyl red</text>
  <rect x="266.8" y="134" width="39.6" height="16" rx="3" fill="var(--t4-ink)" opacity="0.35"/>
  <line x1="282.2" y1="131" x2="282.2" y2="153" stroke="currentColor" stroke-width="2"/>
  <text x="261.8" y="146" text-anchor="end" font-size="10" fill="var(--muted)">red</text>
  <text x="311.4" y="146" font-size="10" fill="var(--muted)">yellow</text>
  <text x="160" y="181" text-anchor="end" fill="currentColor">bromothymol blue</text>
  <rect x="302.0" y="168" width="35.2" height="16" rx="3" fill="var(--t5-ink)" opacity="0.35"/>
  <line x1="324.0" y1="165" x2="324.0" y2="187" stroke="currentColor" stroke-width="2"/>
  <text x="297.0" y="180" text-anchor="end" font-size="10" fill="var(--muted)">yellow</text>
  <text x="342.2" y="180" font-size="10" fill="var(--muted)">blue</text>
  <text x="160" y="215" text-anchor="end" fill="currentColor">phenol red</text>
  <rect x="310.8" y="202" width="35.2" height="16" rx="3" fill="var(--t1-ink)" opacity="0.35"/>
  <line x1="343.8" y1="199" x2="343.8" y2="221" stroke="currentColor" stroke-width="2"/>
  <text x="305.8" y="214" text-anchor="end" font-size="10" fill="var(--muted)">yellow</text>
  <text x="351.0" y="214" font-size="10" fill="var(--muted)">red</text>
  <text x="160" y="249" text-anchor="end" fill="currentColor">phenolphthalein</text>
  <rect x="346.0" y="236" width="44.0" height="16" rx="3" fill="var(--t2-ink)" opacity="0.35"/>
  <line x1="381.2" y1="233" x2="381.2" y2="255" stroke="currentColor" stroke-width="2"/>
  <text x="341.0" y="248" text-anchor="end" font-size="10" fill="var(--muted)">colourless</text>
  <text x="395.0" y="248" font-size="10" fill="var(--muted)">pink</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="170" y1="272" x2="478" y2="272"/>
    <line x1="170" y1="272" x2="170" y2="277"/><line x1="192" y1="272" x2="192" y2="277"/><line x1="214" y1="272" x2="214" y2="277"/><line x1="236" y1="272" x2="236" y2="277"/><line x1="258" y1="272" x2="258" y2="277"/><line x1="280" y1="272" x2="280" y2="277"/><line x1="302" y1="272" x2="302" y2="277"/><line x1="324" y1="272" x2="324" y2="277"/><line x1="346" y1="272" x2="346" y2="277"/><line x1="368" y1="272" x2="368" y2="277"/><line x1="390" y1="272" x2="390" y2="277"/><line x1="412" y1="272" x2="412" y2="277"/><line x1="434" y1="272" x2="434" y2="277"/><line x1="456" y1="272" x2="456" y2="277"/><line x1="478" y1="272" x2="478" y2="277"/>
