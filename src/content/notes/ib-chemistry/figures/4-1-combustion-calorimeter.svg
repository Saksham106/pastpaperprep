<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="t">
  <title id="t">Apparatus for measuring an enthalpy of combustion. A spirit burner containing the liquid fuel sits on the bench, with a flame at its wick. Directly above the flame is a copper can holding a measured mass of water, covered by a lid. A thermometer passes through the lid into the water. Two upright panels either side form a draught shield around the flame and the can.</title>
