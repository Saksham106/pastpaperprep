<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
  <title id="t">pH curve for adding 0.100 mol per cubic decimetre sodium hydroxide to 25.0 cubic centimetres of 0.100 mol per cubic decimetre hydrochloric acid. pH on the vertical axis from 0 to 14, volume of sodium hydroxide added on the horizontal axis from 0 to 50 cubic centimetres. The curve starts at pH 1.00 on the pH axis, rises slowly to about pH 2 at 22 cubic centimetres, then rises almost vertically from about pH 3 to about pH 11 around 25.0 cubic centimetres. The equivalence point is marked at 25.0 cubic centimetres and pH 7.00, with dashed lines to both axes. After it the curve levels off, reaching about pH 12.5 at 50 cubic centimetres.</title>
  <path d="M60 250 H440" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M60 250 V30" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <g stroke="currentColor" stroke-width="1.2">
    <path d="M136 250 v5"/>
    <path d="M212 250 v5"/>
    <path d="M288 250 v5"/>
    <path d="M364 250 v5"/>
    <path d="M440 250 v5"/>
    <path d="M60 220 h-5"/>
    <path d="M60 190 h-5"/>
    <path d="M60 160 h-5"/>
    <path d="M60 130 h-5"/>
    <path d="M60 100 h-5"/>
    <path d="M60 70 h-5"/>
    <path d="M60 40 h-5"/>
  </g>
  <g font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="60" y="268">0</text>
    <text x="136" y="268">10</text>
    <text x="212" y="268">20</text>
    <text x="288" y="268">30</text>
    <text x="364" y="268">40</text>
    <text x="440" y="268">50</text>
  </g>
  <g font-size="11" fill="currentColor" font-family="inherit" text-anchor="end">
    <text x="51" y="254">0</text>
    <text x="51" y="224">2</text>
    <text x="51" y="194">4</text>
    <text x="51" y="164">6</text>
    <text x="51" y="134">8</text>
    <text x="51" y="104">10</text>
    <text x="51" y="74">12</text>
    <text x="51" y="44">14</text>
  </g>
  <text x="250" y="292" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">volume of NaOH(aq) added / cm³</text>
  <text x="18" y="145" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle" transform="rotate(-90 18 145)">pH</text>
  <path d="M60 145 H250 V250" fill="none" stroke="var(--t2-ink)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M60.0 235.0 L75.2 234.0 L90.4 232.9 L105.6 231.8 L120.8 230.7 L136.0 229.5 L151.2 228.2 L166.4 226.8 L181.6 225.1 L196.8 223.2 L212.0 220.7 L227.2 217.1 L234.8 214.3 L242.4 209.6 L246.2 205.1 L248.5 199.1 L249.2 194.5 L249.6 190.0 L250.0 145.0 L250.4 100.0 L250.8 95.5 L251.5 91.0 L253.8 85.1 L257.6 80.6 L265.2 76.2 L272.8 73.7 L288.0 70.6 L303.2 68.7 L318.4 67.2 L333.6 66.2 L348.8 65.3 L364.0 64.6 L379.2 63.9 L394.4 63.4 L409.6 62.9 L424.8 62.5 L440.0 62.2" fill="none" stroke="var(--t1-ink)" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="60" cy="235" r="4" fill="var(--t3-ink)"/>
  <circle cx="250" cy="145" r="4.5" fill="var(--t2-ink)"/>
  <g font-size="12" font-family="inherit">
    <text x="70" y="200" fill="var(--t3-ink)">start: pH 1.00</text>
    <text x="70" y="214" fill="var(--t3-ink)">(the acid alone)</text>
    <text x="262" y="142" fill="var(--t2-ink)">equivalence point</text>
    <text x="262" y="156" fill="var(--t2-ink)">25.0 cm³, pH 7.00</text>
    <text x="262" y="112" fill="currentColor">steep rise, pH 3 to 11</text>
    <text x="330" y="56" fill="currentColor">excess NaOH</text>
  </g>
</svg>
