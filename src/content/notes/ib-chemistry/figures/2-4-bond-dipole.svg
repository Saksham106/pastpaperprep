<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 195" role="img" aria-labelledby="t" font-family="inherit">
<title id="t">Two ways to show the polar H–Cl bond: partial charges, delta plus on hydrogen and delta minus on chlorine, or a dipole arrow with a crossed tail at hydrogen pointing towards chlorine</title>
<line x1="70.0" y1="95.0" x2="190.0" y2="95.0" stroke="currentColor" stroke-width="2.5"/>
<circle cx="70.0" cy="95.0" r="12" fill="var(--surface, white)" stroke="currentColor" stroke-width="1.5"/><text x="70.0" y="99.5" text-anchor="middle" font-size="13" fill="currentColor">H</text>
<circle cx="190.0" cy="95.0" r="15" fill="var(--surface, white)" stroke="currentColor" stroke-width="1.5"/><text x="190.0" y="99.5" text-anchor="middle" font-size="13" fill="currentColor">Cl</text>
<text x="70.0" y="67.0" text-anchor="middle" font-size="16" fill="var(--t2-ink)">δ+</text>
<text x="190.0" y="65.0" text-anchor="middle" font-size="16" fill="var(--t2-ink)">δ−</text>
<text x="130.0" y="178.0" text-anchor="middle" font-size="13" fill="currentColor">partial charges</text>
<line x1="330.0" y1="95.0" x2="450.0" y2="95.0" stroke="currentColor" stroke-width="2.5"/>
<circle cx="330.0" cy="95.0" r="12" fill="var(--surface, white)" stroke="currentColor" stroke-width="1.5"/><text x="330.0" y="99.5" text-anchor="middle" font-size="13" fill="currentColor">H</text>
<circle cx="450.0" cy="95.0" r="15" fill="var(--surface, white)" stroke="currentColor" stroke-width="1.5"/><text x="450.0" y="99.5" text-anchor="middle" font-size="13" fill="currentColor">Cl</text>
<line x1="334.0" y1="65.0" x2="436.0" y2="65.0" stroke="var(--t2-ink)" stroke-width="2.5"/><polygon points="446.0,65.0 436.0,70.5 436.0,59.5" fill="var(--t2-ink)"/><line x1="340.0" y1="70.0" x2="340.0" y2="60.0" stroke="var(--t2-ink)" stroke-width="2.5"/>
<text x="390.0" y="178.0" text-anchor="middle" font-size="13" fill="currentColor">dipole arrow</text>
<text x="390.0" y="137.0" text-anchor="middle" font-size="12" fill="var(--muted)">points to the δ− end</text>
<text x="70.0" y="135.0" text-anchor="middle" font-size="12" fill="var(--muted)">2.2</text>
<text x="190.0" y="135.0" text-anchor="middle" font-size="12" fill="var(--muted)">3.2</text>
<text x="130.0" y="153.0" text-anchor="middle" font-size="12" fill="var(--muted)">electronegativity</text>
</svg>
