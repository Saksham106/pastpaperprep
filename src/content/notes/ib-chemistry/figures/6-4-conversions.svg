<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" role="img" aria-labelledby="t">
  <title id="t">Conversion square for four quantities at 298 K. Top left: hydrogen ion concentration. Top right: hydroxide ion concentration. Bottom left: pH. Bottom right: pOH. A two-way arrow joins the two concentrations, labelled: their product equals Kw, 1.00 times 10 to the minus 14. A two-way arrow joins pH and pOH, labelled: pH plus pOH equals 14.00. On each side a downward arrow from concentration to p-value is labelled minus log base 10, and an upward arrow from p-value back to concentration is labelled 10 to the power minus pH on the left and 10 to the power minus pOH on the right.</title>
  <g fill="none" stroke="currentColor" stroke-width="1.6">
    <rect x="60" y="30" width="100" height="44" rx="6"/>
    <rect x="310" y="30" width="100" height="44" rx="6"/>
    <rect x="60" y="176" width="100" height="44" rx="6"/>
    <rect x="310" y="176" width="100" height="44" rx="6"/>
  </g>
  <g font-size="15" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="110" y="57">[H<tspan baseline-shift="super" font-size="10">+</tspan>]</text>
    <text x="360" y="57">[OH<tspan baseline-shift="super" font-size="10">−</tspan>]</text>
    <text x="110" y="203">pH</text>
    <text x="360" y="203">pOH</text>
  </g>
  <path d="M171 52 H299" fill="none" stroke="var(--t1-ink)" stroke-width="1.8"/>
  <polygon points="162,52 171,47.5 171,56.5" fill="var(--t1-ink)"/>
  <polygon points="308,52 299,47.5 299,56.5" fill="var(--t1-ink)"/>
  <path d="M171 198 H299" fill="none" stroke="var(--t2-ink)" stroke-width="1.8"/>
  <polygon points="162,198 171,193.5 171,202.5" fill="var(--t2-ink)"/>
  <polygon points="308,198 299,193.5 299,202.5" fill="var(--t2-ink)"/>
  <g font-size="12" font-family="inherit" text-anchor="middle">
    <text x="235" y="40" fill="var(--t1-ink)">[H<tspan baseline-shift="super" font-size="9">+</tspan>][OH<tspan baseline-shift="super" font-size="9">−</tspan>] = K<tspan baseline-shift="sub" font-size="9">w</tspan></text>
    <text x="235" y="74" fill="var(--t1-ink)">= 1.00 × 10<tspan baseline-shift="super" font-size="9">−14</tspan></text>
    <text x="235" y="188" fill="var(--t2-ink)">pH + pOH = 14.00</text>
  </g>
  <g fill="none" stroke="var(--t3-ink)" stroke-width="1.8">
    <path d="M90 78 V165"/>
    <path d="M130 172 V87"/>
    <path d="M340 78 V165"/>
    <path d="M380 172 V87"/>
  </g>
  <g fill="var(--t3-ink)">
    <polygon points="90,174 85.5,165 94.5,165"/>
    <polygon points="130,78 125.5,87 134.5,87"/>
    <polygon points="340,174 335.5,165 344.5,165"/>
    <polygon points="380,78 375.5,87 384.5,87"/>
  </g>
  <g font-size="12" font-family="inherit" fill="var(--t3-ink)">
    <text x="84" y="130" text-anchor="end">−log<tspan baseline-shift="sub" font-size="9">10</tspan></text>
    <text x="136" y="130">10<tspan baseline-shift="super" font-size="9">−pH</tspan></text>
    <text x="334" y="130" text-anchor="end">−log<tspan baseline-shift="sub" font-size="9">10</tspan></text>
    <text x="386" y="130">10<tspan baseline-shift="super" font-size="9">−pOH</tspan></text>
  </g>
  <text x="235" y="242" font-size="12" fill="var(--muted)" font-family="inherit" text-anchor="middle">all values at 298 K</text>
</svg>
