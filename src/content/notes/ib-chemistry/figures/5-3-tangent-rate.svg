<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="t">
<title id="t">Graph of concentration of reactant A, in mol per cubic decimetre, against time in seconds, from 0 to 150 seconds. The curve starts at 0.80 at time zero and falls, steeply at first and then more gently, reaching about 0.04 at 150 seconds. Tangent 1 touches the curve at time zero and meets the time axis at 50 seconds. Tangent 2 touches the curve at 50 seconds, where the concentration is about 0.29; it crosses the concentration axis at 0.59 and meets the time axis at 100 seconds. Tangent 2 is less steep than tangent 1.</title>
