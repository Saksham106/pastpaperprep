<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" role="img" aria-labelledby="t36homologousseries">
<title id="t36homologousseries">Table of twelve homologous series with general formula and first member, where n is the number of carbon atoms: alkanes CnH2n+2, methane; alkenes CnH2n, ethene; alkynes CnH2n minus 2, ethyne; halogenoalkanes CnH2n+1X, chloromethane; alcohols CnH2n+1OH, methanol; aldehydes CnH2nO, methanal; ketones CnH2nO, propanone; carboxylic acids CnH2nO2, methanoic acid; ethers CnH2n+2O, methoxymethane; amines CnH2n+3N, methanamine; amides CnH2n+1NO, methanamide; esters CnH2nO2, methyl methanoate</title>
<text x="20.0" y="34.0" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold" font-family="inherit">homologous series</text>
<text x="200.0" y="34.0" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold" font-family="inherit">general formula</text>
<text x="370.0" y="34.0" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold" font-family="inherit">first member</text>
<line x1="15.0" y1="44.0" x2="665.0" y2="44.0" stroke="currentColor" stroke-width="1.4"/>
<rect x="15" y="52" width="650" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="72.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">alkanes</text>
<text x="200.0" y="72.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n+2</tspan></text>
<text x="370.0" y="72.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">methane, CH<tspan font-size="11" dy="4">4</tspan></text>
<text x="20.0" y="102.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">alkenes</text>
<text x="200.0" y="102.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n</tspan></text>
<text x="370.0" y="102.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">ethene, C<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">4</tspan></text>
<rect x="15" y="112" width="650" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="132.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">alkynes</text>
<text x="200.0" y="132.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n−2</tspan></text>
<text x="370.0" y="132.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">ethyne, C<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2</tspan></text>
<text x="20.0" y="162.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">halogenoalkanes</text>
<text x="200.0" y="162.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n+1</tspan><tspan dy="-4">X</tspan></text>
<text x="370.0" y="162.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">chloromethane, CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">Cl</tspan></text>
<rect x="15" y="172" width="650" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="192.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">alcohols</text>
<text x="200.0" y="192.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n+1</tspan><tspan dy="-4">OH</tspan></text>
<text x="370.0" y="192.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">methanol, CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">OH</tspan></text>
<text x="20.0" y="222.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">aldehydes</text>
<text x="200.0" y="222.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n</tspan><tspan dy="-4">O</tspan></text>
<text x="370.0" y="222.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">methanal, HCHO</text>
<rect x="15" y="232" width="650" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="252.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">ketones</text>
<text x="200.0" y="252.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n</tspan><tspan dy="-4">O</tspan></text>
<text x="370.0" y="252.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">propanone, CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">COCH</tspan><tspan font-size="11" dy="4">3</tspan></text>
<text x="20.0" y="282.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">carboxylic acids</text>
<text x="200.0" y="282.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n</tspan><tspan dy="-4">O</tspan><tspan font-size="11" dy="4">2</tspan></text>
<text x="370.0" y="282.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">methanoic acid, HCOOH</text>
<rect x="15" y="292" width="650" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="312.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">ethers</text>
<text x="200.0" y="312.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n+2</tspan><tspan dy="-4">O</tspan></text>
<text x="370.0" y="312.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">methoxymethane, CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">OCH</tspan><tspan font-size="11" dy="4">3</tspan></text>
<text x="20.0" y="342.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">amines</text>
<text x="200.0" y="342.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n+3</tspan><tspan dy="-4">N</tspan></text>
<text x="370.0" y="342.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">methanamine, CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">NH</tspan><tspan font-size="11" dy="4">2</tspan></text>
<rect x="15" y="352" width="650" height="30" fill="var(--muted)" opacity="0.12"/>
<text x="20.0" y="372.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">amides</text>
<text x="200.0" y="372.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n+1</tspan><tspan dy="-4">NO</tspan></text>
<text x="370.0" y="372.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">methanamide, HCONH<tspan font-size="11" dy="4">2</tspan></text>
<text x="20.0" y="402.0" font-size="15" text-anchor="start" fill="var(--t2-ink)" font-family="inherit">esters</text>
<text x="200.0" y="402.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">C<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">2n</tspan><tspan dy="-4">O</tspan><tspan font-size="11" dy="4">2</tspan></text>
<text x="370.0" y="402.0" font-size="15" text-anchor="start" fill="currentColor" font-family="inherit">methyl methanoate, HCOOCH<tspan font-size="11" dy="4">3</tspan></text>
<text x="340.0" y="432.0" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="inherit">n = number of carbon atoms; open-chain members with one functional group and no other multiple bond</text>
</svg>
