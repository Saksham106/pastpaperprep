<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-labelledby="t" font-family="inherit">
<title id="t">A number line of the oxidation state of nitrogen from minus 3 to plus 5. Above it: ammonia, NH3, at minus 3; nitrogen gas, N2, at 0; dinitrogen monoxide, N2O, at plus 1; nitrogen monoxide, NO, at plus 2; nitrogen dioxide, NO2, at plus 4; the nitrate ion, NO3 minus, at plus 5. An arrow pointing right is labelled oxidation, oxidation state increases. An arrow pointing left is labelled reduction, oxidation state decreases.</title>
<defs>
<marker id="ah68o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--t1-ink)"/></marker>
<marker id="ah68r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--t3-ink)"/></marker>
</defs>
<line x1="40" y1="96" x2="520" y2="96" stroke="currentColor" stroke-width="1.5"/>
<g stroke="currentColor" stroke-width="1.5">
<line x1="40" y1="90" x2="40" y2="102"/><line x1="100" y1="90" x2="100" y2="102"/><line x1="160" y1="90" x2="160" y2="102"/>
<line x1="220" y1="90" x2="220" y2="102"/><line x1="280" y1="90" x2="280" y2="102"/><line x1="340" y1="90" x2="340" y2="102"/>
<line x1="400" y1="90" x2="400" y2="102"/><line x1="460" y1="90" x2="460" y2="102"/><line x1="520" y1="90" x2="520" y2="102"/>
</g>
<g font-size="14" text-anchor="middle" fill="var(--muted)">
<text x="40" y="122">−3</text><text x="100" y="122">−2</text><text x="160" y="122">−1</text><text x="220" y="122">0</text>
<text x="280" y="122">+1</text><text x="340" y="122">+2</text><text x="400" y="122">+3</text><text x="460" y="122">+4</text><text x="520" y="122">+5</text>
</g>
<g font-size="16" font-weight="600" text-anchor="middle" fill="var(--t2-ink)">
<text x="40" y="74">NH<tspan font-size="11" dy="4">3</tspan></text>
<text x="220" y="74">N<tspan font-size="11" dy="4">2</tspan></text>
<text x="280" y="74">N<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">O</tspan></text>
<text x="340" y="74">NO</text>
<text x="460" y="74">NO<tspan font-size="11" dy="4">2</tspan></text>
<text x="520" y="74">NO<tspan font-size="11" dy="4">3</tspan><tspan font-size="11" dy="-12">−</tspan></text>
</g>
<text x="280" y="30" text-anchor="middle" font-size="13" fill="currentColor">Oxidation state of nitrogen</text>
<line x1="300" y1="152" x2="500" y2="152" stroke="var(--t1-ink)" stroke-width="1.8" marker-end="url(#ah68o)"/>
<text x="400" y="144" text-anchor="middle" font-size="13" fill="var(--t1-ink)">oxidation: state increases</text>
<line x1="260" y1="182" x2="60" y2="182" stroke="var(--t3-ink)" stroke-width="1.8" marker-end="url(#ah68r)"/>
<text x="160" y="174" text-anchor="middle" font-size="13" fill="var(--t3-ink)">reduction: state decreases</text>
</svg>
