<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-labelledby="t">
  <title id="t">Three boxes side by side showing the particles of one substance as a solid, a liquid and a gas. Left, solid: particles packed in a regular grid, touching, each only vibrating in place. Middle, liquid: particles still close together, but in an irregular arrangement with small gaps, with small curved arrows showing they move past one another. Right, gas: a few particles far apart, spread through the whole box, each with a straight arrow showing fast movement in a random direction. Under the liquid box: water, standard entropy 70 joules per kelvin per mole. Under the gas box: steam, standard entropy 189 joules per kelvin per mole. A long arrow under all three boxes points from left to right and is labelled entropy increases: more ways to arrange the particles and their energy.</title>
