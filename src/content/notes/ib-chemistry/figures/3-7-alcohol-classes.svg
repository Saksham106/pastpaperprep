<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-labelledby="t37classes">
<title id="t37classes">Three alcohols, each drawn around the carbon atom that holds the OH group. Ethanol: that carbon is bonded to one methyl group and two hydrogen atoms, so the alcohol is primary. Propan-2-ol: it is bonded to two methyl groups and one hydrogen atom, so the alcohol is secondary. 2-Methylpropan-2-ol: it is bonded to three methyl groups, so the alcohol is tertiary.</title>
<text x="100" y="28" font-size="14" text-anchor="middle" fill="var(--muted)" font-family="inherit">ethanol</text>
<text x="100" y="131" font-size="18" text-anchor="middle" fill="var(--t1-ink)" font-family="inherit" font-weight="600">C</text>
<text x="38" y="131" font-size="18" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">CH<tspan font-size="13" dy="5">3</tspan><tspan dy="-5"></tspan></text>
<line x1="64" y1="125" x2="89" y2="125" stroke="var(--t2-ink)" stroke-width="2.4"/>
<text x="148" y="131" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">OH</text>
<line x1="111" y1="125" x2="130" y2="125" stroke="currentColor" stroke-width="2"/>
<text x="100" y="73" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">H</text>
<line x1="100" y1="109" x2="100" y2="81" stroke="currentColor" stroke-width="2"/>
<text x="100" y="189" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">H</text>
<line x1="100" y1="139" x2="100" y2="165" stroke="currentColor" stroke-width="2"/>
<text x="100" y="232" font-size="13" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">one carbon: primary</text>
<text x="300" y="28" font-size="14" text-anchor="middle" fill="var(--muted)" font-family="inherit">propan-2-ol</text>
<text x="300" y="131" font-size="18" text-anchor="middle" fill="var(--t1-ink)" font-family="inherit" font-weight="600">C</text>
<text x="238" y="131" font-size="18" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">CH<tspan font-size="13" dy="5">3</tspan><tspan dy="-5"></tspan></text>
<line x1="264" y1="125" x2="289" y2="125" stroke="var(--t2-ink)" stroke-width="2.4"/>
<text x="348" y="131" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">OH</text>
<line x1="311" y1="125" x2="330" y2="125" stroke="currentColor" stroke-width="2"/>
<text x="300" y="73" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">H</text>
<line x1="300" y1="109" x2="300" y2="81" stroke="currentColor" stroke-width="2"/>
<text x="300" y="189" font-size="18" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">CH<tspan font-size="13" dy="5">3</tspan><tspan dy="-5"></tspan></text>
<line x1="300" y1="139" x2="300" y2="165" stroke="var(--t2-ink)" stroke-width="2.4"/>
<text x="300" y="232" font-size="13" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">two carbons: secondary</text>
<text x="500" y="28" font-size="14" text-anchor="middle" fill="var(--muted)" font-family="inherit">2-methylpropan-2-ol</text>
<text x="500" y="131" font-size="18" text-anchor="middle" fill="var(--t1-ink)" font-family="inherit" font-weight="600">C</text>
<text x="438" y="131" font-size="18" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">CH<tspan font-size="13" dy="5">3</tspan><tspan dy="-5"></tspan></text>
<line x1="464" y1="125" x2="489" y2="125" stroke="var(--t2-ink)" stroke-width="2.4"/>
<text x="548" y="131" font-size="18" text-anchor="middle" fill="currentColor" font-family="inherit">OH</text>
<line x1="511" y1="125" x2="530" y2="125" stroke="currentColor" stroke-width="2"/>
<text x="500" y="73" font-size="18" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">CH<tspan font-size="13" dy="5">3</tspan><tspan dy="-5"></tspan></text>
<line x1="500" y1="109" x2="500" y2="81" stroke="var(--t2-ink)" stroke-width="2.4"/>
<text x="500" y="189" font-size="18" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">CH<tspan font-size="13" dy="5">3</tspan><tspan dy="-5"></tspan></text>
<line x1="500" y1="139" x2="500" y2="165" stroke="var(--t2-ink)" stroke-width="2.4"/>
<text x="500" y="232" font-size="13" text-anchor="middle" fill="var(--t2-ink)" font-family="inherit">three carbons: tertiary</text>
