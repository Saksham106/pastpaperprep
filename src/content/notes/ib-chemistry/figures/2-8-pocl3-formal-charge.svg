<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-labelledby="t" font-family="inherit">
<title id="t">Two Lewis formulas of phosphoryl chloride. In each, phosphorus is in the centre, bonded to an oxygen above and three chlorines to the left, right and below; each chlorine has three lone pairs. Structure A has a phosphorus-oxygen single bond with three lone pairs on oxygen: formal charge plus 1 on phosphorus and minus 1 on oxygen. Structure B has a phosphorus-oxygen double bond with two lone pairs on oxygen: every formal charge is zero, so B is preferred.</title>
