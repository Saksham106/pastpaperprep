<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-labelledby="t57tl">
  <title id="t57tl">Arrhenius plot, ln k against 1 over T, with two straight lines that both slope downwards over the same range of 1 over T and cross near the middle. The line for reaction P is steeper than the line for reaction Q. P is labelled steeper, larger activation energy, and Q is labelled shallower, smaller activation energy.</title>
  <defs>
    <marker id="m57tl-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="50" y1="230" x2="50" y2="20" marker-end="url(#m57tl-head)"/>
    <line x1="50" y1="230" x2="370" y2="230" marker-end="url(#m57tl-head)"/>
  </g>
  <line x1="90" y1="40" x2="320" y2="200" stroke="var(--t1-ink)" stroke-width="2.5"/>
  <line x1="90" y1="70" x2="320" y2="130" stroke="var(--t4-ink)" stroke-width="2.5"/>
  <g font-size="13" font-family="inherit">
    <text x="36" y="34" text-anchor="middle" fill="currentColor">ln <tspan font-style="italic">k</tspan></text>
    <text x="340" y="252" text-anchor="middle" fill="currentColor">1/<tspan font-style="italic">T</tspan> / K<tspan font-size="9" dy="-5">−1</tspan></text>
    <text x="160" y="182" fill="var(--t1-ink)">P: steeper,</text>
    <text x="160" y="198" fill="var(--t1-ink)">larger <tspan font-style="italic">E</tspan><tspan font-size="9" dy="3">a</tspan></text>
    <text x="200" y="66" fill="var(--t4-ink)">Q: shallower,</text>
    <text x="200" y="82" fill="var(--t4-ink)">smaller <tspan font-style="italic">E</tspan><tspan font-size="9" dy="3">a</tspan></text>
  </g>
</svg>
