<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
<title id="t">pH curve for adding 0.100 mol per cubic decimetre sodium hydroxide to 20.0 cubic centimetres of a 0.100 mol per cubic decimetre weak acid with pKa 4.20. The curve starts at pH 2.6, rises quickly at first, then climbs slowly through a flatter buffer region. At the half-equivalence point, 10.0 cubic centimetres, the pH is 4.20, equal to the pKa. The curve then rises steeply from about pH 7 to about pH 10.5 around the equivalence point at 20.0 cubic centimetres, where the pH is 8.45, above 7. After that it levels off near pH 12.5 as sodium hydroxide is in excess.</title>
