<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-labelledby="t">
<title id="t">Two rows of space-filling molecules showing carbon monoxide colliding with nitrogen dioxide. Top row, labelled proper orientation: the carbon end of the carbon monoxide molecule moves towards one oxygen atom of the bent nitrogen dioxide molecule, which moves towards it. A reaction arrow leads to a linear carbon dioxide molecule and a nitrogen monoxide molecule. Bottom row, labelled wrong orientation: the oxygen end of the carbon monoxide molecule meets an oxygen atom of the nitrogen dioxide molecule, and an arrow leads to the same two molecules moving apart unchanged, labelled no reaction.</title>
<text x="20" y="40" font-size="13" text-anchor="start" fill="currentColor" font-family="inherit" font-weight="bold">Proper orientation: C meets O</text>
