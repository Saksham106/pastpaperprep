<circle cx="76" cy="95" r="15" fill="var(--muted)" fill-opacity="0.3" stroke="var(--muted)" stroke-width="1.6"/><text x="76" y="99.5" font-size="13" font-weight="bold" text-anchor="middle" fill="currentColor" font-family="inherit">C</text>
