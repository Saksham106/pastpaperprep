<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="t">
<title id="t">Four small pH curves, each for adding 0.100 mol per cubic decimetre base to 20.0 cubic centimetres of 0.100 mol per cubic decimetre acid, pH 0 to 14 against volume 0 to 40 cubic centimetres. strong acid + strong base, HCl + NaOH: starts at pH 1.0, equivalence point at 20 cubic centimetres with pH 7.00. weak acid + strong base, CH3COOH + NaOH: starts at pH 2.9, equivalence point at 20 cubic centimetres with pH 8.73. strong acid + weak base, HCl + NH3: starts at pH 1.0, equivalence point at 20 cubic centimetres with pH 5.28. weak acid + weak base, CH3COOH + NH3: starts at pH 2.9, equivalence point at 20 cubic centimetres with pH 7.00. The strong acid with strong base curve has the longest vertical section, from about pH 3 to 11. Weak acid with strong base has a flatter buffer region before a shorter vertical section from about pH 7 to 11. Strong acid with weak base has a short vertical section from about pH 3 to 7 and levels off near pH 9. Weak acid with weak base has no vertical section at all, only a gradual change through pH 7.</title>
