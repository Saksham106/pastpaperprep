<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" role="img" aria-labelledby="t" font-family="inherit">
<title id="t">Two rows of diagrams compare a metal and an ionic solid when a force pushes the top layer sideways. Top row, metal: before, two layers of positive ions with electron dots between them; after, the top layer has moved one place to the right, and the ions are still surrounded by electron dots, labelled bonding still holds. Bottom row, ionic solid: before, two layers in which positive and negative ions alternate so opposite charges are next to each other; after, the top layer has moved one place, so positive sits next to positive and negative next to negative, labelled like charges repel and the crystal shatters.</title>
