<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 270" role="img" aria-labelledby="t">
<title id="t">The five 3d orbitals of an isolated ion have equal energy. In a complex ion they split into a lower set of three and an upper set of two, separated by an energy gap. A photon of visible light with energy equal to the gap is absorbed and promotes an electron from the lower set to the upper set.</title>
<line x1="30" y1="250" x2="30" y2="28" stroke="currentColor" stroke-width="1.4"/>
<path d="M24 40 L30 26 L36 40" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="20" y="140" font-size="13" fill="currentColor" font-family="inherit" text-anchor="middle" transform="rotate(-90 20 140)">Energy</text>
<rect x="70" y="121" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="90" y="121" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="110" y="121" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="130" y="121" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="150" y="121" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.3"/>
<line x1="80" y1="136" x2="80" y2="125" stroke="var(--t1-ink)" stroke-width="1.6"/><path d="M76.5 129 L80 123.5 L83.5 129" fill="none" stroke="var(--t1-ink)" stroke-width="1.6"/>
<text x="120" y="160" font-size="12" text-anchor="middle" fill="currentColor" font-family="inherit">Isolated ion:</text>
<text x="120" y="176" font-size="12" text-anchor="middle" fill="currentColor" font-family="inherit">five 3d orbitals, equal energy</text>
<text x="380" y="18" font-size="12" text-anchor="middle" fill="currentColor" font-family="inherit">In a complex ion (six ligands)</text>
<text x="380" y="40" font-size="11" text-anchor="middle" fill="var(--muted)" font-family="inherit">upper set</text>
<rect x="360" y="46" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="380" y="46" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.3"/>
<rect x="350" y="196" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="370" y="196" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="390" y="196" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="380" y="230" font-size="11" text-anchor="middle" fill="var(--muted)" font-family="inherit">lower set</text>
<line x1="360" y1="211" x2="360" y2="200" stroke="var(--t1-ink)" stroke-width="1.6"/><path d="M356.5 204 L360 198.5 L363.5 204" fill="none" stroke="var(--t1-ink)" stroke-width="1.6"/>
<path d="M355 194 C 325 160, 325 100, 366 68" fill="none" stroke="var(--t1-ink)" stroke-width="1.4" stroke-dasharray="5 3"/>
<path d="M357 72 L368 66 L364 78" fill="none" stroke="var(--t1-ink)" stroke-width="1.4"/>
<text x="322" y="128" font-size="11" text-anchor="end" fill="var(--t1-ink)" font-family="inherit">electron</text>
<text x="322" y="142" font-size="11" text-anchor="end" fill="var(--t1-ink)" font-family="inherit">promoted</text>
<line x1="440" y1="69" x2="440" y2="191" stroke="currentColor" stroke-width="1.3"/>
<path d="M435 79 L440 68 L445 79" fill="none" stroke="currentColor" stroke-width="1.3"/>
<path d="M435 181 L440 192 L445 181" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="450" y="134" font-size="14" fill="currentColor" font-family="inherit">ΔE</text>
<path d="M200 205 q 7 -8 14 0 t 14 0 t 14 0 t 14 0 t 14 0 t 14 0 t 14 0 t 14 0 L330 205" fill="none" stroke="var(--t3-ink)" stroke-width="1.5"/>
<path d="M322 200 L331 205 L322 210" fill="none" stroke="var(--t3-ink)" stroke-width="1.5"/>
<text x="265" y="232" font-size="11" text-anchor="middle" fill="var(--t3-ink)" font-family="inherit">visible photon absorbed,</text>
<text x="265" y="246" font-size="11" text-anchor="middle" fill="var(--t3-ink)" font-family="inherit">photon energy = ΔE</text>
</svg>
