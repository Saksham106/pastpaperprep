<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="t615chain">
  <title id="t615chain">The chain reaction of methane and chlorine: initiation makes chlorine radicals, two propagation steps pass a radical round a loop, and termination ends the chain</title>
  <defs>
    <marker id="m615chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="m615chain-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/>
    </marker>
  </defs>
  <g font-size="16" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="320" y="34">Initiation: Cl<tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> → 2Cl• (UV light)</tspan></text>
    <text x="320" y="117">CH<tspan font-size="11" dy="4">4</tspan><tspan dy="-4"> + Cl• → •CH</tspan><tspan font-size="11" dy="4">3</tspan><tspan dy="-4"> + HCl</tspan></text>
    <text x="320" y="217">•CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4"> + Cl</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> → CH</tspan><tspan font-size="11" dy="4">3</tspan><tspan dy="-4">Cl + Cl•</tspan></text>
    <text x="320" y="290">Termination: two radicals join, e.g. •CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4"> + Cl• → CH</tspan><tspan font-size="11" dy="4">3</tspan><tspan dy="-4">Cl</tspan></text>
  </g>
  <g font-size="12" fill="var(--muted)" font-family="inherit" text-anchor="middle">
    <text x="320" y="84">propagation 1</text>
    <text x="320" y="184">propagation 2</text>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <rect x="160" y="90" width="320" height="40" rx="6"/>
    <rect x="160" y="190" width="320" height="40" rx="6"/>
    <line x1="320" y1="44" x2="320" y2="70" marker-end="url(#m615chain-arrow)"/>
    <line x1="320" y1="232" x2="320" y2="266" stroke-dasharray="4 4" marker-end="url(#m615chain-arrow)"/>
  </g>
  <g stroke="var(--t1-ink)" stroke-width="1.8" fill="none">
    <path d="M482,110 Q540,160 482,206" marker-end="url(#m615chain-loop)"/>
    <path d="M158,210 Q100,160 158,114" marker-end="url(#m615chain-loop)"/>
  </g>
  <g font-size="14" fill="var(--t1-ink)" font-family="inherit" text-anchor="middle">
    <text x="566" y="156">•CH<tspan font-size="10" dy="4">3</tspan></text>
    <text x="566" y="174" font-size="11"><tspan dy="0">passes on</tspan></text>
    <text x="76" y="156">Cl•</text>
    <text x="76" y="174" font-size="11">made again</text>
  </g>
</svg>
