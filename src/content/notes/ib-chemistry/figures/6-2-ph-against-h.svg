<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-labelledby="t">
  <title id="t">Sketch graph of pH on the vertical axis, from 0 to 3, against hydrogen ion concentration on the horizontal axis, from 0 to 1.0 mol per cubic decimetre. The line is a curve, not a straight line. It starts high at pH 3 when the concentration is 0.001, falls very steeply as the concentration rises towards 0.1, where pH is 1, then flattens out and reaches pH 0 at a concentration of 1.0.</title>
