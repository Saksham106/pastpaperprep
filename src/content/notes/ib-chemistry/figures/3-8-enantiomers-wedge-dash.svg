<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="t38enantiomerswedgedash">
<title id="t38enantiomerswedgedash">The two enantiomers of 2-hydroxypropanoic acid drawn as mirror images either side of a dashed mirror line. Each central carbon has COOH straight up and a methyl group down to the side on plain bonds in the page, an OH group on a solid wedge towards the viewer, and an H atom on a hashed wedge away from the viewer. In the right-hand molecule every group is reflected left to right</title>
