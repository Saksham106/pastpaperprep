<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 260" role="img" aria-labelledby="t">
  <title id="t">Forming a polyester. Top row: a dicarboxylic acid, HO, then a carbon with a double-bonded oxygen, then a group R, then a second carbon with a double-bonded oxygen, then OH, plus a diol, H, O, a group R prime, O, H. The OH at each end of the acid and the H at each end of the diol are highlighted as the atoms that leave. A downward arrow labelled minus 2 water molecules leads to the bottom row: the repeating unit, an open bond, a carbon with a double-bonded oxygen, R, a carbon with a double-bonded oxygen, an oxygen, R prime, an oxygen and an open bond, plus 2 water molecules. The carbon with its double-bonded oxygen and the oxygen next to it are boxed and labelled ester link.</title>
  <g font-size="18" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="76" y="90">C</text>
    <text x="76" y="44">O</text>
    <text x="114" y="90">R</text>
    <text x="152" y="90">C</text>
    <text x="152" y="44">O</text>
    <text x="232" y="90">+</text>
    <text x="296" y="90">O</text>
    <text x="338" y="90">R′</text>
    <text x="380" y="90">O</text>
    <text x="70" y="215">C</text>
    <text x="70" y="169">O</text>
    <text x="108" y="215">R</text>
    <text x="146" y="215">C</text>
    <text x="146" y="169">O</text>
    <text x="226" y="215">R′</text>
    <text x="268" y="215">O</text>
  </g>
  <g font-size="18" fill="var(--t1-ink)" font-family="inherit" text-anchor="middle">
    <text x="34" y="90">HO</text>
    <text x="194" y="90">OH</text>
    <text x="262" y="90">H</text>
    <text x="416" y="90">H</text>
    <text x="390" y="215">+ 2H<tspan baseline-shift="sub" font-size="13">2</tspan>O</text>
  </g>
  <text x="184" y="215" font-size="18" fill="var(--t2-ink)" font-family="inherit" text-anchor="middle">O</text>
  <g stroke="currentColor" stroke-width="2" fill="none">
