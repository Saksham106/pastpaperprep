    <text x="244" y="134" fill="var(--t1-ink)">− 2H<tspan baseline-shift="sub" font-size="10">2</tspan>O</text>
    <text x="114" y="118" fill="var(--muted)" text-anchor="middle">dicarboxylic acid</text>
    <text x="338" y="118" fill="var(--muted)" text-anchor="middle">diol</text>
    <text x="164" y="244" fill="var(--t2-ink)" text-anchor="middle">ester link</text>
