<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" role="img" aria-labelledby="t54mbt">
  <title id="t54mbt">Maxwell-Boltzmann distribution, fraction of particles against kinetic energy, at two temperatures. Both curves start at the origin, rise to a peak and then fall away in a long tail that gets closer to the energy axis without touching it. The curve at the lower temperature T1 has a taller, narrower peak at lower energy. The curve at the higher temperature T2 has a lower peak further to the right and a fatter tail. The two curves cross once, to the right of both peaks. A vertical dashed line marks the activation energy, well out in the tail. The area under each curve beyond the activation energy is shaded, and the shaded area is much larger for T2 than for T1.</title>
