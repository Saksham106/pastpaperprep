<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" role="img" aria-labelledby="t">
  <title id="t">Two side-by-side diagrams of metal cations in layers. Left, a pure metal: four rows of identical cations packed in regular layers, with a dashed line between the second and third rows and an arrow showing the top layers sliding over the ones below when a force is applied. Labelled: pure metal, layers slide easily. Right, an alloy: the same rows, but three larger atoms of a second element are scattered through them, so the rows are no longer flat. The force arrow is crossed out. Labelled: alloy, layers slide less easily.</title>
