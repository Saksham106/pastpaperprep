<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-labelledby="t">
  <title id="t">A developed chromatogram. A pencil baseline runs across near the bottom of the plate and a dashed solvent front runs across near the top. One blue spot sits partway up. Two vertical measuring arrows start at the baseline. The shorter one ends level with the centre of the spot and is labelled 5.7 centimetres, distance moved by the component. The longer one ends at the solvent front and is labelled 9.2 centimetres, distance moved by the solvent front.</title>
  <rect x="110" y="20" width="110" height="300" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M111 60 H219" fill="none" stroke="var(--t2-ink)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M114 290 H216" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g stroke="currentColor" stroke-width="1.2">
    <path d="M161 286 l8 8 M161 294 l8 -8"/>
  </g>
  <ellipse cx="165" cy="148" rx="10" ry="7" fill="var(--t1-ink)"/>
  <g fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M175 148 H262"/>
    <path d="M219 60 H352"/>
    <path d="M216 290 H352"/>
  </g>
  <g fill="none" stroke="var(--t1-ink)" stroke-width="1.6">
    <path d="M255 290 V152"/>
    <path d="M250 157 L255 148 L260 157"/>
  </g>
  <g fill="none" stroke="var(--t2-ink)" stroke-width="1.6">
    <path d="M345 290 V64"/>
    <path d="M340 69 L345 60 L350 69"/>
  </g>
  <g font-size="12" font-family="inherit">
    <text x="262" y="216" fill="var(--t1-ink)">5.7 cm</text>
    <text x="356" y="180" fill="var(--t2-ink)">9.2 cm</text>
  </g>
  <g font-size="11" fill="currentColor" font-family="inherit" text-anchor="end">
    <text x="104" y="64">solvent front</text>
    <text x="104" y="152">centre of spot</text>
    <text x="104" y="294">baseline</text>
  </g>
  <g font-size="11" fill="currentColor" font-family="inherit">
    <text x="262" y="231" fill="var(--t1-ink)">component</text>
    <text x="356" y="196" fill="var(--t2-ink)">solvent</text>
    <text x="356" y="210" fill="var(--t2-ink)">front</text>
  </g>
</svg>
