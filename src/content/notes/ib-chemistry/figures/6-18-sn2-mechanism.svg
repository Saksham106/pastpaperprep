<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200" role="img" aria-labelledby="t618sn2">
  <title id="t618sn2">SN2 mechanism for bromoethane and the hydroxide ion: one step through a transition state, with inversion of the three groups on carbon</title>
  <defs>
    <marker id="m618sn2-curly" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/>
    </marker>
    <marker id="m618sn2-react" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-size="16" fill="currentColor" font-family="inherit">
    <!-- reactants -->
    <text x="62" y="106">HO</text>
    <text x="76" y="89" font-size="14">−</text>
    <circle cx="94" cy="98" r="1.8"/>
    <circle cx="94" cy="105" r="1.8"/>
    <text x="163" y="106">C</text>
    <text x="218" y="106">Br</text>
    <text x="124" y="68">H<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">C</tspan></text>
    <text x="137" y="142">H</text>
    <text x="164" y="146">H</text>
    <text x="178" y="88" font-size="12" fill="var(--t5-ink)">δ+</text>
    <text x="222" y="86" font-size="12" fill="var(--t5-ink)">δ−</text>
    <!-- transition state -->
    <text x="346" y="106">HO</text>
    <text x="414" y="106">C</text>
    <text x="470" y="106">Br</text>
    <text x="408" y="64">CH<tspan font-size="11" dy="4">3</tspan></text>
    <text x="392" y="144">H</text>
    <text x="436" y="144">H</text>
    <text x="518" y="56" font-size="16">−</text>
    <!-- products -->
    <text x="583" y="106">HO</text>
    <text x="630" y="106">C</text>
    <text x="652" y="66">CH<tspan font-size="11" dy="4">3</tspan></text>
    <text x="658" y="142">H</text>
    <text x="631" y="146">H</text>
    <text x="684" y="106">+ Br</text>
    <text x="715" y="94" font-size="14">−</text>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <!-- reactant bonds -->
    <line x1="179" y1="100" x2="215" y2="100"/>
    <line x1="164" y1="91" x2="150" y2="73"/>
    <line x1="163" y1="108" x2="149" y2="127"/>
    <line x1="169" y1="110" x2="169" y2="131"/>
    <!-- transition state partial bonds -->
    <line x1="372" y1="100" x2="410" y2="100" stroke-dasharray="4 4"/>
    <line x1="428" y1="100" x2="466" y2="100" stroke-dasharray="4 4"/>
    <line x1="420" y1="90" x2="420" y2="70"/>
    <line x1="415" y1="109" x2="402" y2="128"/>
    <line x1="425" y1="109" x2="438" y2="128"/>
    <path d="M342,48 L336,48 L336,156 L342,156"/>
    <path d="M506,48 L512,48 L512,156 L506,156"/>
    <!-- product bonds -->
    <line x1="609" y1="100" x2="627" y2="100"/>
    <line x1="643" y1="91" x2="657" y2="73"/>
    <line x1="643" y1="108" x2="657" y2="127"/>
    <line x1="636" y1="110" x2="636" y2="131"/>
    <!-- reaction arrows -->
    <line x1="262" y1="100" x2="318" y2="100" marker-end="url(#m618sn2-react)"/>
    <line x1="526" y1="100" x2="568" y2="100" marker-end="url(#m618sn2-react)"/>
  </g>
  <g stroke="var(--t1-ink)" stroke-width="1.8" fill="none">
    <path d="M98,96 Q128,62 158,94" marker-end="url(#m618sn2-curly)"/>
    <path d="M197,103 Q214,132 230,112" marker-end="url(#m618sn2-curly)"/>
  </g>
  <g font-size="12" fill="var(--muted)" font-family="inherit" text-anchor="middle">
    <text x="150" y="185">bromoethane + hydroxide ion</text>
    <text x="424" y="185">transition state</text>
    <text x="660" y="185">ethanol + bromide ion</text>
  </g>
</svg>
