<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="t">
  <title id="t">The bonding triangle with the six period 3 oxides plotted. Sodium oxide, at an average electronegativity of 2.15 and a difference of 2.5, and magnesium oxide, at 2.35 and 2.1, sit well inside the ionic region. Aluminium oxide, at 2.5 and 1.8, sits right on the border between the ionic and covalent regions. Silicon dioxide, at 2.65 and 1.5, phosphorus(V) oxide, P4O10, at 2.8 and 1.2, and sulfur trioxide, at 3.0 and 0.8, sit in the covalent region. The points fall on a straight line running down to the right, from ionic to covalent.</title>
  <path d="M70.0 300.0 H488.9" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M70.0 300.0 V28.0" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <g stroke="currentColor" stroke-width="1.2">
    <path d="M117.2 300.0 v5"/>
    <path d="M176.2 300.0 v5"/>
    <path d="M235.2 300.0 v5"/>
    <path d="M294.2 300.0 v5"/>
    <path d="M353.2 300.0 v5"/>
    <path d="M412.2 300.0 v5"/>
    <path d="M471.2 300.0 v5"/>
    <path d="M70.0 260.0 h-5"/>
    <path d="M70.0 220.0 h-5"/>
    <path d="M70.0 180.0 h-5"/>
    <path d="M70.0 140.0 h-5"/>
    <path d="M70.0 100.0 h-5"/>
    <path d="M70.0 60.0 h-5"/>
  </g>
  <g font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="117.2" y="318.0">1.0</text>
    <text x="176.2" y="318.0">1.5</text>
    <text x="235.2" y="318.0">2.0</text>
    <text x="294.2" y="318.0">2.5</text>
    <text x="353.2" y="318.0">3.0</text>
    <text x="412.2" y="318.0">3.5</text>
    <text x="471.2" y="318.0">4.0</text>
  </g>
  <g font-size="11" fill="currentColor" font-family="inherit" text-anchor="end">
    <text x="62.0" y="304.0">0</text>
    <text x="62.0" y="264.0">0.5</text>
    <text x="62.0" y="224.0">1.0</text>
