<text x="478" y="27" font-size="11" fill="currentColor" font-family="inherit">n = ∞</text>
<text x="478" y="50" font-size="11" fill="currentColor" font-family="inherit">n = 4</text>
<text x="478" y="63" font-size="11" fill="currentColor" font-family="inherit">n = 3</text>
<text x="478" y="99" font-size="11" fill="currentColor" font-family="inherit">n = 2</text>
<text x="478" y="294" font-size="11" fill="currentColor" font-family="inherit">n = 1</text>
