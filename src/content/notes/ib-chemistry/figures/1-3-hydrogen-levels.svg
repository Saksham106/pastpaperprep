<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" role="img" aria-labelledby="t">
<title id="t">Energy levels of the hydrogen atom, getting closer together towards the top, with downward transitions to n = 1, n = 2 and n = 3</title>
