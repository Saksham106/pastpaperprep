<line x1="70" y1="30" x2="470" y2="30" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="70" y1="37.2" x2="470" y2="37.2" stroke="currentColor" stroke-width="1"/>
<line x1="70" y1="40.4" x2="470" y2="40.4" stroke="currentColor" stroke-width="1"/>
<line x1="70" y1="46.25" x2="470" y2="46.25" stroke="currentColor" stroke-width="1.2"/>
