<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="t">
<title id="t">Head-on overlap of s and s orbitals and of two p orbitals gives sigma bonds; sideways overlap of two parallel p orbitals gives a pi bond</title>
<text x="30" y="49" font-size="11" fill="var(--muted)" font-family="inherit">bond axis</text>
<line x1="30" y1="55" x2="250" y2="55" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5 4"/>
<circle cx="108" cy="55" r="36" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="1.3"/>
<circle cx="162" cy="55" r="36" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="1.3"/>
<circle cx="108" cy="55" r="3" fill="currentColor"/>
<circle cx="162" cy="55" r="3" fill="currentColor"/>
<text x="275" y="51" font-size="13" fill="currentColor" font-family="inherit">σ bond: s and s overlap</text>
<text x="275" y="69" font-size="12" fill="var(--muted)" font-family="inherit">head-on, along the axis</text>
<line x1="30" y1="160" x2="250" y2="160" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5 4"/>
<ellipse cx="67" cy="160" rx="27" ry="16" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="1.3"/>
<ellipse cx="123" cy="160" rx="27" ry="16" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="1.3"/>
<ellipse cx="147" cy="160" rx="27" ry="16" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="1.3"/>
<ellipse cx="203" cy="160" rx="27" ry="16" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="1.3"/>
<circle cx="95" cy="160" r="3" fill="currentColor"/>
<circle cx="175" cy="160" r="3" fill="currentColor"/>
<text x="275" y="156" font-size="13" fill="currentColor" font-family="inherit">σ bond: p and p overlap</text>
<text x="275" y="174" font-size="12" fill="var(--muted)" font-family="inherit">head-on, along the axis</text>
<line x1="30" y1="265" x2="250" y2="265" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5 4"/>
<ellipse cx="121" cy="236" rx="18" ry="27" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="1.3"/>
<ellipse cx="121" cy="294" rx="18" ry="27" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="1.3"/>
<ellipse cx="149" cy="236" rx="18" ry="27" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="1.3"/>
<ellipse cx="149" cy="294" rx="18" ry="27" fill="var(--t2-ink)" fill-opacity="0.18" stroke="var(--t2-ink)" stroke-width="1.3"/>
<circle cx="121" cy="265" r="3" fill="currentColor"/>
<circle cx="149" cy="265" r="3" fill="currentColor"/>
<text x="275" y="261" font-size="13" fill="currentColor" font-family="inherit">π bond: parallel p orbitals</text>
<text x="275" y="279" font-size="12" fill="var(--muted)" font-family="inherit">sideways, above and below the axis</text>
</svg>
