<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t">
<title id="t">Down group 1, metals are oxidized more easily and are stronger reducing agents. Down group 17, halogens are reduced less easily and are weaker oxidizing agents. In both groups the atoms get larger, so outer electrons are further from the nucleus and more shielded.</title>
<g font-family="inherit" fill="currentColor" font-size="13">
<text x="140" y="24" text-anchor="middle" font-weight="600">Group 1 metals</text>
<text x="140" y="42" text-anchor="middle" font-size="11" fill="var(--muted)">lose an electron: M → M⁺ + e⁻</text>
<text x="420" y="24" text-anchor="middle" font-weight="600">Group 17 halogens</text>
<text x="420" y="42" text-anchor="middle" font-size="11" fill="var(--muted)">gain electrons: X₂ + 2e⁻ → 2X⁻</text>
<text x="80" y="76" text-anchor="middle">Li</text>
<text x="80" y="110" text-anchor="middle">Na</text>
<text x="80" y="144" text-anchor="middle">K</text>
<text x="80" y="178" text-anchor="middle">Rb</text>
<text x="80" y="212" text-anchor="middle">Cs</text>
<text x="360" y="76" text-anchor="middle">F₂</text>
<text x="360" y="110" text-anchor="middle">Cl₂</text>
<text x="360" y="144" text-anchor="middle">Br₂</text>
<text x="360" y="178" text-anchor="middle">I₂</text>
</g>
<g fill="none" stroke-width="3" stroke-linecap="round">
<line x1="120" y1="66" x2="120" y2="206" stroke="var(--t2-ink)"/>
<polyline points="111,194 120,210 129,194" stroke="var(--t2-ink)"/>
<line x1="400" y1="66" x2="400" y2="172" stroke="var(--t4-ink)"/>
<polyline points="391,160 400,176 409,160" stroke="var(--t4-ink)"/>
</g>
<g font-family="inherit" font-size="12">
<text x="136" y="120" fill="var(--t2-ink)" font-weight="600">oxidized more easily</text>
<text x="136" y="138" fill="currentColor">stronger reducing agent</text>
<text x="136" y="156" fill="currentColor">more reactive</text>
<text x="416" y="110" fill="var(--t4-ink)" font-weight="600">reduced less easily</text>
<text x="416" y="128" fill="currentColor">weaker oxidizing agent</text>
<text x="416" y="146" fill="currentColor">less reactive</text>
</g>
<rect x="20" y="236" width="520" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
<g font-family="inherit" font-size="12" fill="currentColor" text-anchor="middle">
<text x="280" y="257">Down both groups the atoms get larger: outer electrons are further from the nucleus</text>
<text x="280" y="276">and more shielded, so they are held less strongly.</text>
</g>
</svg>
