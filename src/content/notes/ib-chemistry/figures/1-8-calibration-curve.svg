<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" role="img" aria-labelledby="t">
  <title id="t">Calibration curve. Absorbance on the vertical axis, from 0 to 0.400, against concentration in moles per cubic decimetre on the horizontal axis, from 0 to 0.0500. Five standard solutions, 0.0100 to 0.0500, are plotted as points that lie on a straight line through the origin; the 0.0500 standard has absorbance 0.360. A dashed line runs across from an absorbance of 0.270 to the line, then down to the concentration axis at 0.0375.</title>
  <path d="M60 250 H440" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M60 250 V40" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <g stroke="currentColor" stroke-width="1.2">
    <path d="M132 250 v5"/>
    <path d="M204 250 v5"/>
    <path d="M276 250 v5"/>
    <path d="M348 250 v5"/>
    <path d="M420 250 v5"/>
    <path d="M60 200 h-5"/>
    <path d="M60 150 h-5"/>
    <path d="M60 100 h-5"/>
    <path d="M60 50 h-5"/>
  </g>
  <g font-size="11" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="60" y="268">0</text>
    <text x="132" y="268">0.0100</text>
    <text x="204" y="268">0.0200</text>
    <text x="276" y="268">0.0300</text>
    <text x="348" y="268">0.0400</text>
    <text x="420" y="268">0.0500</text>
  </g>
  <g font-size="11" fill="currentColor" font-family="inherit" text-anchor="end">
    <text x="51" y="204">0.100</text>
    <text x="51" y="154">0.200</text>
    <text x="51" y="104">0.300</text>
    <text x="51" y="54">0.400</text>
  </g>
  <text x="250" y="292" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle">concentration / mol dm⁻³</text>
  <text x="16" y="150" font-size="12" fill="currentColor" font-family="inherit" text-anchor="middle" transform="rotate(-90 16 150)">absorbance</text>
  <path d="M60 250 L436 62" fill="none" stroke="var(--t1-ink)" stroke-width="2"/>
  <g fill="var(--t1-ink)">
    <circle cx="132" cy="214" r="4"/>
    <circle cx="204" cy="178" r="4"/>
    <circle cx="276" cy="142" r="4"/>
    <circle cx="348" cy="106" r="4"/>
    <circle cx="420" cy="70" r="4"/>
  </g>
  <path d="M60 115 H330 V250" fill="none" stroke="var(--t2-ink)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g font-size="12" font-family="inherit" fill="var(--t2-ink)">
    <text x="66" y="108">unknown: 0.270</text>
    <text x="336" y="240">0.0375</text>
  </g>
</svg>
