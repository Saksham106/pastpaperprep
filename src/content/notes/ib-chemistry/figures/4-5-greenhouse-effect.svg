<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="t">
  <title id="t">The greenhouse effect. Sunlight, mostly visible light, passes through the atmosphere and warms the Earth's surface. The warm surface emits infrared radiation upwards. A carbon dioxide molecule in the atmosphere absorbs the infrared and re-emits it in all directions: some escapes to space and some goes back down to the surface, which keeps the lower atmosphere warmer.</title>
  <circle cx="60" cy="50" r="24" fill="none" stroke="var(--t4-ink)" stroke-width="2.5"/>
  <g stroke="var(--t4-ink)" stroke-width="2">
    <path d="M60 14 L60 4"/><path d="M60 86 L60 96"/><path d="M24 50 L14 50"/><path d="M96 50 L106 50"/>
    <path d="M35 25 L28 18"/><path d="M85 25 L92 18"/><path d="M35 75 L28 82"/><path d="M85 75 L92 82"/>
  </g>
  <rect x="0" y="120" width="560" height="140" fill="var(--t3-ink)" fill-opacity="0.08"/>
  <text x="548" y="140" font-size="12" fill="var(--muted)" font-family="inherit" text-anchor="end">atmosphere</text>
  <rect x="0" y="260" width="560" height="60" fill="var(--t5-ink)" fill-opacity="0.25"/>
  <text x="280" y="300" font-size="13" fill="currentColor" font-family="inherit" text-anchor="middle">Earth's surface</text>
  <path d="M90 82 L176 248" stroke="var(--t4-ink)" stroke-width="2.5" fill="none"/>
  <polygon points="181,257 172,250 180,246" fill="var(--t4-ink)"/>
  <text x="150" y="110" font-size="12" fill="currentColor" font-family="inherit">sunlight passes through</text>
