  <polygon points="350.0,195.0 341.9,205.1 337.1,196.4" fill="var(--t1-ink)"/>
  <text x="180" y="190" font-size="12" fill="var(--t1-ink)" font-family="inherit">infrared from the surface</text>
  <g font-size="13" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="380" y="185">O=C=O</text>
