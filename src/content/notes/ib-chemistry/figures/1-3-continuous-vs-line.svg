<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 215" role="img" aria-labelledby="t">
<title id="t">A continuous spectrum with every visible wavelength, above the line emission spectrum of hydrogen with four separate lines</title>
<text x="40" y="18" font-size="13" fill="currentColor" font-family="inherit">Continuous spectrum (white light through a prism)</text>
<rect x="40" y="26" width="400" height="36" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="1.2"/>
<text x="67" y="77" font-size="11" text-anchor="middle" fill="currentColor" font-family="inherit">violet</text>
<text x="133" y="77" font-size="11" text-anchor="middle" fill="currentColor" font-family="inherit">blue</text>
<text x="213" y="77" font-size="11" text-anchor="middle" fill="currentColor" font-family="inherit">green</text>
<text x="280" y="77" font-size="11" text-anchor="middle" fill="currentColor" font-family="inherit">yellow</text>
<text x="333" y="77" font-size="11" text-anchor="middle" fill="currentColor" font-family="inherit">orange</text>
<text x="400" y="77" font-size="11" text-anchor="middle" fill="currentColor" font-family="inherit">red</text>
<text x="40" y="104" font-size="13" fill="currentColor" font-family="inherit">Line emission spectrum of hydrogen (visible part)</text>
<rect x="40" y="128" width="400" height="36" fill="none" stroke="currentColor" stroke-width="1.2"/>
<line x1="53.6" y1="128" x2="53.6" y2="164" stroke="var(--t5-ink)" stroke-width="3"/>
<line x1="85.3" y1="128" x2="85.3" y2="164" stroke="var(--t4-ink)" stroke-width="3"/>
<line x1="154.8" y1="128" x2="154.8" y2="164" stroke="var(--t3-ink)" stroke-width="3"/>
<line x1="381.7" y1="128" x2="381.7" y2="164" stroke="var(--t1-ink)" stroke-width="3"/>
<text x="53.6" y="122" font-size="10" text-anchor="middle" fill="currentColor" font-family="inherit">410</text>
<text x="85.3" y="122" font-size="10" text-anchor="middle" fill="currentColor" font-family="inherit">434</text>
<text x="154.8" y="122" font-size="10" text-anchor="middle" fill="currentColor" font-family="inherit">486</text>
<text x="381.7" y="122" font-size="10" text-anchor="middle" fill="currentColor" font-family="inherit">656</text>
<line x1="40" y1="176" x2="440" y2="176" stroke="currentColor" stroke-width="1.2"/>
<line x1="40" y1="176" x2="40" y2="181" stroke="currentColor" stroke-width="1.2"/>
<line x1="173.3" y1="176" x2="173.3" y2="181" stroke="currentColor" stroke-width="1.2"/>
<line x1="306.7" y1="176" x2="306.7" y2="181" stroke="currentColor" stroke-width="1.2"/>
<line x1="440" y1="176" x2="440" y2="181" stroke="currentColor" stroke-width="1.2"/>
<text x="40" y="193" font-size="11" text-anchor="middle" fill="currentColor" font-family="inherit">400</text>
<text x="173.3" y="193" font-size="11" text-anchor="middle" fill="currentColor" font-family="inherit">500</text>
<text x="306.7" y="193" font-size="11" text-anchor="middle" fill="currentColor" font-family="inherit">600</text>
<text x="440" y="193" font-size="11" text-anchor="middle" fill="currentColor" font-family="inherit">700</text>
<text x="240" y="210" font-size="11" text-anchor="middle" fill="var(--muted)" font-family="inherit">wavelength / nm (shorter wavelength and higher energy to the left)</text>
</svg>
