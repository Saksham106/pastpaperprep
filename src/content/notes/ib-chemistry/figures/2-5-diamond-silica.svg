<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 262" role="img" aria-labelledby="t">
  <title id="t">Two ball-and-stick fragments of covalent network structures. Left, diamond: a central carbon atom is bonded to four other carbon atoms arranged tetrahedrally, at 109.5 degrees, and each of those carbon atoms has dashed bonds leading on to three more atoms, showing the network continues in every direction. Silicon has the same structure with silicon atoms. Right, silicon dioxide: a central silicon atom is bonded tetrahedrally to four oxygen atoms, and each oxygen atom is also bonded to a second silicon atom, which has dashed bonds leading on to more oxygen atoms.</title>
