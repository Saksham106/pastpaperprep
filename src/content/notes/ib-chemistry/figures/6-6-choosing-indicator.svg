<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" role="img" aria-labelledby="t66ci">
  <title id="t66ci">pH curve for a weak acid titrated with a strong base. pH starts near 3, rises slowly, then jumps steeply from about 7 to 11 at the equivalence point, 25 cubic centimetres and pH 8.8, then levels off near 12.5. A shaded band for phenolphthalein, pH 8.0 to 10.0, lies inside the steep jump. A shaded band for methyl orange, pH 3.1 to 4.4, is crossed by the curve during the first few cubic centimetres, long before the equivalence point.</title>
  <rect x="60" y="100.0" width="420" height="40.0" fill="var(--t2-ink)" opacity="0.18"/>
  <rect x="60" y="212.0" width="420" height="26.0" fill="var(--t4-ink)" opacity="0.18"/>
  <g font-size="12" font-family="inherit">
    <text x="290" y="125" fill="var(--t2-ink)">phenolphthalein, pH 8.0–10.0</text>
    <text x="476" y="230" text-anchor="end" fill="var(--t4-ink)">methyl orange, pH 3.1–4.4</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <path d="M60,20 V300 H480"/>
    <line x1="56" y1="300" x2="60" y2="300"/><line x1="56" y1="260" x2="60" y2="260"/><line x1="56" y1="220" x2="60" y2="220"/><line x1="56" y1="180" x2="60" y2="180"/><line x1="56" y1="140" x2="60" y2="140"/><line x1="56" y1="100" x2="60" y2="100"/><line x1="56" y1="60" x2="60" y2="60"/><line x1="56" y1="20" x2="60" y2="20"/><line x1="60.0" y1="300" x2="60.0" y2="304"/><line x1="144.0" y1="300" x2="144.0" y2="304"/><line x1="228.0" y1="300" x2="228.0" y2="304"/><line x1="312.0" y1="300" x2="312.0" y2="304"/><line x1="396.0" y1="300" x2="396.0" y2="304"/><line x1="480.0" y1="300" x2="480.0" y2="304"/>
  </g>
  <g font-size="12" font-family="inherit" fill="currentColor">
    <text x="50" y="304" text-anchor="end">0</text><text x="50" y="264" text-anchor="end">2</text><text x="50" y="224" text-anchor="end">4</text><text x="50" y="184" text-anchor="end">6</text><text x="50" y="144" text-anchor="end">8</text><text x="50" y="104" text-anchor="end">10</text><text x="50" y="64" text-anchor="end">12</text><text x="50" y="24" text-anchor="end">14</text><text x="60.0" y="318" text-anchor="middle">0</text><text x="144.0" y="318" text-anchor="middle">10</text><text x="228.0" y="318" text-anchor="middle">20</text><text x="312.0" y="318" text-anchor="middle">30</text><text x="396.0" y="318" text-anchor="middle">40</text><text x="480.0" y="318" text-anchor="middle">50</text>
    <text x="270" y="342" text-anchor="middle">volume of strong base added / cm³</text>
    <text x="18" y="160" text-anchor="middle" transform="rotate(-90 18 160)">pH</text>
  </g>
