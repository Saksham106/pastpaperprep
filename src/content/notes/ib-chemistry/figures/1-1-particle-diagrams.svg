<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 180" role="img" aria-labelledby="t">
  <title id="t">Four boxes of particles. Box 1, an element made of atoms: separate circles, all the same colour. Box 2, an element made of molecules: pairs of joined circles, all the same colour. Box 3, a compound: identical particles, each one large circle joined to two small circles of a different colour. Box 4, a mixture: some single circles and some joined pairs of a different colour, mixed together and not joined to each other.</title>
