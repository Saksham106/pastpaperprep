<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-labelledby="t36boilingpoints">
<title id="t36boilingpoints">Graph of boiling point in degrees Celsius against number of carbon atoms, 1 to 6, for straight-chain alkanes and alcohols. Alkanes: minus 162, minus 89, minus 42, minus 1, 36 and 69. Alcohols with the OH on the end carbon: 65, 78, 97, 118, 138 and 157. Both lines rise steadily, and the alcohol line lies well above the alkane line throughout. A dashed line marks 25 degrees Celsius: the first four alkanes lie below it and are gases at room temperature, while every alcohol shown lies above it</title>
