<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="t">
<title id="t">Graph of volume of hydrogen collected, in cubic centimetres, against time in seconds, from 0 to 240 seconds, with four curves that all start at the origin. The original curve rises and levels off at 60 cubic centimetres by about 160 seconds. Curve P is steeper at the start and levels off sooner at the same 60 cubic centimetres. Curve Q is less steep than the original and is still rising slowly towards 60 cubic centimetres at 240 seconds. Curve R is less steep than the original and levels off at 30 cubic centimetres.</title>
