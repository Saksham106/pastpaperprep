<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
<title id="t">pH curve for adding 0.100 mol per cubic decimetre hydrochloric acid to 20.0 cubic centimetres of 0.100 mol per cubic decimetre aqueous ammonia, pKb 4.75. The curve starts at pH 11.1 and falls. It falls slowly through a flatter buffer region. At the half-equivalence point, 10.0 cubic centimetres, the pH is 9.25, so the pOH is 4.75, equal to the pKb. The curve then drops steeply from about pH 7 to about pH 3.5 around the equivalence point at 20.0 cubic centimetres, where the pH is 5.28, below 7. After that it levels off near pH 1.5 as hydrochloric acid is in excess.</title>
