<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 350" role="img" aria-labelledby="t">
<title id="t">Colour wheel with six sectors and their wavelength ranges. Opposite sectors are complementary: red and green, orange and blue, yellow and violet.</title>
<path d="M210 175 L145.0 62.4 A130 130 0 0 1 275.0 62.4 Z" fill="#e5484d" fill-opacity="0.32" stroke="currentColor" stroke-width="1.3"/>
