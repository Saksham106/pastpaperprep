<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 228" role="img" aria-labelledby="t">
<title id="t">Left: an ammonia molecule, nitrogen bonded to three hydrogen atoms with a lone pair, next to a hydrogen ion H plus. A curved arrow goes from the lone pair to the H plus. After a reaction arrow, the ammonium ion: nitrogen bonded to four hydrogen atoms inside square brackets with a plus charge, one bond drawn as an arrow from nitrogen to hydrogen. Right: carbon monoxide, carbon and oxygen joined by a triple bond with one lone pair on each atom; one of the three bonds is an arrow pointing from oxygen to carbon.</title>
