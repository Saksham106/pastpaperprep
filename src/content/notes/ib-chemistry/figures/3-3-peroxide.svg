<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" role="img" aria-labelledby="t" font-family="inherit">
<title id="t">Hydrogen peroxide drawn as H, O, O, H in a row joined by single bonds. Above each oxygen to hydrogen bond: pair given to O. Above the oxygen to oxygen bond: shared equally. Below the atoms the oxidation states are plus 1, minus 1, minus 1, plus 1.</title>
<text x="260" y="24" text-anchor="middle" font-size="13" fill="currentColor">Hydrogen peroxide, H–O–O–H</text>
<text x="60" y="98" text-anchor="middle" font-size="22" font-weight="600" fill="currentColor">H</text>
<text x="190" y="98" text-anchor="middle" font-size="22" font-weight="600" fill="currentColor">O</text>
<text x="330" y="98" text-anchor="middle" font-size="22" font-weight="600" fill="currentColor">O</text>
<text x="460" y="98" text-anchor="middle" font-size="22" font-weight="600" fill="currentColor">H</text>
<line x1="76" y1="91" x2="172" y2="91" stroke="currentColor" stroke-width="2"/>
<line x1="208" y1="91" x2="312" y2="91" stroke="currentColor" stroke-width="2"/>
<line x1="348" y1="91" x2="444" y2="91" stroke="currentColor" stroke-width="2"/>
<text x="124" y="66" text-anchor="middle" font-size="12" fill="var(--t2-ink)">pair given to O</text>
<text x="260" y="66" text-anchor="middle" font-size="12" fill="var(--t2-ink)">shared equally</text>
<text x="396" y="66" text-anchor="middle" font-size="12" fill="var(--t2-ink)">pair given to O</text>
<path d="M150 76 L166 84" stroke="var(--t2-ink)" stroke-width="1.4" fill="none"/>
<polygon points="170,86 160,86 165,78" fill="var(--t2-ink)"/>
<path d="M370 76 L354 84" stroke="var(--t2-ink)" stroke-width="1.4" fill="none"/>
<polygon points="350,86 355,78 360,86" fill="var(--t2-ink)"/>
<text x="60" y="140" text-anchor="middle" font-size="18" font-weight="600" fill="var(--t1-ink)">+1</text>
<text x="190" y="140" text-anchor="middle" font-size="18" font-weight="600" fill="var(--t3-ink)">−1</text>
<text x="330" y="140" text-anchor="middle" font-size="18" font-weight="600" fill="var(--t3-ink)">−1</text>
<text x="460" y="140" text-anchor="middle" font-size="18" font-weight="600" fill="var(--t1-ink)">+1</text>
</svg>
