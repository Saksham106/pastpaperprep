<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" role="img" aria-labelledby="t616sub">
  <title id="t616sub">Nucleophilic substitution of 1-chloropropane by the hydroxide ion, with two curly arrows</title>
  <defs>
    <marker id="m616sub-curly" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--t1-ink)"/>
    </marker>
    <marker id="m616sub-react" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-size="16" fill="currentColor" font-family="inherit">
    <!-- reactants -->
    <text x="62" y="106">HO</text>
    <text x="76" y="89" font-size="14">−</text>
    <circle cx="94" cy="98" r="1.8"/>
    <circle cx="94" cy="105" r="1.8"/>
    <text x="163" y="106">C</text>
    <text x="218" y="106">Cl</text>
    <text x="169" y="58" text-anchor="middle">CH<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">CH</tspan><tspan font-size="11" dy="4">3</tspan></text>
    <text x="137" y="142">H</text>
    <text x="188" y="142">H</text>
    <text x="180" y="86" font-size="12" fill="var(--t5-ink)">δ+</text>
    <text x="224" y="86" font-size="12" fill="var(--t5-ink)">δ−</text>
    <!-- products -->
    <text x="345" y="106">HO</text>
    <text x="392" y="106">C</text>
    <text x="398" y="58" text-anchor="middle">CH<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">CH</tspan><tspan font-size="11" dy="4">3</tspan></text>
    <text x="366" y="142">H</text>
    <text x="417" y="142">H</text>
    <text x="450" y="106">+</text>
    <text x="468" y="106">Cl</text>
    <text x="486" y="94" font-size="14">−</text>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <!-- reactant bonds -->
    <line x1="179" y1="100" x2="215" y2="100"/>
    <line x1="169" y1="90" x2="169" y2="66"/>
    <line x1="163" y1="108" x2="149" y2="127"/>
    <line x1="175" y1="108" x2="189" y2="127"/>
    <!-- product bonds -->
    <line x1="371" y1="100" x2="389" y2="100"/>
    <line x1="398" y1="90" x2="398" y2="66"/>
    <line x1="392" y1="108" x2="378" y2="127"/>
    <line x1="404" y1="108" x2="418" y2="127"/>
    <!-- reaction arrow -->
    <line x1="262" y1="100" x2="318" y2="100" marker-end="url(#m616sub-react)"/>
  </g>
  <g stroke="var(--t1-ink)" stroke-width="1.8" fill="none">
    <path d="M98,96 Q128,62 158,94" marker-end="url(#m616sub-curly)"/>
    <path d="M197,103 Q214,132 230,112" marker-end="url(#m616sub-curly)"/>
  </g>
  <g font-size="12" fill="var(--muted)" font-family="inherit" text-anchor="middle">
    <text x="150" y="185">hydroxide ion + 1-chloropropane</text>
    <text x="430" y="185">propan-1-ol + chloride ion</text>
  </g>
</svg>
