<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-labelledby="t">
<title id="t">An s orbital drawn as a sphere and the three p orbitals drawn as dumbbells along the x, y and z axes</title>
<g stroke="var(--muted)" stroke-width="1"><line x1="10" y1="70" x2="110" y2="70"/><line x1="60" y1="118" x2="60" y2="22"/><line x1="90" y1="40" x2="30" y2="100"/></g><g font-size="11" fill="var(--muted)" font-family="inherit"><text x="106" y="66">x</text><text x="64" y="28">y</text><text x="20" y="110">z</text></g>
<circle cx="60" cy="70" r="30" fill="var(--t1-ink)" fill-opacity="0.25" stroke="var(--t1-ink)" stroke-width="1.4"/>
<circle cx="60" cy="70" r="2.5" fill="currentColor"/>
<text x="60" y="148" font-size="15" text-anchor="middle" fill="currentColor" font-family="inherit">s</text>
<g stroke="var(--muted)" stroke-width="1"><line x1="130" y1="70" x2="230" y2="70"/><line x1="180" y1="118" x2="180" y2="22"/><line x1="210" y1="40" x2="150" y2="100"/></g><g font-size="11" fill="var(--muted)" font-family="inherit"><text x="226" y="66">x</text><text x="184" y="28">y</text><text x="140" y="110">z</text></g>
