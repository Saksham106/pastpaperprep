<g stroke="var(--muted)" stroke-width="1"><line x1="250" y1="70" x2="350" y2="70"/><line x1="300" y1="118" x2="300" y2="22"/><line x1="330" y1="40" x2="270" y2="100"/></g><g font-size="11" fill="var(--muted)" font-family="inherit"><text x="346" y="66">x</text><text x="304" y="28">y</text><text x="260" y="110">z</text></g>
<g transform="rotate(-90.0 300 70)" fill="var(--t3-ink)" fill-opacity="0.25" stroke="var(--t3-ink)" stroke-width="1.4"><path d="M300 70 C308 54 338 52 340 70 C338 88 308 86 300 70 Z"/><path d="M300 70 C292 54 262 52 260 70 C262 88 292 86 300 70 Z"/></g>
<circle cx="300" cy="70" r="2.5" fill="currentColor"/>
