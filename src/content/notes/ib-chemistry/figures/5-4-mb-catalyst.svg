<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" role="img" aria-labelledby="t54mbc">
  <title id="t54mbc">One Maxwell-Boltzmann distribution, fraction of particles against kinetic energy, at a single temperature. Two vertical dashed lines cross the tail. The left line, at lower energy, is the activation energy with a catalyst. The right line, at higher energy, is the activation energy without a catalyst. The area under the curve to the right of the catalysed line is shaded, and it is much larger than the darker shaded area to the right of the uncatalysed line. The curve itself is the same in both cases.</title>
