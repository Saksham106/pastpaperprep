<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="t">
  <title id="t">The bonding triangle. Average electronegativity runs along the horizontal axis from about 0.8 to 4.0, and electronegativity difference runs up the vertical axis from 0 to about 3.2. The triangle's bottom left corner is caesium, Cs, its bottom right corner is fluorine, F2, and its top corner is caesium fluoride, CsF. The top part of the triangle is the ionic region. A small triangle in the bottom left corner is the metallic region. The bottom right part is the covalent region, labelled polar covalent higher up and covalent near the base. The border between the ionic and covalent regions is a sloping line, parallel to the left edge, running from the right edge at a difference of about 2.3 down to the edge of the metallic region at an average of about 1.8.</title>
