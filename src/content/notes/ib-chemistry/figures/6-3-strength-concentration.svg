<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" role="img" aria-labelledby="t">
  <title id="t">Four boxes of acid solution in a two by two grid, water molecules not shown. Columns: concentrated on the left, dilute on the right. Rows: strong acid on top, weak acid below. Strong and concentrated: eight hydronium ions and eight anions, no acid molecules left. Strong and dilute: three hydronium ions and three anions, no acid molecules left. Weak and concentrated: seven un-ionized acid molecules, labelled HA, with only one hydronium ion and one anion. Weak and dilute: two HA molecules with one hydronium ion and one anion. Key: plus in a circle is a hydronium ion, minus in a circle is the anion A minus, HA is an un-ionized acid molecule.</title>
