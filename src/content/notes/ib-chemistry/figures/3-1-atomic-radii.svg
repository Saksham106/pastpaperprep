<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 385" role="img" aria-labelledby="t">
<title id="t">Atoms drawn as circles to scale, with atomic radii in units of ten to the minus twelve metres. Left, group 1 from top to bottom: lithium 130, sodium 160, potassium 200, rubidium 215 and caesium 238; the circles grow down the group. Right, period 3 from left to right: sodium 160, magnesium 140, aluminium 124, silicon 114, phosphorus 109, sulfur 104 and chlorine 100; the circles shrink across the period.</title>
