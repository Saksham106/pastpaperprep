<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">Particle diagram for hydrogen reacting with oxygen to make water. The left box, before, holds six hydrogen molecules and five oxygen molecules. An arrow leads to the right box, after, which holds six water molecules and two oxygen molecules that did not react, ringed and labelled excess. Hydrogen ran out first, so it is the limiting reactant.</title>
