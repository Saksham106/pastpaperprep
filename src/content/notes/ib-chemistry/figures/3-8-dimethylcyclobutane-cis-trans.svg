<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 272" role="img" aria-labelledby="t38dimethylcyclobutanecistrans">
<title id="t38dimethylcyclobutanecistrans">Skeletal formulas of cis- and trans-1,2-dimethylcyclobutane. In the cis isomer both methyl groups are on wedges, on the same face of the ring. In the trans isomer one is on a wedge and one on a hashed bond, on opposite faces</title>
<polygon points="105,95 175,95 175,165 105,165" fill="none" stroke="currentColor" stroke-width="2"/>
<polygon points="105.0,95.0 71.1,49.3 62.9,56.7" fill="currentColor"/>
<text x="55.0" y="47.0" font-size="15" text-anchor="middle" fill="currentColor" font-family="inherit">H<tspan font-size="11" dy="4">3</tspan><tspan dy="-4"></tspan>C</text>
<polygon points="175.0,95.0 217.1,56.7 208.9,49.3" fill="currentColor"/>
<text x="227.0" y="47.0" font-size="15" text-anchor="middle" fill="currentColor" font-family="inherit">CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4"></tspan></text>
<text x="140.0" y="200" font-size="14" text-anchor="middle" font-weight="bold" fill="currentColor" font-family="inherit">cis-1,2-dimethylcyclobutane</text>
<text x="140.0" y="218" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="inherit">both CH<tspan font-size="9" dy="3">3</tspan><tspan dy="-3"> on wedges: same face of the ring</tspan></text>
<polygon points="405,95 475,95 475,165 405,165" fill="none" stroke="currentColor" stroke-width="2"/>
<polygon points="405.0,95.0 371.1,49.3 362.9,56.7" fill="currentColor"/>
<text x="355.0" y="47.0" font-size="15" text-anchor="middle" fill="currentColor" font-family="inherit">H<tspan font-size="11" dy="4">3</tspan><tspan dy="-4"></tspan>C</text>
<line x1="480.7" y1="87.4" x2="482.0" y2="88.6" stroke="currentColor" stroke-width="1.6"/><line x1="486.3" y1="79.8" x2="489.0" y2="82.2" stroke="currentColor" stroke-width="1.6"/><line x1="492.0" y1="72.2" x2="496.0" y2="75.8" stroke="currentColor" stroke-width="1.6"/><line x1="497.6" y1="64.5" x2="503.1" y2="69.5" stroke="currentColor" stroke-width="1.6"/><line x1="503.3" y1="56.9" x2="510.1" y2="63.1" stroke="currentColor" stroke-width="1.6"/><line x1="508.9" y1="49.3" x2="517.1" y2="56.7" stroke="currentColor" stroke-width="1.6"/>
<text x="527.0" y="47.0" font-size="15" text-anchor="middle" fill="currentColor" font-family="inherit">CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4"></tspan></text>
<text x="440.0" y="200" font-size="14" text-anchor="middle" font-weight="bold" fill="currentColor" font-family="inherit">trans-1,2-dimethylcyclobutane</text>
<text x="440.0" y="218" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="inherit">one wedge, one hashed: opposite faces</text>
<text x="290" y="244" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="inherit">ring in the plane of the page; H atoms on the ring not shown</text>
<text x="290" y="261" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="inherit">wedge: towards you (above the ring); hashed: away from you (below the ring)</text>
</svg>
