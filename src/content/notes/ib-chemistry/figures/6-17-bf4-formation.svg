<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-labelledby="t"><title id="t">Left: boron trifluoride, a boron atom bonded to three fluorine atoms, left, up and down, each fluorine with three lone pairs; boron has no lone pair and only six outer electrons. Next to it a fluoride ion with four lone pairs and a negative charge. A curved arrow goes from one lone pair of the fluoride ion to the boron atom. After a reaction arrow: the tetrafluoroborate ion, boron bonded to four fluorine atoms, each fluorine with three lone pairs. The bond to the fluorine on the right is drawn as an arrow pointing from fluorine to boron. The ion is in square brackets with a negative charge outside. Labels: BF3 is the Lewis acid, F minus is the Lewis base.</title>
