<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t614ni">
  <title id="t614ni">Electroplating a steel key with nickel. A beaker holds aqueous nickel(II) sulfate. On the left, a nickel bar is joined to the positive terminal of a DC power supply: it is the anode, where nickel atoms are oxidized, Ni gives Ni2+ plus 2 electrons, so the bar slowly dissolves. On the right, the steel key is joined to the negative terminal: it is the cathode, where nickel ions are reduced, Ni2+ plus 2 electrons gives Ni, so a thin nickel layer coats the key. Arrows on the wires show electrons moving from the anode to the power supply and from the power supply to the key. An arrow in the solution shows nickel ions moving from the anode towards the key.</title>
