<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="t">
<title id="t">Three pairs of carbon atoms drawn to scale. Single bond, one line: 154 picometres, bond enthalpy 346 kilojoules per mole. Double bond, two lines: 134 picometres, 614 kilojoules per mole. Triple bond, three lines: 120 picometres, 839 kilojoules per mole. An arrow pointing down the list is labelled shorter and stronger.</title>
<text x="225.0" y="22.0" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="inherit">length</text>
<text x="330.0" y="22.0" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="inherit">bond enthalpy</text>
<circle cx="30" cy="60" r="13" fill="var(--t1-ink)" stroke="currentColor" stroke-width="1.5"/>
<circle cx="160.9" cy="60" r="13" fill="var(--t1-ink)" stroke="currentColor" stroke-width="1.5"/>
<text x="30" y="64.5" text-anchor="middle" font-size="13" fill="var(--surface, white)" font-family="inherit">C</text>
<text x="160.9" y="64.5" text-anchor="middle" font-size="13" fill="var(--surface, white)" font-family="inherit">C</text>
<line x1="44.0" y1="60.0" x2="146.9" y2="60.0" stroke="currentColor" stroke-width="2"/>
<text x="225.0" y="65.0" text-anchor="middle" font-size="13" fill="currentColor" font-family="inherit">154 pm</text>
<text x="330.0" y="65.0" text-anchor="middle" font-size="13" fill="currentColor" font-family="inherit">346 kJ mol⁻¹</text>
<text x="430.0" y="65.0" text-anchor="start" font-size="12" fill="var(--t3-ink)" font-family="inherit">single: 1 shared pair</text>
<circle cx="30" cy="115" r="13" fill="var(--t1-ink)" stroke="currentColor" stroke-width="1.5"/>
<circle cx="143.9" cy="115" r="13" fill="var(--t1-ink)" stroke="currentColor" stroke-width="1.5"/>
<text x="30" y="119.5" text-anchor="middle" font-size="13" fill="var(--surface, white)" font-family="inherit">C</text>
<text x="143.9" y="119.5" text-anchor="middle" font-size="13" fill="var(--surface, white)" font-family="inherit">C</text>
<line x1="44.0" y1="111.5" x2="129.9" y2="111.5" stroke="currentColor" stroke-width="2"/>
<line x1="44.0" y1="118.5" x2="129.9" y2="118.5" stroke="currentColor" stroke-width="2"/>
<text x="225.0" y="120.0" text-anchor="middle" font-size="13" fill="currentColor" font-family="inherit">134 pm</text>
<text x="330.0" y="120.0" text-anchor="middle" font-size="13" fill="currentColor" font-family="inherit">614 kJ mol⁻¹</text>
<text x="430.0" y="120.0" text-anchor="start" font-size="12" fill="var(--t3-ink)" font-family="inherit">double: 2 shared pairs</text>
<circle cx="30" cy="170" r="13" fill="var(--t1-ink)" stroke="currentColor" stroke-width="1.5"/>
<circle cx="132.0" cy="170" r="13" fill="var(--t1-ink)" stroke="currentColor" stroke-width="1.5"/>
<text x="30" y="174.5" text-anchor="middle" font-size="13" fill="var(--surface, white)" font-family="inherit">C</text>
<text x="132.0" y="174.5" text-anchor="middle" font-size="13" fill="var(--surface, white)" font-family="inherit">C</text>
<line x1="44.0" y1="164.0" x2="118.0" y2="164.0" stroke="currentColor" stroke-width="2"/>
<line x1="44.0" y1="170.0" x2="118.0" y2="170.0" stroke="currentColor" stroke-width="2"/>
<line x1="44.0" y1="176.0" x2="118.0" y2="176.0" stroke="currentColor" stroke-width="2"/>
<text x="225.0" y="175.0" text-anchor="middle" font-size="13" fill="currentColor" font-family="inherit">120 pm</text>
<text x="330.0" y="175.0" text-anchor="middle" font-size="13" fill="currentColor" font-family="inherit">839 kJ mol⁻¹</text>
<text x="430.0" y="175.0" text-anchor="start" font-size="12" fill="var(--t3-ink)" font-family="inherit">triple: 3 shared pairs</text>
<line x1="560" y1="50" x2="560" y2="165" stroke="var(--t3-ink)" stroke-width="1.8"/>
<polygon points="560,174 555.5,165 564.5,165" fill="var(--t3-ink)"/>
<text x="575.0" y="100.0" text-anchor="start" font-size="12" fill="var(--t3-ink)" font-family="inherit">shorter</text>
<text x="575.0" y="116.0" text-anchor="start" font-size="12" fill="var(--t3-ink)" font-family="inherit">stronger</text>
</svg>
