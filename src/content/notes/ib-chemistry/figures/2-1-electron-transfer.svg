<title id="t">Dot-and-cross shell diagrams for sodium and chlorine. Top row: a sodium atom with electrons 2, 8, 1 shown as dots, and a chlorine atom with electrons 2, 8, 7 shown as crosses. A curved arrow carries sodium's single outer electron to chlorine's outer shell. Bottom row, after the transfer: a sodium ion in square brackets with a plus charge and shells 2, 8, and a chloride ion in square brackets with a minus charge and shells 2, 8, 8, whose outer shell now holds seven crosses and one dot.</title>
