<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" role="img" aria-labelledby="t">
  <title id="t">A weighted graph with vertices F, G, H and I. Edge weights: F to G 15, F to H 9, G to H 4, G to I 8, H to I 18, and F to I 24, drawn as a long curve over the top.</title>
  <line x1="50" y1="180" x2="250" y2="110" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="50" y1="180" x2="170" y2="200" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="250" y1="110" x2="170" y2="200" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="250" y1="110" x2="390" y2="180" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="170" y1="200" x2="390" y2="180" stroke="currentColor" stroke-width="2" fill="none"/>
  <path d="M 50 180 Q 220 -30 390 180" stroke="currentColor" stroke-width="2" fill="none"/>
  <text x="138" y="124" font-size="13" text-anchor="middle" fill="var(--t1-ink)">15</text>
  <text x="105" y="206" font-size="13" text-anchor="middle" fill="var(--t1-ink)">9</text>
  <text x="222" y="165" font-size="13" text-anchor="middle" fill="var(--t1-ink)">4</text>
  <text x="330" y="135" font-size="13" text-anchor="middle" fill="var(--t1-ink)">8</text>
  <text x="285" y="208" font-size="13" text-anchor="middle" fill="var(--t1-ink)">18</text>
  <text x="220" y="62" font-size="13" text-anchor="middle" fill="var(--t1-ink)">24</text>
  <circle cx="50" cy="180" r="5" fill="currentColor"/>
  <text x="38" y="188" font-size="14" text-anchor="middle" fill="currentColor">F</text>
  <circle cx="250" cy="110" r="5" fill="currentColor"/>
  <text x="250" y="98" font-size="14" text-anchor="middle" fill="currentColor">G</text>
  <circle cx="170" cy="200" r="5" fill="currentColor"/>
  <text x="170" y="224" font-size="14" text-anchor="middle" fill="currentColor">H</text>
  <circle cx="390" cy="180" r="5" fill="currentColor"/>
  <text x="402" y="188" font-size="14" text-anchor="middle" fill="currentColor">I</text>
</svg>
