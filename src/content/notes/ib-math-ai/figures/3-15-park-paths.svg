<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-labelledby="tpark-paths">
  <title id="tpark-paths">An undirected graph with five vertices F, G, K, L and V. Edges: F to G, F to K, F to L, G to K, K to L, K to V and L to V.</title>
  <line x1="80.0" y1="50.0" x2="60.0" y2="200.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="80.0" y1="50.0" x2="200.0" y2="130.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="80.0" y1="50.0" x2="330.0" y2="55.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="60.0" y1="200.0" x2="200.0" y2="130.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="200.0" y1="130.0" x2="330.0" y2="55.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="200.0" y1="130.0" x2="360.0" y2="205.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="330.0" y1="55.0" x2="360.0" y2="205.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <circle cx="80" cy="50" r="5" fill="currentColor"/>
  <text x="70" y="38" font-size="14" text-anchor="middle" fill="currentColor">F</text>
  <circle cx="60" cy="200" r="5" fill="currentColor"/>
  <text x="46" y="216" font-size="14" text-anchor="middle" fill="currentColor">G</text>
  <circle cx="200" cy="130" r="5" fill="currentColor"/>
  <text x="200" y="158" font-size="14" text-anchor="middle" fill="currentColor">K</text>
  <circle cx="330" cy="55" r="5" fill="currentColor"/>
  <text x="340" y="42" font-size="14" text-anchor="middle" fill="currentColor">L</text>
  <circle cx="360" cy="205" r="5" fill="currentColor"/>
  <text x="374" y="222" font-size="14" text-anchor="middle" fill="currentColor">V</text>
</svg>
