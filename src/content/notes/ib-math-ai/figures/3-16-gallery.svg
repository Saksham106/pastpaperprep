<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img" aria-labelledby="t">
  <title id="t">A graph with six vertices A to F. Edges: A to B, A to C, B to C, B to D, B to E, C to E, D to E and D to F.</title>
  <line x1="60" y1="115" x2="180" y2="45" stroke="currentColor" stroke-width="2"/>
  <line x1="60" y1="115" x2="180" y2="185" stroke="currentColor" stroke-width="2"/>
  <line x1="180" y1="45" x2="180" y2="185" stroke="currentColor" stroke-width="2"/>
  <line x1="180" y1="45" x2="310" y2="45" stroke="currentColor" stroke-width="2"/>
  <line x1="180" y1="45" x2="310" y2="185" stroke="currentColor" stroke-width="2"/>
  <line x1="180" y1="185" x2="310" y2="185" stroke="currentColor" stroke-width="2"/>
  <line x1="310" y1="45" x2="310" y2="185" stroke="currentColor" stroke-width="2"/>
  <line x1="310" y1="45" x2="430" y2="45" stroke="currentColor" stroke-width="2"/>
  <circle cx="60" cy="115" r="5" fill="currentColor"/>
  <text x="46" y="120" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">A</text>
  <circle cx="180" cy="45" r="5" fill="currentColor"/>
  <text x="180" y="36" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">B</text>
  <circle cx="180" cy="185" r="5" fill="currentColor"/>
  <text x="180" y="212" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">C</text>
  <circle cx="310" cy="45" r="5" fill="currentColor"/>
  <text x="310" y="36" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">D</text>
  <circle cx="310" cy="185" r="5" fill="currentColor"/>
  <text x="310" y="212" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">E</text>
  <circle cx="430" cy="45" r="5" fill="currentColor"/>
  <text x="430" y="36" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">F</text>
</svg>
