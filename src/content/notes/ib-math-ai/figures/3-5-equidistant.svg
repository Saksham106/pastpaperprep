<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 360" role="img" aria-labelledby="t">
  <title id="t">Coordinate grid from 0 to 9 on both axes. Segment HK joins H at (1, 2) and K at (7, 6), with midpoint M at (4, 4). Equal tick marks show HM equals MK. The perpendicular bisector, the line 3x + 2y - 20 = 0, passes through M at a right angle to HK. The point P at (2, 7) lies on the bisector, and dashed lines from P to H and from P to K are both labelled root 26.</title>
