  <circle cx="370" cy="74" r="4" fill="currentColor"/>
  <text x="377" y="68" font-size="12" fill="currentColor">C</text>
  <circle cx="370" cy="154" r="4" fill="currentColor"/>
  <text x="377" y="148" font-size="12" fill="currentColor">D</text>
