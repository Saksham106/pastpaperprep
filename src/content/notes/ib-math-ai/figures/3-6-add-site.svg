<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 270" role="img" aria-labelledby="t">
  <title id="t">Two Voronoi diagrams of the same 12 by 10 rectangle. Before: sites A, B and C with three edges meeting at vertex V at (6, 4). After adding site D at (3, 4): D gets a new shaded cell bounded by the edge x = 7 with B, the edge y = 6 with C and a sloping edge with A. The new vertices are at (7, 1) and (7, 6). V is now inside the cell of D, so it is no longer a vertex.</title>
  <text x="150" y="20" font-size="13" text-anchor="middle" fill="currentColor">Before</text>
  <text x="430" y="20" font-size="13" text-anchor="middle" fill="currentColor">After adding D (3, 4)</text>
  <polygon points="30,234 176.7,234 150,154 30,136.9" fill="var(--t1-ink)" opacity="0.1" stroke="none"/>
  <polygon points="176.7,234 270,234 270,34 210,34 150,154" fill="var(--t2-ink)" opacity="0.1" stroke="none"/>
  <polygon points="210,34 30,34 30,136.9 150,154" fill="var(--t3-ink)" opacity="0.1" stroke="none"/>
  <rect x="30" y="34" width="240" height="200" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <line x1="176.7" y1="234" x2="150" y2="154" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="150" y1="154" x2="30" y2="136.9" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="210" y1="34" x2="150" y2="154" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
  <g font-size="10" fill="currentColor" opacity="0.7"><text x="30" y="248" text-anchor="middle">0</text><text x="70" y="248" text-anchor="middle">2</text><text x="110" y="248" text-anchor="middle">4</text><text x="150" y="248" text-anchor="middle">6</text><text x="190" y="248" text-anchor="middle">8</text><text x="230" y="248" text-anchor="middle">10</text><text x="270" y="248" text-anchor="middle">12</text><text x="25" y="198" text-anchor="end">2</text><text x="25" y="158" text-anchor="end">4</text><text x="25" y="118" text-anchor="end">6</text><text x="25" y="78" text-anchor="end">8</text><text x="25" y="38" text-anchor="end">10</text></g>
  <circle cx="70" cy="214" r="4" fill="currentColor"/>
  <text x="77" y="208" font-size="12" fill="currentColor">A</text>
  <circle cx="250" cy="154" r="4" fill="currentColor"/>
  <text x="234" y="148" font-size="12" fill="currentColor">B</text>
  <circle cx="90" cy="74" r="4" fill="currentColor"/>
  <text x="97" y="68" font-size="12" fill="currentColor">C</text>
  <circle cx="150" cy="154" r="4.5" fill="var(--surface, white)" stroke="currentColor" stroke-width="2"/>
  <text x="157" y="169" font-size="12" fill="currentColor">V</text>
  <polygon points="310,234 456.7,234 450,214 310,167.3" fill="var(--t1-ink)" opacity="0.1" stroke="none"/>
  <polygon points="456.7,234 550,234 550,34 490,34 450,114 450,214" fill="var(--t2-ink)" opacity="0.1" stroke="none"/>
  <polygon points="490,34 310,34 310,114 450,114" fill="var(--t3-ink)" opacity="0.1" stroke="none"/>
  <polygon points="310,114 310,167.3 450,214 450,114" fill="var(--t4-ink)" opacity="0.28" stroke="none"/>
  <rect x="310" y="34" width="240" height="200" fill="none" stroke="currentColor" stroke-width="1.2"/>
