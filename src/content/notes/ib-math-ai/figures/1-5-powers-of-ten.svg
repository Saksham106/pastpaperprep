<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 170" role="img" aria-labelledby="t">
  <title id="t">Three rows. The numbers 0.01, 0.1, 1, 10, 100 and 1000, each 10 times the one before. Below them the same numbers as powers of 10, from 10 to the power minus 2 up to 10 to the power 3. Below those, log base 10 of each number: minus 2, minus 1, 0, 1, 2 and 3. Numbers below 1 have negative logs.</title>
  <g font-size="14" fill="var(--muted)" font-family="inherit" text-anchor="start">
    <text x="10" y="50">number</text>
    <text x="10" y="100">as a power of 10</text>
    <text x="10" y="150">log base 10</text>
  </g>
  <g font-size="17" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="190" y="50">0.01</text>
    <text x="255" y="50">0.1</text>
    <text x="320" y="50">1</text>
    <text x="385" y="50">10</text>
    <text x="450" y="50">100</text>
    <text x="515" y="50">1000</text>
  </g>
  <g font-size="17" fill="currentColor" font-family="inherit" text-anchor="middle">
    <text x="190" y="100">10<tspan font-size="12" dy="-8">−2</tspan></text>
    <text x="255" y="100">10<tspan font-size="12" dy="-8">−1</tspan></text>
    <text x="320" y="100">10<tspan font-size="12" dy="-8">0</tspan></text>
    <text x="385" y="100">10<tspan font-size="12" dy="-8">1</tspan></text>
    <text x="450" y="100">10<tspan font-size="12" dy="-8">2</tspan></text>
    <text x="515" y="100">10<tspan font-size="12" dy="-8">3</tspan></text>
  </g>
  <g font-size="18" font-family="inherit" text-anchor="middle" font-weight="bold">
    <text x="190" y="150" fill="var(--t5-ink)">−2</text>
    <text x="255" y="150" fill="var(--t5-ink)">−1</text>
    <text x="320" y="150" fill="currentColor">0</text>
    <text x="385" y="150" fill="var(--t1-ink)">1</text>
    <text x="450" y="150" fill="var(--t1-ink)">2</text>
    <text x="515" y="150" fill="var(--t1-ink)">3</text>
  </g>
  <g fill="none" stroke="var(--muted)" stroke-width="1.4">
    <path d="M200 20 Q222 6 245 20"/>
    <path d="M265 20 Q287 6 310 20"/>
    <path d="M330 20 Q352 6 375 20"/>
    <path d="M395 20 Q417 6 440 20"/>
    <path d="M460 20 Q482 6 505 20"/>
  </g>
  <g font-size="11" fill="var(--muted)" font-family="inherit" text-anchor="middle">
    <text x="222" y="30">×10</text>
    <text x="287" y="30">×10</text>
    <text x="352" y="30">×10</text>
    <text x="417" y="30">×10</text>
    <text x="482" y="30">×10</text>
  </g>
  <line x1="10" y1="118" x2="535" y2="118" stroke="var(--muted)" stroke-width="0.8" stroke-dasharray="3 3"/>
</svg>
