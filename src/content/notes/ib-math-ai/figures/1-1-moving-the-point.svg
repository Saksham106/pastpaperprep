  <title id="t">The decimal point of 0.000064 moves 5 places right to sit after the 6, giving 6.4 times 10 to the power minus 5. The decimal point at the end of 38200000 moves 7 places left to sit after the 3, giving 3.82 times 10 to the power 7.</title>
