<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-labelledby="t">
  <title id="t">A weighted graph with five vertices H, P, Q, R and S. Edges and times in minutes: H to P 84, H to Q 30, H to S 33, P to Q 48, P to R 51, Q to R 63, Q to S 45, R to S 24. There is no direct road from H to R or from P to S.</title>
  <line x1="60" y1="150" x2="220" y2="45" stroke="currentColor" stroke-width="2"/>
  <line x1="60" y1="150" x2="220" y2="150" stroke="currentColor" stroke-width="2"/>
  <line x1="60" y1="150" x2="220" y2="260" stroke="currentColor" stroke-width="2"/>
  <line x1="220" y1="45" x2="220" y2="150" stroke="currentColor" stroke-width="2"/>
  <line x1="220" y1="45" x2="390" y2="150" stroke="currentColor" stroke-width="2"/>
  <line x1="220" y1="150" x2="390" y2="150" stroke="currentColor" stroke-width="2"/>
  <line x1="220" y1="150" x2="220" y2="260" stroke="currentColor" stroke-width="2"/>
  <line x1="390" y1="150" x2="220" y2="260" stroke="currentColor" stroke-width="2"/>
  <text x="132" y="91" font-size="14" text-anchor="middle" fill="var(--t2-ink)">84</text>
  <text x="140" y="143" font-size="14" text-anchor="middle" fill="var(--t2-ink)">30</text>
  <text x="132" y="222" font-size="14" text-anchor="middle" fill="var(--t2-ink)">33</text>
  <text x="236" y="102" font-size="14" text-anchor="middle" fill="var(--t2-ink)">48</text>
  <text x="312" y="91" font-size="14" text-anchor="middle" fill="var(--t2-ink)">51</text>
  <text x="305" y="143" font-size="14" text-anchor="middle" fill="var(--t2-ink)">63</text>
  <text x="236" y="210" font-size="14" text-anchor="middle" fill="var(--t2-ink)">45</text>
  <text x="297" y="198" font-size="14" text-anchor="middle" fill="var(--t2-ink)">24</text>
  <circle cx="60" cy="150" r="5" fill="currentColor"/>
  <text x="46" y="155" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">H</text>
  <circle cx="220" cy="45" r="5" fill="currentColor"/>
  <text x="220" y="36" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">P</text>
  <circle cx="220" cy="150" r="5" fill="currentColor"/>
  <text x="208" y="175" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">Q</text>
  <circle cx="220" cy="260" r="5" fill="currentColor"/>
  <text x="220" y="287" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">S</text>
  <circle cx="390" cy="150" r="5" fill="currentColor"/>
  <text x="404" y="155" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">R</text>
</svg>
