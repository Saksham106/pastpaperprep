<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-labelledby="t">
  <title id="t">Rectangular pen against a barn wall, fenced on three sides</title>
  <rect x="20" y="20" width="320" height="22" fill="var(--muted)" opacity="0.35"/>
  <line x1="20" y1="42" x2="340" y2="42" stroke="currentColor" stroke-width="2.5"/>
  <text x="180" y="35" font-size="13" fill="currentColor" font-family="inherit" text-anchor="middle">barn wall (no fence)</text>
  <path d="M70,42 L70,190 L290,190 L290,42" fill="none" stroke="var(--t1-ink)" stroke-width="3" stroke-dasharray="9 4"/>
  <g font-size="14" font-family="inherit" fill="currentColor">
    <text x="180" y="212" text-anchor="middle">x m</text>
    <text x="58" y="120" text-anchor="end">y m</text>
    <text x="302" y="120">y m</text>
    <text x="180" y="120" text-anchor="middle">area 450 m²</text>
  </g>
  <text x="180" y="180" font-size="12" fill="var(--t1-ink)" font-family="inherit" text-anchor="middle">fence</text>
</svg>
