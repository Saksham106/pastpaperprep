<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-labelledby="t" font-family="sans-serif" font-size="13">
  <title id="t">Fence AB of 120 m along the bottom. A hedge leaves A at 35 degrees to the fence. A dashed arc of radius 80 m centred at B cuts the hedge at two points, C1 far from A and C2 close to A, so two triangles fit the measurements.</title>
  <line x1="40" y1="230" x2="285.7" y2="57.9" stroke="currentColor" stroke-width="1.6"/>
  <path d="M134.24 164.01 A160 160 0 0 1 267.84 70.46" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="40" y1="230" x2="280" y2="230" stroke="currentColor" stroke-width="2.2"/>
  <line x1="280" y1="230" x2="267.84" y2="70.46" stroke="var(--t1-ink)" stroke-width="2.4"/>
  <line x1="280" y1="230" x2="134.24" y2="164.01" stroke="var(--t5-ink)" stroke-width="2.4"/>
  <path d="M70 230 A30 30 0 0 0 64.57 212.79" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <circle cx="40" cy="230" r="3.5" fill="currentColor"/>
  <circle cx="280" cy="230" r="3.5" fill="currentColor"/>
  <circle cx="267.84" cy="70.46" r="4" fill="var(--t1-ink)"/>
  <circle cx="134.24" cy="164.01" r="4" fill="var(--t5-ink)"/>
  <g fill="currentColor">
    <text x="24" y="236">A</text>
    <text x="288" y="236">B</text>
    <text x="76" y="222">35°</text>
    <text x="160" y="252" text-anchor="middle">120 m</text>
    <text x="296" y="62">hedge</text>
  </g>
  <g fill="var(--t1-ink)">
    <text x="250" y="62">C₁</text>
    <text x="284" y="150">80 m</text>
  </g>
  <g fill="var(--t5-ink)">
    <text x="112" y="158">C₂</text>
    <text x="196" y="214">80 m</text>
  </g>
</svg>
