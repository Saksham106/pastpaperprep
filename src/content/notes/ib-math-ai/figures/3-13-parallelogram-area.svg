<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 215" role="img" aria-labelledby="t313pa">
  <title id="t313pa">A parallelogram with base v along the bottom and side w leaving the same corner at angle theta. A dashed vertical height of length w sin theta drops from the top of w to the base, meeting it at a right angle. A diagonal from the end of v to the end of w cuts off a shaded triangle with sides v and w.</title>
  <defs><marker id="a313pa" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <path d="M40,180 L230,180 L120,70 Z" fill="var(--t1-ink)" fill-opacity="0.12" stroke="none"/>
  <line x1="120" y1="70" x2="310" y2="70" stroke="var(--muted)" stroke-width="1.4"/>
  <line x1="230" y1="180" x2="310" y2="70" stroke="var(--muted)" stroke-width="1.4"/>
  <line x1="230" y1="180" x2="120" y2="70" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="120" y1="70" x2="120" y2="180" stroke="var(--t3-ink)" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M120,170 L130,170 L130,180" fill="none" stroke="var(--t3-ink)" stroke-width="1.2"/>
  <line x1="40" y1="180" x2="230" y2="180" stroke="var(--t1-ink)" stroke-width="2.4" marker-end="url(#a313pa)"/>
  <line x1="40" y1="180" x2="120" y2="70" stroke="var(--t2-ink)" stroke-width="2.4" marker-end="url(#a313pa)"/>
  <path d="M68,180 A28,28 0 0 0 56.5,157.3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-size="15" font-weight="600">
    <text x="150" y="202" fill="var(--t1-ink)">v</text>
    <text x="58" y="116" fill="var(--t2-ink)">w</text>
    <text x="72" y="172" fill="currentColor" font-weight="400" font-size="13">θ</text>
    <text x="126" y="122" fill="var(--t3-ink)" font-size="13">|w| sin θ</text>
  </g>
</svg>
