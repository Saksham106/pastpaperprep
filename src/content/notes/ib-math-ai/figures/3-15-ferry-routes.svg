<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 240" role="img" aria-labelledby="tferry-routes">
  <title id="tferry-routes">A weighted graph with five vertices V, W, X, Y and Z. Edge weights in minutes: V to W 25, V to X 40, W to X 10, W to Y 32, X to Y 20, X to Z 55 and Y to Z 15.</title>
  <line x1="50.0" y1="120.0" x2="170.0" y2="40.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="50.0" y1="120.0" x2="190.0" y2="200.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="170.0" y1="40.0" x2="190.0" y2="200.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="170.0" y1="40.0" x2="330.0" y2="110.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="190.0" y1="200.0" x2="330.0" y2="110.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="190.0" y1="200.0" x2="440.0" y2="210.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="330.0" y1="110.0" x2="440.0" y2="210.0" stroke="currentColor" stroke-width="2" fill="none"/>
  <text x="98" y="70" font-size="13" text-anchor="middle" fill="var(--t2-ink)">25</text>
  <text x="108" y="182" font-size="13" text-anchor="middle" fill="var(--t2-ink)">40</text>
  <text x="168" y="124" font-size="13" text-anchor="middle" fill="var(--t2-ink)">10</text>
  <text x="256" y="64" font-size="13" text-anchor="middle" fill="var(--t2-ink)">32</text>
  <text x="252" y="168" font-size="13" text-anchor="middle" fill="var(--t2-ink)">20</text>
  <text x="316" y="222" font-size="13" text-anchor="middle" fill="var(--t2-ink)">55</text>
  <text x="398" y="150" font-size="13" text-anchor="middle" fill="var(--t2-ink)">15</text>
  <circle cx="50" cy="120" r="5" fill="currentColor"/>
  <text x="34" y="125" font-size="14" text-anchor="middle" fill="currentColor">V</text>
  <circle cx="170" cy="40" r="5" fill="currentColor"/>
  <text x="170" y="26" font-size="14" text-anchor="middle" fill="currentColor">W</text>
  <circle cx="190" cy="200" r="5" fill="currentColor"/>
  <text x="184" y="224" font-size="14" text-anchor="middle" fill="currentColor">X</text>
  <circle cx="330" cy="110" r="5" fill="currentColor"/>
  <text x="336" y="94" font-size="14" text-anchor="middle" fill="currentColor">Y</text>
  <circle cx="440" cy="210" r="5" fill="currentColor"/>
  <text x="456" y="226" font-size="14" text-anchor="middle" fill="currentColor">Z</text>
</svg>
