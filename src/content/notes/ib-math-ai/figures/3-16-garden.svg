<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" role="img" aria-labelledby="t">
  <title id="t">A graph with five vertices A, B, C, D and E. Edges: A to B, B to C, C to D, D to A, B to D, D to E and C to E.</title>
  <line x1="60" y1="130" x2="190" y2="45" stroke="currentColor" stroke-width="2"/>
  <line x1="190" y1="45" x2="330" y2="60" stroke="currentColor" stroke-width="2"/>
  <line x1="330" y1="60" x2="220" y2="205" stroke="currentColor" stroke-width="2"/>
  <line x1="60" y1="130" x2="220" y2="205" stroke="currentColor" stroke-width="2"/>
  <line x1="190" y1="45" x2="220" y2="205" stroke="currentColor" stroke-width="2"/>
  <line x1="220" y1="205" x2="390" y2="205" stroke="currentColor" stroke-width="2"/>
  <line x1="330" y1="60" x2="390" y2="205" stroke="currentColor" stroke-width="2"/>
  <circle cx="60" cy="130" r="5" fill="currentColor"/>
  <text x="46" y="135" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">A</text>
  <circle cx="190" cy="45" r="5" fill="currentColor"/>
  <text x="190" y="36" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">B</text>
  <circle cx="330" cy="60" r="5" fill="currentColor"/>
  <text x="330" y="51" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">C</text>
  <circle cx="220" cy="205" r="5" fill="currentColor"/>
  <text x="220" y="232" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">D</text>
  <circle cx="390" cy="205" r="5" fill="currentColor"/>
  <text x="404" y="228" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">E</text>
</svg>
