<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" role="img" aria-labelledby="t">
  <title id="t">Number line with a box from Q1 to Q3 and the median inside it. One and a half IQRs are measured out from Q1 down to the lower fence and from Q3 up to the upper fence. Values beyond either fence are outliers.</title>
  <g fill="var(--t4-ink)" fill-opacity="0.15" stroke="none">
    <rect x="10" y="74" width="54" height="50" />
    <rect x="320" y="74" width="50" height="50" />
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="10" y1="124" x2="370" y2="124" />
    <line x1="64" y1="118" x2="64" y2="130" />
    <line x1="160" y1="118" x2="160" y2="130" />
    <line x1="224" y1="118" x2="224" y2="130" />
    <line x1="320" y1="118" x2="320" y2="130" />
  </g>
  <rect x="160" y="84" width="64" height="28" fill="none" stroke="var(--t4-ink)" stroke-width="2.2" />
  <line x1="186" y1="84" x2="186" y2="112" stroke="var(--t4-ink)" stroke-width="2" />
  <g stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <line x1="64" y1="74" x2="64" y2="124" />
    <line x1="320" y1="74" x2="320" y2="124" />
  </g>
  <g stroke="currentColor" stroke-width="1" fill="none">
    <polyline points="64,60 64,54 160,54 160,60" />
    <polyline points="160,60 160,54 224,54 224,60" />
    <polyline points="224,60 224,54 320,54 320,60" />
  </g>
  <g fill="currentColor" font-size="12" font-family="inherit" text-anchor="middle">
    <text x="112" y="46">1.5 × IQR</text>
    <text x="192" y="46">IQR</text>
    <text x="270" y="46">1.5 × IQR</text>
    <text x="160" y="146">Q1</text>
    <text x="224" y="146">Q3</text>
    <text x="186" y="78" font-size="10">median</text>
    <text x="64" y="146">lower</text>
    <text x="64" y="160">fence</text>
    <text x="320" y="146">upper</text>
    <text x="320" y="160">fence</text>
  </g>
  <g fill="var(--t4-ink)" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="37" y="103">outliers</text>
    <text x="345" y="103">outliers</text>
  </g>
</svg>
