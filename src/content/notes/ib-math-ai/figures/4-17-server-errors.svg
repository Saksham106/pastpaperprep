<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 244" role="img" aria-labelledby="t">
  <title id="t">Bar chart of the Poisson distribution with mean 2.7, for 0 to 10 errors in a day. The bars rise to a peak at 2, then shrink towards zero but never stop. The bar at 4 is highlighted, and a dashed line marks the mean 2.7.</title>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="48" y1="20" x2="48" y2="170" />
    <line x1="48" y1="170" x2="362" y2="170" />
    <line x1="44" y1="170" x2="48" y2="170" /><line x1="44" y1="142" x2="48" y2="142" /><line x1="44" y1="114" x2="48" y2="114" /><line x1="44" y1="86" x2="48" y2="86" /><line x1="44" y1="58" x2="48" y2="58" /><line x1="44" y1="30" x2="48" y2="30" />
  </g>
  <g fill="var(--t4-ink)" fill-opacity="0.25" stroke="var(--t4-ink)" stroke-width="1.2">
    <rect x="57.0" y="132.4" width="18" height="37.6" />
    <rect x="84.0" y="68.4" width="18" height="101.6" />
    <rect x="111.0" y="32.8" width="18" height="137.2" />
    <rect x="138.0" y="46.5" width="18" height="123.5" />
    <rect x="192.0" y="125.0" width="18" height="45.0" />
    <rect x="219.0" y="149.7" width="18" height="20.3" />
    <rect x="246.0" y="162.2" width="18" height="7.8" />
    <rect x="273.0" y="167.4" width="18" height="2.6" />
    <rect x="300.0" y="169.2" width="18" height="0.8" />
    <rect x="327.0" y="169.8" width="18" height="0.2" />
  </g>
  <g fill="var(--t2-ink)" fill-opacity="0.55" stroke="var(--t2-ink)" stroke-width="1.5">
    <rect x="165.0" y="86.7" width="18" height="83.3" />
  </g>
  <line x1="138.9" y1="14" x2="138.9" y2="176" stroke="var(--t2-ink)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="end">
    <text x="40" y="174">0</text><text x="40" y="146">0.05</text><text x="40" y="118">0.1</text><text x="40" y="90">0.15</text><text x="40" y="62">0.2</text><text x="40" y="34">0.25</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="66" y="190">0</text><text x="93" y="190">1</text><text x="120" y="190">2</text><text x="147" y="190">3</text><text x="174" y="190">4</text><text x="201" y="190">5</text><text x="228" y="190">6</text><text x="255" y="190">7</text><text x="282" y="190">8</text><text x="309" y="190">9</text><text x="336" y="190">10</text>
    <text x="355" y="166">…</text>
    <text x="205" y="236">number of errors in a day, x</text>
  </g>
  <g fill="var(--t2-ink)" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="138.9" y="212">mean m = 2.7</text>
    <text x="174" y="81">P(X = 4)</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="start">
    <text x="56" y="14">P(X = x)</text>
  </g>
</svg>
