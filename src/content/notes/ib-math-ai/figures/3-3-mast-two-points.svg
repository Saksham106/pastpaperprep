    <text x="158" y="208" font-style="italic">B</text>
    <text x="286" y="96" font-style="italic">T</text>
    <text x="286" y="208" font-style="italic">F</text>
    <text x="296" y="152" font-style="italic">h</text>
    <text x="110" y="184" fill="var(--t1-ink)" font-size="12">21°</text>
    <text x="196" y="184" fill="var(--t3-ink)" font-size="12">34°</text>
    <text x="98" y="214">60 m</text>
  </g>
</svg>
