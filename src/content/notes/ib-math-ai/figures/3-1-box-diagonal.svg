<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-labelledby="t">
  <title id="t">A cuboid with edges a, b and c. A dashed floor diagonal f runs from corner A to corner N, directly below corner B, and meets the vertical edge c at a right angle at N. The space diagonal d joins A to B.</title>
  <polygon points="60,200 290,155 290,35" fill="var(--t1-ink)" fill-opacity="0.15" stroke="none"/>
  <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <rect x="60" y="80" width="160" height="120"/>
    <polyline points="60,80 130,35 290,35 220,80"/>
    <polyline points="290,35 290,155 220,200"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.55">
    <polyline points="60,200 130,155 290,155"/>
    <line x1="130" y1="155" x2="130" y2="35"/>
  </g>
  <g fill="none" stroke="var(--t1-ink)" stroke-width="2">
    <line x1="60" y1="200" x2="290" y2="155" stroke-dasharray="6 4"/>
    <line x1="60" y1="200" x2="290" y2="35"/>
  </g>
  <polyline points="290,145 280.2,146.9 280.2,156.9" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="inherit" fill="currentColor" font-size="15">
    <text x="46" y="216">A</text>
    <text x="296" y="30">B</text>
    <text x="298" y="170">N</text>
    <text x="140" y="222" text-anchor="middle">a</text>
    <text x="262" y="194">b</text>
    <text x="300" y="100">c</text>
  </g>
  <g font-family="inherit" fill="var(--t1-ink)" font-size="15" font-style="italic">
    <text x="190" y="188">f</text>
    <text x="160" y="120">d</text>
  </g>
</svg>
