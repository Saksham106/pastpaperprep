  <title id="t">Saddle point at the origin. The line y equals x has arrows pointing away from the origin. The line y equals minus four thirds x has arrows pointing towards the origin. In each of the four regions between the lines, curved trajectories come in alongside the incoming line, turn near the origin and leave alongside the line y equals x.</title>
