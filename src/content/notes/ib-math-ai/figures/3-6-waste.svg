<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" role="img" aria-labelledby="t">
  <title id="t">Voronoi diagram of four villages P at (4, 6), Q at (5, 11), R at (9, 11) and S at (13, 3) in a 15 by 13 rectangle. It has two vertices, U at (7, 8) and W at (9, 6). A dotted circle centred on U passes through P, Q and R, with radius about 3.6. A larger dotted circle centred on W passes through P, R and S, with radius 5. No village lies inside either circle.</title>
