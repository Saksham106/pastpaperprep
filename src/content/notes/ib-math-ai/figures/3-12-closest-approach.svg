<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" role="img" aria-labelledby="t312ca">
  <title id="t312ca">Axes with x pointing east and y pointing north. Ship A starts at the upper left and sails east and slightly south in a straight line. Ship B starts at the lower right and sails north-west in a straight line. The two paths cross. A short dashed arrow from A to B at the moment they are closest shows the relative position vector, with length about 2.77 km.</title>
  <defs><marker id="a312c" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <g stroke="currentColor" stroke-width="1" opacity="0.6">
    <line x1="30" y1="180" x2="455" y2="180" marker-end="url(#a312c)"/>
    <line x1="120" y1="290" x2="120" y2="10" marker-end="url(#a312c)"/>
  </g>
  <g font-size="12" fill="currentColor" opacity="0.8">
    <text x="405" y="172">x (east)</text>
    <text x="126" y="18">y (north)</text>
    <text x="104" y="196">O</text>
  </g>
  <line x1="70" y1="60" x2="420" y2="135" stroke="var(--t1-ink)" stroke-width="2.5" marker-end="url(#a312c)"/>
  <line x1="320" y1="260" x2="220" y2="35" stroke="var(--t2-ink)" stroke-width="2.5" marker-end="url(#a312c)"/>
  <circle cx="70" cy="60" r="4" fill="var(--t1-ink)"/>
  <circle cx="320" cy="260" r="4" fill="var(--t2-ink)"/>
  <circle cx="276.4" cy="104.2" r="4" fill="var(--t1-ink)"/>
  <circle cx="261" cy="127.3" r="4" fill="var(--t2-ink)"/>
  <line x1="276.4" y1="104.2" x2="262.5" y2="125" stroke="var(--t3-ink)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a312c)"/>
  <g font-size="12" fill="currentColor">
    <text x="40" y="48">A at 06:00 (−5, 12)</text>
    <text x="300" y="282">B at 06:00 (20, −8)</text>
    <text x="290" y="100">A at 07:28</text>
    <text x="182" y="134">B at 07:28</text>
    <text x="284" y="128" fill="var(--t3-ink)">rB − rA</text>
    <text x="300" y="144" fill="var(--t3-ink)" font-size="11">≈ 2.77 km</text>
  </g>
</svg>
