<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" role="img" aria-labelledby="t">
  <title id="t">Four by four grid of outcomes for two four-sided dice. Each cell shows the larger of the two numbers. The seven cells with score 4, the whole last row and last column, are shaded.</title>
  <g fill="currentColor" font-size="12" font-family="inherit" text-anchor="middle">
    <text x="160" y="22">Second die</text>
    <text x="22" y="130" transform="rotate(-90 22 130)">First die</text>
    <text x="100.0" y="42">1</text>
    <text x="140.0" y="42">2</text>
    <text x="180.0" y="42">3</text>
    <text x="220.0" y="42">4</text>
    <text x="68" y="74.0">1</text>
    <text x="68" y="114.0">2</text>
    <text x="68" y="154.0">3</text>
    <text x="68" y="194.0">4</text>
  </g>
  <rect x="80" y="50" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="120" y="50" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="160" y="50" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="200" y="50" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.22" stroke="currentColor" stroke-width="1"/>
  <rect x="80" y="90" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="120" y="90" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="160" y="90" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="200" y="90" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.22" stroke="currentColor" stroke-width="1"/>
  <rect x="80" y="130" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="120" y="130" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="160" y="130" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="200" y="130" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.22" stroke="currentColor" stroke-width="1"/>
  <rect x="80" y="170" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.22" stroke="currentColor" stroke-width="1"/>
  <rect x="120" y="170" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.22" stroke="currentColor" stroke-width="1"/>
  <rect x="160" y="170" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.22" stroke="currentColor" stroke-width="1"/>
  <rect x="200" y="170" width="40" height="40" fill="var(--t2-ink)" fill-opacity="0.22" stroke="currentColor" stroke-width="1"/>
  <g fill="currentColor" font-size="14" font-family="inherit" text-anchor="middle">
    <text x="100.0" y="75.0">1</text>
    <text x="140.0" y="75.0">2</text>
    <text x="180.0" y="75.0">3</text>
    <text x="220.0" y="75.0">4</text>
    <text x="100.0" y="115.0">2</text>
    <text x="140.0" y="115.0">2</text>
    <text x="180.0" y="115.0">3</text>
    <text x="220.0" y="115.0">4</text>
    <text x="100.0" y="155.0">3</text>
    <text x="140.0" y="155.0">3</text>
    <text x="180.0" y="155.0">3</text>
    <text x="220.0" y="155.0">4</text>
    <text x="100.0" y="195.0">4</text>
    <text x="140.0" y="195.0">4</text>
    <text x="180.0" y="195.0">4</text>
    <text x="220.0" y="195.0">4</text>
  </g>
</svg>
