<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" role="img" aria-labelledby="t">
  <title id="t">Bar chart of the probability distribution of the number of cars a household owns, with a dashed line at the expected value 1.5.</title>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="48" y1="20" x2="48" y2="170" />
    <line x1="48" y1="170" x2="336" y2="170" />
    <line x1="44" y1="170" x2="48" y2="170" /><line x1="44" y1="135" x2="48" y2="135" /><line x1="44" y1="100" x2="48" y2="100" /><line x1="44" y1="65" x2="48" y2="65" /><line x1="44" y1="30" x2="48" y2="30" />
  </g>
  <g fill="var(--t4-ink)" fill-opacity="0.35" stroke="var(--t4-ink)" stroke-width="1.2">
    <rect x="62" y="128" width="28" height="42" />
    <rect x="122" y="26.5" width="28" height="143.5" />
    <rect x="182" y="47.5" width="28" height="122.5" />
    <rect x="242" y="138.5" width="28" height="31.5" />
    <rect x="302" y="159.5" width="28" height="10.5" />
  </g>
  <line x1="166" y1="14" x2="166" y2="176" stroke="var(--t2-ink)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="end">
    <text x="40" y="174">0</text><text x="40" y="139">0.1</text><text x="40" y="104">0.2</text><text x="40" y="69">0.3</text><text x="40" y="34">0.4</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="76" y="190">0</text><text x="136" y="190">1</text><text x="196" y="190">2</text><text x="256" y="190">3</text><text x="316" y="190">4</text>
    <text x="192" y="236">number of cars, x</text>
  </g>
  <g fill="var(--t2-ink)" font-size="11" font-family="inherit" text-anchor="middle">
    <text x="166" y="212">E(X) = 1.5</text>
  </g>
  <g fill="currentColor" font-size="11" font-family="inherit" text-anchor="start">
    <text x="56" y="14">P(X = x)</text>
  </g>
</svg>
