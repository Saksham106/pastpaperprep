<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" font-family="sans-serif" font-size="12">
<line x1="40" y1="60" x2="480" y2="60" stroke="currentColor"/>
<line x1="60" y1="54" x2="60" y2="66" stroke="currentColor"/>
<text x="60" y="44" text-anchor="middle" fill="currentColor">Year 0</text>
<line x1="190" y1="54" x2="190" y2="66" stroke="currentColor"/>
<text x="190" y="44" text-anchor="middle" fill="currentColor">End of year 1</text>
<line x1="320" y1="54" x2="320" y2="66" stroke="currentColor"/>
<text x="320" y="44" text-anchor="middle" fill="currentColor">End of year 2</text>
<line x1="450" y1="54" x2="450" y2="66" stroke="currentColor"/>
<text x="450" y="44" text-anchor="middle" fill="currentColor">End of year 3</text>
<text x="60" y="84" text-anchor="middle" fill="var(--muted)">no payment</text>
<circle cx="190" cy="60" r="5" fill="var(--t1-ink)"/>
<circle cx="320" cy="60" r="5" fill="var(--t1-ink)"/>
<circle cx="450" cy="60" r="5" fill="var(--t1-ink)"/>
<line x1="190" y1="100" x2="440" y2="100" stroke="var(--t1-ink)" stroke-width="2"/>
<polygon points="440,95 450,100 440,105" fill="var(--t1-ink)"/>
<text x="190" y="118" text-anchor="start" fill="currentColor">1000 paid in, earns interest for 2 years</text>
<text x="456" y="104" text-anchor="start" fill="currentColor">1102.50</text>
<line x1="320" y1="145" x2="440" y2="145" stroke="var(--t2-ink)" stroke-width="2"/>
<polygon points="440,140 450,145 440,150" fill="var(--t2-ink)"/>
<text x="320" y="163" text-anchor="start" fill="currentColor">1000 paid in, 1 year</text>
<text x="456" y="149" text-anchor="start" fill="currentColor">1050.00</text>
<circle cx="450" cy="190" r="4" fill="var(--t3-ink)"/>
<text x="440" y="194" text-anchor="end" fill="currentColor">1000 paid in, no interest yet</text>
<text x="456" y="194" text-anchor="start" fill="currentColor">1000.00</text>
<line x1="440" y1="208" x2="515" y2="208" stroke="currentColor"/>
<text x="440" y="230" text-anchor="end" fill="currentColor">Value just after the third payment</text>
<text x="456" y="230" text-anchor="start" fill="currentColor" font-weight="bold">3152.50</text>
</svg>
