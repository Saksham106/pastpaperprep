  <title id="t">Graph of the two populations against time t from 0 to 20 years. The rabbit curve, R in hundreds, rises from 40 to a peak near 58 at about t equals 1.5, falls to about 13, then repeats roughly every 9 years. The fox curve, F in tens, starts at 10, peaks near 31 at about t equals 3, about one and a half years after each rabbit peak, then falls to about 9 and repeats.</title>
