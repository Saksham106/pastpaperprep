  <circle cx="200" cy="150" r="5" fill="currentColor"/>
  <text x="212" y="173" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">C</text>
  <circle cx="200" cy="260" r="5" fill="currentColor"/>
  <text x="200" y="287" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">D</text>
  <circle cx="360" cy="45" r="5" fill="currentColor"/>
  <text x="360" y="36" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">E</text>
  <circle cx="360" cy="200" r="5" fill="currentColor"/>
  <text x="376" y="219" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">F</text>
