  <line x1="400" y1="50" x2="300" y2="150" stroke="currentColor" stroke-width="2"/>
  <line x1="400" y1="50" x2="400" y2="250" stroke="currentColor" stroke-width="2"/>
  <line x1="300" y1="150" x2="400" y2="250" stroke="currentColor" stroke-width="2"/>
