  <text x="284" y="92" font-size="14" text-anchor="middle" fill="var(--t2-ink)">9</text>
  <text x="240" y="169" font-size="14" text-anchor="middle" fill="var(--t2-ink)">7</text>
  <text x="360" y="115" font-size="14" text-anchor="middle" fill="var(--t2-ink)">10</text>
  <text x="414" y="155" font-size="14" text-anchor="middle" fill="var(--t2-ink)">17</text>
