  <circle cx="60" cy="250" r="5" fill="currentColor"/>
  <text x="46" y="261" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">A</text>
  <circle cx="400" cy="250" r="5" fill="currentColor"/>
  <text x="414" y="261" font-size="15" font-weight="bold" text-anchor="middle" fill="currentColor">F</text>
  <circle cx="180" cy="150" r="5" fill="currentColor"/>
