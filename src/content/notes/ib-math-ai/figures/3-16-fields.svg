<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-labelledby="t">
  <title id="t">A weighted graph with six vertices A to F. Edges and weights: A to B 8, A to C 11, A to F 15, B to C 6, B to D 13, C to D 9, C to E 7, D to E 10, D to F 17, E to F 12.</title>
  <line x1="60" y1="250" x2="60" y2="50" stroke="currentColor" stroke-width="2"/>
  <line x1="60" y1="250" x2="180" y2="150" stroke="currentColor" stroke-width="2"/>
