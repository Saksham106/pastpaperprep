<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="t418">
  <title id="t418">Two normal curves for the sample mean bulb life. The right curve, centred on 1500 hours, is the distribution if H0 is true. The left curve, centred on 1440 hours, is the distribution if the true mean is 1440. A dashed vertical line at the critical value 1460.5 splits the axis into reject H0 on the left and do not reject H0 on the right. The small area under the H0 curve left of the line is shaded and labelled Type I, 0.05. The area under the 1440 curve right of the line is shaded and labelled Type II, 0.196.</title>
