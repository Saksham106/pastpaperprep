<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" role="img" aria-labelledby="t">
  <title id="t">Tree diagram. First stage: first serve in 0.62, first serve out 0.38. After a first serve in: win the point 0.71, lose 0.29. After a first serve out: win 0.48, lose 0.52. Path products: 0.4402, 0.1798, 0.1824 and 0.1976.</title>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="20" y1="125" x2="135" y2="65"/>
    <line x1="20" y1="125" x2="135" y2="185"/>
    <line x1="165" y1="65" x2="280" y2="30"/>
    <line x1="165" y1="65" x2="280" y2="100"/>
    <line x1="165" y1="185" x2="280" y2="150"/>
    <line x1="165" y1="185" x2="280" y2="220"/>
  </g>
  <g font-family="inherit" font-size="14" fill="currentColor">
    <text x="142" y="70" fill="var(--t1-ink)" font-weight="bold">F</text>
    <text x="142" y="190" fill="var(--t1-ink)" font-weight="bold">F′</text>
    <text x="288" y="35" fill="var(--t2-ink)" font-weight="bold">W</text>
    <text x="288" y="105" fill="var(--t2-ink)" font-weight="bold">W′</text>
    <text x="288" y="155" fill="var(--t2-ink)" font-weight="bold">W</text>
    <text x="288" y="225" fill="var(--t2-ink)" font-weight="bold">W′</text>
  </g>
  <g font-family="inherit" font-size="13" fill="currentColor">
    <text x="52" y="82">0.62</text>
    <text x="52" y="180">0.38</text>
    <text x="205" y="36">0.71</text>
    <text x="205" y="104">0.29</text>
    <text x="205" y="156">0.48</text>
    <text x="205" y="224">0.52</text>
  </g>
  <g font-family="inherit" font-size="13" fill="var(--muted)">
    <text x="322" y="35">0.62 × 0.71 = 0.4402</text>
    <text x="322" y="105">0.62 × 0.29 = 0.1798</text>
    <text x="322" y="155">0.38 × 0.48 = 0.1824</text>
    <text x="322" y="225">0.38 × 0.52 = 0.1976</text>
  </g>
</svg>
